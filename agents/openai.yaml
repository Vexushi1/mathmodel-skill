interface:
  display_name: "HSK 数学建模 Skill"
  short_description: "轻量启动、多意图路由、条件式预处理、双阶段Python、MATLAB科研图、可选DOCX审阅与LaTeX终稿"
  default_prompt: "Read core/bootstrap.yaml first. Use scripts/resolve_workflow.py to resolve one or more intents and load only the returned contracts, modules, packs and templates. Treat the resolver's pre_delivery_gates as the authoritative and complete gate sequence; execute every returned gate in resolver order, and do not maintain a separate fixed gate list or replace stage-specific gates with a blanket project-sync call. project_sync is the formal artifact synchronization gate for its resolved delivery scope; when run with --write it may create the project-root sync_report.yaml. Classify every subproblem with one objective, up to three structures and independent validation capabilities. After model lock, maintain the current-only project-root 模型论文框架.md and read its relevant current sections before downstream work. Concrete numerical claims still require accepted-workbook verification, while project state owns hashes and stale status. Generate full-fidelity Python code for user execution; accept the standard stage workbooks only after the user returns them; MATLAB reads exact unique headers from the current accepted workbooks and does not recompute numerical results. LaTeX is the default writing path; DOCX is explicit-only and is not a LaTeX prerequisite. Load packs/artifact/proposition_proof.md only for explicit proof requests or a nonzero proposition plan. Do not load legacy or V622 compatibility pointers by default."

user_execution:
  default_owner: user
  profile: full_fidelity
  task_code_execution_allowed: false
