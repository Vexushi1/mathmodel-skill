interface:
  display_name: "HSK 数学建模 Skill"
  short_description: "轻量启动、多意图路由、项目同步、Python求解、标准Excel、MATLAB科研图、DOCX草稿与LaTeX终稿"
  default_prompt: "Read core/bootstrap.yaml first. Use scripts/resolve_workflow.py to resolve one or more intents and load only the returned contracts, modules, packs and templates. Classify every subproblem with one objective, up to three structures and independent validation capabilities. After model lock, maintain the current-only project-root 模型论文框架.md. Before every formal model, code, workbook, MATLAB figure, DOCX, LaTeX or submission delivery, run scripts/sync_project.py <project_root> --write --strict and include sync_report.yaml. The synchronizer may discover artifacts, read workbook structure, compute hashes and propagate stale state, but must never invent model semantics, numerical results or validation success. Python solves and writes two standard workbooks; MATLAB reads exact unique headers from the same question directory and retains a concise title or sgtitle. Load packs/artifact/proposition_proof.md only for explicit proof requests or a nonzero proposition plan. Do not load legacy by default."
