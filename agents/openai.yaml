interface:
  display_name: "HSK 数学建模 Skill"
  short_description: "按启动合同读取规则、条件驱动结构化简、最小充分主模型、结构匹配求解与科研交付"
  default_prompt: >-
    Read core/bootstrap.yaml first at the project's fixed commit. Follow core/bootstrap.yaml#startup_contract
    for the opening event and source retrieval. For a new project, select v11_full_read as specified by
    PROJECT_INSTRUCTIONS.md#web-app-start when the pinned source declares it. Keep an existing project's pin
    and startup choice. For an active selection, pass --candidate-startup-event and --source-commit together.
    Use scripts/resolve_runtime.py when the matching resource root, dependencies, execution
    tools and required project materials are available. Pass the project root for state
    and artifact assurance. With read-only access, obtain the original sources at the same
    commit and identify any missing text. Treat the resolver's pre_delivery_gates as the
    authoritative and complete gate sequence and execute every returned gate in resolver order.
    project_sync may write the project-root sync_report.yaml for its resolved delivery scope.
    Classify each subproblem by objective, structures and validation capabilities. During
    model design, convert problem conditions into mathematical consequences, perform
    condition-driven structural reduction, generate the minimal-sufficient main model and
    select a structure-matched solver. Comparators are optional. Distinguish proposed_model_spec
    from locked_model_spec. Under core/model_approval_contract.yaml, run the independent
    Model Reviewer and Devil's Advocate passes and present the Model Approval Brief. Stop at
    awaiting_model_approval until the user explicitly approves the current semantic_revision
    and validated semantic_identity_hash. Before delivering task-specific preprocessing or
    primary solve code, require scripts/validate_semantic_governance.py and
    scripts/validate_model_approval.py to pass. Maintain the current 模型论文框架.md from the
    proposed-model stage. Read the framework at the applicable scope, use accepted workbooks
    for numbers and project state for revision, identity, approval and stale status. For
    primary solving and activated result analysis, follow the project-root execution.solver_backend
    and core/user_execution_contract.yaml. Generate full-fidelity code for the selected Python or MATLAB backend
    and validate the user's returned workbooks. Formal MATLAB plotting reads exact evidence from current accepted workbooks
    without recomputing results. LaTeX is the default writing path. DOCX is explicit-only.
    Apply packs/artifact/proposition_proof.md for an explicit proof request or a nonzero
    proposition plan. Keep legacy and V622 pointers outside the default workflow.

user_execution:
  default_owner: user
  profile: full_fidelity
  task_code_execution_allowed: false
