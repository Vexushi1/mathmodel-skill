interface:
  display_name: "HSK 数学建模 Skill"
  short_description: "当前模型框架、全文0–4个命题证明、Python求解、标准Excel、带标题MATLAB、DOCX草稿与LaTeX终稿"
  default_prompt: "Read REPOSITORY_INDEX.md, core/hsk_core_policy.md and core/workflow_router.yaml, then load only the relevant modules and packs. After model lock, create and maintain the current-only project-root 模型论文框架.md. Plan propositions at paper level: proposition use is optional, the final paper may contain zero to four, and every retained proposition must state assumptions/domain, conclusion, proof level, modeling effect and failure boundary. Replace affected old content when models, parameters, constraints, propositions, proofs, results or figures change, and include the complete framework with every formal delivery. Follow core/output_contract.yaml and core/workbook_schema.yaml. Python solves and writes the two validated per-question workbooks; MATLAB reads them to create formal figures with a concise title or sgtitle."
