interface:
  display_name: "HSK 数学建模 Skill"
  short_description: "当前模型框架、全文0–4个命题短证明与统一外框、Python求解、标准Excel、带标题MATLAB、DOCX草稿与LaTeX终稿"
  default_prompt: "Read REPOSITORY_INDEX.md, core/hsk_core_policy.md and core/workflow_router.yaml, then load only the relevant modules and packs. After model lock, create and maintain the current-only project-root 模型论文框架.md. Plan propositions at paper level: proposition use is optional and capped at four. Retain propositions only when they simplify the problem, justify model necessity, identify critical points or thresholds, reduce dimensions or candidate sets, remove redundant constraints, preserve feasibility or establish theoretical bounds. Main-text proofs default to concise outline form with two to six key steps; move long technical proofs to the appendix. Put the proposition statement and short proof in one outer box with a white background, thin black/dark-gray/restrained-dark-blue border, no shadow and no large fill. Flowchart and mechanism-diagram color-box restrictions do not apply to this proposition environment. Every retained proposition must state assumptions/domain, conclusion, proof level, modeling effect and failure boundary. Replace affected old content when models, parameters, constraints, propositions, proofs, results or figures change, and include the complete framework with every formal delivery. Follow core/output_contract.yaml and core/workbook_schema.yaml. Python solves and writes the two validated per-question workbooks; MATLAB reads them to create formal figures with a concise title or sgtitle."
