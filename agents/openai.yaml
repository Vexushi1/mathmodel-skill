interface:
  display_name: "HSK 数学建模 Skill"
  short_description: "按启动合同读取规则、条件驱动结构化简、最小充分主模型、结构匹配求解与科研交付"
  default_prompt: >-
    Read core/bootstrap.yaml first at the project's fixed commit. Follow core/bootstrap.yaml#startup_contract
    for the opening event. For a new project, select v11_full_read as specified by
    PROJECT_INSTRUCTIONS.md#web-app-start when the pinned source declares it. Keep an existing project's pin
    and startup choice. Read the complete selected rule text, supplement missing ranges, then begin problem analysis.
    For cross-chat recovery, read the complete current framework and restore the model, review findings and human approval.
    Classify each subproblem by objective, structures and validation capabilities. Convert conditions into
    mathematical consequences, reduce the structure, and choose the minimal-sufficient main model and its solver.
    Follow core/model_approval_contract.yaml for independent Model Reviewer and Devil's Advocate passes,
    the Model Approval Brief and explicit user approval. Save the approved model and approval evidence in
    模型论文框架.md before continuing to code delivery. Record project facts in state/project_state.yaml.
    Follow core/user_execution_contract.yaml#result_handoff to inspect the user's actual workbooks and continue
    analysis, figures and writing from their recorded evidence. Generate full-fidelity code for the project's
    Python/MATLAB backend; the user runs it. Formal figures consume those results. LaTeX is the default paper
    path; load DOCX for an explicit Word request. Apply packs/artifact/proposition_proof.md for an explicit
    proof request or a nonzero proposition plan.
    When machine validation is explicitly requested, use scripts/resolve_runtime.py with the project root and
    current question. Pass --candidate-startup-event and --source-commit together for its startup selection.
    Treat pre_delivery_gates as the authoritative and complete gate sequence and execute every returned gate in resolver order.
    Keep legacy and V622 pointers outside the default workflow.

user_execution:
  default_owner: user
  profile: full_fidelity
  task_code_execution_allowed: false
