version: 6.2.3
# 该 version 是 competition-profile 配置格式沿革，不是当前 Skill release；当前 Skill 版本由 core/bootstrap.yaml 等 release carriers 声明。
purpose: 为竞赛识别、模板选择和当届规则核验提供机器可读入口；稳定配置与时效性规则严格分离。

edition_rule_contract:
  required_fields: [edition, verification_status, verified_at, source, page_limit, anonymity, submission_files, ai_disclosure]
  verification_status: [verified, unverified, expired]
  rules:
    - 当届页数、匿名、文件命名、附件和 AI 披露要求必须来自题面或官方通知。
    - verification_status 不是 verified 时，不得把默认值写成官方要求。
    - verified_at 和 source 必须随竞赛年度更新。

profiles:
  cumcm:
    aliases: [国赛, CUMCM, cumcm]
    stable:
      competition_pack: packs/competition/cumcm.md
      latex_template: templates/latex/cumcm/hsk/
      compile_profile: cumcm
      language: zh-CN
      writing_runtime:
        mode: template_first_progressive
        competition_label: CUMCM
        template_manifest: templates/latex/cumcm/hsk/template_manifest.yaml
        supported_intents: [latex, review, full_submission, full_workflow]
        compact_intents: [latex]
    edition_rules:
      edition: "2026"
      verification_status: verified
      verified_at: "2026-11-03"
      source: https://dxs.moe.gov.cn/zx/a/hd_sxjm_gsyw/260702/2046411.shtml
      ai_rule_source: https://dxs.moe.gov.cn/zx/a/hd_sxjm_gsyw/260807/2051819.shtml
      page_limit: 30
      anonymity: true
      # A2 will define official external exports. Keep the legacy internal-ZIP
      # allowlist empty in A1 so hsk_pack_submission.py refuses unsafe PASS.
      submission_files: []
      ai_disclosure: required_used_or_not_used_before_references
      paper:
        electronic_first_page: abstract
        electronic_forbidden_frontmatter: [promise_page, team_number_page, table_of_contents]
        electronic_single_file_formats: [pdf, docx]
        max_paper_mb: 20
        max_support_mb: 20
        appendix_required: true
        appendix_complete_runnable_programs: true
        no_program_statement: 本论文没有用到程序
        no_support_statement: 本论文没有支撑材料
        ai_detail_file_when_used: AI工具使用详情.pdf
        print_promise_and_number_pages: required
        body_max_pages: 30

  mcm_icm:
    aliases: [MCM, ICM, mcm, icm]
    stable:
      competition_pack: packs/competition/mcm_icm.md
      latex_template: templates/latex/mcm/
      compile_profile: mcm_icm
      language: en
      writing_runtime:
        mode: full_reasoning_fallback
    edition_rules:
      edition: current
      verification_status: unverified
      verified_at: null
      source: null
      page_limit: null
      anonymity: null
      submission_files: []
      ai_disclosure: null

  diangong:
    aliases: [电工杯, diangong]
    stable:
      competition_pack: packs/competition/diangong.md
      latex_template: templates/latex/diangong/
      compile_profile: diangong
      language: zh-CN
      writing_runtime:
        mode: full_reasoning_fallback
    edition_rules:
      edition: current
      verification_status: unverified
      verified_at: null
      source: null
      page_limit: null
      anonymity: null
      submission_files: []
      ai_disclosure: null

  certification_cup:
    aliases: [认证杯, certification cup]
    stable:
      competition_pack: packs/competition/certification_cup.md
      latex_template: null
      compile_profile: null
      language: zh-CN
      writing_runtime:
        mode: full_reasoning_fallback
    edition_rules:
      edition: current
      verification_status: unverified
      verified_at: null
      source: null
      page_limit: null
      anonymity: null
      submission_files: []
      ai_disclosure: null
