project:
  random_seed: 2026
  source_root: .
  model_paper_framework: 模型论文框架.md
  result_root: 结果数据表
  draft_docx_dir: draft_docx
  final_latex_dir: final_latex

framework_sync:
  mode: compact
  required_after_model_lock: true
  current_only: true
  formal_delivery_gate: project_sync
  result_summary_after_solve: true
  history_storage: git

question:
  problem_name: 问题一
  framework_section: '### Q1：填写问题名称'
  result_summary_status: pending
  objective: optimization
  structures: []
  capabilities:
    has_explicit_constraints: false
    requires_feasibility_check: false
    requires_equilibrium_residual: false
    requires_conservation_residual: false
    requires_discretization_check: false
    requires_convergence_diagnostic: false
    requires_out_of_sample_validation: false
    requires_uncertainty_quantification: false
    requires_leakage_check: false
    requires_calibration_check: false
    requires_identifiability_check: false

primary_solve:
  quality_gate_required: true
  quality_sheet: 主结果质量门
  required_quality_fields: [检查项, 是否通过, 证据]
  result_quality_status: pending

result_analysis:
  status: pending
  selection_basis: [题目要求, 模型结构, 数据特征, 主结果表现, 评委风险]
  candidate_methods: []
  required_sheets: [分析设计, 结论稳定性汇总]
  fixed_uniform_perturbation: forbidden
  redo_primary_solve_when_failed: true

question_output:
  result_dir: 结果数据表/问题一
  solution_workbook: 问题一求解结果.xlsx
  result_analysis_workbook: 问题一结果深化分析.xlsx
  matlab_script: q1_plot.m
  figure_dir: 图表
  matlab_title_policy: title_or_sgtitle

runtime:
  strict_column_check: true
  n_jobs: 1
  use_progress_bar: false
  delivery_scope_after_solve: results

metadata:
  generate_run_info: false
  generate_result_manifest: false
  generate_matlab_handoff: false

latex:
  compiler: xelatex
  bibliography: biber
  main_tex: final_latex/main.tex
