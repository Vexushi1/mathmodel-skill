schema_version: 1.1.0
skill_compatibility: ">=7.4.2,<11.0.0"
purpose: 将论文 Figure 图例/视觉参考资产作为按需索引接入图型与版式选择；资产不提供数据、结论、固定配色或固定面板数量。
default_load: false
rules:
  - 仅在图型选择、版式对照或多面板设计需要时，通过 reference_index 先选择少量 asset key，再加载对应资产。
  - reference_index 只做 Evidence Structure / publication pattern / layout need 到既有 asset key 的候选映射，不拥有 Figure 决策权。
  - 资产不能替代 Figure Contract、底层工作簿、模型论文框架或 MATLAB 重绘脚本。
  - 不按示例图机械复制颜色、面板数量、统计图型、legend 或 annotation。
  - 视觉参考只影响表现形式，不得改变模型结果、统计口径、证据层级、Scientific Figure Synthesis 或 Figure Layout Gate 的判定。
  - 默认不得预加载全部图片；消费者只读取本次 lookup 命中的 path/paths。
reference_index:
  evidence_structures:
    simple_comparison: [bar_comparison, forest_interval]
    distribution_uncertainty: [distributions, forest_interval]
    time_dynamic: [line_trends, area_stacked]
    parameter_matrix: [heatmaps, scatter_bubble]
    spatial_field: [image_plates, heatmaps]
    multiobjective_candidates: [scatter_bubble]
    network_flow: [network_matrix, area_stacked]
    composition_decomposition: [area_stacked, heatmaps]
    multi_metric_profile: [radar_polar, heatmaps]
    multi_panel_evidence: [biomedical_panel_examples]
  publication_patterns:
    multi_metric_comparison_strip: [bar_comparison, forest_interval, biomedical_panel_examples]
    ordered_ablation_ladder: [bar_comparison, forest_interval]
    composition_decomposition: [area_stacked, heatmaps]
    evidence_matrix: [heatmaps, network_matrix]
    milestone_aware_trend: [line_trends, area_stacked]
    normalized_multi_criteria_radar: [radar_polar]
    density_state_space: [scatter_bubble, distributions]
    comparative_performance_matrix: [heatmaps, forest_interval]
  layout_needs:
    compact_multi_panel: [biomedical_panel_examples]
    shared_or_dedicated_legend: [bar_comparison, biomedical_panel_examples]
    global_local_pair: [line_trends, scatter_bubble, image_plates]
    matrix_with_marginal_context: [heatmaps, network_matrix]
    print_safe_composition: [area_stacked, forest_interval]
assets:
  bar_comparison:
    path: assets/nature_figure/chart-atlas/atlas-01-bar-charts.png
    use_for: [方案比较, 类别比较, 排名]
  line_trends:
    path: assets/nature_figure/chart-atlas/atlas-02-line-trends.png
    use_for: [时间趋势, 预测, 收敛]
  heatmaps:
    path: assets/nature_figure/chart-atlas/atlas-03-heatmaps.png
    use_for: [敏感性矩阵, 相关结构, 排名稳定性]
  scatter_bubble:
    path: assets/nature_figure/chart-atlas/atlas-04-scatter-bubble.png
    use_for: [目标权衡, 误差时间, 相关关系]
  radar_polar:
    path: assets/nature_figure/chart-atlas/atlas-05-radar-polar.png
    use_for: [少量对象多指标画像]
  distributions:
    path: assets/nature_figure/chart-atlas/atlas-06-distributions.png
    use_for: [鲁棒性, 扰动分布, 残差]
  forest_interval:
    path: assets/nature_figure/chart-atlas/atlas-07-forest-interval.png
    use_for: [区间估计, 效应比较, 不确定性]
  area_stacked:
    path: assets/nature_figure/chart-atlas/atlas-08-area-stacked.png
    use_for: [构成变化, 资源占用, 流量变化]
  image_plates:
    path: assets/nature_figure/chart-atlas/atlas-09-image-plates.png
    use_for: [空间图像, 场景对照, 机理快照]
  network_matrix:
    path: assets/nature_figure/chart-atlas/atlas-10-network-matrix.png
    use_for: [网络, 邻接矩阵, 流与路径]
  biomedical_panel_examples:
    paths:
      - assets/nature_figure/gallery/fig1-material-mechanism-rich.png
      - assets/nature_figure/gallery/fig2-spatial-imaging-rich.png
      - assets/nature_figure/gallery/fig3-in-vivo-efficacy-rich.png
      - assets/nature_figure/gallery/fig4-single-cell-systems-rich.png
      - assets/nature_figure/gallery/fig5-validation-perturbation-rich.png
    use_for: [紧凑多面板, 主结果与验证组合, 留白和层级参考]
