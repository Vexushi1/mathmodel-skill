schema_version: 1.1.0
purpose: >-
  Fixed project-state fixtures for v8.7.0 per-question writing capability preflight.
  These cases test state-to-activation behavior; they do not judge mathematical truth.

cases:
  - id: summary_required_complex_optimization
    question: Q1
    user_prompt_mentions_capability: false
    project_state:
      formula_roles:
        - formula_id: F1
          role: final_model_relation
        - formula_id: F2
          role: key_bridge_relation
      core_model_summary: required
      proposition_proof: not_assessed
      algorithm_presentation: not_needed
    expect:
      status: current
      activate:
        - adaptive_core_model_summary
      do_not_activate:
        - packs/artifact/proposition_proof.md
        - packs/artifact/algorithm_flow.md

  - id: summary_inline_simple_analytic
    question: Q1b
    user_prompt_mentions_capability: false
    project_state:
      formula_roles:
        - formula_id: F2A
          role: final_model_relation
      core_model_summary: inline
      proposition_proof: not_assessed
      algorithm_presentation: not_needed
    expect:
      status: current
      activate:
        - adaptive_core_model_summary
      do_not_activate:
        - packs/artifact/proposition_proof.md
        - packs/artifact/algorithm_flow.md

  - id: bridge_relation_preserved_without_formula_dump
    question: Q1c
    user_prompt_mentions_capability: false
    project_state:
      formula_roles:
        - formula_id: FB1
          role: key_bridge_relation
        - formula_id: FB2
          role: final_model_relation
        - formula_id: FB3
          role: supporting_derivation
      core_model_summary: required
      proposition_proof: not_assessed
      algorithm_presentation: not_needed
    expect:
      status: current
      activate:
        - adaptive_core_model_summary
      bridge_formula_id: FB1
      final_formula_id: FB2
      supporting_formula_id: FB3

  - id: proposition_planned_without_user_keyword
    question: Q2
    user_prompt_mentions_capability: false
    project_state:
      formula_roles:
        - formula_id: F3
          role: final_model_relation
      core_model_summary: inline
      proposition_proof: planned
      algorithm_presentation: not_needed
    expect:
      status: current
      activate:
        - adaptive_core_model_summary
        - core/writing_reasoning_contract.yaml
        - packs/artifact/proposition_proof.md
      do_not_activate:
        - packs/artifact/algorithm_flow.md

  - id: proposition_candidate_reviews_without_auto_creation
    question: Q2b
    user_prompt_mentions_capability: false
    project_state:
      formula_roles:
        - formula_id: F3B
          role: key_bridge_relation
        - formula_id: F3C
          role: final_model_relation
      core_model_summary: inline
      proposition_proof: candidate
      algorithm_presentation: not_needed
    expect:
      status: current
      activate:
        - adaptive_core_model_summary
        - core/writing_reasoning_contract.yaml
      do_not_activate:
        - packs/artifact/proposition_proof.md
        - packs/artifact/algorithm_flow.md
      action: semantic_proposition_necessity_review

  - id: explicit_proof_request_remains_compatible
    question: Q2c
    user_prompt_mentions_capability: true
    explicit_request: proof
    project_state:
      formula_roles:
        - formula_id: F3D
          role: final_model_relation
      core_model_summary: inline
      proposition_proof: not_assessed
      algorithm_presentation: not_needed
    expect:
      status: current
      activate:
        - adaptive_core_model_summary
      conditional_user_request_must_allow:
        - core/writing_reasoning_contract.yaml
        - packs/artifact/proposition_proof.md

  - id: pseudocode_without_user_keyword
    question: Q3
    user_prompt_mentions_capability: false
    project_state:
      formula_roles:
        - formula_id: F4
          role: final_model_relation
      core_model_summary: required
      proposition_proof: not_assessed
      algorithm_presentation: pseudocode
    expect:
      status: current
      activate:
        - adaptive_core_model_summary
        - core/writing_reasoning_contract.yaml
        - packs/artifact/algorithm_flow.md
        - modules/05_writing/latex.md#5-图表命题和算法环境

  - id: stepwise_without_user_keyword
    question: Q4
    user_prompt_mentions_capability: false
    project_state:
      formula_roles:
        - formula_id: F5
          role: key_bridge_relation
        - formula_id: F6
          role: final_model_relation
      core_model_summary: inline
      proposition_proof: not_assessed
      algorithm_presentation: stepwise
    expect:
      status: current
      activate:
        - adaptive_core_model_summary
        - core/writing_reasoning_contract.yaml
        - packs/artifact/algorithm_flow.md
      do_not_activate:
        - modules/05_writing/latex.md#5-图表命题和算法环境

  - id: algorithm_not_needed_keeps_compact_runtime
    question: Q5
    user_prompt_mentions_capability: false
    project_state:
      formula_roles:
        - formula_id: F7
          role: final_model_relation
      core_model_summary: inline
      proposition_proof: not_assessed
      algorithm_presentation: not_needed
    expect:
      status: current
      activate:
        - adaptive_core_model_summary
      do_not_activate:
        - core/writing_reasoning_contract.yaml
        - packs/artifact/proposition_proof.md
        - packs/artifact/algorithm_flow.md

  - id: missing_states_require_adjudication
    question: Q6
    user_prompt_mentions_capability: false
    project_state:
      formula_roles: []
      core_model_summary: missing
      proposition_proof: missing
      algorithm_presentation: missing
    expect:
      status: needs_adjudication
      must_not_silently_default_to:
        - not_applicable
        - not_needed

  - id: stale_proposition_cannot_be_written_current
    question: Q7
    user_prompt_mentions_capability: false
    project_state:
      formula_roles:
        - formula_id: F8
          role: final_model_relation
      core_model_summary: inline
      proposition_proof: stale
      algorithm_presentation: not_needed
    expect:
      status: review_required
      activate:
        - adaptive_core_model_summary
        - core/writing_reasoning_contract.yaml
        - packs/artifact/proposition_proof.md
      prohibition: stale_proposition_must_not_surface_as_current

  - id: inherited_question_compact_with_incremental_bridge
    question: Q8
    user_prompt_mentions_capability: false
    project_state:
      inherited_from: Q1
      formula_roles:
        - formula_id: F9
          role: key_bridge_relation
        - formula_id: F10
          role: final_model_relation
      core_model_summary: inline
      proposition_proof: removed
      algorithm_presentation: not_needed
    expect:
      status: current
      activate:
        - adaptive_core_model_summary
      do_not_activate:
        - packs/artifact/proposition_proof.md
        - packs/artifact/algorithm_flow.md
      must_preserve_increment_formula_id: F9
      must_not_repeat_entire_parent_model: true
