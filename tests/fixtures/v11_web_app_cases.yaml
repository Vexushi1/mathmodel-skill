  figure_plan:
    path: 模型论文框架.md
    text: |
      # 模型论文框架
      本次工程只存草案。Q1：无补水阶段从校准观测确定恒定流出率 r；待审方案尚未锁定。
      Q2：一次补水形成水量跳变，须先检查左右极限及区间边界。机理草图拟呈现储槽、放水和脉冲补水三个对象。
      图1预登记为机理草图；图2拟呈现实测和预测的误差。仅有原始校准测量，尚无主求解返回的工作簿。
  chapter:
    path: 章节交接.md
    text: |
      认证杯训练稿，仅作章节组织练习；未提供比赛专属模板。本章限于标量模型第一问已有结果的证据提纲。
      写稿人在全局图表登记中预留 T1“解与方程残差”，初始位置留空。F1“温度情景下的解误差带”仅是设想，
      无设计完成记录、图文件或本次运行证据。正文草案由“模型前提”“求解结果”“适用范围”三段组成。
  analysis_commitments:
    path: 深化分析设计记录.md
    text: |
      对本次结果说明拟答两件事。A：在三个给定 a 值下检查解是否为正。B：保持 a 不变，另对 offset 取两个扰动值，
      检查结论是否改变。两项都属于已提出的查证目标。已有回传文件以本次提供的原件为准。
