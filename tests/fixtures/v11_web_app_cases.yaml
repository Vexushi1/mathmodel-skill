# Maintenance inputs. Deliver only the selected turn with tests/v11_web_app_packet.py.
schema_version: 1
materials:
  problem:
    path: 题面.md
    text: |
      # 储槽补水调度（合成题）　1/2
      一条试验线初始储水 60 L。无补水时以未知恒定速率放水。附件是无补水校准试验，观测视为精确值。
      问题一：据附件识别放水速率，求水量首次降至 35 L 的时刻。
      问题二：在同一放水速率下安排一次瞬时补水。候选时刻为试验开始后第 15、25、30 分钟，补水量只能为 8 L 或 12 L，
      成本分别为 8 元、12 元。要求先最小化总成本，若成本相同则尽量晚补。
      时间窗内任一时刻的水量必须在 [30,50] L 内，但上界仅从补水瞬间的补后值起生效，下界同时约束补水前后。

      # 输出与边界条件　2/2
      观察和调度均限于闭区间 [0,30] 分钟。问题一的达标时刻以秒报告到最近的 10 秒，最后一步才舍入。
      问题二沿用第一问识别的速率；不得把补水数据拼入第一问校准，也不得把约束仅检查在补后时点。
      给出方案、成本和全程可行性的依据。未提供赛事专属模板。
  style:
    path: 图1样式.json
    text: |
      {"图号":"图1","变量":"储水量","线型":"实线","线宽":1.6,"线色":"#2171B5","坐标单位":["min","L"]}
  draft_model:
    path: 拟议模型.md
    text: |
      这是尚未批准的第二问模型草案。
      V(t)=60-r t+u I(t>=s)，t 以分钟计。s 属于 {15,25,30}，u 属于 {8,12}。
      程序设想：最大化成本，成本相同取较晚 s；将附件“时刻 (min)”列的数值直接当成秒作为时间输入，
      并使用以 L/s 表示的 r。评估校准误差时，用第 i 行模型预测对齐第 i+1 行观测。
      只检查补水后 V(s+) 在 [30,50] L 内即可报告可行。
