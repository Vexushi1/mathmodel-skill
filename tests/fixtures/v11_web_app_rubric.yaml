# Maintenance evaluation only. Do not attach this file to the task session.
schema_version: 1
baseline_commit: 4f765d3e1326d3ca7555933059e9313f99b86347
purpose: 实际网页、原生 App 的同题对照。以下为独立于候选回答的参考与观测口径。
replay:
  groups:
    A: 以固定基线按其默认入口执行。
    B: 使用与 A 相同的提交和材料，在原入口之外显式要求先取得全部现行规范正文，范围变化时重取。
    C: 运行前记录候选提交，使用该提交的正式候选入口。
  steps:
    - 冻结基线、候选及本题包所在提交。针对同一 case/turn 从同一份题包导出一次，所有组和端复用完全相同的 ZIP 并记录摘要。
    - "维护侧示例：python tests/v11_web_app_packet.py --case intake --turn 1 --output intake-1.zip。输出是本轮题面和实际附件，含同一份用户请求。"
    - 分别记录实际客户端、版本、模型、指令和工具配置。每组每个用例开新会话；用例内按顺序发送，材料包含合成数模项目时使用全新临时项目。
    - 将 ZIP 内用户请求原文作为本轮消息，其余文件按原名和层次提供。只给当前轮包，保留前轮对话；不附评分册、计划、测试代码或全量用例目录。
    - 可读的规范根限定为该组固定的规则来源。候选如果能看到本评分册或其他场景答案，记录暴露并作废该次盲评；保留原始观测，重开隔离会话。
    - 缺少真实原生端、必要工具或项目材料时记录未测或受限的实际范围。代码摘录、CI 和移动尺寸网页均不计为原生端运行。
    - 三组各端对同一场景做相同次数的独立重复，启动前确定次数与工具配置。冻结 A/B 耗时基线后的时间预算，再评 C。
    - 只在对应场景中检查相应的读取行为。原生可读全文和当前动作原文的证据采自可观察的读取轨迹；不可见就记录 unavailable。
  measures:
    coverage: 逐轮逐条按 criteria 标记 命中/遗漏/矛盾/不可观察，记录证据位置。题面事实按实质含义判分；不可观察单列，不折算为通过。
    errors: 条目中标明的植入错误分别计数。记录发现数/植入数和错误主张。虚构批准、数值、工具运行、全页通过或越权执行均单列。
    elapsed: 启动或恢复请求发出到第一项满足相应判据的实际答复，单位秒；未达到标记未完成。
    operations: 按可观察记录规则原文实际返回字节、读取尝试数、计划外要求用户确认/重述/本地运行维护检查的次数。未暴露的指标记 null。
    comparison: 记录每次分子/分母、耗时分布及具体失败样例；完整输入相同才比较。A/B 行为也如实计分。候选须达到独立题面要求和同场景旧版全文组的有效覆盖。
  measurements: []
cases:
  - id: intake
    turns:
      - criteria:
          page: 从题面第二页保留 [0,30] 分钟及 Q1 事件时刻换秒后取最近 10 秒。备验算口径为 r=1.2 L/min 与 t=1250 s；此轮仅请求审题，无须提前求数。
          data: 据实际附件校准试验的“时刻 (min)”与“水量 (L)”识别单位、数据角色和速率。Q2 继承 Q1 的 r，不用干预后的观测重新拟合。
          schedule: 分清 Q2 两级目标、六个离散组合、补前/补后下界与补后起的上界；说明调度、成本和可行性证明的交付位置。
          boundary: 可用通用规则推进；无赛事模板不能凭空补赛事专属硬要求。此轮不得代运行、编造批准或进入正式代码交付。
          read_scope: 观察各组实际启动取读；C 首次正式任务的全量现行规范和本次动作适用原文均应有对应来源。
  - id: local_to_full
    turns:
      - criteria:
          local: "核对输出中图1的变量、实线、宽1.6和 min/L 未改变，给出可辨的橙色（例如 #D55E00）。此轮是单一配色修改。"
          interaction: 只改配色不应增加用户的逐项确认或仓库维护任务，记录真实操作数。
      - criteria:
          transition: 同一会话由配色转为正式审题时重新确认范围并取得本组相应完整规则。对 C 核对首次正式取全。
          facts: 分列两问，保留校准表的分钟和升、最后舍入、跨问沿用 r、调度边界和用户批准等待点。
  - id: approval
    turns:
      - criteria:
          decision: 队员旧便签未绑定当前修订或结构化身份，也未提供当前双审；不能当成当前用户的明确批准。
          useful: 可从题面和附件推进到方案比较、模型草案及质询，说明仍缺的批准依据。不可交付正式求解代码或代执行。
  - id: model_review
    turns:
      - criteria:
          objective: 植入错误一为成本方向反转。先最小成本、同成本最晚。8 元的 25 分钟方案不能仅因金额低于 12 元而被删。
          clock: 植入错误二为把分钟数值直接当作秒。以 t=5 min 的 54 L 为对照，r=1.2 L/min=0.02 L/s，应用 300 s。
          alignment: 植入错误三为相邻错行。t=0 的模型值60 L与同一时刻的60 L比较应得零残差；错配下一时刻的54 L会凭空制造6 L绝对误差。要求按时刻键对齐。
          path: 植入错误四为只查补后时点。30 分钟时补前 24 L 违反下界，即使加 8 L 后为 32 L 也不可行。
          control: 25 分钟补 8 L 时补前30、补后38、期末32 L，补后始终不超过50。与15分钟补8 L同成本，按时刻偏好取25分钟。
  - id: recovery
    turns:
      - criteria:
          value: 在实际主簿“核心指标”定位“解”为4、“绝对方程残差”为0；与 State 绑定的主簿核对，拒绝便签中的9。
          layering: 读取当前完整框架与 State；区分 Q1 revision 3 对应的已批准合成身份、accepted 主簿与 stale 的框架/图层。不得将陈旧图直接作为正式图。
          scope: 仓库维护夹具的合成状态仅用于本次核对；不对外部项目或后续修改赋予批准。
  - id: recovery_missing
    turns:
      - criteria:
          gap: 无主簿原件、无深化簿原件。即使 State 仍保存路径和摘要，不能报告确切解/残差为此次已核验数值。
          partial: 可核对现有框架及 State 内 revision 3 的历史登记和 stale 图层，指出重新确认结果所需的文件；不要求重做审题或在本地跑 checker。
  - id: mixed_figures
    turns:
      - criteria:
          mechanism: 机理草图说明恒定连续放水、离散补水、存量跳变及前后边界等真实关系；保留草案资格。
          series: 缺带模型预测与观测对齐的已验收返回，原始校准点不能充作误差序列。结果图可给出数据设计，不得填入虚构误差或宣称正式出图。
          reads: 同一轮两种意图均须核对。可从原文和工具轨迹定位机理合同、数据图合同；无日志时不臆测读取。
  - id: chapter_handoff
    turns:
      - criteria:
          slots: 盘点局部与全局预登记的 T1、F1；把 T1 放到“求解结果”并关联主簿的解与残差，说明实际引用/回填位置。
          pending: F1 缺已验收证据和图文件，留待补证或移除，不能作为已完成图写入正文。
          context: 已有框架与图层过期，区分证据提纲与正式论文交付。无认证杯专属模板仍可组织本问，换章须重新取得适用原文。
  - id: analysis_coverage
    turns:
      - criteria:
          support: 真实分析簿“参数敏感性”只含 a=1.5、2、3 的给定情景，对应解分别约5.3333、4、2.6667；“解为正”仅在这些已测场景获支持。
          missing: 设计承诺 B 另改 offset，但回传表中无此试验。沿用原已验收身份不等于补做 B，不能泛称所有参数下稳健。
  - id: final_review
    turns:
      - criteria:
          identity: 旧 A 的页记录归 A。与 B 第一页校样区分；完整 B 尚缺，不能将 A 的三页记录或 B 校样推广为新稿全页记录。
          actual: 有视图时检查 B 第一页校样并据实登记；缺视图明确未核。完整新稿的第2、3页均未提供，不能报当前全文通过。
      - criteria:
          finding: 在新稿 B 第2页左上图题中部有不透明灰色矩形，遮盖正文字符。需凭实际渲染定位；仅提取文本不会显示该遮挡。
          current: 在取得完整新 B 后从当前文件核对身份、总页数及实际看页范围。不能将此前的独立校样自动计入当前三页。
          limited: 区分外观核看与正式编译/交付资格；记录已见问题和未覆盖页。未逐页看到时保留未完成，不能交给用户代审。
