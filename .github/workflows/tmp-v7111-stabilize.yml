name: Temporary v7.11.1 stabilization

on:
  push:
    branches:
      - "refactor/v7.11.1-authority-single-source"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Apply stabilization migration
        run: python scripts/_tmp_v7111_stabilize.py
      - name: Repair compatibility tests and historical-analysis boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # Output summary uses the established compatibility pointer name.
          path = 'core/output_contract.yaml'
          text = read(path)
          old = '  analysis_evidence_authority: core/writing_reasoning_contract.yaml#analysis_evidence_disposition\n'
          new = '  result_analysis_disposition_authority: core/writing_reasoning_contract.yaml#analysis_evidence_disposition\n'
          if text.count(old) != 1:
              raise SystemExit(f'{path}: expected one result-policy pointer to rename, found {text.count(old)}')
          write(path, text.replace(old, new, 1))

          # Existing accepted primary results remain eligible for result-analysis without retroactive approval.
          path = 'core/workflow_router.yaml'
          text = read(path)
          old = '  analysis_execution:\n    role: analysis_execution\n    canonical_route: result_analysis\n'
          new = '  analysis_execution:\n    role: analysis_execution\n    canonical_route: result_analysis\n    pre_delivery_gates: [semantic_governance, code_delivery]\n'
          if text.count(old) != 1:
              raise SystemExit(f'{path}: analysis_execution anchor drift')
          write(path, text.replace(old, new, 1))

          # Preprocessing conditionality is now Router + module-spec authority, not a manifest top-level copy.
          path = 'tests/test_preprocessing_decision_contract.py'
          text = read(path)
          old = '    def test_manifest_makes_preprocessing_conditional(self):\n        self.assertIn("data_preprocessing", self.manifest["conditional_modules"])\n'
          new = '    def test_manifest_makes_preprocessing_conditional(self):\n        self.assertNotIn("conditional_modules", self.manifest)\n        self.assertIn("data_preprocessing", self.router["execution_contract"]["conditional_modules"])\n'
          if text.count(old) != 1:
              raise SystemExit(f'{path}: conditional manifest test anchor drift')
          write(path, text.replace(old, new, 1))

          # The route itself owns code-stage gate sequencing; execution_contract no longer duplicates it.
          path = 'tests/test_router_contract.py'
          text = read(path)
          old = '''        self.assertEqual(
            self.router["execution_contract"]["code_stage_gates"],
            ["semantic_governance", "model_approval", "code_delivery"],
        )
'''
          new = '''        self.assertNotIn("code_stage_gates", self.router["execution_contract"])
        self.assertEqual(
            self.router["routing"]["full_solution"]["pre_delivery_gates"],
            ["semantic_governance", "model_approval", "code_delivery"],
        )
'''
          if text.count(old) != 1:
              raise SystemExit(f'{path}: code_stage_gates test anchor drift')
          write(path, text.replace(old, new, 1))

          # Rewrite the stale changelog test with a syntactically stable, invariant-based check.
          path = 'tests/test_v752_entrypoint_parity.py'
          text = read(path)
          pattern = r'    def test_current_changelog_matches_bootstrap\(self\):\n.*?\n    def test_stable_docs_and_resolver_do_not_create_extra_release_carriers'
          replacement = '''    def test_current_changelog_matches_bootstrap(self):
        current = str(yaml.safe_load((ROOT / "core/bootstrap.yaml").read_text(encoding="utf-8"))["skill_version"])
        changelog = (ROOT / "CHANGELOG.md").read_text(encoding="utf-8")
        releases = re.findall(r"^## (?:Current|Previous) release: ([^\\n]+)$", changelog, flags=re.MULTILINE)
        self.assertGreaterEqual(len(releases), 2)
        self.assertEqual(releases[0], current)
        self.assertNotEqual(releases[1], current)

    def test_stable_docs_and_resolver_do_not_create_extra_release_carriers'''
          text2, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit(f'{path}: changelog test repair anchor drift')
          write(path, text2)

          # Current consumer test now protects delegation rather than copied approval literals.
          path = 'tests/test_v711_model_approval_gate.py'
          text = read(path)
          old = '''    def test_solve_module_requires_model_approval_validator(self):
        text = (ROOT / "modules" / "03_solve_validate.md").read_text(encoding="utf-8")
        self.assertIn("scripts/validate_model_approval.py", text)
        self.assertIn("model_challenge_status=passed", text)
        self.assertIn("human_model_approval_status=approved", text)
        self.assertIn("awaiting_model_approval", text)
'''
          new = '''    def test_solve_module_requires_model_approval_validator(self):
        text = (ROOT / "modules" / "03_solve_validate.md").read_text(encoding="utf-8")
        self.assertIn("scripts/validate_model_approval.py", text)
        self.assertIn("core/model_approval_contract.yaml", text)
        self.assertIn("不复制第二套检查清单", text)
        self.assertIn("awaiting_model_approval", text)
        self.assertNotIn("model_challenge_status=passed", text)
        self.assertNotIn("human_model_approval_status=approved", text)
'''
          if text.count(old) != 1:
              raise SystemExit(f'{path}: model approval consumer test anchor drift')
          write(path, text.replace(old, new, 1))
          PY
      - name: Remove one-shot migration files
        shell: bash
        run: |
          rm -f scripts/_tmp_v7111_stabilize.py
          rm -f .github/workflows/tmp-v7111-stabilize.yml
      - name: Refresh generated repository metadata
        run: python scripts/generate_indexes.py
      - name: Validate lint, resolver and unit suite
        shell: bash
        run: |
          python scripts/lint_skill.py
          python scripts/resolve_workflow.py full_solution --primary mechanism --secondary optimization --competition CUMCM
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/generate_indexes.py --check
      - name: Commit source and generated stabilization changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize v7.11.1 single-authority runtime"
      - name: Rebase onto latest branch and push
        shell: bash
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
