name: V716 Release Hygiene

on:
  push:
    branches:
      - "upgrade/v7.16.0-paper-writing-spec"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply release hygiene fixes
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" = "chore: release hygiene autofix" ]; then
            echo "cleanup commit already applied"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import subprocess

          BASE = "6827cb781bf34ad4c15c6714e376d810a52a7b9a"

          root = Path("SKILL.md")
          skill = root.read_text(encoding="utf-8")
          skill = skill.replace("v0.9 框架", "v0.8 框架")
          skill = skill.replace("`v0.9-project-memory`", "`v0.8-project-memory`")
          root.write_text(skill, encoding="utf-8")
          Path("skills/mathmodel-skill/SKILL.md").write_text(skill, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace("`v0.9-project-memory`", "`v0.8-project-memory`")
          readme = readme.replace("升级为 `v0.8-project-memory`", "继续沿用 `v0.8-project-memory`")
          readme = readme.replace("root/package Skill 全文件一致", "root/packaged Skill 全文件一致")
          accidental = """- 删除 `core/module_manifest.yaml` 中与 Router 重复的 top-level `workflow_profiles`；运行时 profile 顺序只从 Router 解析，Manifest 只保留模块、产物和 Gate 图。\n- `scripts/resolve_workflow.py` 删除硬编码 `MODULE_ORDER`、`DOWNSTREAM_MODULES`、`*_GATES`、`*_OUTPUTS`、`MODEL_APPROVAL_REQUIRED_INTENTS` 等平行策略表，统一解释 Router 的 `runtime_segments`、route `boundary_roles`、`stop_before_module`、`terminal_outputs` 与 `pre_delivery_gates`。\n- Module 02/03 的 Model Approval 细节统一改为“引用 `core/model_approval_contract.yaml` + 调用 validator”，不再维护第二套字段级通过条件。\n- `core/output_contract.yaml` 的 semantic/execution/result policy 收缩为 authority pointers 与交付级开关；不再重复 challenge/approval、返回工作簿状态机和结果分析的完整规范。\n- 新增 single-authority regressions，检查 Router/Manifest/Resolver 的职责边界、Model Approval consumer delegation、Output Contract 集成边界与多意图 boundary dispatch。\n- 修复测试 fixture 中仍把 `proposition_limit` 当当前硬字段的漂移；当前命题规则继续为 0--4 默认阅读预算 + 超预算 justification。\n\n"""
          readme = readme.replace(accidental, "")
          readme_path.write_text(readme, encoding="utf-8")

          current = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = "## Previous release: 7.15.0"
          if marker not in current:
              raise SystemExit("missing v7.15 marker in current CHANGELOG")
          top = current.split(marker, 1)[0].rstrip() + "\n\n"
          top = top.replace("`v0.9-project-memory`", "`v0.8-project-memory`")
          top = top.replace("升级为 `v0.8-project-memory`", "继续沿用 `v0.8-project-memory`")
          base = subprocess.check_output(["git", "show", f"{BASE}:CHANGELOG.md"], text=True, encoding="utf-8")
          if base.startswith("# Changelog\n\n"):
              base = base[len("# Changelog\n\n"):]
          base = base.replace("## Current release: 7.15.0", "## Previous release: 7.15.0", 1)
          Path("CHANGELOG.md").write_text(top + base, encoding="utf-8")

          Path(".github/workflows/v716_release_hygiene.yml").unlink()
          PY

          python scripts/generate_indexes.py
          python scripts/generate_indexes.py --check
          ! grep -nE 'v0\.9(-project-memory| 框架)' SKILL.md skills/mathmodel-skill/SKILL.md README.md CHANGELOG.md

      - name: Commit and push cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: release hygiene autofix"
          git push origin HEAD:upgrade/v7.16.0-paper-writing-spec
