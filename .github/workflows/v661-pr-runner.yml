name: Run v6.6.1 cleanup on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'fix/v6.6.1-active-residue-cleanup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v6.6.1-active-residue-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Execute embedded cleanup migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('.github/workflows/v661-active-residue-cleanup.yml')
          text = path.read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if start not in text or end not in text:
              raise SystemExit('embedded migration block not found')
          body = textwrap.dedent(text.split(start, 1)[1].split(end, 1)[0])
          body = body.replace(
              'if path.name in {"CHANGELOG.md"}:',
              'if path.name in {"CHANGELOG.md"} or path == ROOT / "scripts/lint_skill.py" or ".github" in path.parts:',
          )
          body = body.replace(
              "if 'legacy' in path.parts or path.name == 'CHANGELOG.md':",
              "if 'legacy' in path.parts or path.name == 'CHANGELOG.md' or path == ROOT / 'scripts/lint_skill.py' or path == ROOT / 'tests/test_v661_active_residue_cleanup.py' or '.github' in path.parts:",
          )
          exec(compile(body, str(path), 'exec'))

          for relative in ('tests/test_active_residue_cleanup.py', 'tests/test_starter_templates.py'):
              target = Path(relative)
              value = target.read_text(encoding='utf-8')
              value = value.replace(
                  'self.assertTrue((ROOT / "templates/code/full_fidelity_config.yaml").is_file())',
                  'self.assertFalse((ROOT / "templates/code/full_fidelity_config.yaml").exists())',
              )
              target.write_text(value, encoding='utf-8')

          pack = Path('packs/artifact/figure.md')
          value = pack.read_text(encoding='utf-8')
          value = value.replace(
              '- 每问入口统一为 `问题X求解/qX_plot.m`；',
              '- 每问入口统一为 `问题X求解/qX_plot.m`；通用模板记为 `q{x}_plot.m`；',
          )
          value = value.replace(
              '饼图、雷达图、3D 曲面和复杂网络图必须提供额外可验证信息，否则降级或删除。',
              '饼图、雷达图、3D 曲面和复杂网络图必须通过高级图表准入检查，并提供额外可验证信息，否则降级或删除。',
          )
          pack.write_text(value, encoding='utf-8')

          matlab_readme = Path('templates/matlab/README.md')
          value = matlab_readme.read_text(encoding='utf-8')
          value = value.replace(
              'MATLAB 只读取 Python 输出的两个标准工作簿，不重新求解。每问唯一入口 `qX_plot.m` 与工作簿同处 `问题X求解/`。',
              'MATLAB 只读取 Python 输出的两个标准工作簿，不重新求解。每问唯一入口通用记为 `q{x}_plot.m`，问题一实例为 `q1_plot.m`，与工作簿同处 `问题X求解/`。禁止 `q1_polt.m` 等拼写变体。',
          )
          matlab_readme.write_text(value, encoding='utf-8')

          scripts_readme = Path('scripts/README.md')
          value = scripts_readme.read_text(encoding='utf-8')
          value = value.replace(
              '- `resolve_workflow.py`：解析意图、题型、能力与竞赛类型，返回确定性执行计划；',
              '- `resolve_workflow.py`：解析意图、`objective`、`structures`、`capabilities` 与竞赛类型，返回确定性执行计划；',
          )
          scripts_readme.write_text(value, encoding='utf-8')
          PY
      - name: Run focused and full validation
        run: |
          python scripts/lint_skill.py --skip-generated
          python -m unittest tests.test_v660_self_contained_question_folder
          python -m unittest tests.test_v661_active_residue_cleanup
          python -m unittest tests.test_tooling
          python -m unittest discover -s tests -p "test_*.py"
      - name: Remove temporary workflows and regenerate metadata
        run: |
          git rm .github/workflows/v661-active-residue-cleanup.yml
          git rm .github/workflows/v661-pr-runner.yml
          python scripts/generate_indexes.py
          python scripts/lint_skill.py
          python -m unittest discover -s tests -p "test_*.py"
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: release v6.6.1 active residue cleanup'
          git push origin HEAD:fix/v6.6.1-active-residue-cleanup
