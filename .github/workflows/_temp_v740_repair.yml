name: Repair temporary v7.4.0 upgrade bootstrap

on:
  push:
    branches:
      - upgrade/v7.4.0-writing-evidence-architecture

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Repair anchor handling and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/_temp_v740_writing_upgrade.yml')
          text = p.read_text(encoding='utf-8')
          old = """              text = replace_once(text, skill_insert, skill_add, f'{path} v740 writing summary')\n              write(path, text)"""
          new = """              if skill_insert in text:\n                  text = text.replace(skill_insert, skill_add, 1)\n              elif path == 'SKILL.md':\n                  raise SystemExit('anchor missing: root SKILL v740 writing summary')\n              write(path, text)"""
          if old not in text:
              raise SystemExit('repair anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/_temp_v740_repair.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: tolerate packaged skill summary wording during v7.4.0 bootstrap"
          git push
