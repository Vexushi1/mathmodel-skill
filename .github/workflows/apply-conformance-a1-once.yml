name: Apply verified A1 delta once
on:
  push:
    branches: [upgrade/v10.2.0-conformance-a1]
    paths: [.github/workflows/apply-conformance-a1-once.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: apply-conformance-a1-once
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Vexushi1/mathmodel-skill' && github.ref == 'refs/heads/upgrade/v10.2.0-conformance-a1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upgrade/v10.2.0-conformance-a1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply only the reviewed source delta and rebuild generated metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          branch = 'upgrade/v10.2.0-conformance-a1'
          base = '870e3345f1d3180b80be7a8fdf31f41ae00bee85'
          repo = 'Vexushi1/mathmodel-skill'
          chunks = ['613dc62c898f7bd152387c472c0cfffafac95d10', 'ac494cfb54293ebb09b15f4bfe82700b460c23f9', '123cf6f243c8a4e1f50dee54dc407694d361563b']
          expected = '2c45a4d5583847101df0ea520f4c33ee5f237db0e259539a45b6b942d96e97c0'
          allowed = set('''
          .codex-plugin/plugin.json
          CHANGELOG.md
          README.md
          SKILL.md
          config/prose_audit_patterns.yaml
          core/bootstrap.yaml
          core/hsk_core_policy.md
          core/model_code_conformance_contract.yaml
          core/module_manifest.yaml
          core/output_contract.yaml
          core/project_state.schema.yaml
          core/workflow_router.yaml
          core/writing_runtime_contract.yaml
          docs/modeling_intelligence_a0_decisions.md
          docs/modeling_intelligence_evidence_evolution_plan.md
          scripts/README.md
          scripts/conformance_source.py
          scripts/lint_skill_checks.py
          scripts/model_code_conformance.py
          skills/mathmodel-skill/SKILL.md
          templates/model/formula_code_closure.md
          tests/reading_plan_evidence.py
          tests/test_conformance_integration.py
          tests/test_model_code_conformance.py
          tests/test_p9_release_closeout.py
          tests/test_v1000_release_version_matrix.py
          tests/test_v830_editable_mechanism_diagram.py
          tests/test_v900_phase_i_migration_matrix.py
          tests/test_v900_phase_i_release_closure.py
          tests/test_v900_phase_i_v9_applicability.py
          tests/test_v900_phase_i_writer_retirement_readiness.py
          tests/test_v910_publication_rendering.py
          '''.split())
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path, payload=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'User-Agent': 'verified-a1-delta',
                           'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          if api('/git/ref/heads/main')['object']['sha'] != base:
              raise SystemExit('main changed; stop for review')
          git('fetch', 'origin', branch, 'main')
          git('reset', '--hard', 'origin/' + branch)
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          blocks = []
          for digest in chunks:
              blob = api('/git/blobs/' + digest)
              raw = base64.b64decode(blob['content'])
              if hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() != digest:
                  raise SystemExit('Git blob mismatch')
              blocks.append(raw)
          compressed = b''.join(blocks)
          if len(compressed) != 28436 or hashlib.sha256(compressed).hexdigest() != expected:
              raise SystemExit('reviewed delta digest mismatch')
          decoder = lzma.LZMADecompressor(memlimit=256 * 1024 * 1024)
          raw = decoder.decompress(compressed, max_length=2 * 1024 * 1024)
          if not decoder.eof or decoder.unused_data or len(raw) != 110367:
              raise SystemExit('invalid or oversized delta')
          payload = json.loads(raw)
          if (payload.get('format'), payload.get('repository'), payload.get('branch'), payload.get('base_main')) != (1, repo, branch, base):
              raise SystemExit('delta scope mismatch')
          files = payload['files']
          if len(files) != 32 or {f['path'] for f in files} != allowed:
              raise SystemExit('delta file allowlist mismatch')
          for record in files:
              path = root / record['path']
              if path.is_symlink() or not path.resolve().is_relative_to(root):
                  raise SystemExit('unsafe target')
              old = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if old != record['old_sha256']:
                  raise SystemExit('base changed: ' + record['path'])
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-a1.patch'
          patch.write_text(payload['patch'], encoding='utf-8')
          subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--whitespace=error-all', str(patch)], check=True)
          for record in files:
              if hashlib.sha256((root / record['path']).read_bytes()).hexdigest() != record['new_sha256']:
                  raise SystemExit('patched bytes mismatch: ' + record['path'])
          own = '.github/workflows/apply-conformance-a1-once.yml'
          (root / own).unlink()
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('add', '--', *sorted(allowed), own)
          git('diff', '--cached', '--check')
          git('commit', '-m', 'feat(v10.2.0): add opt-in readonly model/code structural conformance')
          subprocess.run(['python', 'scripts/generate_indexes.py'], check=True)
          subprocess.run(['python', 'scripts/lint_skill.py'], check=True)
          subprocess.run(['python', 'scripts/generate_indexes.py', '--check'], check=True)
          git('add', '--', 'SKILL_FILE_INDEX.md', 'TEMPLATE_INDEX.md', 'MANIFEST.sha256')
          if git('diff', '--cached', '--name-only'):
              git('commit', '-m', 'chore: refresh generated repository metadata')
          if git('status', '--porcelain'):
              raise SystemExit('unexpected dirty worktree')
          git('push', 'origin', 'HEAD:refs/heads/' + branch)
          head = git('rev-parse', 'HEAD')
          if api('/git/ref/heads/' + branch)['object']['sha'] != head:
              raise SystemExit('branch changed after push; no attestation')
          for workflow in ('ci.yml', 'optimization-baseline.yml'):
              api('/actions/workflows/' + workflow + '/dispatches', {'ref': branch})
          print(json.dumps({'head': head, 'tree': git('rev-parse', 'HEAD^{tree}'), 'verified_files': 32,
                            'delta_sha256': expected, 'temporary_workflow_removed': True}))
          PY
