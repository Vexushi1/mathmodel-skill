name: Temporary P7 release generated refresh

on:
  push:
    branches:
      - release/v9.2.1-p7-closeout

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate metadata from final source tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-p7-release-generated-refresh.yml
          python scripts/generate_indexes.py
          python scripts/generate_indexes.py --check
          allowed='^(\.github/workflows/tmp-p7-release-generated-refresh\.yml|SKILL_FILE_INDEX\.md|TEMPLATE_INDEX\.md|HSK_SKILL_FILE_INDEX_V622\.md|HSK_TEMPLATE_INDEX_V622\.md|MANIFEST\.sha256)$'
          unexpected=$(git status --short | sed -E 's/^.. //' | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected generated-refresh changes:'
            echo "$unexpected"
            exit 1
          fi
      - name: Commit generated final tree and trigger validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/tmp-p7-release-generated-refresh.yml SKILL_FILE_INDEX.md TEMPLATE_INDEX.md HSK_SKILL_FILE_INDEX_V622.md HSK_TEMPLATE_INDEX_V622.md MANIFEST.sha256
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 1
          fi
          git commit -m 'chore: refresh generated repository metadata'
          git push
          final_head=$(git rev-parse HEAD)
          echo "Generated metadata final head: ${final_head}"
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
          gh workflow run optimization-baseline.yml --ref "$GITHUB_REF_NAME"
