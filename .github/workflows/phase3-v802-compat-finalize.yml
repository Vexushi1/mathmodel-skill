name: Phase 3 v8.0.2 compatibility finalize

on:
  push:
    branches:
      - maintenance/v802-entrypoint-slimming
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3-v802-compat-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/v802-entrypoint-slimming
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply compatibility navigation shell
        run: python scripts/_phase3_finalize_compat.py
      - name: Remove one-shot finalizer
        run: |
          rm scripts/_phase3_finalize_compat.py
          rm .github/workflows/phase3-v802-compat-finalize.yml
      - name: Refresh generated repository metadata
        run: python scripts/generate_indexes.py
      - name: Run full validation before commit
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/lint_skill.py
          python scripts/generate_indexes.py --check
      - name: Commit final compatibility tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve v8.0.2 entrypoint navigation compatibility"
          git push
