name: Phase 4 v8.0.3 vocabulary migration

on:
  push:
    branches:
      - maintenance/v803-health-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/v803-health-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply explicit Phase 4 migration
        run: python scripts/_phase4_v803_vocab_migration.py
      - name: Remove one-shot migration machinery
        run: |
          rm scripts/_phase4_v803_vocab_migration.py
          rm .github/workflows/_phase4-v803-vocab.yml
      - name: Refresh generated repository metadata
        run: python scripts/generate_indexes.py
      - name: Validate Phase 4 tree
        run: |
          python -m unittest tests.test_v803_core_model_summary_vocabulary
          python -m unittest tests.test_v743_writing_structure_style
          python -m unittest tests.test_v800_template_authority
          python -m unittest tests.test_v800_writing_runtime
          python -m unittest tests.test_v802_entrypoint_surface_slimming
          python -m unittest tests.test_v7141_skill_health
          python scripts/lint_skill.py
          python scripts/generate_indexes.py --check
      - name: Commit final Phase 4 tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: clarify core model summary vocabulary in v8.0.3'
          git push origin HEAD:maintenance/v803-health-hardening
