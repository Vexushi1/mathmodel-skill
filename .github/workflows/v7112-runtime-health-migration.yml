name: v7.11.2 Runtime Health Migration

on:
  push:
    branches:
      - fix/v7.11.2-runtime-health-coherence

permissions:
  contents: write

concurrency:
  group: v7112-runtime-health-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v7.11.2-runtime-health-coherence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for metadata refresh and sync branch
        shell: bash
        run: |
          sleep 20
          git fetch origin fix/v7.11.2-runtime-health-coherence
          git reset --hard origin/fix/v7.11.2-runtime-health-coherence
      - name: Apply runtime health patch
        run: python scripts/_v7112_runtime_health_migration.py
      - name: Refresh generated repository metadata
        run: python scripts/generate_indexes.py
      - name: Run health validation
        run: |
          python scripts/lint_skill.py
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/generate_indexes.py --check
          python scripts/resolve_workflow.py full_solution --primary mechanism --secondary optimization --competition CUMCM
      - name: Commit health patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "fix: align v7.11.2 runtime health semantics"
          git push origin HEAD:fix/v7.11.2-runtime-health-coherence
