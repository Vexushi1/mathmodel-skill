name: Phase F transactional project writes integration

on:
  push:
    branches:
      - phase-f/transactional-project-writes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-f-transactional-writes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-f/transactional-project-writes
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply Phase F writer integration
        run: python scripts/_phase_f_apply.py
      - name: Remove one-shot integration files
        run: |
          rm scripts/_phase_f_apply.py
          rm .github/workflows/phase-f-integration.yml
      - name: Rebuild generated metadata
        run: python scripts/generate_indexes.py
      - name: Run Phase F focused regressions
        run: >-
          python -m unittest
          tests.test_v900_project_transaction
          tests.test_v900_transactional_writers
          tests.test_sync_project
          tests.test_v900_semantic_governance
          tests.test_user_execution_contract
      - name: Run full unit test suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run active-skill lint
        run: python scripts/lint_skill.py
      - name: Verify generated metadata
        run: python scripts/generate_indexes.py --check
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit Phase F integration
        run: |
          git config user.name "Vexushi1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Phase F changes to commit."
            exit 1
          fi
          git commit -m "refactor: make project writes transactional"
          git push origin HEAD:phase-f/transactional-project-writes
