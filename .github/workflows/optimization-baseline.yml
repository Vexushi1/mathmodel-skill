name: Optimization baseline evidence

on:
  pull_request:
    paths:
      - core/bootstrap.yaml
      - core/workflow_router.yaml
      - core/runtime_assurance_contract.yaml
      - scripts/resolve_runtime.py
      - scripts/reading_plan.py
      - scripts/README.md
      - RUNTIME_ROUTER.md
      - tests/reading_plan_cases.py
      - tests/reading_plan_evidence.py
      - tests/test_reading_plan.py
      - tests/optimization_baseline.py
      - tests/test_optimization_baseline.py
      - tests/fixtures/skill_optimization_cases.yaml
      - docs/skill_optimization_status.md
      - templates/matlab/hsk_publication_profile.m
      - templates/matlab/hsk_apply_scientific_style.m
      - tests/matlab/p6b_publication_preview.m
      - tests/test_p6b_matlab_preview_contract.py
      - docs/p6b_matlab_rendering_preview.md
      - .github/workflows/optimization-baseline.yml
  workflow_dispatch:
    inputs:
      run_matlab_preview:
        description: 'Run real MATLAB rendering and image checks for publication profiles'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: optimization-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source_snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preserve tracked source inputs without credentials or working files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/optimization-sources"
          git archive --format=tar.gz --output="$RUNNER_TEMP/optimization-sources/p1-main.tar.gz" 0eecaf929c83f19555402564ea0b14743d9bcf7d
          git archive --format=tar.gz --output="$RUNNER_TEMP/optimization-sources/candidate.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/optimization-sources/candidate-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/optimization-sources/candidate-tree.txt"
          sha256sum "$RUNNER_TEMP/optimization-sources/"*.tar.gz > "$RUNNER_TEMP/optimization-sources/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: optimization-source-inputs
          path: ${{ runner.temp }}/optimization-sources
          retention-days: 7
          if-no-files-found: error

  characterize:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install repository validation dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare immutable approved baseline
        shell: pwsh
        run: |
          $baseline = & python -c "import pathlib,yaml; print(yaml.safe_load(pathlib.Path('tests/fixtures/skill_optimization_cases.yaml').read_text(encoding='utf-8'))['baseline_commit'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($baseline.Trim() -ne '8a92a7924e950939dc77b15d3bb1a88400c09979') { throw 'Approved baseline commit changed' }
          $baselinePath = Join-Path $env:RUNNER_TEMP 'hsk-approved-baseline'
          $p1Path = Join-Path $env:RUNNER_TEMP 'hsk-p1-baseline'
          $candidatePath = Join-Path $env:RUNNER_TEMP 'hsk-candidate'
          $reportPath = Join-Path $env:RUNNER_TEMP 'optimization-evidence'
          $fixtureTemp = Join-Path $env:RUNNER_TEMP 'hsk-fixture-temp'
          git worktree add --detach $baselinePath $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git worktree add --detach $p1Path 0eecaf929c83f19555402564ea0b14743d9bcf7d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git worktree add --detach $candidatePath HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path $reportPath -Force | Out-Null
          # The immutable P1 driver replaces its exact synthetic root string.
          # Keep fixtures under runner temp to avoid Windows profile-path aliasing.
          New-Item -ItemType Directory -Path $fixtureTemp -Force | Out-Null
          @("OPT_BASELINE=$baselinePath", "OPT_P1=$p1Path", "OPT_CANDIDATE=$candidatePath", "OPT_REPORTS=$reportPath",
            "TMPDIR=$fixtureTemp", "TEMP=$fixtureTemp", "TMP=$fixtureTemp") |
            Add-Content -Path $env:GITHUB_ENV -Encoding utf8
      - name: Recheck approved baseline lint and generated files
        shell: pwsh
        run: |
          Push-Location $env:OPT_BASELINE
          try {
            python scripts/lint_skill.py *> (Join-Path $env:OPT_REPORTS 'baseline-lint.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python scripts/generate_indexes.py --check *> (Join-Path $env:OPT_REPORTS 'baseline-generated.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Run measurement and boundary regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_optimization_baseline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve the immutable P1 characterization as a control
        shell: pwsh
        run: |
          $driver = Join-Path $env:OPT_P1 'tests/optimization_baseline.py'
          $baselineReport = Join-Path $env:OPT_REPORTS 'baseline.json'
          $p1Report = Join-Path $env:OPT_REPORTS 'candidate.json'
          $comparisonReport = Join-Path $env:OPT_REPORTS 'comparison.json'
          python $driver --repo-root $env:OPT_BASELINE --output $baselineReport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $driver --repo-root $env:OPT_P1 --output $p1Report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $driver --compare $baselineReport $p1Report --output $comparisonReport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -Path $comparisonReport -Raw -Encoding utf8 | ConvertFrom-Json
          $rows = @('# P1 baseline comparison', '', 'No runtime reduction is claimed in P1.', '',
                    '| Case | Baseline bytes | Candidate bytes | Behavior equal |',
                    '|---|---:|---:|---|')
          foreach ($row in $report.cases) {
            $rows += "| $($row.id) | $($row.baseline_declared_bytes) | $($row.candidate_declared_bytes) | $($row.behavior_equal) |"
          }
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($rows -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
      - name: Validate reading scopes and compare P2 legacy behavior
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_reading_plan.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidateRef = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/reading_plan_evidence.py --baseline $env:OPT_P1 --candidate $env:OPT_CANDIDATE --candidate-ref $candidateRef --output $env:OPT_REPORTS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload real measurement evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optimization-p2-evidence
          path: ${{ runner.temp }}/optimization-evidence
          if-no-files-found: warn

  real_matlab_preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_matlab_preview == true }}
    name: Real MATLAB publication preview
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Define preview output directory
        shell: bash
        run: echo "HSK_PREVIEW_DIR=$RUNNER_TEMP/hsk-matlab-preview" >> "$GITHUB_ENV"
      - name: Install CJK publication fonts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true
      - name: Render and machine-check publication previews
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,"tests","matlab")); p6b_publication_preview(string(getenv("HSK_PREVIEW_DIR")))
      - name: Prove preview harness did not mutate repository files
        shell: bash
        run: test -z "$(git status --porcelain)"
      - name: Summarize real MATLAB evidence
        if: success()
        shell: bash
        run: |
          test -s "$HSK_PREVIEW_DIR/preview_report.json"
          echo '## Real MATLAB publication preview' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'The P6b harness rendered all three publication profiles in a real MATLAB batch session.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$HSK_PREVIEW_DIR/preview_report.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload real MATLAB preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matlab-publication-preview
          path: ${{ runner.temp }}/hsk-matlab-preview
          retention-days: 14
          if-no-files-found: error
