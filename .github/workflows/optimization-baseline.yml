name: Optimization baseline evidence

on:
  pull_request:
    paths:
      - core/bootstrap.yaml
      - core/workflow_router.yaml
      - core/runtime_assurance_contract.yaml
      - scripts/resolve_runtime.py
      - scripts/reading_plan.py
      - scripts/README.md
      - RUNTIME_ROUTER.md
      - tests/reading_plan_cases.py
      - tests/reading_plan_evidence.py
      - tests/test_reading_plan.py
      - tests/optimization_baseline.py
      - tests/test_optimization_baseline.py
      - tests/fixtures/skill_optimization_cases.yaml
      - docs/skill_optimization_status.md
      - .github/workflows/optimization-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimization-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source_snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preserve tracked source inputs without credentials or working files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/optimization-sources"
          git archive --format=tar.gz --output="$RUNNER_TEMP/optimization-sources/p1-main.tar.gz" 0eecaf929c83f19555402564ea0b14743d9bcf7d
          git archive --format=tar.gz --output="$RUNNER_TEMP/optimization-sources/candidate.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/optimization-sources/candidate-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/optimization-sources/candidate-tree.txt"
          sha256sum "$RUNNER_TEMP/optimization-sources/"*.tar.gz > "$RUNNER_TEMP/optimization-sources/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: optimization-source-inputs
          path: ${{ runner.temp }}/optimization-sources
          retention-days: 7
          if-no-files-found: error

  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare immutable approved baseline
        shell: bash
        run: |
          baseline=$(python -c 'import yaml; print(yaml.safe_load(open("tests/fixtures/skill_optimization_cases.yaml"))["baseline_commit"])')
          test "$baseline" = 8a92a7924e950939dc77b15d3bb1a88400c09979
          git worktree add --detach "$RUNNER_TEMP/hsk-approved-baseline" "$baseline"
          git worktree add --detach "$RUNNER_TEMP/hsk-p1-baseline" 0eecaf929c83f19555402564ea0b14743d9bcf7d
          echo "OPT_P1=$RUNNER_TEMP/hsk-p1-baseline" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/optimization-evidence"
          echo "OPT_BASELINE=$RUNNER_TEMP/hsk-approved-baseline" >> "$GITHUB_ENV"
          echo "OPT_REPORTS=$RUNNER_TEMP/optimization-evidence" >> "$GITHUB_ENV"
      - name: Recheck existing baseline lint tests and generated files
        shell: bash
        run: |
          cd "$OPT_BASELINE"
          python scripts/lint_skill.py > "$OPT_REPORTS/baseline-lint.log" 2>&1
          python -m unittest discover -s tests > "$OPT_REPORTS/baseline-unittest.log" 2>&1
          python scripts/generate_indexes.py --check > "$OPT_REPORTS/baseline-generated.log" 2>&1
      - name: Run measurement and boundary regression tests
        run: python -m unittest discover -s tests -p test_optimization_baseline.py
      - name: Preserve the immutable P1 characterization as a control
        shell: bash
        run: |
          python "$OPT_P1/tests/optimization_baseline.py" --repo-root "$OPT_BASELINE" --output "$OPT_REPORTS/baseline.json"
          python "$OPT_P1/tests/optimization_baseline.py" --repo-root "$OPT_P1" --output "$OPT_REPORTS/candidate.json"
          python "$OPT_P1/tests/optimization_baseline.py" --compare "$OPT_REPORTS/baseline.json" "$OPT_REPORTS/candidate.json" --output "$OPT_REPORTS/comparison.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["OPT_REPORTS"]) / "comparison.json").read_text())
          rows = ["# P1 baseline comparison", "", "No runtime reduction is claimed in P1.", "",
                  "| Case | Baseline bytes | Candidate bytes | Behavior equal |",
                  "|---|---:|---:|---|"]
          for row in report["cases"]:
              rows.append(f'| {row["id"]} | {row["baseline_declared_bytes"]} | {row["candidate_declared_bytes"]} | {row["behavior_equal"]} |')
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(rows) + "\n")
          PY
      - name: Validate reading scopes and compare P2 legacy behavior
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_reading_plan.py
          python tests/reading_plan_evidence.py --baseline "$OPT_P1" --candidate "$PWD" --candidate-ref "$(git rev-parse HEAD)" --output "$OPT_REPORTS"
      - name: Upload real measurement evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optimization-p2-evidence
          path: ${{ runner.temp }}/optimization-evidence
          if-no-files-found: warn
