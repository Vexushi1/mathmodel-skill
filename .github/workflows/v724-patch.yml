name: Apply v7.2.4 preprocessing figure gate patch

on:
  push:
    branches:
      - fix/v7.2.4-preprocessing-figure-gates

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v7.2.4-preprocessing-figure-gates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/apply_v724_patch.py
      - name: Commit patch and remove one-shot machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden v7.2.4 preprocessing figure runtime gates"
          git push origin HEAD:fix/v7.2.4-preprocessing-figure-gates
