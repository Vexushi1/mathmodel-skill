name: v7.11 one-shot gate split
on:
  push:
    branches: ["upgrade/v7.11.0-model-approval-gate"]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/v7.11.0-model-approval-gate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/_v711_gate_split.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/resolve_workflow.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: scope model approval gate to pre-primary code"
          git push origin HEAD:upgrade/v7.11.0-model-approval-gate
