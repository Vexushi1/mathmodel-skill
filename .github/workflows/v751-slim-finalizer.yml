name: v7.5.1 slimming finalizer

on:
  push:
    branches:
      - fix/v7.5.1-architecture-slimming

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v7.5.1-architecture-slimming
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintenance dependencies
        run: python -m pip install --quiet pyyaml
      - name: Validate one-shot finalizer syntax
        run: python -m py_compile scripts/_v751_slim_finalizer.py
      - name: Apply architecture slimming patch
        run: python scripts/_v751_slim_finalizer.py
      - name: Regenerate active indexes and manifest
        run: python scripts/generate_indexes.py
      - name: Remove one-shot maintenance files
        run: git rm scripts/_v751_slim_finalizer.py .github/workflows/v751-slim-finalizer.yml
      - name: Commit finalized patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: v7.5.1 slim runtime loading without capability loss"
          git push origin HEAD:fix/v7.5.1-architecture-slimming
