name: v7.2.3 apply patch after generated refresh

on:
  workflow_run:
    workflows: ["Refresh generated repository metadata"]
    types: [completed]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.workflow_run.head_branch == 'fix/v7.2.3-preprocessing-paper-evidence' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v7.2.3-preprocessing-paper-evidence
          fetch-depth: 0
      - name: Reuse the already-reviewed precise patch and remove both temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/v723-once.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          if marker not in source:
              raise SystemExit('one-shot patch source marker missing')
          payload = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(payload), {})
          Path('.github/workflows/v723-after-refresh.yml').unlink()
          PY
      - name: Commit serialized patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: close v7.2.3 runtime and version consistency'
          git push origin HEAD:fix/v7.2.3-preprocessing-paper-evidence
