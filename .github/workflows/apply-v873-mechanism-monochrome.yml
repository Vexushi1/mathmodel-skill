name: Apply v8.7.3 mechanism monochrome migration

on:
  push:
    branches:
      - refactor/v8.7.3-mechanism-monochrome

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/v8.7.3-mechanism-monochrome
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply source changes
        shell: bash
