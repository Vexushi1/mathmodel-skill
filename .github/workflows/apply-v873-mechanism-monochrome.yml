正式机理/推导图采用 **monochrome-first（黑白线稿优先）** 视觉语法：默认白底、黑色或深灰轮廓/箭头/文字，次级结构仅用灰度、线宽、虚实、形状和留白降权；不得用蓝/绿/红等多色填充替代语义结构。只有黑白线型与形状仍不足以区分且确有论证收益时，才允许加入 1 个强调色；极少数复杂图最多 2 个强调色，并必须保证转灰度或黑白打印后仍能无损辨识。

