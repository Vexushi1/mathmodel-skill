name: Refresh generated repository metadata

on:
  push:
    branches:
      - main
      - "codex/**"
      - "docs/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "upgrade/**"
    paths-ignore:
      - SKILL_FILE_INDEX.md
      - TEMPLATE_INDEX.md
      - HSK_SKILL_FILE_INDEX_V622.md
      - HSK_TEMPLATE_INDEX_V622.md
      - MANIFEST.sha256
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-feature-branch:
    if: github.actor != 'github-actions[bot]' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply v8.6.1 release synchronization
        run: python scripts/_v861_release_sync.py
      - name: Rebuild active indexes and manifest
        run: python scripts/generate_indexes.py
      - name: Commit v8.6.1 release synchronization and generated metadata
        run: |
          if git diff --quiet; then
            echo "Release synchronization and generated metadata are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .codex-plugin/plugin.json \
            CHANGELOG.md \
            README.md \
            SKILL.md \
            skills/mathmodel-skill/SKILL.md \
            config/prose_audit_patterns.yaml \
            core/bootstrap.yaml \
            core/hsk_core_policy.md \
            core/module_manifest.yaml \
            core/output_contract.yaml \
            core/workflow_router.yaml \
            core/writing_runtime_contract.yaml \
            modules/05_writing/paper_writing_protocol.md \
            docs/v861_active_consistency_semantic_drift_hardening_plan.md \
            tests/test_current_skill_health.py \
            tests/test_v840_author_reasoning_writing.py \
            SKILL_FILE_INDEX.md \
            TEMPLATE_INDEX.md \
            HSK_SKILL_FILE_INDEX_V622.md \
            HSK_TEMPLATE_INDEX_V622.md \
            MANIFEST.sha256
          git commit -m "chore(release): synchronize v8.6.1 release carriers"
          git push

  verify-main:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify generated metadata is already current
        run: python scripts/generate_indexes.py --check
