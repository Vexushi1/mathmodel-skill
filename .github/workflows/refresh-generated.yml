name: Refresh generated repository metadata

on:
  push:
    branches:
      - main
      - "codex/**"
      - "docs/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "upgrade/**"
    paths-ignore:
      - SKILL_FILE_INDEX.md
      - TEMPLATE_INDEX.md
      - HSK_SKILL_FILE_INDEX_V622.md
      - HSK_TEMPLATE_INDEX_V622.md
      - MANIFEST.sha256
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-feature-branch:
    if: github.actor != 'github-actions[bot]' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply approved v8.7 writing capability phase 2
        run: python scripts/apply_v870_writing_capability_phase2.py
      - name: Rebuild active indexes and manifest
        run: python scripts/generate_indexes.py
      - name: Commit semantic integration and generated metadata when changed
        run: |
          if git diff --quiet; then
            echo "v8.7 phase 2 and generated metadata are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/writing_reasoning_contract.yaml \
            core/output_contract.yaml \
            modules/05_writing/paper_writing_protocol.md \
            modules/05_writing/ai_cleanup.md \
            modules/06_review_delivery.md \
            SKILL_FILE_INDEX.md TEMPLATE_INDEX.md HSK_SKILL_FILE_INDEX_V622.md HSK_TEMPLATE_INDEX_V622.md MANIFEST.sha256
          git commit -m "feat(writing): integrate v8.7 formula roles and capability activation"
          git push

  verify-main:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify generated metadata is already current
        run: python scripts/generate_indexes.py --check
