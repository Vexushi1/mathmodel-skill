name: Refresh generated repository metadata

on:
  push:
    branches:
      - main
      - "codex/**"
      - "fix/**"
      - "refactor/**"
      - "upgrade/**"
    paths-ignore:
      - SKILL_FILE_INDEX.md
      - TEMPLATE_INDEX.md
      - HSK_SKILL_FILE_INDEX_V622.md
      - HSK_TEMPLATE_INDEX_V622.md
      - MANIFEST.sha256
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply coordinated v6.5.0 migration
        run: python scripts/apply_v650_once.py
      - name: Rebuild active indexes and manifest
        run: python scripts/generate_indexes.py
      - name: Commit v6.5.0 migration and generated metadata
        run: |
          if git diff --quiet; then
            echo "Repository is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement v6.5.0 user-executed full-fidelity workflow"
          git push
