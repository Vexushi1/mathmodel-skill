name: Refresh generated repository metadata

on:
  push:
    branches:
      - main
      - "codex/**"
      - "docs/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "upgrade/**"
    paths-ignore:
      - SKILL_FILE_INDEX.md
      - TEMPLATE_INDEX.md
      - HSK_SKILL_FILE_INDEX_V622.md
      - HSK_TEMPLATE_INDEX_V622.md
      - MANIFEST.sha256
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-feature-branch:
    if: github.actor != 'github-actions[bot]' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Synchronize v8.6 release carriers
        run: python scripts/sync_v860_release_carriers.py
      - name: Rebuild active indexes and manifest
        run: python scripts/generate_indexes.py
      - name: Commit release carriers and generated metadata when changed
        run: |
          TRACKED=(
            .codex-plugin/plugin.json
            SKILL.md
            skills/mathmodel-skill/SKILL.md
            README.md
            CHANGELOG.md
            core/bootstrap.yaml
            core/hsk_core_policy.md
            core/workflow_router.yaml
            core/module_manifest.yaml
            core/output_contract.yaml
            core/writing_runtime_contract.yaml
            config/prose_audit_patterns.yaml
            SKILL_FILE_INDEX.md
            TEMPLATE_INDEX.md
            HSK_SKILL_FILE_INDEX_V622.md
            HSK_TEMPLATE_INDEX_V622.md
            MANIFEST.sha256
          )
          if git diff --quiet -- "${TRACKED[@]}"; then
            echo "Release carriers and generated metadata are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TRACKED[@]}"
          git commit -m "chore: synchronize v8.6 release carriers and metadata"
          git push

  verify-main:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify generated metadata is already current
        run: python scripts/generate_indexes.py --check
