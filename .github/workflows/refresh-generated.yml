name: Refresh generated repository metadata

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "upgrade/**"
    paths-ignore:
      - SKILL_FILE_INDEX.md
      - TEMPLATE_INDEX.md
      - HSK_SKILL_FILE_INDEX_V622.md
      - HSK_TEMPLATE_INDEX_V622.md
      - MANIFEST.sha256
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-generated-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Apply one-shot v7.9.0 runtime closure
        run: python scripts/_v790_runtime_closure_migration.py
      - name: Rebuild active indexes and manifest
        run: python scripts/generate_indexes.py
      - name: Validate migrated active tree
        run: |
          python scripts/lint_skill.py
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/generate_indexes.py --check
      - name: Commit validated v7.9.0 runtime closure
        run: |
          if git diff --quiet; then
            echo "Migration produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: v7.9.0 close modular LaTeX runtime"
          git push
