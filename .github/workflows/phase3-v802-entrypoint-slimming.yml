name: Phase 3 v8.0.2 entrypoint slimming

on:
  push:
    branches:
      - maintenance/v802-entrypoint-slimming
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3-v802-entrypoint-slimming
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/v802-entrypoint-slimming
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pyyaml openpyxl
      - name: Apply explicit v8.0.2 migration
        run: python scripts/_phase3_v802_entrypoint_slimming.py
      - name: Remove one-shot migration machinery
        run: |
          rm scripts/_phase3_v802_entrypoint_slimming.py
          rm .github/workflows/phase3-v802-entrypoint-slimming.yml
      - name: Refresh generated repository metadata
        run: python scripts/generate_indexes.py
      - name: Run targeted entrypoint checks
        run: |
          python -m unittest tests.test_v752_entrypoint_parity
          python -m unittest tests.test_v7141_skill_health
          python -m unittest tests.test_v800_writing_runtime
          python -m unittest tests.test_v802_entrypoint_surface_slimming
          python scripts/lint_skill.py
          python scripts/generate_indexes.py --check
      - name: Commit final migration tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: slim v8.0.2 active entrypoints"
          git push
