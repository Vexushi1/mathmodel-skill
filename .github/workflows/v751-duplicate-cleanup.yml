name: v7.5.1 duplicate cleanup

on:
  push:
    branches:
      - fix/v7.5.1-architecture-slimming

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v7.5.1-architecture-slimming
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean duplicate and add regression
        run: python scripts/_v751_remove_duplicate.py
      - name: Regenerate active metadata
        run: python scripts/generate_indexes.py
      - name: Remove one-shot files
        run: git rm scripts/_v751_remove_duplicate.py .github/workflows/v751-duplicate-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove duplicate numerical-parameter section"
          git push origin HEAD:fix/v7.5.1-architecture-slimming
