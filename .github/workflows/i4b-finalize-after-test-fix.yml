name: I4b finalize after regression fix

on:
  push:
    branches:
      - "release/v900-phase-i-i4b-release-carriers"

permissions:
  contents: read

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Remove finalizer from final tree
        run: git rm .github/workflows/i4b-finalize-after-test-fix.yml
      - name: Rebuild repository generated metadata
        run: python scripts/generate_indexes.py
      - name: Commit final generated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh generated metadata after I4b test fix"
          git push
