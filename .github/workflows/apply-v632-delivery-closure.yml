name: Apply v6.3.2 delivery closure

on:
  push:
    branches:
      - fix/v6.3.2-delivery-gate-closure
    paths:
      - scripts/apply_v632_bootstrap.py
      - scripts/.v632/**
      - .github/workflows/apply-v632-delivery-closure.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - scripts/apply_v632_bootstrap.py
      - scripts/.v632/**
      - .github/workflows/apply-v632-delivery-closure.yml

permissions:
  contents: write

concurrency:
  group: apply-v632-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install migration dependency
        run: pip install pyyaml
      - name: Apply approved migration
        run: python scripts/apply_v632_bootstrap.py
      - name: Commit migrated Skill
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close v6.3.2 delivery gates'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
