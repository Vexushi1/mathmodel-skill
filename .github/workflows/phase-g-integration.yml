name: Phase G Integration

on:
  push:
    branches: ["phase-g/competition-writing-runtime"]

permissions:
  contents: write

concurrency:
  group: phase-g-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Apply deterministic Phase G migration
        run: python scripts/_phase_g_migrate.py
      - name: Run focused Phase G regression
        run: python -m unittest tests.test_v900_phase_g_competition_runtime tests.test_v800_writing_runtime tests.test_v800_cross_chat_minimal_context
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Regenerate repository metadata
        run: python scripts/generate_indexes.py
      - name: Lint active skill graph
        run: python scripts/lint_skill.py --skip-generated
      - name: Verify generated metadata
        run: python scripts/generate_indexes.py --check
      - name: Remove one-shot integration files
        run: rm scripts/_phase_g_migrate.py .github/workflows/phase-g-integration.yml
      - name: Regenerate final metadata
        run: python scripts/generate_indexes.py
      - name: Final lint and diff check
        run: |
          python scripts/lint_skill.py --skip-generated
          python scripts/generate_indexes.py --check
          git diff --check
      - name: Commit verified Phase G tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: configure competition writing runtime profiles"
          git push origin HEAD:phase-g/competition-writing-runtime
