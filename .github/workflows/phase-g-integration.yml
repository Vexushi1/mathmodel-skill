name: Phase G Integration

on:
  push:
    branches: ["phase-g/competition-writing-runtime"]

permissions:
  contents: write

concurrency:
  group: phase-g-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Fix deterministic migration anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_phase_g_migrate.py")
          text = path.read_text(encoding="utf-8")

          old = '        plan = runtime.resolve_runtime(intent, competition="CUMCM")\n'
          new = '        kwargs = {"primary": "mechanism"} if intent == "full_workflow" else {}\n        plan = runtime.resolve_runtime(intent, competition="CUMCM", **kwargs)\n'
          if text.count(old) != 1:
              raise SystemExit(f"golden capture anchor mismatch: {text.count(old)}")
          text = text.replace(old, new, 1)

          old_test = '                actual = self.runtime.resolve_runtime(intent, competition="CUMCM")\\n'
          new_test = '                kwargs = {"primary": "mechanism"} if intent == "full_workflow" else {}\\n                actual = self.runtime.resolve_runtime(intent, competition="CUMCM", **kwargs)\\n'
          if text.count(old_test) != 1:
              raise SystemExit(f"permanent test anchor mismatch: {text.count(old_test)}")
          text = text.replace(old_test, new_test, 1)

          start = text.index("def patch_profiles() -> None:\n")
          end = text.index("\ndef patch_resolver() -> None:\n", start)
          replacement = '''def patch_profiles() -> None:\n    path = ROOT / "config" / "competition_profiles.yaml"\n    text = path.read_text(encoding="utf-8")\n    replacements = [\n        (\n            "  cumcm:\\n"\n            "    aliases: [国赛, CUMCM, cumcm]\\n"\n            "    stable:\\n"\n            "      competition_pack: packs/competition/cumcm.md\\n"\n            "      latex_template: templates/latex/cumcm/hsk/\\n"\n            "      compile_profile: cumcm\\n"\n            "      language: zh-CN\\n"\n            "    edition_rules:\\n",\n            "  cumcm:\\n"\n            "    aliases: [国赛, CUMCM, cumcm]\\n"\n            "    stable:\\n"\n            "      competition_pack: packs/competition/cumcm.md\\n"\n            "      latex_template: templates/latex/cumcm/hsk/\\n"\n            "      compile_profile: cumcm\\n"\n            "      language: zh-CN\\n"\n            "      writing_runtime:\\n"\n            "        mode: template_first_progressive\\n"\n            "        competition_label: CUMCM\\n"\n            "        template_manifest: templates/latex/cumcm/hsk/template_manifest.yaml\\n"\n            "        supported_intents: [latex, review, full_submission, full_workflow]\\n"\n            "        compact_intents: [latex]\\n"\n            "    edition_rules:\\n",\n            "cumcm writing_runtime",\n        ),\n        (\n            "  mcm_icm:\\n"\n            "    aliases: [MCM, ICM, mcm, icm]\\n"\n            "    stable:\\n"\n            "      competition_pack: packs/competition/mcm_icm.md\\n"\n            "      latex_template: templates/latex/mcm/\\n"\n            "      compile_profile: mcm_icm\\n"\n            "      language: en\\n"\n            "    edition_rules:\\n",\n            "  mcm_icm:\\n"\n            "    aliases: [MCM, ICM, mcm, icm]\\n"\n            "    stable:\\n"\n            "      competition_pack: packs/competition/mcm_icm.md\\n"\n            "      latex_template: templates/latex/mcm/\\n"\n            "      compile_profile: mcm_icm\\n"\n            "      language: en\\n"\n            "      writing_runtime:\\n"\n            "        mode: full_reasoning_fallback\\n"\n            "    edition_rules:\\n",\n            "mcm writing_runtime",\n        ),\n        (\n            "  diangong:\\n"\n            "    aliases: [电工杯, diangong]\\n"\n            "    stable:\\n"\n            "      competition_pack: packs/competition/diangong.md\\n"\n            "      latex_template: templates/latex/diangong/\\n"\n            "      compile_profile: diangong\\n"\n            "      language: zh-CN\\n"\n            "    edition_rules:\\n",\n            "  diangong:\\n"\n            "    aliases: [电工杯, diangong]\\n"\n            "    stable:\\n"\n            "      competition_pack: packs/competition/diangong.md\\n"\n            "      latex_template: templates/latex/diangong/\\n"\n            "      compile_profile: diangong\\n"\n            "      language: zh-CN\\n"\n            "      writing_runtime:\\n"\n            "        mode: full_reasoning_fallback\\n"\n            "    edition_rules:\\n",\n            "diangong writing_runtime",\n        ),\n        (\n            "  certification_cup:\\n"\n            "    aliases: [认证杯, certification cup]\\n"\n            "    stable:\\n"\n            "      competition_pack: packs/competition/certification_cup.md\\n"\n            "      latex_template: null\\n"\n            "      compile_profile: null\\n"\n            "      language: zh-CN\\n"\n            "    edition_rules:\\n",\n            "  certification_cup:\\n"\n            "    aliases: [认证杯, certification cup]\\n"\n            "    stable:\\n"\n            "      competition_pack: packs/competition/certification_cup.md\\n"\n            "      latex_template: null\\n"\n            "      compile_profile: null\\n"\n            "      language: zh-CN\\n"\n            "      writing_runtime:\\n"\n            "        mode: full_reasoning_fallback\\n"\n            "    edition_rules:\\n",\n            "certification writing_runtime",\n        ),\n    ]\n    for old, new, label in replacements:\n        text = replace_once(text, old, new, label)\n    write(path, text)\n\n'''
          text = text[:start] + replacement + text[end + 1:]

          broken = '''    # Ensure the new check is invoked from the main lint sequence.\n    call_anchor = "    check_templates(errors)\\n"\n    text = replace_once(\n        text,\n        call_anchor,\n        "    check_competition_writing_runtime(errors)\\n" + call_anchor,\n        "lint competition runtime call",\n    )\n'''
          fixed = '''    sequence_anchor = (\n        "        check_contracts, check_project_state_and_framework, check_templates, "\n        "check_final_review_compliance, check_editable_mechanism_diagrams, check_syntax,\\n"\n    )\n    text = replace_once(\n        text,\n        sequence_anchor,\n        "        check_contracts, check_project_state_and_framework, "\n        "check_competition_writing_runtime, check_templates, "\n        "check_final_review_compliance, check_editable_mechanism_diagrams, check_syntax,\\n",\n        "lint competition runtime call",\n    )\n'''
          if text.count(broken) != 1:
              raise SystemExit(f"lint helper anchor mismatch: {text.count(broken)}")
          text = text.replace(broken, fixed, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply deterministic Phase G migration
        run: python scripts/_phase_g_migrate.py
      - name: Approve changed competition profile authority baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_v830_editable_mechanism_diagram.py")
          text = path.read_text(encoding="utf-8")
          old = '"config/competition_profiles.yaml": "fcddec42a30ad4d4bc760dc8322cc13a998a6ebd"'
          new = '"config/competition_profiles.yaml": "0cfe08e2edac99f07f2e527643499b8bc73c0479"'
          if text.count(old) != 1:
              raise SystemExit(f"competition profile protected baseline anchor mismatch: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Run focused Phase G regression
        run: python -m unittest tests.test_v900_phase_g_competition_runtime tests.test_v800_writing_runtime tests.test_v800_cross_chat_minimal_context
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Regenerate repository metadata
        run: python scripts/generate_indexes.py
      - name: Lint active skill graph
        run: python scripts/lint_skill.py --skip-generated
      - name: Verify generated metadata
        run: python scripts/generate_indexes.py --check
      - name: Remove one-shot integration files
        run: rm scripts/_phase_g_migrate.py .github/workflows/phase-g-integration.yml
      - name: Regenerate final metadata
        run: python scripts/generate_indexes.py
      - name: Final lint and diff check
        run: |
          python scripts/lint_skill.py --skip-generated
          python scripts/generate_indexes.py --check
          git diff --check
      - name: Commit verified Phase G tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: configure competition writing runtime profiles"
          git push origin HEAD:phase-g/competition-writing-runtime
