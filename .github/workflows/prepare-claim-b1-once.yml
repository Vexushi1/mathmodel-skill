name: Prepare verified B1 candidate once
on:
  push:
    branches: ["upgrade/v10.4.0-claim-evidence-b1"]
    paths: [".github/workflows/prepare-claim-b1-once.yml"]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'Vexushi1/mathmodel-skill' && github.ref_name == 'upgrade/v10.4.0-claim-evidence-b1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Prepare bounded candidate objects without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import base64, bz2, hashlib, io, json, os, pathlib, subprocess, tarfile, tempfile, urllib.request, zipfile
          REPO='Vexushi1/mathmodel-skill'
          BRANCH='upgrade/v10.4.0-claim-evidence-b1'
          BASE='eb46d962d3e2e840be44fca5122138fabaf889e7'
          MAIN='186785e662b15989c649201a25709ae90cfee410'
          MAIN_TREE='ff0e5612bb9df47ea33a0ad74e1e47ff5e613ff8'
          TRANSPORT='613f6f970bd32afe5fe4d4ca7d5307c3399e763b'
          SELF='.github/workflows/prepare-claim-b1-once.yml'
          DIGEST='2cbdfdc10e040336d7e86596e6ac2809f616ccc87f9b01594b87cfdb7a14e4f1'
          GENERATED={'SKILL_FILE_INDEX.md','TEMPLATE_INDEX.md','MANIFEST.sha256','HSK_SKILL_FILE_INDEX_V622.md','HSK_TEMPLATE_INDEX_V622.md'}
          ALLOWED=set('''.codex-plugin/plugin.json
          .github/workflows/ci.yml
          CHANGELOG.md
          README.md
          SKILL.md
          config/prose_audit_patterns.yaml
          core/bootstrap.yaml
          core/claim_evidence_contract.yaml
          core/hsk_core_policy.md
          core/module_manifest.yaml
          core/output_contract.yaml
          core/project_state.schema.yaml
          core/workflow_router.yaml
          core/writing_runtime_contract.yaml
          docs/modeling_intelligence_b1_protocol_decisions.md
          docs/modeling_intelligence_evidence_evolution_plan.md
          scripts/README.md
          scripts/claim_evidence.py
          scripts/claim_sources.py
          scripts/claim_values.py
          scripts/claim_workbook.py
          scripts/lint_skill_checks.py
          skills/mathmodel-skill/SKILL.md
          tests/claim_evidence_smoke.py
          tests/claim_fixture.py
          tests/claim_schema_reference.py
          tests/reading_plan_evidence.py
          tests/test_claim_contract.py
          tests/test_claim_evidence.py
          tests/test_claim_graph.py
          tests/test_claim_values.py
          tests/test_claim_workbook.py
          tests/test_conformance_integration.py
          tests/test_p9_release_closeout.py
          tests/test_v1000_release_version_matrix.py
          tests/test_v900_phase_i_migration_matrix.py
          tests/test_v900_phase_i_release_closure.py
          tests/test_v900_phase_i_v9_applicability.py
          tests/test_v900_phase_i_writer_retirement_readiness.py
          tests/test_v910_publication_rendering.py'''.splitlines())
          PARTS=['d3d04536ffdad143f52f5ada734ffc5748c38576','cf16540ec26f04700b957b9fd139ddb5f1ce6b91','3cb26e1d82046dbe3c1c6c9517aca19ff833b8aa','5d835b421d0e4d177b29e2bebd4d807318a817c1','2d422b8a24c2a59d5b36c47c2f49a64100f3ff43','df2b2cdc8e2912c86afaa6874f7f1083591ed1f8','d13cbb81e7209664d2a6bdc69acc8a77f10f6094']
          ROOT=pathlib.Path.cwd().resolve()
          OUT=pathlib.Path(os.environ['RUNNER_TEMP'])/'b1-preparation-evidence';OUT.mkdir()
          def git(*args, raw=False):
              data=subprocess.check_output(['git',*args]);return data if raw else data.decode().strip()
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def api(path,data=None):
              body=None if data is None else json.dumps(data,ensure_ascii=False).encode()
              request=urllib.request.Request('https://api.github.com/repos/'+REPO+path,data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response:raw=response.read(4_000_001)
              assert len(raw)<=4_000_000
              return json.loads(raw)
          assert os.environ['GITHUB_REPOSITORY']==REPO and os.environ['GITHUB_REF_NAME']==BRANCH
          assert api('/git/ref/heads/main')['object']['sha']==MAIN
          assert git('merge-base',BASE,'HEAD')==BASE
          assert set(git('diff','--name-only',BASE,'HEAD').splitlines())<=GENERATED|{SELF}
          rows=api('/git/trees/'+TRANSPORT)['tree']
          assert [(r['path'],r['sha']) for r in rows]==[(f'part-{i:03d}.txt',sha) for i,sha in enumerate(PARTS)]
          chunks=[]
          for i,row in enumerate(rows):
              assert row['type']=='blob' and row['mode']=='100644' and row['size']<=8194
              obj=api('/git/blobs/'+row['sha']);assert obj['encoding']=='base64'
              data=base64.b64decode(obj['content']);assert blob(data)==row['sha']
              if i==1:
                  # Repair the one identified transport-only two-character duplication.
                  assert data.count(b'KKIiIiIiIiIiIiJ9fv')==1
                  data=data.replace(b'KKIiIiIiIiIiIiJ9fv',b'KKIiIiIiIiIiJ9fv',1)
                  assert blob(data)=='3135f3ebfdfa52c749d8be5f988782a3c8815c2a'
              chunks.append(data)
          compressed=base64.b64decode(b''.join(chunks),validate=True)
          assert len(compressed)==39476 and hashlib.sha256(compressed).hexdigest()==DIGEST
          reader=bz2.BZ2Decompressor();raw=reader.decompress(compressed,max_length=1_000_001)
          assert len(raw)==170073 and reader.eof and not reader.unused_data
          payload=json.loads(raw)
          assert set(payload)=={'protocol','repository','branch','base_commit','files','patch'}
          assert (payload['protocol'],payload['repository'],payload['branch'],payload['base_commit'])==('B1-exact-delta-1',REPO,BRANCH,BASE)
          assert len(payload['files'])==40 and {r['path'] for r in payload['files']}==ALLOWED
          for row in payload['files']:
              path=ROOT/row['path'];assert not path.is_symlink() and path.resolve().is_relative_to(ROOT)
              assert (blob(path.read_bytes()) if path.exists() else None)==row['old_blob'],row['path']
          patch=OUT/'verified.diff';patch.write_text(payload['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for row in payload['files']:
              data=(ROOT/row['path']).read_bytes()
              assert blob(data)==row['new_blob'] and hashlib.sha256(data).hexdigest()==row['sha256'],row['path']
          # Two precisely diagnosed full-suite closure corrections, without weakening assertions.
          p=ROOT/'CHANGELOG.md';text=p.read_text();assert blob(p.read_bytes())=='025ede7db9ffeb4659968773e088d00ac087bb0e'
          assert text.count('## 10.3.0\n')==1;p.write_text(text.replace('## 10.3.0\n','## Previous release: 10.3.0\n'),encoding='utf-8')
          assert blob(p.read_bytes())=='a07648072aa55a064cb455137e8b278451dda1db'
          name='tests/test_v830_editable_mechanism_diagram.py';p=ROOT/name
          assert blob(p.read_bytes())=='fa09d10515fa09cf0d7152f662462cfb68ebbee4'
          old='        # Schema 8.0.0 removes stage selectors and declares one project-root backend.\n        "core/project_state.schema.yaml": "28e3f87b8a4f54caadff48abbcf82ab56c1b9009",'
          new='        # B1 adds optional claim records; test_claim_contract protects the exact predecessor schema.\n        "core/project_state.schema.yaml": "b7ad4dbaccc76734ac712f6388c898654813cde2",'
          text=p.read_text();assert text.count(old)==1;p.write_text(text.replace(old,new),encoding='utf-8')
          assert blob(p.read_bytes())=='a6572896e3cce6f2d564ef3fb514a2f34e592f88';ALLOWED.add(name)
          # Create genuine old-A2 execution evidence, not manually edited receipts or approvals.
          assert git('rev-parse',MAIN+'^{tree}')==MAIN_TREE
          with tempfile.TemporaryDirectory(prefix='b1-old-a2-') as tmp:
              tmp=pathlib.Path(tmp);base=tmp/'baseline';base.mkdir();fixture=tmp/'fixture'
              with tarfile.open(fileobj=io.BytesIO(git('archive',MAIN,raw=True))) as archive:
                  for member in archive.getmembers():
                      target=base/member.name
                      assert not member.issym() and not member.islnk() and target.resolve().is_relative_to(base)
                  archive.extractall(base,filter='data')
              cmd=['python','tests/conformance_a2_smoke.py','--project',str(fixture),'--backend','python']
              process=subprocess.run(cmd,cwd=base,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=300)
              (OUT/'old-a2-actual-execution.log').write_bytes(process.stdout);assert process.returncode==0
              expected={'constraints.json','data/raw.csv','data.csv','state/project_state.yaml','模型论文框架.md','数据预处理/数据预处理.py','数据预处理/数据预处理结果.xlsx','问题一求解/问题一求解.py','问题一求解/问题一求解结果.xlsx','问题一求解/问题一结果深化分析.py','问题一求解/问题一结果深化分析.xlsx'}
              excluded={'state/.project_transaction.lock','a2_primary_native.log','a2_primary_receipt.log','a2_analysis_native.log','a2_analysis_receipt.log','a2_smoke_report.json'}
              actual={p.relative_to(fixture).as_posix():p for p in fixture.rglob('*') if p.is_file()}
              assert set(actual)==expected|excluded
              prefix='tests/fixtures/claim_evidence/'
              capsule=ROOT/(prefix+'a2_baseline_synthetic.zip');capsule.parent.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(capsule,'w',compression=zipfile.ZIP_DEFLATED) as z:
                  for name in sorted(expected):z.writestr(name,actual[name].read_bytes())
              metadata={'synthetic_only':True,'fixture':'scalar a*x=b+offset, a=2,b=6,offset=2','baseline_commit':MAIN,'baseline_tree':MAIN_TREE,
                  'creation_command':['python','tests/conformance_a2_smoke.py','--project','<isolated synthetic directory>','--backend','python'],
                  'baseline_native_and_receipt_exit':0,'capsule_sha256':hashlib.sha256(capsule.read_bytes()).hexdigest(),
                  'files':{name:hashlib.sha256(actual[name].read_bytes()).hexdigest() for name in sorted(expected)},'excluded_transient_files':sorted(excluded)}
              meta=ROOT/(prefix+'a2_baseline_provenance.json');meta.write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              ALLOWED|={prefix+'a2_baseline_synthetic.zip',prefix+'a2_baseline_provenance.json'}
              (OUT/'fixture-provenance.json').write_text(meta.read_text(),encoding='utf-8')
          (ROOT/SELF).unlink()
          subprocess.run(['python','scripts/generate_indexes.py'],check=True)
          subprocess.run(['python','scripts/lint_skill.py'],check=True)
          subprocess.run(['python','scripts/generate_indexes.py','--check'],check=True)
          subprocess.run(['python','-m','unittest','tests.test_claim_values','tests.test_claim_workbook','tests.test_claim_graph','tests.test_claim_contract'],check=True)
          subprocess.run(['git','fetch','origin','refs/heads/'+BRANCH],check=True)
          parent=git('rev-parse','FETCH_HEAD');assert git('merge-base',BASE,parent)==BASE
          assert set(git('diff','--name-only',BASE,parent).splitlines())<=GENERATED|{SELF}
          assert api('/git/ref/heads/main')['object']['sha']==MAIN
          subprocess.run(['git','add','--',*sorted(ALLOWED|GENERATED|{SELF})],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          changed=set(git('diff','--cached','--name-only',parent).splitlines());assert changed<=ALLOWED|GENERATED|{SELF}
          expected_tree=git('write-tree');elements=[];summary=[]
          for name in sorted(changed):
              path=ROOT/name
              if not path.exists():
                  assert name==SELF;elements.append({'path':name,'mode':'100644','type':'blob','sha':None});continue
              data=path.read_bytes();mode=git('ls-files','--stage','--',name).split()[0]
              item={'path':name,'mode':mode,'type':'blob'}
              if name.endswith('.zip'):
                  created=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()});assert created['sha']==blob(data);item['sha']=created['sha']
              else:item['content']=data.decode('utf-8')
              elements.append(item);summary.append({'path':name,'blob':blob(data),'sha256':hashlib.sha256(data).hexdigest()})
          created=api('/git/trees',{'base_tree':git('rev-parse',parent+'^{tree}'),'tree':elements})
          assert created['sha']==expected_tree
          commit=api('/git/commits',{'message':'feat(v10.4.0): B1 bounded claim-evidence parsing and explicit A2 revalidation','tree':expected_tree,'parents':[parent]})
          report={'repository':REPO,'branch':BRANCH,'parent':parent,'candidate_commit':commit['sha'],'tree':expected_tree,'attached_to_branch':False,'transport_sha256':DIGEST,'files':summary,'fixture':metadata}
          (OUT/'candidate.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:report[k] for k in ('parent','candidate_commit','tree','attached_to_branch')},ensure_ascii=False))
          print('Prepared only. The authorized connector must review the candidate and fast-forward the feature branch; no refs were moved here.')
          PYTHON
      - name: Preserve preparation and actual baseline-run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b1-prepared-candidate
          path: ${{ runner.temp }}/b1-preparation-evidence
          if-no-files-found: error
