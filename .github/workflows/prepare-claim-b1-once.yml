name: Prepare verified B1 candidate once
on:
  push:
    branches: ["upgrade/v10.4.0-claim-evidence-b1"]
    paths: [".github/workflows/prepare-claim-b1-once.yml"]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'Vexushi1/mathmodel-skill' && github.ref_name == 'upgrade/v10.4.0-claim-evidence-b1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Recover reviewed sources and upload unattached blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import hashlib, pathlib, subprocess, yaml
          # Execute only this pinned, already-reviewed repository maintenance program.
          # Its transport, path, baseline, source hash and native-fixture checks remain intact.
          # No project task code is accepted, and no refs/commits/trees are written by the token.
          reference='42eaa0a2d7a98967f5dfb93795344e484a0fb45a'
          path='.github/workflows/prepare-claim-b1-once.yml'
          raw=subprocess.check_output(['git','show',reference+':'+path])
          actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert actual=='3253d6f75674d999a91ec01895ffb5302e2235f7'
          steps=yaml.safe_load(raw)['jobs']['prepare']['steps']
          matches=[x['run'] for x in steps if x.get('name')=='Prepare bounded candidate objects without moving refs']
          assert len(matches)==1
          lines=matches[0].splitlines()
          assert lines[0]=="python - <<'PYTHON'" and lines[-1]=='PYTHON'
          program='\n'.join(lines[1:-1])+'\n'
          marker="subprocess.run(['python','scripts/generate_indexes.py'],check=True)"
          assert program.count(marker)==1
          correction=r'''
          encoded_obj=api('/git/blobs/05d4c9a6653d0e7b880b251b93ecea71a94c4d7f')
          assert encoded_obj['encoding']=='base64'
          encoded=base64.b64decode(encoded_obj['content'])
          assert len(encoded)==8012 and blob(encoded)=='05d4c9a6653d0e7b880b251b93ecea71a94c4d7f'
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='a4b82f6464fa51650d473c746a410900f590bbde6a593840402444477f5268bf'
          decoder=bz2.BZ2Decompressor();decoded=decoder.decompress(packed,max_length=200001)
          assert len(decoded)<=200000 and decoder.eof and not decoder.unused_data
          delta=json.loads(decoded)
          names={'scripts/claim_values.py','scripts/claim_workbook.py','tests/test_claim_values.py','tests/test_claim_workbook.py','core/claim_evidence_contract.yaml','docs/modeling_intelligence_b1_protocol_decisions.md'}
          assert set(delta)=={'protocol','files','patch'} and delta['protocol']=='B1-reviewed-boundary-delta-1'
          assert len(delta['files'])==6 and {x['path'] for x in delta['files']}==names and names<=ALLOWED
          for row in delta['files']:
              assert blob((ROOT/row['path']).read_bytes())==row['old_blob'],row['path']
          fix=OUT/'reviewed-boundary.diff';fix.write_text(delta['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(fix)],check=True)
          subprocess.run(['git','apply',str(fix)],check=True)
          for row in delta['files']:
              data=(ROOT/row['path']).read_bytes()
              assert blob(data)==row['new_blob'] and hashlib.sha256(data).hexdigest()==row['sha256'],row['path']
          '''
          import textwrap
          program=program.replace(marker,textwrap.dedent(correction)+'\n'+marker)
          tail='expected_tree=git(\'write-tree\');elements=[];summary=[]'
          assert program.count(tail)==1
          program=program.split(tail)[0]+textwrap.dedent(r'''
          expected_tree=git('write-tree');elements=[];summary=[]
          for name in sorted(changed):
              path=ROOT/name
              if not path.exists():
                  assert name==SELF
                  elements.append({'path':name,'mode':'100644','type':'blob','sha':None})
                  continue
              data=path.read_bytes();mode=git('ls-files','--stage','--',name).split()[0]
              assert mode=='100644',name
              created=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
              assert created['sha']==blob(data),name
              elements.append({'path':name,'mode':mode,'type':'blob','sha':created['sha']})
              summary.append({'path':name,'blob':created['sha'],'sha256':hashlib.sha256(data).hexdigest()})
          archive=git('archive','--format=tar.gz',expected_tree,raw=True)
          (OUT/'candidate.tar.gz').write_bytes(archive)
          report={'repository':REPO,'branch':BRANCH,'parent':parent,'parent_tree':git('rev-parse',parent+'^{tree}'),
              'tree':expected_tree,'attached_to_branch':False,'refs_written':False,'trees_written':False,
              'transport_sha256':DIGEST,'files':summary,'tree_elements':elements,'fixture':metadata,
              'candidate_archive_sha256':hashlib.sha256(archive).hexdigest()}
          (OUT/'candidate.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:report[k] for k in ('parent','parent_tree','tree','attached_to_branch','refs_written','trees_written')},ensure_ascii=False))
          print('Unattached blobs only. The authorized connector must verify the full snapshot and create the reviewed tree/commit.')
          ''')
          compile(program,'<pinned-b1-maintenance-with-reviewed-boundary-corrections>','exec')
          exec(program,{'__name__':'__main__'})
          PYTHON
      - name: Preserve source snapshot and actual validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b1-prepared-candidate
          path: ${{ runner.temp }}/b1-preparation-evidence
          if-no-files-found: error
