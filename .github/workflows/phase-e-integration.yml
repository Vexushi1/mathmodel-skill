name: Phase E artifact identity integration

on:
  push:
    branches:
      - phase-e/artifact-naming-migration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-e-artifact-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-e/artifact-naming-migration
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply Phase E migration
        run: python scripts/_phase_e_apply.py
      - name: Remove one-shot integration files
        run: |
          rm scripts/_phase_e_apply.py
          rm .github/workflows/phase-e-integration.yml
      - name: Rebuild generated metadata
        run: python scripts/generate_indexes.py
      - name: Run Phase E focused regressions
        run: python -m unittest tests.test_v900_artifact_identity tests.test_v900_state_transitions tests.test_v900_refactor_characterization tests.test_schemas tests.test_user_execution_contract tests.test_v711_model_approval_gate
      - name: Run full unit test suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run active-skill lint
        run: python scripts/lint_skill.py
      - name: Verify generated metadata
        run: python scripts/generate_indexes.py --check
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit Phase E
        run: |
          git config user.name "Vexushi1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Phase E changes to commit."
            exit 1
          fi
          git commit -m "refactor: migrate Phase E artifact identity names"
          git push origin HEAD:phase-e/artifact-naming-migration
