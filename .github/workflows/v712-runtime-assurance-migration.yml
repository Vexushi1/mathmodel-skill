name: v7.12 Runtime Assurance Migration

on:
  push:
    branches:
      - upgrade/v7.12.0-declarative-runtime-assurance

permissions:
  contents: write

concurrency:
  group: v712-runtime-assurance-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: upgrade/v7.12.0-declarative-runtime-assurance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Wait for generated metadata refresh and sync branch
        shell: bash
        run: |
          sleep 20
          git fetch origin upgrade/v7.12.0-declarative-runtime-assurance
          git reset --hard origin/upgrade/v7.12.0-declarative-runtime-assurance
      - name: Apply v7.12 runtime assurance migration
        run: |
          python scripts/_v712_runtime_assurance_migration.py
          python scripts/_v712_lint_migration.py
      - name: Refresh generated repository metadata
        run: python scripts/generate_indexes.py
      - name: Validate runtime assurance migration
        shell: bash
        run: |
          python scripts/lint_skill.py
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/generate_indexes.py --check
          python scripts/resolve_runtime.py full_solution --primary mechanism --secondary optimization --competition CUMCM
          python scripts/resolve_runtime.py --request "请审题并建模"
      - name: Commit runtime assurance migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "feat: add v7.12 declarative runtime assurance"
          git push origin HEAD:upgrade/v7.12.0-declarative-runtime-assurance
