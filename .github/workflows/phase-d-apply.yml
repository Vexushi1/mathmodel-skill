name: Phase D deterministic integration

on:
  push:
    branches:
      - phase-d/state-transition-engine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-d-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-d/state-transition-engine
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply deterministic Phase D patch
        run: python scripts/_phase_d_apply.py
      - name: Repair approval-preservation characterization fixture
        run: python scripts/_phase_d_fix_fixture.py
      - name: Migrate active skill lint to shared transition Authority
        run: python scripts/_phase_d_fix_lint.py
      - name: Run full unit test suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Rebuild generated metadata before lint
        run: python scripts/generate_indexes.py
      - name: Run active-skill lint
        run: python scripts/lint_skill.py
      - name: Verify generated metadata
        run: python scripts/generate_indexes.py --check
      - name: Reject whitespace errors
        run: git diff --check
      - name: Remove one-shot integration helpers
        run: |
          rm scripts/_phase_d_apply.py
          rm scripts/_phase_d_fix_fixture.py
          rm scripts/_phase_d_fix_lint.py
          rm .github/workflows/phase-d-apply.yml
      - name: Rebuild and revalidate final metadata
        run: |
          python scripts/generate_indexes.py
          python scripts/generate_indexes.py --check
          python scripts/lint_skill.py
          git diff --check
      - name: Commit final Phase D integration
        run: |
          git config user.name "Vexushi1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Phase D changes to commit."
            exit 1
          fi
          git commit -m "refactor: unify Phase D state transitions"
          git push origin HEAD:phase-d/state-transition-engine
