name: P8c one-shot drift rebaseline

on:
  push:
    branches:
      - maintenance/p8c-drift-rebaseline

permissions:
  contents: write

jobs:
  rebaseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/p8c-drift-rebaseline
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Rebaseline only the explicitly changed protected execution surface
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_v830_editable_mechanism_diagram.py')
          text = path.read_text(encoding='utf-8')
          old_comment = '''    # P7 intentionally rebaselines only project-state result-analysis semantics and the\n    # 03B module because conditional Analysis Necessity Gate behavior explicitly changes them.\n'''
          new_comment = old_comment + '''    # P8c intentionally rebaselines only code-delivery validation because the measured\n    # duplicate RUN_CONFIG parser is consolidated without changing its field policy or errors.\n'''
          assert text.count(old_comment) == 1
          text = text.replace(old_comment, new_comment, 1)
          old_hash = '"scripts/validate_code_delivery.py": "8d2cbbf6e75c0871c329954b7fed11df53fe50bc"'
          new_hash = '"scripts/validate_code_delivery.py": "078e50d2d8b192823f4e462d7bfd5e46e0e27988"'
          assert text.count(old_hash) == 1
          text = text.replace(old_hash, new_hash, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/p8c-rebaseline-once.yml').unlink()
          PY
      - name: Refresh generated metadata
        run: python scripts/generate_indexes.py
      - name: Run protected-surface and P5/P8c regression
        run: python -m unittest tests.test_v830_editable_mechanism_diagram tests.test_p5a_run_config tests.test_p5b_run_receipt tests.test_p8c_run_config_parser
      - name: Run static skill lint
        run: python scripts/lint_skill.py
      - name: Commit final rebaseline tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: rebaseline P8c protected parser surface"
          git push origin HEAD:maintenance/p8c-drift-rebaseline
