name: Apply v7.2.6 framework project-memory patch

on:
  push:
    branches:
      - fix/v7.2.6-framework-project-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: add v7.2.6 framework-memory patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/apply_v726_framework_memory_patch.py
      - name: Remove one-shot patch files
        run: git rm scripts/apply_v726_framework_memory_patch.py .github/workflows/v726-framework-memory.yml
      - name: Commit and push
        run: |
          git config user.name "hsk"
          git config user.email "h2133577702@gmail.com"
          git add -A
          git commit -m "fix: release v7.2.6 framework project-memory contract"
          git push
