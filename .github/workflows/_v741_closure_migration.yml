name: Temporary v7.4.1 closure migration

on:
  push:
    branches:
      - fix/v7.4.1-skill-closure-hygiene
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v741-closure-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply one-shot migration
        run: python scripts/_v741_closure_migration.py
      - name: Refresh generated metadata
        run: python scripts/generate_indexes.py
      - name: Run closure lint and focused regressions
        run: |
          python scripts/lint_skill.py
          python -m unittest tests.test_v741_skill_closure_hygiene tests.test_router_contract tests.test_latex_first_versionless_docs tests.test_v740_writing_evidence_architecture tests.test_schemas
      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "fix: v7.4.1 skill closure and read-path hygiene"
          git push
