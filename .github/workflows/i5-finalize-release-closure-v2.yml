              '        self.assertIn("runtime_authority: false", MIGRATION_CONTRACT)\n'
              '        self.assertIn("destructive_compatibility_removal_authorized: true", MIGRATION_CONTRACT)\n'
              '        self.assertIn("current_skill_version: 9.0.0", MIGRATION_CONTRACT)\n'
              '        self.assertIn("phase_i_release_documentation_complete: true", MIGRATION_CONTRACT)\n'
              '        self.assertIn("I5 本身不执行真实用户项目的批量迁移", MIGRATION_CONTRACT)\n'
          )
          text, n = pattern.subn(replacement, text)
          if n != 1:
              raise SystemExit(f"migration test: function replacement count={n}")
          p.write_text(text, encoding="utf-8")
          PY
      - name: Remove temporary workflows and rebuild generated metadata
        run: |
          git rm -f .github/workflows/i5-finalize-release-closure.yml
          git rm -f .github/workflows/i5-finalize-release-closure-v2.yml
          python scripts/generate_indexes.py
      - name: Validate focused I5 closure before commit
        run: |
          python -m unittest tests.test_v900_phase_i_release_closure tests.test_v900_phase_i_migration_matrix
          python scripts/generate_indexes.py --check
      - name: Commit final I5 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
