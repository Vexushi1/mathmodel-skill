name: v7.5.2 CI guard alignment

on:
  push:
    branches:
      - fix/v7.5.2-entrypoint-parity
    paths:
      - .github/workflows/v752-ci-hotfix.yml

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Wait for generated metadata refresh from this push
        run: sleep 20
      - name: Reset to latest branch head
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - name: Align old CI guards with versionless stable docs
        run: |
          python - <<'PY'
          from pathlib import Path

          lint = Path("scripts/lint_skill.py")
          text = lint.read_text(encoding="utf-8")
          old = '''    if f"HSK v{PACKAGE_VERSION} execution plan" not in resolver:\n        errors.append("resolver release marker mismatch")\n    if "HSK v7.0.1 execution plan" in resolver:\n        errors.append("resolver still contains obsolete v7.0.1 release marker")'''
          new = '''    if "ordered HSK execution plan" not in resolver:\n        errors.append("resolver must expose the versionless execution-plan docstring")\n    if re.search(r"HSK v\\d+\\.\\d+\\.\\d+ execution plan", resolver):\n        errors.append("resolver execution-plan docstring must remain versionless")'''
          if text.count(old) != 1:
              raise SystemExit("lint resolver guard anchor mismatch")
          lint.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          test = Path("tests/test_structure.py")
          text = test.read_text(encoding="utf-8")
          old = '''        version = str(bootstrap["skill_version"])\n        scripts_readme = (ROOT / "scripts/README.md").read_text(encoding="utf-8")\n        legacy_readme = (ROOT / "legacy/README.md").read_text(encoding="utf-8")\n\n        self.assertEqual(scripts_readme.splitlines()[0], f"# Scripts v{version}")\n        for token in ("objective", "structures", "capabilities"):\n            self.assertIn(token, scripts_readme)\n        self.assertNotIn("主/次题型", scripts_readme)\n        self.assertIn(f"不属于 v{version} 默认运行链路", legacy_readme)'''
          new = '''        scripts_readme = (ROOT / "scripts/README.md").read_text(encoding="utf-8")\n        legacy_readme = (ROOT / "legacy/README.md").read_text(encoding="utf-8")\n\n        self.assertEqual(scripts_readme.splitlines()[0], "# Scripts")\n        for token in ("objective", "structures", "capabilities"):\n            self.assertIn(token, scripts_readme)\n        self.assertNotIn("主/次题型", scripts_readme)\n        self.assertIn("不属于当前默认运行链路", legacy_readme)'''
          if text.count(old) != 1:
              raise SystemExit("test_structure stable-doc guard anchor mismatch")
          test.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/v752-ci-hotfix.yml
      - name: Refresh generated metadata
        run: python scripts/generate_indexes.py
      - name: Run focused lint and regression checks
        run: |
          python scripts/lint_skill.py
          python -m unittest tests.test_structure tests.test_v752_entrypoint_parity
      - name: Commit aligned guards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align v7.5.2 CI guards with versionless docs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
