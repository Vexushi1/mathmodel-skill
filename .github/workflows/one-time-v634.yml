# Temporary workflow. It deletes itself after synchronizing the pull-request branch.
name: One-time v6.3.4 synchronization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: one-time-v634-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Synchronize current version markers
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              "core/workflow_router.yaml",
              "core/module_manifest.yaml",
              "core/output_contract.yaml",
              "core/project_state.schema.yaml",
              "scripts/generate_indexes.py",
              "scripts/lint_skill.py",
              "scripts/resolve_workflow.py",
              "scripts/sync_project.py",
              "scripts/validate_model_paper_framework.py",
              "scripts/validate_project_state.py",
              "scripts/README.md",
              "skills/mathmodel-skill/SKILL.md",
              "state/project_state.example.yaml",
              "templates/code/hsk_pipeline/README.md",
              "agents/openai.yaml",
          ]
          for relative in targets:
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              updated = text.replace("6.3.3", "6.3.4")
              if relative == "scripts/lint_skill.py":
                  updated = updated.replace(
                      '"CHANGELOG_V633.md", "CHANGELOG_V632.md"',
                      '"CHANGELOG_V634.md", "CHANGELOG_V633.md", "CHANGELOG_V632.md"',
                  )
                  updated = updated.replace(
                      ', "CHANGELOG_V633.md"]',
                      ', "CHANGELOG_V634.md"]',
                  )
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="\n")
          PY
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Refresh generated repository metadata
        run: python scripts/generate_indexes.py
      - name: Validate repository
        run: |
          python scripts/lint_skill.py
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/generate_indexes.py --check
      - name: Remove temporary workflow and commit synchronized files
        run: |
          rm .github/workflows/one-time-v634.yml
          python scripts/generate_indexes.py
          python scripts/lint_skill.py
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/generate_indexes.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: synchronize v6.3.4 and remove temporary workflow"
          git push origin HEAD:${{ github.head_ref }}
