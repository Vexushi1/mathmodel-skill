name: Apply v6.3.2 CI fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - scripts/apply_v632_ci_fixes.py
      - .github/workflows/apply-v632-ci-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-v632-ci-fixes-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic fixes
        run: python scripts/apply_v632_ci_fixes.py
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Record pre-commit diagnostics
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' > v632-ci-fixes.log 2>&1
          echo "unit_test_status=$?" >> v632-ci-fixes.log
          python scripts/lint_skill.py --skip-generated >> v632-ci-fixes.log 2>&1
          echo "lint_status=$?" >> v632-ci-fixes.log
          cat v632-ci-fixes.log
          exit 0
      - name: Upload pre-commit diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v632-ci-fixes-diagnostics
          path: v632-ci-fixes.log
      - name: Commit repaired sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/code/hsk_pipeline/workbook_validation.py tests/test_v631_contract_closure.py tests/test_v632_delivery_gate_closure.py scripts/lint_skill.py scripts/sync_project.py
          git commit -m 'fix: align v6.3.2 validator diagnostics and scope semantics'
          git push origin HEAD:${{ github.head_ref }}
