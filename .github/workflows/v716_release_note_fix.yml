name: V716 Release Note Fix

on:
  push:
    branches:
      - "upgrade/v7.16.0-paper-writing-spec"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize wording and generated metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          old = "Upgraded `模型论文框架.md` to `v0.8-project-memory` with standard model type, formal model name, Model/Solver/Validator roles, optimization-objective abstract closure, solver evidence roles, subsection planning, and headline claim Evidence Level/Scope."
          new = "Extended the existing `v0.8-project-memory` model-paper framework with standard model type, formal model name, Model/Solver/Validator roles, optimization-objective abstract closure, solver evidence roles, subsection planning, and headline claim Evidence Level/Scope, without a framework schema-version migration."
          if old not in text:
              raise SystemExit("expected release-note sentence not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/v716_release_note_fix.yml").unlink()
          PY
          python scripts/generate_indexes.py
          python scripts/generate_indexes.py --check
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize v7.16 release notes"
          git push origin HEAD:upgrade/v7.16.0-paper-writing-spec
