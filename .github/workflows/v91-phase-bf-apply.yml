name: Apply v9.1 publication rendering Phase B-F

on:
  push:
    branches:
      - docs/v9.1-matlab-publication-rendering-plan
    paths:
      - .github/workflows/v91-phase-bf-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/v9.1-matlab-publication-rendering-plan
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply deterministic Phase B-F patch
        shell: bash
        run: |
          cat > /tmp/v91_phase_bf.py.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/v91_phase_bf.py.gz.b64 | gzip -d > /tmp/v91_phase_bf.py
          python /tmp/v91_phase_bf.py
          python scripts/generate_indexes.py
      - name: Commit Phase B-F and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v91-phase-bf-apply.yml
          git add -A
          git commit -m "feat: implement v9.1 publication rendering core"
          git push origin HEAD:docs/v9.1-matlab-publication-rendering-plan
