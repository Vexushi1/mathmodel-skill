name: Phase H Integration

on:
  push:
    branches: ["phase-h/sync-project-mechanical-split"]

permissions:
  contents: write

concurrency:
  group: phase-h-integration-${{ github.ref }}
  cancel-in-progress: true

# One-shot verifier for the mechanical extraction; this file deletes itself on success.
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Fix Phase H regression harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_phase_h_extract.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '            self.assertIs(getattr(SYNC, name), getattr(FINGERPRINT, name))\n',
                  '            self.assertIs(getattr(SYNC, name), getattr(SYNC.ARTIFACT_FINGERPRINT, name))\n',
                  "artifact alias assertion",
              ),
              (
                  '            self.assertIs(getattr(SYNC, name), getattr(SNAPSHOT, name))\n',
                  '            self.assertIs(getattr(SYNC, name), getattr(SYNC.PROJECT_SNAPSHOT, name))\n',
                  "snapshot alias assertion",
              ),
          ]
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"{label} anchor mismatch: {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply mechanical extraction
        run: python scripts/_phase_h_extract.py
      - name: Run focused Phase H regression
        run: >-
          python -m unittest
          tests.test_v900_phase_h_sync_split
          tests.test_sync_project
          tests.test_v900_artifact_identity
          tests.test_v900_transactional_writers
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Regenerate repository metadata
        run: python scripts/generate_indexes.py
      - name: Lint active skill graph
        run: python scripts/lint_skill.py --skip-generated
      - name: Verify generated metadata
        run: python scripts/generate_indexes.py --check
      - name: Remove one-shot integration files
        run: rm scripts/_phase_h_extract.py .github/workflows/phase-h-integration.yml
      - name: Regenerate final metadata
        run: python scripts/generate_indexes.py
      - name: Final checks
        run: |
          python scripts/lint_skill.py --skip-generated
          python scripts/generate_indexes.py --check
          git diff --check
      - name: Commit verified Phase H tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: split sync project snapshot helpers"
          git push origin HEAD:phase-h/sync-project-mechanical-split
