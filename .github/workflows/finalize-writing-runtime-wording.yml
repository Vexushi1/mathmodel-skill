name: Finalize writing runtime wording

on:
  push:
    branches:
      - maintenance/writing-runtime-v9-wording

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/writing-runtime-v9-wording
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply exact docs-only wording cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("core/writing_runtime_contract.yaml")
          text = path.read_text(encoding="utf-8")
          old = "  v8 写作阶段的最小运行时映射。它不建立第二套数学写作 Authority，只声明普通论文写作真正需要加载的\n"
          new = "  普通论文写作的最小运行时映射。它不建立第二套数学写作 Authority，只声明普通论文写作真正需要加载的\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale wording occurrence, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")

          workflow = Path(".github/workflows/finalize-writing-runtime-wording.yml")
          workflow.unlink()
          PY
      - name: Regenerate repository metadata
        run: python scripts/generate_indexes.py
      - name: Commit final source and generated metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/writing_runtime_contract.yaml \
            SKILL_FILE_INDEX.md TEMPLATE_INDEX.md \
            HSK_SKILL_FILE_INDEX_V622.md HSK_TEMPLATE_INDEX_V622.md \
            MANIFEST.sha256 \
            .github/workflows/finalize-writing-runtime-wording.yml
          git commit -m "docs: remove stale v8 wording from writing runtime"
          git push
