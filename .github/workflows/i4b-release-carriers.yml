name: I4b exact release carrier transition

on:
  push:
    branches:
      - "release/v900-phase-i-i4b-release-carriers"

permissions:
  contents: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply exact release carrier patch
        run: python scripts/_i4b_apply_release_carriers.py
      - name: Commit I4b source and test changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .codex-plugin/plugin.json \
            CHANGELOG.md \
            README.md \
            SKILL.md \
            skills/mathmodel-skill/SKILL.md \
            core/bootstrap.yaml \
            core/hsk_core_policy.md \
            core/workflow_router.yaml \
            core/module_manifest.yaml \
            core/output_contract.yaml \
            core/writing_runtime_contract.yaml \
            config/prose_audit_patterns.yaml \
            tests/test_current_skill_health.py \
            tests/test_v900_phase_i_v9_applicability.py \
            tests/test_v900_phase_i_migration_matrix.py \
            tests/test_v900_phase_i_writer_retirement_readiness.py \
            docs/phase_i_v9_release_carrier_transition.md \
            tests/test_v900_phase_i_release_carriers.py
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "release: transition active carriers to v9.0.0"
          git push
