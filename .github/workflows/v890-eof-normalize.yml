name: v8.9.0 EOF normalization

on:
  push:
    branches:
      - upgrade/v890-stable-compat-checkpoint
    paths:
      - .github/workflows/v890-eof-normalize.yml

permissions:
  contents: write

jobs:
  normalize-eof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore final newline only
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path("SKILL.md"),
              Path("skills/mathmodel-skill/SKILL.md"),
              Path("core/hsk_core_policy.md"),
              Path("core/workflow_router.yaml"),
              Path("core/module_manifest.yaml"),
              Path("core/output_contract.yaml"),
          ]
          changed = []
          for path in paths:
              data = path.read_bytes()
              if data.endswith(b"\n"):
                  continue
              path.write_bytes(data + b"\n")
              changed.append(str(path))
          if len(changed) != len(paths):
              raise SystemExit(f"unexpected EOF state; changed={changed}")
          print("normalized:", ", ".join(changed))
          PY
      - name: Commit EOF normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL.md skills/mathmodel-skill/SKILL.md core/hsk_core_policy.md core/workflow_router.yaml core/module_manifest.yaml core/output_contract.yaml
          git commit -m "chore: restore release-carrier EOF newlines"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
