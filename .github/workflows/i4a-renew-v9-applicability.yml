name: I4a exact applicability renewal

on:
  push:
    branches:
      - "refactor/v900-phase-i-i4a-v9-applicability"

permissions:
  contents: read

jobs:
  renew:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply exact whitelist patch
        run: python scripts/_i4a_apply_applicability.py
      - name: Commit source and test changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL_CHANGE_GOVERNANCE.md core/task_taxonomy.yaml core/code_quality_contract.yaml core/workbook_schema.yaml core/user_execution_contract.yaml core/runtime_assurance_contract.yaml core/numerical_verification_contract.yaml core/global_preprocessing_contract.yaml assets/figure_assets.yaml scripts/lint_skill_checks.py tests/test_runtime_health_coherence.py tests/test_schemas.py tests/test_v661_code_quality_closure.py tests/test_read_path_semantic_closure.py docs/phase_i_v9_applicability_renewal.md tests/test_v900_phase_i_v9_applicability.py
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "refactor: renew v9 applicability metadata"
          git push
