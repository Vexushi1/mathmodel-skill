name: Fix v9.1 rendering authority wording
on:
  push:
    branches: [docs/v9.1-matlab-publication-rendering-plan]
    paths: [.github/workflows/v91-rendering-wording-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/v9.1-matlab-publication-rendering-plan
          fetch-depth: 0
      - name: Align typography wording and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('modules/04_figure_evidence.md')
          s = p.read_text(encoding='utf-8')
          old = '默认白底、清晰细轴、中文坐标轴和单位、字号 18，网格关闭；确需网格时必须浅、稀并置于数据后方。'
          new = '默认白底、清晰细轴、中文坐标轴和单位；普通二维图采用层级字号，默认 tick label 16、axis label 18，legend / colorbar 14，网格关闭；确需网格时必须浅、稀并置于数据后方。'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one typography anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v91-rendering-wording-fix.yml
          git add modules/04_figure_evidence.md
          git commit -m "docs: align v9.1 publication typography hierarchy"
          git fetch origin docs/v9.1-matlab-publication-rendering-plan
          git rebase origin/docs/v9.1-matlab-publication-rendering-plan
          git push origin HEAD:docs/v9.1-matlab-publication-rendering-plan
