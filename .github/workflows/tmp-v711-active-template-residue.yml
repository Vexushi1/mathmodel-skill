name: Temporary v7.11 active-template residue cleanup

on:
  push:
    branches:
      - "docs/v7.11-active-template-version-residue"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply scoped active-template cleanup
        run: python scripts/tmp_apply_v711_active_template_residue.py
      - name: Rebuild generated repository metadata
        run: python scripts/generate_indexes.py
      - name: Commit scoped cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/code/hsk_pipeline/main_pipeline.py templates/code/hsk_pipeline/result_io.py tests/test_active_template_version_hygiene.py SKILL_FILE_INDEX.md TEMPLATE_INDEX.md HSK_SKILL_FILE_INDEX_V622.md HSK_TEMPLATE_INDEX_V622.md MANIFEST.sha256
          git commit -m "docs: remove stale v6.6.0 markers from active templates"
          git push
