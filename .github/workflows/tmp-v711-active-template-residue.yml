name: Temporary v7.11 active-template residue cleanup

on:
  push:
    branches:
      - "docs/v7.11-active-template-version-residue"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply scoped active-template cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("templates/code/hsk_pipeline/main_pipeline.py"): (
                  "v6.6.0正式代码必须由用户以full_fidelity模式执行",
                  "正式代码必须由用户以full_fidelity模式执行",
              ),
              Path("templates/code/hsk_pipeline/result_io.py"): (
                  "# v6.6.0默认不创建图表子目录；MATLAB脚本只打开图窗，用户按需导出。",
                  "# 当前活动规则默认不创建图表子目录；MATLAB脚本只打开图窗，用户按需导出。",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one scoped residue, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_active_template_version_hygiene.py")
          test_path.write_text(
              '''from __future__ import annotations

import re
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
TEXT_SUFFIXES = {".md", ".yaml", ".yml", ".py", ".m", ".tex", ".txt", ".json"}
OBSOLETE_ACTIVE_TEMPLATE_MARKERS = ("v6.6.0",)


class TestActiveTemplateVersionHygiene(unittest.TestCase):
    def test_active_template_index_has_no_obsolete_release_marker(self) -> None:
        index_text = (ROOT / "TEMPLATE_INDEX.md").read_text(encoding="utf-8")
        relative_paths = sorted(set(re.findall(r"`(templates/[^`]+)`", index_text)))
        self.assertTrue(relative_paths)
        for relative in relative_paths:
            path = ROOT / relative
            self.assertTrue(path.is_file(), relative)
            if path.suffix.lower() not in TEXT_SUFFIXES:
                continue
            text = path.read_text(encoding="utf-8", errors="ignore")
            for marker in OBSOLETE_ACTIVE_TEMPLATE_MARKERS:
                self.assertNotIn(marker, text, relative)

    def test_historical_v660_marker_remains_legacy_only(self) -> None:
        legacy = ROOT / "legacy" / "v660_self_contained_output_migration.md"
        self.assertTrue(legacy.is_file())
        self.assertIn("v6.6.0", legacy.read_text(encoding="utf-8"))


if __name__ == "__main__":
    unittest.main()
''',
              encoding="utf-8",
          )

          Path(".github/workflows/tmp-v711-active-template-residue.yml").unlink()
          PY
      - name: Rebuild generated repository metadata
        run: python scripts/generate_indexes.py
      - name: Commit scoped cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: remove stale v6.6.0 markers from active templates"
          git push
