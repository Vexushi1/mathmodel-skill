name: Phase D post-audit closure

on:
  push:
    branches:
      - phase-d/state-transition-engine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-d-postaudit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-d/state-transition-engine
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply post-audit correction
        run: python scripts/_phase_d_postaudit_fix.py
      - name: Remove one-shot helpers
        run: |
          rm scripts/_phase_d_postaudit_fix.py
          rm .github/workflows/phase-d-postaudit.yml
      - name: Rebuild generated metadata
        run: python scripts/generate_indexes.py
      - name: Run full unit test suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run active-skill lint
        run: python scripts/lint_skill.py
      - name: Verify generated metadata
        run: python scripts/generate_indexes.py --check
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit post-audit closure
        run: |
          git config user.name "Vexushi1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No post-audit changes to commit."
            exit 1
          fi
          git commit -m "fix: close Phase D post-audit return contract"
          git push origin HEAD:phase-d/state-transition-engine
