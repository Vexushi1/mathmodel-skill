name: HSK Skill CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: hsk-skill-ci-v650-staged-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-staged-gates:
    name: Apply v6.5.0 staged gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Apply staged user-execution semantics
        run: python scripts/apply_v650_gate_semantics.py
      - name: Remove one-time migration and rebuild metadata
        run: |
          rm scripts/apply_v650_gate_semantics.py
          python scripts/generate_indexes.py
      - name: Validate static contracts
        run: python scripts/lint_skill.py
      - name: Run all unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Restore standard CI workflow
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit validated staged-gate implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enforce staged user-execution gates in v6.5.0"
          git push origin HEAD:${{ github.head_ref }}
