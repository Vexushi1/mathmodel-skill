name: HSK Skill CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hsk-skill-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-lint:
    name: Static contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Lint active skill graph and artifact closure
        shell: bash
        run: python scripts/lint_skill.py --skip-generated > static-lint.log 2>&1
      - name: Upload static lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-lint-diagnostics
          path: static-lint.log
      - name: Resolve representative assured workflow
        run: python scripts/resolve_runtime.py full_solution --primary mechanism --secondary optimization --competition CUMCM
      - name: Legacy resolver compatibility smoke
        run: python scripts/resolve_workflow.py problem_analysis --primary mechanism --competition CUMCM

  unit-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py" > unittest.log 2>&1
      - name: Upload unit test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-diagnostics-${{ matrix.python-version }}
          path: unittest.log

  latex-smoke:
    name: LaTeX ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUMCM
            working_directory: templates/latex/cumcm/hsk
            root_file: hsk_main.tex
            xelatex: true
          - name: MCM-ICM
            working_directory: templates/latex/mcm
            root_file: main.tex
            xelatex: false
          - name: Diangong
            working_directory: templates/latex/diangong
            root_file: main.tex
            xelatex: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare CUMCM class
        if: matrix.name == 'CUMCM'
        run: |
          cp templates/latex/cumcm/cumcmthesis/cumcmthesis.cls templates/latex/cumcm/hsk/
          python scripts/prepare_cumcm_class.py templates/latex/cumcm/hsk/cumcmthesis.cls
      - name: Compile template
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ matrix.root_file }}
          working_directory: ${{ matrix.working_directory }}
          latexmk_use_xelatex: ${{ matrix.xelatex }}
          args: -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Reject unresolved references and fatal warnings
        shell: bash
        run: |
          log="${{ matrix.working_directory }}/${{ matrix.root_file }}"
          log="${log%.tex}.log"
          test -f "$log"
          ! grep -E "Undefined control sequence|LaTeX Error|Citation .* undefined|There were undefined references" "$log"
      - name: Collect LaTeX diagnostics
        if: failure()
        shell: bash
        run: |
          log="${{ matrix.working_directory }}/${{ matrix.root_file }}"
          log="${log%.tex}.log"
          {
            echo "Template: ${{ matrix.name }}"
            echo "Expected log: $log"
            if test -f "$log"; then
              tail -n 200 "$log"
            else
              echo "Expected log was not created. Files in the working directory:"
              find "${{ matrix.working_directory }}" -maxdepth 1 -type f -printf '%f\n' | sort
            fi
          } > latex-diagnostics.txt
      - name: Upload LaTeX diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-diagnostics-${{ matrix.name }}
          path: latex-diagnostics.txt

  production-latex-attestation:
    name: Production LaTeX attestation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Install production TeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-bibtex-extra texlive-lang-chinese texlive-plain-generic texlive-fonts-recommended biber
      - name: Build minimal formal project fixture
        shell: bash
        run: |
          project="$RUNNER_TEMP/hsk-formal-project"
          mkdir -p "$project/final_latex"
          cat > "$project/模型论文框架.md" <<'EOF'
          # 模型论文框架

          当前文件仅用于 CI 验证正式 LaTeX 审计、编译与哈希证明链。
          EOF
          cat > "$project/final_latex/main.tex" <<'EOF'
          \documentclass[withoutpreface]{cumcmthesis}
          \let\supercite\relax
          \usepackage[backend=biber,style=numeric,sorting=none]{biblatex}
          \addbibresource{references.bib}
          \begin{document}
          \section{CI Attestation}
          This synthetic CUMCM paper validates the formal HSK LaTeX delivery path. Its only citation uses the current bibliography interface~\cite{ci}, and the generated PDF is bound to the audited source and compile profile.
          \printbibliography
          \end{document}
          EOF
          cat > "$project/final_latex/references.bib" <<'EOF'
          @book{ci,
            author = {HSK CI},
            title = {Formal Delivery Attestation Fixture},
            year = {2026}
          }
          EOF
          echo "HSK_FORMAL_PROJECT=$project" >> "$GITHUB_ENV"
      - name: Run formal audit and profile-bound compilation
        run: python scripts/render_paper.py "$HSK_FORMAL_PROJECT/final_latex" --profile cumcm --main main.tex
      - name: Verify formal attestation chain
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          import latex_delivery

          project = Path(__import__("os").environ["HSK_FORMAL_PROJECT"]) / "final_latex"
          audit = yaml.safe_load((project / "latex_audit_report.yaml").read_text(encoding="utf-8"))
          report = yaml.safe_load((project / "compile_report.yaml").read_text(encoding="utf-8"))
          main_text = (project / "main.tex").read_text(encoding="utf-8")
          assert "\\documentclass[withoutpreface]{cumcmthesis}" in main_text, main_text
          assert audit["status"] == "passed", audit
          assert audit["mode"] == "formal", audit
          assert report["report_schema_version"] == "3.0.0", report
          assert report["status"] == "passed", report
          assert report["attestation_mode"] == "formal", report
          assert report["profile"] == "cumcm", report
          assert report["log_present"] is True, report
          assert report["profile_override_used"] is False, report
          assert (project / "cumcmthesis.cls").is_file()
          issues = latex_delivery.verify_compile_report(
              project=project,
              main=project / "main.tex",
              pdf=project / "main.pdf",
              report=report,
          )
          assert issues == [], issues
          PY
      - name: Collect production attestation diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p production-attestation-diagnostics
          if test -n "${HSK_FORMAL_PROJECT:-}" && test -d "$HSK_FORMAL_PROJECT/final_latex"; then
            cp -f "$HSK_FORMAL_PROJECT/final_latex/latex_audit_report.yaml" production-attestation-diagnostics/ 2>/dev/null || true
            cp -f "$HSK_FORMAL_PROJECT/final_latex/compile_report.yaml" production-attestation-diagnostics/ 2>/dev/null || true
            cp -f "$HSK_FORMAL_PROJECT/final_latex/main.log" production-attestation-diagnostics/ 2>/dev/null || true
          fi
      - name: Upload production attestation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-latex-attestation-diagnostics
          path: production-attestation-diagnostics

  generated-files:
    name: Generated file contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild generated indexes and active manifest
        run: python scripts/generate_indexes.py
      - name: Upload regenerated metadata
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-repository-metadata
          path: |
            SKILL_FILE_INDEX.md
            TEMPLATE_INDEX.md
            HSK_SKILL_FILE_INDEX_V622.md
            HSK_TEMPLATE_INDEX_V622.md
            MANIFEST.sha256
      - name: Reject stale generated files
        shell: bash
        run: |
          git diff --exit-code -- \
            SKILL_FILE_INDEX.md \
            TEMPLATE_INDEX.md \
            HSK_SKILL_FILE_INDEX_V622.md \
            HSK_TEMPLATE_INDEX_V622.md \
            MANIFEST.sha256
