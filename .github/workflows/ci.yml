name: HSK Skill CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: hsk-skill-ci-v650-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-v650-repair:
    name: Finalize v6.5.0 structural repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repair dependencies
        run: python -m pip install PyYAML
      - name: Apply validated repair
        run: python scripts/finalize_v650_structure.py
      - name: Rebuild active indexes and manifest
        run: python scripts/generate_indexes.py
      - name: Validate repaired contracts and Python
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path
          import yaml
          for path in [
              Path('core/project_state.schema.yaml'),
              Path('core/workflow_router.yaml'),
              Path('core/module_manifest.yaml'),
              Path('core/output_contract.yaml'),
              Path('core/user_execution_contract.yaml'),
          ]:
              yaml.safe_load(path.read_text(encoding='utf-8'))
          for path in [
              Path('templates/code/hsk_pipeline/main_pipeline.py'),
              Path('scripts/validate_code_delivery.py'),
              Path('scripts/validate_user_execution.py'),
              Path('scripts/resolve_workflow.py'),
          ]:
              py_compile.compile(str(path), doraise=True)
          PY
      - name: Restore standard CI workflow
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit repaired tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize v6.5.0 schema, routing, and pipeline structure"
          git push origin HEAD:${{ github.head_ref }}
