name: HSK Skill CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      python_test_mode:
        description: Targeted development checks or full frozen-head acceptance
        type: choice
        options: [targeted, full]
        default: full

permissions:
  contents: read

env:
  HSK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: hsk-skill-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.python_test_mode || (github.event.pull_request.draft && 'targeted') || 'full' }}
  cancel-in-progress: true

jobs:
  test-plan:
    name: Regression mode
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.mode.outputs.full }}
    steps:
      - id: mode
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft || false }}
          CI_MODE: ${{ inputs.python_test_mode || 'full' }}
        run: |
          full=true
          if [[ "$CI_EVENT" == pull_request && "$CI_DRAFT" == true ]]; then full=false; fi
          if [[ "$CI_EVENT" == workflow_dispatch && "$CI_MODE" == targeted ]]; then full=false; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

  static-lint:
    name: Static contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Lint active skill graph and artifact closure
        shell: bash
        run: python scripts/lint_skill.py --skip-generated > static-lint.log 2>&1
      - name: Upload static lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-lint-diagnostics
          path: static-lint.log
      - name: Resolve representative assured workflow
        run: python scripts/resolve_runtime.py full_solution --primary mechanism --secondary optimization --competition CUMCM
      - name: Legacy resolver compatibility smoke
        run: python scripts/resolve_workflow.py problem_analysis --primary mechanism --competition CUMCM

  python-targeted:
    name: Windows Python targeted checks
    needs: [test-plan, generated-files]
    if: needs.test-plan.outputs.full != 'true'
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run affected development tests
        run: |
          python scripts/ci_unittest.py run --modules test_analysis_comparison,test_analysis_comparison_review,test_analysis_comparison_integration,test_analysis_comparison_smoke,test_result_io,test_user_execution_contract,test_audit_runtime_qualification,test_schemas,test_v900_semantic_identity,test_v900_state_transitions,test_v711_model_approval_gate,test_safe_yaml,test_ci_unittest,test_actions_runtime_modernization,test_ci_platform_policy,test_generated_workflow_hardening,test_p6b_matlab_preview_contract,test_review_receipts,test_review_receipt_consumption,test_project_solver_backend_select,test_model_code_conformance,test_claim_workbook,test_claim_evidence,test_claim_consumption,test_reading_plan_evidence,test_v1000_release_version_matrix,test_v861_active_consistency_semantic_drift,test_case_memory,test_case_memory_generated,test_template_index_exclusions,test_p9_release_closeout,test_v900_phase_i_migration_matrix,test_v900_phase_i_release_closure,test_v900_phase_i_v9_applicability,test_v900_phase_i_writer_retirement_readiness,test_v910_publication_rendering,test_v751_architecture_slimming,test_case_memory_retrieval,test_case_references,test_case_memory_routing,test_b2b4_formal_figure_gate,test_b2b3_source_bindings_schema,test_claim_consumption_contract,test_b2b3_figure_bindings_schema,test_b2b3_caption_schema,test_review_receipt_schema,test_v830_editable_mechanism_diagram,test_conformance_execution,test_conformance_integration,test_conformance_upstream_read_set,test_project_transaction_read_set,test_project_state_read_snapshot,test_e1_cross_module_acceptance,test_e1_resource_measurement --report timings.json > unittest.log 2>&1
          $testExit = $LASTEXITCODE
          Get-Content unittest.log -Tail 35
          exit $testExit
      - name: Measure safe contract parsing separately from regression time
        if: always()
        run: |
          python scripts/measure_contract_parsing.py --repeats 3 --output contract-parsing.json
          exit $LASTEXITCODE
      - name: Measure declared case retrieval development suite
        if: always()
        run: |
          python scripts/case_memory_retrieve.py evaluate > case-memory-development.json
          exit $LASTEXITCODE
      - name: Measure E1 bounded extension resources
        if: always()
        run: |
          python scripts/measure_e1_resources.py --repeats 1 --output e1-resources.json
          exit $LASTEXITCODE
      - name: Upload targeted timing and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-targeted-evidence
          path: |
            unittest.log
            timings.json
            contract-parsing.json
            case-memory-development.json
            e1-resources.json
          if-no-files-found: error

  unit-matrix-shards:
    name: Windows Python 3.10 shard ${{ matrix.shard }}
    needs: [test-plan, generated-files]
    if: needs.test-plan.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run complete regression shard with timings
        run: |
          python scripts/ci_unittest.py run --shard-index ${{ matrix.shard }} --shard-count 4 --report timings.json > unittest.log 2>&1
          $testExit = $LASTEXITCODE
          Get-Content unittest.log -Tail 35
          exit $testExit
      - name: Upload shard timing and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-3.10-shard-${{ matrix.shard }}
          path: |
            unittest.log
            timings.json
          if-no-files-found: error

  windows-unit-shards:
    name: Windows Python 3.14 shard ${{ matrix.shard }}
    needs: [test-plan, generated-files]
    if: needs.test-plan.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run complete regression shard with timings
        run: |
          python scripts/ci_unittest.py run --shard-index ${{ matrix.shard }} --shard-count 4 --report timings.json > unittest.log 2>&1
          $testExit = $LASTEXITCODE
          Get-Content unittest.log -Tail 35
          exit $testExit
      - name: Upload shard timing and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-3.14-shard-${{ matrix.shard }}
          path: |
            unittest.log
            timings.json
          if-no-files-found: error

  unit-matrix:
    name: Python ${{ matrix.python-version }}
    needs: [test-plan, generated-files, unit-matrix-shards]
    if: always() && (needs.test-plan.outputs.full == 'true' || needs.test-plan.result != 'success')
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require every shard and verify complete coverage
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD_RESULT: ${{ needs.unit-matrix-shards.result }}
          MODE_RESULT: ${{ needs.test-plan.result }}
          GENERATED_RESULT: ${{ needs.generated-files.result }}
        run: |
          if ($env:MODE_RESULT -ne 'success' -or $env:GENERATED_RESULT -ne 'success' -or $env:SHARD_RESULT -ne 'success') { throw 'Full regression prerequisites and shards did not all succeed.' }
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --pattern 'python-3.10-shard-*' --dir shard-reports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci_unittest.py verify --reports shard-reports --shard-count 4 --python-version 3.10 --output coverage-summary.json
          exit $LASTEXITCODE
      - name: Preserve complete coverage and timing summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-3.10-coverage-summary
          path: coverage-summary.json
          if-no-files-found: warn

  windows-unit:
    name: Windows Python 3.14
    needs: [test-plan, generated-files, windows-unit-shards]
    if: always() && (needs.test-plan.outputs.full == 'true' || needs.test-plan.result != 'success')
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Require every shard and verify complete coverage
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD_RESULT: ${{ needs.windows-unit-shards.result }}
          MODE_RESULT: ${{ needs.test-plan.result }}
          GENERATED_RESULT: ${{ needs.generated-files.result }}
        run: |
          if ($env:MODE_RESULT -ne 'success' -or $env:GENERATED_RESULT -ne 'success' -or $env:SHARD_RESULT -ne 'success') { throw 'Full regression prerequisites and shards did not all succeed.' }
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --pattern 'python-3.14-shard-*' --dir shard-reports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci_unittest.py verify --reports shard-reports --shard-count 4 --python-version 3.14 --output coverage-summary.json
          exit $LASTEXITCODE
      - name: Preserve complete coverage and timing summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-3.14-coverage-summary
          path: coverage-summary.json
          if-no-files-found: warn
      - name: Install bounded case retrieval dependencies
        run: python -m pip install "PyYAML>=6.0" "jsonschema>=4.22"
      - name: Measure declared case retrieval development suite
        run: |
          python scripts/case_memory_retrieve.py evaluate > case-memory-development.json
          exit $LASTEXITCODE
      - name: Preserve case retrieval development evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: case-memory-development-evidence
          path: case-memory-development.json
          if-no-files-found: warn

      - name: Measure E1 bounded extension resources
        run: |
          python scripts/measure_e1_resources.py --repeats 1 --output e1-resources.json
          exit $LASTEXITCODE
      - name: Preserve E1 extension resource evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e1-extension-resource-evidence
          path: e1-resources.json
          if-no-files-found: error

  matlab-solver-smoke:
    name: MATLAB R2024b native solver contracts
    needs: [test-plan, generated-files]
    if: needs.test-plan.outputs.full == 'true'
    # MathWorks R2024b lists Server 2022; windows-latest currently selects Server 2025.
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Set temporary solver fixture directory
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'hsk-native-solver'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $output 'matlab-ci-probe.log') | Out-Null
          "HSK_MATLAB_SOLVER_OUTPUT=$output" >> $env:GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true
      - name: Configure and verify licensed MATLAB CI launcher
        run: |
          $adapterSource = Join-Path $env:RUNNER_TEMP 'hsk-matlab-adapter-source'
          $adapterOutput = Join-Path $env:RUNNER_TEMP 'hsk-matlab-adapter'
          New-Item -ItemType Directory -Force -Path $adapterSource, $adapterOutput | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <UseAppHost>true</UseAppHost>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -LiteralPath (Join-Path $adapterSource 'hsk-matlab-adapter.csproj') -Encoding utf8
          @'
          using System;
          using System.Diagnostics;
          using System.IO;

          if (args.Length != 2 || args[0] != "-batch" || string.IsNullOrWhiteSpace(args[1])) {
              Console.Error.WriteLine("Expected exactly: -batch MATLAB_EXPRESSION");
              return 64;
          }
          var launcher = Path.Combine(AppContext.BaseDirectory, "run-matlab-command.exe");
          var start = new ProcessStartInfo(launcher) { UseShellExecute = false };
          start.ArgumentList.Add(args[1]);
          start.Environment["MW_BATCH_LICENSING_ONLINE"] = "true";
          using var process = Process.Start(start);
          if (process is null) return 70;
          process.WaitForExit();
          return process.ExitCode;
          '@ | Set-Content -LiteralPath (Join-Path $adapterSource 'Program.cs') -Encoding utf8
          dotnet publish (Join-Path $adapterSource 'hsk-matlab-adapter.csproj') -c Release -o $adapterOutput --self-contained false
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the temporary Windows MATLAB adapter.' }
          $launcher = Join-Path $adapterOutput 'run-matlab-command.exe'
          $adapter = Join-Path $adapterOutput 'hsk-matlab-adapter.exe'
          if (-not (Test-Path -LiteralPath $adapter -PathType Leaf)) { throw 'Windows MATLAB adapter executable is missing.' }
          $probeLog = Join-Path $env:HSK_MATLAB_SOLVER_OUTPUT 'matlab-ci-probe.log'
          # Same official binary as run-command@v3, pinned to its resolved commit.
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/matlab-actions/run-command/bfa857648f4895aa98a446fe41c85e0788421ed5/dist/bin/win64/run-matlab-command.exe' -OutFile $launcher
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf) -or (Get-Item -LiteralPath $launcher).Length -le 0) {
            throw 'Pinned official Windows MATLAB launcher is missing or empty.'
          }
          $env:MW_BATCH_LICENSING_ONLINE = 'true'
          'MW_BATCH_LICENSING_ONLINE=true' >> $env:GITHUB_ENV
          "HSK_MATLAB_CI_COMMAND=$adapter" >> $env:GITHUB_ENV
          & $adapter -batch "assert(~isempty(ver('MATLAB'))); assert(license('test','MATLAB')); assert(strcmp(version('-release'),'2024b'));" 2>&1 | Tee-Object -FilePath $probeLog -Append
          if ($LASTEXITCODE -ne 0) { throw 'Windows R2024b MATLAB launch and license probe failed.' }
          $quotedRoot = $env:HSK_MATLAB_SOLVER_OUTPUT.Replace("'", "''")
          $unicodeProbe = Join-Path $env:HSK_MATLAB_SOLVER_OUTPUT "引号'分号;圆括号(测试).txt"
          & $adapter -batch "p=fullfile('$quotedRoot','引号''分号;圆括号(测试).txt'); f=fopen(p,'w'); assert(f>=0); fprintf(f,'%s','quoted'); fclose(f);" 2>&1 | Tee-Object -FilePath $probeLog -Append
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $unicodeProbe -PathType Leaf) -or (Get-Item -LiteralPath $unicodeProbe).Length -le 0) {
            throw 'Windows MATLAB adapter did not preserve the quoted Unicode fullfile expression.'
          }
          $PSNativeCommandUseErrorActionPreference = $false
          & $adapter -batch "error('HSK_EXPECTED_LAUNCH_FAILURE');" 2>&1 | Tee-Object -FilePath $probeLog -Append
          if ($LASTEXITCODE -eq 0) { throw 'Windows MATLAB adapter did not propagate the native failure exit code.' }
          # GitHub's pwsh wrapper exits with LASTEXITCODE after the script body.
          $global:LASTEXITCODE = 0
      - name: Prepare isolated synthetic primary fixture
        run: python tests/test_solver_backend_end_to_end.py prepare --project $env:HSK_MATLAB_SOLVER_OUTPUT
      - name: Deliver primary only after real native Code Analyzer passes
        run: python tests/test_solver_backend_end_to_end.py deliver-primary --project $env:HSK_MATLAB_SOLVER_OUTPUT --matlab-command $env:HSK_MATLAB_CI_COMMAND
      - name: Run native MATLAB primary solver
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,"tests","matlab")); run_solver_backend_smoke(string(getenv("HSK_MATLAB_SOLVER_OUTPUT")),"primary")
      - name: Accept native primary workbook and prepare required analysis
        run: |
          python tests/test_solver_backend_end_to_end.py verify-primary --project $env:HSK_MATLAB_SOLVER_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_solver_backend_end_to_end.py prepare-analysis --project $env:HSK_MATLAB_SOLVER_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_solver_backend_end_to_end.py deliver-analysis --project $env:HSK_MATLAB_SOLVER_OUTPUT --matlab-command $env:HSK_MATLAB_CI_COMMAND
      - name: Run native MATLAB analysis solver
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,"tests","matlab")); run_solver_backend_smoke(string(getenv("HSK_MATLAB_SOLVER_OUTPUT")),"analysis")
      - name: Verify analysis and original primary preservation
        run: python tests/test_solver_backend_end_to_end.py verify-analysis --project $env:HSK_MATLAB_SOLVER_OUTPUT
      - name: Prepare separate same-backend projects and execute Python Q1/Q2/analysis
        run: |
          $project = Join-Path $env:HSK_MATLAB_SOLVER_OUTPUT 'same-backend'
          python tests/solver_backend_mixed_smoke.py prepare --source $env:HSK_MATLAB_SOLVER_OUTPUT --project $project
      - name: Run native MATLAB Q2 consuming accepted MATLAB Q1 workbook
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,"tests","matlab")); run_solver_backend_mixed_smoke(fullfile(string(getenv("HSK_MATLAB_SOLVER_OUTPUT")),"same-backend"))
      - name: Accept same-backend stages and reject mixed numerical delivery
        run: |
          $project = Join-Path $env:HSK_MATLAB_SOLVER_OUTPUT 'same-backend'
          python tests/solver_backend_mixed_smoke.py verify --project $project
      - name: Prepare accepted preprocessing 1.0 fixture and deliver MATLAB 1.1 primary
        run: |
          $project = Join-Path $env:HSK_MATLAB_SOLVER_OUTPUT 'preprocessed'
          python tests/test_solver_backend_end_to_end.py prepare-preprocessed --project $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_solver_backend_end_to_end.py deliver-primary --project $project --matlab-command $env:HSK_MATLAB_CI_COMMAND
      - name: Run native primary from accepted preprocessing XLSX
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,"tests","matlab")); run_solver_backend_smoke(fullfile(string(getenv("HSK_MATLAB_SOLVER_OUTPUT")),"preprocessed"),"primary")
      - name: Accept preprocessed-input primary and deliver analysis
        run: |
          $project = Join-Path $env:HSK_MATLAB_SOLVER_OUTPUT 'preprocessed'
          python tests/test_solver_backend_end_to_end.py verify-primary --project $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_solver_backend_end_to_end.py prepare-analysis --project $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_solver_backend_end_to_end.py deliver-analysis --project $project --matlab-command $env:HSK_MATLAB_CI_COMMAND
      - name: Run native analysis from accepted preprocessing XLSX
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,"tests","matlab")); run_solver_backend_smoke(fullfile(string(getenv("HSK_MATLAB_SOLVER_OUTPUT")),"preprocessed"),"analysis")
      - name: Verify preprocessing identity and workbook preservation
        run: |
          $project = Join-Path $env:HSK_MATLAB_SOLVER_OUTPUT 'preprocessed'
          python tests/test_solver_backend_end_to_end.py verify-analysis --project $project
      - name: Verify uppercase source input and accepted-primary hashes in native stages
        run: |
          $project = Join-Path $env:HSK_MATLAB_SOLVER_OUTPUT 'hash-casing'
          python tests/solver_backend_hash_smoke.py --project $project --matlab-command $env:HSK_MATLAB_CI_COMMAND
      - name: Verify native auxiliary-input receipt 1.2 without changing preprocessing identity
        run: |
          $project = Join-Path $env:HSK_MATLAB_SOLVER_OUTPUT 'auxiliary-inputs'
          python tests/audit_auxiliary_smoke.py --project $project --backend matlab --matlab-command $env:HSK_MATLAB_CI_COMMAND
      - name: Verify A2 opted-in structural delivery and receipt bindings natively
        run: |
          $project = Join-Path $env:HSK_MATLAB_SOLVER_OUTPUT 'conformance-a2'
          python tests/conformance_a2_smoke.py --project $project --backend matlab --matlab-command $env:HSK_MATLAB_CI_COMMAND
      - name: Read native primary and analysis evidence through opt-in B1
        run: |
          $project = Join-Path $env:HSK_MATLAB_SOLVER_OUTPUT 'conformance-a2'
          python tests/claim_evidence_smoke.py --project $project
      - name: Verify two comparison types through native MATLAB delivery and acceptance
        run: |
          $project = Join-Path $env:HSK_MATLAB_SOLVER_OUTPUT 'analysis-comparisons'
          python tests/analysis_comparison_smoke.py --project $project --backend matlab --matlab-command $env:HSK_MATLAB_CI_COMMAND
          exit $LASTEXITCODE
      - name: Assert nonempty Windows MATLAB evidence
        run: |
          $root = $env:HSK_MATLAB_SOLVER_OUTPUT
          $required = @(
            'primary_matlab_report.json',
            'analysis_matlab_report.json',
            '问题一求解/问题一求解结果.xlsx',
            '问题一求解/问题一结果深化分析.xlsx',
            'same-backend/same_backend_matlab_report.json',
            'same-backend/same_backend_acceptance_report.json',
            'same-backend/matlab-project/问题二求解/问题二求解结果.xlsx',
            'preprocessed/数据预处理/数据预处理结果.xlsx',
            'preprocessed/primary_matlab_report.json',
            'preprocessed/analysis_matlab_report.json',
            'preprocessed/问题一求解/问题一求解结果.xlsx',
            'preprocessed/问题一求解/问题一结果深化分析.xlsx',
            'hash-casing/hash_casing_report.json',
            'auxiliary-inputs/auxiliary_smoke_report.json',
            'conformance-a2/a2_smoke_report.json',
            'conformance-a2/b1_smoke_report.json',
            'analysis-comparisons/comparison_smoke_report.json',
            'analysis-comparisons/问题一求解/问题一求解结果.xlsx',
            'analysis-comparisons/问题一求解/问题一结果深化分析.xlsx'
          )
          foreach ($relative in $required) {
            $path = Join-Path $root $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "Required native evidence is missing or empty: $relative"
            }
          }
          foreach ($relative in @('matlab-ci-probe.log', 'hash-casing/primary_native.log', 'hash-casing/analysis_native.log', 'auxiliary-inputs/primary_native.log', 'auxiliary-inputs/analysis_native.log', 'conformance-a2/a2_primary_native.log', 'conformance-a2/a2_analysis_native.log')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $relative) -PathType Leaf)) {
              throw "Required native log is missing: $relative"
            }
          }
          foreach ($relative in @('primary_matlab_report.json', 'analysis_matlab_report.json', 'preprocessed/primary_matlab_report.json', 'preprocessed/analysis_matlab_report.json')) {
            $report = Get-Content -LiteralPath (Join-Path $root $relative) -Raw | ConvertFrom-Json
            if ($report.status -ne 'passed' -or -not $report.actual_matlab_execution -or $report.matlab_release -ne '2024b') {
              throw "Native R2024b execution is not proved by $relative"
            }
          }
          foreach ($relative in @('analysis-comparisons/primary_native.log', 'analysis-comparisons/analysis_native.log')) {
            $path = Join-Path $root $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "Comparison native execution log is missing or empty: $relative"
            }
          }
          $comparison = Get-Content -LiteralPath (Join-Path $root 'analysis-comparisons/comparison_smoke_report.json') -Raw | ConvertFrom-Json
          if ($comparison.status -ne 'passed' -or $comparison.backend -ne 'matlab' -or
              -not $comparison.actual_matlab_execution -or $comparison.matlab_release -ne '2024b' -or
              -not $comparison.primary_unchanged -or -not $comparison.model_comparison_verified -or
              -not $comparison.algorithm_comparison_verified) {
            throw 'Native comparison evidence does not prove both current comparison chains'
          }
      - name: Upload actual MATLAB execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matlab-native-solver-evidence
          path: ${{ env.HSK_MATLAB_SOLVER_OUTPUT }}
          if-no-files-found: error
      - name: Ensure smoke did not write into the checkout
        run: |
          $changes = git status --porcelain
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the repository checkout after MATLAB smoke.' }
          if ($changes) { throw 'MATLAB smoke wrote into the repository checkout.' }

  latex-smoke:
    needs: [test-plan, generated-files]
    if: needs.test-plan.outputs.full == 'true'
    name: LaTeX ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUMCM
            working_directory: templates/latex/cumcm/hsk
            root_file: hsk_main.tex
            xelatex: true
          - name: MCM-ICM
            working_directory: templates/latex/mcm
            root_file: main.tex
            xelatex: false
          - name: Diangong
            working_directory: templates/latex/diangong
            root_file: main.tex
            xelatex: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare CUMCM class
        if: matrix.name == 'CUMCM'
        run: |
          cp templates/latex/cumcm/cumcmthesis/cumcmthesis.cls templates/latex/cumcm/hsk/
          python scripts/prepare_cumcm_class.py templates/latex/cumcm/hsk/cumcmthesis.cls
      - name: Compile template
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ matrix.root_file }}
          working_directory: ${{ matrix.working_directory }}
          latexmk_use_xelatex: ${{ matrix.xelatex }}
          args: -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Reject unresolved references and fatal warnings
        shell: bash
        run: |
          log="${{ matrix.working_directory }}/${{ matrix.root_file }}"
          log="${log%.tex}.log"
          test -f "$log"
          ! grep -E "Undefined control sequence|LaTeX Error|Citation .* undefined|There were undefined references" "$log"
      - name: Collect LaTeX diagnostics
        if: failure()
        shell: bash
        run: |
          log="${{ matrix.working_directory }}/${{ matrix.root_file }}"
          log="${log%.tex}.log"
          {
            echo "Template: ${{ matrix.name }}"
            echo "Expected log: $log"
            if test -f "$log"; then
              tail -n 200 "$log"
            else
              echo "Expected log was not created. Files in the working directory:"
              find "${{ matrix.working_directory }}" -maxdepth 1 -type f -printf '%f\n' | sort
            fi
          } > latex-diagnostics.txt
      - name: Upload LaTeX diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: latex-diagnostics-${{ matrix.name }}
          path: latex-diagnostics.txt

  production-latex-attestation:
    name: Production LaTeX attestation
    needs: [test-plan, generated-files]
    if: needs.test-plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HSK_TEX_IMAGE: ghcr.io/xu-cheng/texlive-historic-debian@sha256:b466f39161dc6d37772e773284f094e11205fcdfe33b91ea43ad4a3b7da2bc57
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Prepare pinned production TeX environment
        run: |
          docker pull "$HSK_TEX_IMAGE"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "HSK_PRODUCTION_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "HSK_PRODUCTION_PYTHON_ROOT=$(python -c 'import sys; print(sys.prefix)')" >> "$GITHUB_ENV"
          tools="$RUNNER_TEMP/hsk-production-bin"
          mkdir -p "$tools" "$RUNNER_TEMP/hsk-tex-home"
          cat > "$tools/python" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -i --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --volume "$HSK_PRODUCTION_PYTHON_ROOT:$HSK_PRODUCTION_PYTHON_ROOT:ro" \
            --workdir "$PWD" \
            --env "LD_LIBRARY_PATH=$HSK_PRODUCTION_PYTHON_ROOT/lib" \
            --env "HOME=$RUNNER_TEMP/hsk-tex-home" \
            --env TMPDIR --env PYTHONUTF8 \
            --env HSK_FORMAL_PROJECT --env HSK_LONG_PROOF_PROJECT --env LONG_PROJECT \
            --entrypoint "$HSK_PRODUCTION_PYTHON" "$HSK_TEX_IMAGE" "$@"
          SH
          chmod +x "$tools/python"
          echo "$tools" >> "$GITHUB_PATH"
      - name: Verify preinstalled production TeX tools and Python ABI
        run: |
          python - <<'PY'
          import bz2, ctypes, lzma, sqlite3, ssl, subprocess, sys
          import jsonschema, openpyxl, pandas, yaml

          assert sys.version_info[:2] == (3, 12), sys.version
          print("Production Python:", sys.version, sys.executable, flush=True)
          for command in (
              ["xelatex", "--version"], ["biber", "--version"],
              ["kpsewhich", "ctex.sty"], ["kpsewhich", "biblatex.sty"],
          ):
              result = subprocess.run(command, check=True, capture_output=True, text=True)
              assert result.stdout.strip(), command
              print(result.stdout.strip(), flush=True)
          PY
      - name: Verify live B2 Figure compilation proof
        run: python -m unittest tests.test_b2b4_figure_integration.FigureFormalChainIntegrationTests.test_real_xelatex_figure_image_proof
      - name: Verify continuous B12 repair and fresh Figure package proof
        run: python -m unittest tests.test_b2b5_continuous_acceptance.B2b5ContinuousAcceptanceTests.test_real_xelatex_b12_repair_regenerates_current_figure_and_package_proof
      - name: Verify B2c selected LaTeX carrier and package proof
        run: python -m unittest tests.test_b2c_runtime_integration.SelectedPolicyStructuredSyncTests.test_real_xelatex_1_5_selected_carrier_proof_and_package
      - name: Build minimal formal project fixture
        shell: bash
        run: |
          project="$RUNNER_TEMP/hsk-formal-project"
          mkdir -p "$project/final_latex"
          cat > "$project/模型论文框架.md" <<'EOF'
          # 模型论文框架

          当前文件仅用于 CI 验证正式 LaTeX 审计、编译与哈希证明链。
          EOF
          cat > "$project/final_latex/main.tex" <<'EOF'
          \documentclass[withoutpreface]{cumcmthesis}
          \let\supercite\relax
          \usepackage[backend=biber,style=numeric,sorting=none]{biblatex}
          \addbibresource{references.bib}
          \begin{document}
          \section{CI Attestation}
          This synthetic CUMCM paper validates the formal HSK LaTeX delivery path. Its only citation uses the current bibliography interface~\cite{ci}, and the generated PDF is bound to the audited source and compile profile.
          \printbibliography
          \end{document}
          EOF
          cat > "$project/final_latex/references.bib" <<'EOF'
          @book{ci,
            author = {HSK CI},
            title = {Formal Delivery Attestation Fixture},
            year = {2026}
          }
          EOF
          echo "HSK_FORMAL_PROJECT=$project" >> "$GITHUB_ENV"
      - name: Run formal audit and profile-bound compilation
        run: python scripts/render_paper.py "$HSK_FORMAL_PROJECT/final_latex" --profile cumcm --main main.tex
      - name: Verify formal attestation chain
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          import latex_delivery

          project = Path(__import__("os").environ["HSK_FORMAL_PROJECT"]) / "final_latex"
          audit = yaml.safe_load((project / "latex_audit_report.yaml").read_text(encoding="utf-8"))
          report = yaml.safe_load((project / "compile_report.yaml").read_text(encoding="utf-8"))
          main_text = (project / "main.tex").read_text(encoding="utf-8")
          assert "\\documentclass[withoutpreface]{cumcmthesis}" in main_text, main_text
          assert audit["status"] == "passed", audit
          assert audit["mode"] == "formal", audit
          assert report["report_schema_version"] == "4.0.0", report
          assert report["status"] == "passed", report
          assert report["attestation_mode"] == "formal", report
          assert report["profile"] == "cumcm", report
          assert report["log_present"] is True, report
          assert report["profile_override_used"] is False, report
          assert (project / "cumcmthesis.cls").is_file()
          issues = latex_delivery.verify_compile_report(
              project=project,
              main=project / "main.tex",
              pdf=project / "main.pdf",
              report=report,
          )
          assert issues == [], issues
          PY
      - name: Render long core proof pagination and numbering fixture
        shell: bash
        run: |
          set -euo pipefail
          long_project="$RUNNER_TEMP/hsk-long-core-proof"
          mkdir -p "$long_project/final_latex/config"
          cp templates/latex/cumcm/hsk/config/preamble.tex "$long_project/final_latex/config/preamble.tex"
          cat > "$long_project/模型论文框架.md" <<'EOF'
          # 模型论文框架

          该文件仅用于 CI 验证长核心证明仍留在正文、可正常跨页，并保持命题/公式引用编号可解析。
          EOF
          cat > "$long_project/final_latex/references.bib" <<'EOF'
          @book{proofci,
            author = {HSK CI},
            title = {Long Core Proof Rendering Fixture},
            year = {2026}
          }
          EOF
          cat > "$long_project/final_latex/main.tex" <<'EOF'
          \documentclass[withoutpreface]{cumcmthesis}
          \input{config/preamble}
          \begin{document}
          \section{长核心证明渲染验证}

          \begin{hskproposition}{长核心证明的正文可分页性}
          \label{prop:long-core-proof}
          若每一步推理都保持当前定义域与可行性条件，则完整核心证明应保留在正文，并允许跨页连续展开。
          \end{hskproposition}

          \begin{hskproof}
          下面保留一组连续的必要推理单元，用于验证较长核心证明不依赖命题框整体同页，也不会因为篇幅而迁移到附录。

          \newcount\proofstep
          \proofstep=1
          \loop
          第 \the\proofstep 步保留一个独立的必要推理单元：由前一步关系和当前定义域条件，可知对应中间量仍满足可行性要求，因此下一步变换仍具有合法输入。该段只用于形成足够长的正文证明，以真实验证普通正文流中的分页能力。
          \par\medskip
          \advance\proofstep by1
          \ifnum\proofstep<55
          \repeat

          最后一项关系写为
          \begin{equation}
              z=x+1.
              \label{eq:long-proof-final}
          \end{equation}
          因而完整证明在保留全部必要推理后得到最终关系，命题得证。
          \end{hskproof}

          命题~\ref{prop:long-core-proof} 的完整证明已经在正文跨页展开，最终关系见式~\eqref{eq:long-proof-final}。
          该维护夹具的参考文献接口见文献~\cite{proofci}。
          \printbibliography
          \end{document}
          EOF
          echo "HSK_LONG_PROOF_PROJECT=$long_project" >> "$GITHUB_ENV"
          python scripts/render_paper.py "$long_project/final_latex" --profile cumcm --main main.tex
          LONG_PROJECT="$long_project" python - <<'PY'
          import os
          import re
          from pathlib import Path

          import yaml

          project = Path(os.environ["LONG_PROJECT"]) / "final_latex"
          audit = yaml.safe_load((project / "latex_audit_report.yaml").read_text(encoding="utf-8"))
          report = yaml.safe_load((project / "compile_report.yaml").read_text(encoding="utf-8"))
          assert audit["status"] == "passed", audit
          assert report["status"] == "passed", report

          aux = (project / "main.aux").read_text(encoding="utf-8", errors="ignore")
          log = (project / "main.log").read_text(encoding="utf-8", errors="ignore")

          def label_page(label: str) -> int:
              prefix = "\\newlabel{" + label + "}"
              line = next((item for item in aux.splitlines() if item.startswith(prefix)), None)
              assert line is not None, (label, aux[-3000:])
              match = re.search(r"\{\{[^{}]*\}\{(\d+)\}", line)
              assert match is not None, line
              return int(match.group(1))

          proposition_page = label_page("prop:long-core-proof")
          final_page = label_page("eq:long-proof-final")
          assert final_page > proposition_page, (proposition_page, final_page)
          lowered = log.lower()
          assert "undefined references" not in lowered, log[-3000:]
          assert "citation `proofci' undefined" not in lowered, log[-3000:]
          PY

      - name: Collect production attestation diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p production-attestation-diagnostics
          if test -n "${HSK_FORMAL_PROJECT:-}" && test -d "$HSK_FORMAL_PROJECT/final_latex"; then
            cp -f "$HSK_FORMAL_PROJECT/final_latex/latex_audit_report.yaml" production-attestation-diagnostics/ 2>/dev/null || true
            cp -f "$HSK_FORMAL_PROJECT/final_latex/compile_report.yaml" production-attestation-diagnostics/ 2>/dev/null || true
            cp -f "$HSK_FORMAL_PROJECT/final_latex/main.log" production-attestation-diagnostics/ 2>/dev/null || true
          fi
          if test -n "${HSK_LONG_PROOF_PROJECT:-}" && test -d "$HSK_LONG_PROOF_PROJECT/final_latex"; then
            mkdir -p production-attestation-diagnostics/long-core-proof
            cp -f "$HSK_LONG_PROOF_PROJECT/final_latex/latex_audit_report.yaml" production-attestation-diagnostics/long-core-proof/ 2>/dev/null || true
            cp -f "$HSK_LONG_PROOF_PROJECT/final_latex/compile_report.yaml" production-attestation-diagnostics/long-core-proof/ 2>/dev/null || true
            cp -f "$HSK_LONG_PROOF_PROJECT/final_latex/main.log" production-attestation-diagnostics/long-core-proof/ 2>/dev/null || true
            cp -f "$HSK_LONG_PROOF_PROJECT/final_latex/main.aux" production-attestation-diagnostics/long-core-proof/ 2>/dev/null || true
          fi
      - name: Upload production attestation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-latex-attestation-diagnostics
          path: production-attestation-diagnostics

  generated-files:
    name: Generated file contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bounded corpus validation dependencies
        run: python -m pip install "PyYAML>=6.0" "jsonschema>=4.22"
      - name: Rebuild generated indexes and active manifest
        run: python scripts/generate_indexes.py
      - name: Upload regenerated metadata
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-repository-metadata
          path: |
            SKILL_FILE_INDEX.md
            TEMPLATE_INDEX.md
            HSK_SKILL_FILE_INDEX_V622.md
            HSK_TEMPLATE_INDEX_V622.md
            MANIFEST.sha256
            knowledge/case_memory/index.json
      - name: Reject stale generated files
        shell: bash
        run: |
          git diff --exit-code -- \
            SKILL_FILE_INDEX.md \
            TEMPLATE_INDEX.md \
            HSK_SKILL_FILE_INDEX_V622.md \
            HSK_TEMPLATE_INDEX_V622.md \
            MANIFEST.sha256 \
            knowledge/case_memory/index.json
          test -z "$(git ls-files --others --exclude-standard -- knowledge/case_memory/index.json)"
