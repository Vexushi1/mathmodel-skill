name: HSK Skill CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: hsk-skill-ci-v650-code-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-code-scope:
    name: Apply formal code sync scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Apply sync-project code scope
        run: python scripts/apply_v650_sync_code_scope.py
      - name: Remove migration and rebuild metadata
        run: |
          rm scripts/apply_v650_sync_code_scope.py
          python scripts/generate_indexes.py
      - name: Validate static contracts
        run: python scripts/lint_skill.py
      - name: Run all unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Restore standard CI workflow
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit validated code-scope implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support formal code delivery scope in project sync"
          git push origin HEAD:${{ github.head_ref }}
