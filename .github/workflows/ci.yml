name: HSK Skill CI

on:
  push:
    branches: [main, "refactor/**", "upgrade/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hsk-skill-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-lint:
    name: Static contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Lint active skill graph and artifact closure
        shell: bash
        run: python scripts/lint_skill.py --skip-generated > static-lint.log 2>&1
      - name: Upload static lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-lint-diagnostics
          path: static-lint.log
      - name: Resolve representative assured workflow
        run: python scripts/resolve_runtime.py full_solution --primary mechanism --secondary optimization --competition CUMCM
      - name: Legacy resolver compatibility smoke
        run: python scripts/resolve_workflow.py problem_analysis --primary mechanism --competition CUMCM

  unit-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py" > unittest.log 2>&1
      - name: Upload unit test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unittest-diagnostics-${{ matrix.python-version }}
          path: unittest.log

  windows-unit:
    name: Windows Python 3.14
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run native Windows unit tests
        run: python -m unittest discover -s tests -p "test_*.py" > unittest-windows.log 2>&1
      - name: Upload Windows diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unittest-diagnostics-windows
          path: unittest-windows.log

  matlab-solver-smoke:
    name: MATLAB R2024b native solver contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set temporary solver fixture directory
        shell: bash
        run: |
          echo "HSK_MATLAB_SOLVER_OUTPUT=$RUNNER_TEMP/hsk-native-solver" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hsk-native-solver"
          : > "$RUNNER_TEMP/hsk-native-solver/matlab-ci-probe.log"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
      - name: Configure and verify licensed MATLAB CI launcher
        shell: bash
        run: |
          set -euo pipefail
          launcher="$RUNNER_TEMP/hsk-run-matlab-command"
          probe_log="$HSK_MATLAB_SOLVER_OUTPUT/matlab-ci-probe.log"
          # Same official binary as run-command@v3, pinned to its resolved commit.
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/matlab-actions/run-command/bfa857648f4895aa98a446fe41c85e0788421ed5/dist/bin/glnxa64/run-matlab-command" \
            --output "$launcher" 2>&1 | tee -a "$probe_log"
          chmod +x "$launcher"
          adapter="$RUNNER_TEMP/hsk-matlab-ci"
          cat > "$adapter" <<'MATLAB_CI'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ $# -ne 2 || "${1-}" != "-batch" || -z "${2-}" ]]; then
            echo "Expected exactly: -batch MATLAB_EXPRESSION" >&2
            exit 64
          fi
          launcher="$(dirname -- "${BASH_SOURCE[0]}")/hsk-run-matlab-command"
          exec env MW_BATCH_LICENSING_ONLINE=true "$launcher" "$2"
          MATLAB_CI
          chmod +x "$adapter"
          echo "HSK_MATLAB_CI_COMMAND=$adapter" >> "$GITHUB_ENV"
          if ! "$adapter" -batch "assert(~isempty(ver('MATLAB'))); assert(license('test','MATLAB'));" 2>&1 | tee -a "$probe_log"; then
            echo "MathWorks CI MATLAB launch and license probe failed" | tee -a "$probe_log" >&2
            exit 1
          fi
      - name: Prepare isolated synthetic primary fixture
        run: python tests/test_solver_backend_end_to_end.py prepare --project "$HSK_MATLAB_SOLVER_OUTPUT"
      - name: Deliver primary only after real native Code Analyzer passes
        run: python tests/test_solver_backend_end_to_end.py deliver-primary --project "$HSK_MATLAB_SOLVER_OUTPUT" --matlab-command "$HSK_MATLAB_CI_COMMAND"
      - name: Run native MATLAB primary solver
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,"tests","matlab")); run_solver_backend_smoke(string(getenv("HSK_MATLAB_SOLVER_OUTPUT")),"primary")
      - name: Accept native primary workbook and prepare required analysis
        run: |
          python tests/test_solver_backend_end_to_end.py verify-primary --project "$HSK_MATLAB_SOLVER_OUTPUT"
          python tests/test_solver_backend_end_to_end.py prepare-analysis --project "$HSK_MATLAB_SOLVER_OUTPUT"
          python tests/test_solver_backend_end_to_end.py deliver-analysis --project "$HSK_MATLAB_SOLVER_OUTPUT" --matlab-command "$HSK_MATLAB_CI_COMMAND"
      - name: Run native MATLAB analysis solver
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,"tests","matlab")); run_solver_backend_smoke(string(getenv("HSK_MATLAB_SOLVER_OUTPUT")),"analysis")
      - name: Verify analysis and original primary preservation
        run: python tests/test_solver_backend_end_to_end.py verify-analysis --project "$HSK_MATLAB_SOLVER_OUTPUT"
      - name: Prepare separate same-backend projects and execute Python Q1/Q2/analysis
        run: python tests/solver_backend_mixed_smoke.py prepare --source "$HSK_MATLAB_SOLVER_OUTPUT" --project "$HSK_MATLAB_SOLVER_OUTPUT/same-backend"
      - name: Run native MATLAB Q2 consuming accepted MATLAB Q1 workbook
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,"tests","matlab")); run_solver_backend_mixed_smoke(fullfile(string(getenv("HSK_MATLAB_SOLVER_OUTPUT")),"same-backend"))
      - name: Accept same-backend stages and reject mixed numerical delivery
        run: python tests/solver_backend_mixed_smoke.py verify --project "$HSK_MATLAB_SOLVER_OUTPUT/same-backend"
      - name: Prepare accepted preprocessing 1.0 fixture and deliver MATLAB 1.1 primary
        run: |
          python tests/test_solver_backend_end_to_end.py prepare-preprocessed --project "$HSK_MATLAB_SOLVER_OUTPUT/preprocessed"
          python tests/test_solver_backend_end_to_end.py deliver-primary --project "$HSK_MATLAB_SOLVER_OUTPUT/preprocessed" --matlab-command "$HSK_MATLAB_CI_COMMAND"
      - name: Run native primary from accepted preprocessing XLSX
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,"tests","matlab")); run_solver_backend_smoke(fullfile(string(getenv("HSK_MATLAB_SOLVER_OUTPUT")),"preprocessed"),"primary")
      - name: Accept preprocessed-input primary and deliver analysis
        run: |
          python tests/test_solver_backend_end_to_end.py verify-primary --project "$HSK_MATLAB_SOLVER_OUTPUT/preprocessed"
          python tests/test_solver_backend_end_to_end.py prepare-analysis --project "$HSK_MATLAB_SOLVER_OUTPUT/preprocessed"
          python tests/test_solver_backend_end_to_end.py deliver-analysis --project "$HSK_MATLAB_SOLVER_OUTPUT/preprocessed" --matlab-command "$HSK_MATLAB_CI_COMMAND"
      - name: Run native analysis from accepted preprocessing XLSX
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,"tests","matlab")); run_solver_backend_smoke(fullfile(string(getenv("HSK_MATLAB_SOLVER_OUTPUT")),"preprocessed"),"analysis")
      - name: Verify preprocessing identity and workbook preservation
        run: python tests/test_solver_backend_end_to_end.py verify-analysis --project "$HSK_MATLAB_SOLVER_OUTPUT/preprocessed"
      - name: Verify uppercase source input and accepted-primary hashes in native stages
        run: python tests/solver_backend_hash_smoke.py --project "$HSK_MATLAB_SOLVER_OUTPUT/hash-casing" --matlab-command "$HSK_MATLAB_CI_COMMAND"
      - name: Upload actual MATLAB execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matlab-native-solver-evidence
          path: ${{ env.HSK_MATLAB_SOLVER_OUTPUT }}
          if-no-files-found: error
      - name: Ensure smoke did not write into the checkout
        run: test -z "$(git status --porcelain)"

  latex-smoke:
    name: LaTeX ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUMCM
            working_directory: templates/latex/cumcm/hsk
            root_file: hsk_main.tex
            xelatex: true
          - name: MCM-ICM
            working_directory: templates/latex/mcm
            root_file: main.tex
            xelatex: false
          - name: Diangong
            working_directory: templates/latex/diangong
            root_file: main.tex
            xelatex: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare CUMCM class
        if: matrix.name == 'CUMCM'
        run: |
          cp templates/latex/cumcm/cumcmthesis/cumcmthesis.cls templates/latex/cumcm/hsk/
          python scripts/prepare_cumcm_class.py templates/latex/cumcm/hsk/cumcmthesis.cls
      - name: Compile template
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ matrix.root_file }}
          working_directory: ${{ matrix.working_directory }}
          latexmk_use_xelatex: ${{ matrix.xelatex }}
          args: -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Reject unresolved references and fatal warnings
        shell: bash
        run: |
          log="${{ matrix.working_directory }}/${{ matrix.root_file }}"
          log="${log%.tex}.log"
          test -f "$log"
          ! grep -E "Undefined control sequence|LaTeX Error|Citation .* undefined|There were undefined references" "$log"
      - name: Collect LaTeX diagnostics
        if: failure()
        shell: bash
        run: |
          log="${{ matrix.working_directory }}/${{ matrix.root_file }}"
          log="${log%.tex}.log"
          {
            echo "Template: ${{ matrix.name }}"
            echo "Expected log: $log"
            if test -f "$log"; then
              tail -n 200 "$log"
            else
              echo "Expected log was not created. Files in the working directory:"
              find "${{ matrix.working_directory }}" -maxdepth 1 -type f -printf '%f\n' | sort
            fi
          } > latex-diagnostics.txt
      - name: Upload LaTeX diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: latex-diagnostics-${{ matrix.name }}
          path: latex-diagnostics.txt

  production-latex-attestation:
    name: Production LaTeX attestation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Install production TeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-bibtex-extra texlive-lang-chinese texlive-plain-generic texlive-fonts-recommended texlive-science biber
      - name: Build minimal formal project fixture
        shell: bash
        run: |
          project="$RUNNER_TEMP/hsk-formal-project"
          mkdir -p "$project/final_latex"
          cat > "$project/模型论文框架.md" <<'EOF'
          # 模型论文框架

          当前文件仅用于 CI 验证正式 LaTeX 审计、编译与哈希证明链。
          EOF
          cat > "$project/final_latex/main.tex" <<'EOF'
          \documentclass[withoutpreface]{cumcmthesis}
          \let\supercite\relax
          \usepackage[backend=biber,style=numeric,sorting=none]{biblatex}
          \addbibresource{references.bib}
          \begin{document}
          \section{CI Attestation}
          This synthetic CUMCM paper validates the formal HSK LaTeX delivery path. Its only citation uses the current bibliography interface~\cite{ci}, and the generated PDF is bound to the audited source and compile profile.
          \printbibliography
          \end{document}
          EOF
          cat > "$project/final_latex/references.bib" <<'EOF'
          @book{ci,
            author = {HSK CI},
            title = {Formal Delivery Attestation Fixture},
            year = {2026}
          }
          EOF
          echo "HSK_FORMAL_PROJECT=$project" >> "$GITHUB_ENV"
      - name: Run formal audit and profile-bound compilation
        run: python scripts/render_paper.py "$HSK_FORMAL_PROJECT/final_latex" --profile cumcm --main main.tex
      - name: Verify formal attestation chain
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          import latex_delivery

          project = Path(__import__("os").environ["HSK_FORMAL_PROJECT"]) / "final_latex"
          audit = yaml.safe_load((project / "latex_audit_report.yaml").read_text(encoding="utf-8"))
          report = yaml.safe_load((project / "compile_report.yaml").read_text(encoding="utf-8"))
          main_text = (project / "main.tex").read_text(encoding="utf-8")
          assert "\\documentclass[withoutpreface]{cumcmthesis}" in main_text, main_text
          assert audit["status"] == "passed", audit
          assert audit["mode"] == "formal", audit
          assert report["report_schema_version"] == "4.0.0", report
          assert report["status"] == "passed", report
          assert report["attestation_mode"] == "formal", report
          assert report["profile"] == "cumcm", report
          assert report["log_present"] is True, report
          assert report["profile_override_used"] is False, report
          assert (project / "cumcmthesis.cls").is_file()
          issues = latex_delivery.verify_compile_report(
              project=project,
              main=project / "main.tex",
              pdf=project / "main.pdf",
              report=report,
          )
          assert issues == [], issues
          PY
      - name: Render long core proof pagination and numbering fixture
        shell: bash
        run: |
          set -euo pipefail
          long_project="$RUNNER_TEMP/hsk-long-core-proof"
          mkdir -p "$long_project/final_latex/config"
          cp templates/latex/cumcm/hsk/config/preamble.tex "$long_project/final_latex/config/preamble.tex"
          cat > "$long_project/模型论文框架.md" <<'EOF'
          # 模型论文框架

          该文件仅用于 CI 验证长核心证明仍留在正文、可正常跨页，并保持命题/公式引用编号可解析。
          EOF
          cat > "$long_project/final_latex/references.bib" <<'EOF'
          @book{proofci,
            author = {HSK CI},
            title = {Long Core Proof Rendering Fixture},
            year = {2026}
          }
          EOF
          cat > "$long_project/final_latex/main.tex" <<'EOF'
          \documentclass[withoutpreface]{cumcmthesis}
          \input{config/preamble}
          \begin{document}
          \section{长核心证明渲染验证}

          \begin{hskproposition}{长核心证明的正文可分页性}
          \label{prop:long-core-proof}
          若每一步推理都保持当前定义域与可行性条件，则完整核心证明应保留在正文，并允许跨页连续展开。
          \end{hskproposition}

          \begin{hskproof}
          下面保留一组连续的必要推理单元，用于验证较长核心证明不依赖命题框整体同页，也不会因为篇幅而迁移到附录。

          \newcount\proofstep
          \proofstep=1
          \loop
          第 \the\proofstep 步保留一个独立的必要推理单元：由前一步关系和当前定义域条件，可知对应中间量仍满足可行性要求，因此下一步变换仍具有合法输入。该段只用于形成足够长的正文证明，以真实验证普通正文流中的分页能力。
          \par\medskip
          \advance\proofstep by1
          \ifnum\proofstep<55
          \repeat

          最后一项关系写为
          \begin{equation}
              z=x+1.
              \label{eq:long-proof-final}
          \end{equation}
          因而完整证明在保留全部必要推理后得到最终关系，命题得证。
          \end{hskproof}

          命题~\ref{prop:long-core-proof} 的完整证明已经在正文跨页展开，最终关系见式~\eqref{eq:long-proof-final}。
          该维护夹具的参考文献接口见文献~\cite{proofci}。
          \printbibliography
          \end{document}
          EOF
          echo "HSK_LONG_PROOF_PROJECT=$long_project" >> "$GITHUB_ENV"
          python scripts/render_paper.py "$long_project/final_latex" --profile cumcm --main main.tex
          LONG_PROJECT="$long_project" python - <<'PY'
          import os
          import re
          from pathlib import Path

          import yaml

          project = Path(os.environ["LONG_PROJECT"]) / "final_latex"
          audit = yaml.safe_load((project / "latex_audit_report.yaml").read_text(encoding="utf-8"))
          report = yaml.safe_load((project / "compile_report.yaml").read_text(encoding="utf-8"))
          assert audit["status"] == "passed", audit
          assert report["status"] == "passed", report

          aux = (project / "main.aux").read_text(encoding="utf-8", errors="ignore")
          log = (project / "main.log").read_text(encoding="utf-8", errors="ignore")

          def label_page(label: str) -> int:
              prefix = "\\newlabel{" + label + "}"
              line = next((item for item in aux.splitlines() if item.startswith(prefix)), None)
              assert line is not None, (label, aux[-3000:])
              match = re.search(r"\{\{[^{}]*\}\{(\d+)\}", line)
              assert match is not None, line
              return int(match.group(1))

          proposition_page = label_page("prop:long-core-proof")
          final_page = label_page("eq:long-proof-final")
          assert final_page > proposition_page, (proposition_page, final_page)
          lowered = log.lower()
          assert "undefined references" not in lowered, log[-3000:]
          assert "citation `proofci' undefined" not in lowered, log[-3000:]
          PY

      - name: Collect production attestation diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p production-attestation-diagnostics
          if test -n "${HSK_FORMAL_PROJECT:-}" && test -d "$HSK_FORMAL_PROJECT/final_latex"; then
            cp -f "$HSK_FORMAL_PROJECT/final_latex/latex_audit_report.yaml" production-attestation-diagnostics/ 2>/dev/null || true
            cp -f "$HSK_FORMAL_PROJECT/final_latex/compile_report.yaml" production-attestation-diagnostics/ 2>/dev/null || true
            cp -f "$HSK_FORMAL_PROJECT/final_latex/main.log" production-attestation-diagnostics/ 2>/dev/null || true
          fi
          if test -n "${HSK_LONG_PROOF_PROJECT:-}" && test -d "$HSK_LONG_PROOF_PROJECT/final_latex"; then
            mkdir -p production-attestation-diagnostics/long-core-proof
            cp -f "$HSK_LONG_PROOF_PROJECT/final_latex/latex_audit_report.yaml" production-attestation-diagnostics/long-core-proof/ 2>/dev/null || true
            cp -f "$HSK_LONG_PROOF_PROJECT/final_latex/compile_report.yaml" production-attestation-diagnostics/long-core-proof/ 2>/dev/null || true
            cp -f "$HSK_LONG_PROOF_PROJECT/final_latex/main.log" production-attestation-diagnostics/long-core-proof/ 2>/dev/null || true
            cp -f "$HSK_LONG_PROOF_PROJECT/final_latex/main.aux" production-attestation-diagnostics/long-core-proof/ 2>/dev/null || true
          fi
      - name: Upload production attestation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-latex-attestation-diagnostics
          path: production-attestation-diagnostics

  generated-files:
    name: Generated file contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rebuild generated indexes and active manifest
        run: python scripts/generate_indexes.py
      - name: Upload regenerated metadata
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-repository-metadata
          path: |
            SKILL_FILE_INDEX.md
            TEMPLATE_INDEX.md
            HSK_SKILL_FILE_INDEX_V622.md
            HSK_TEMPLATE_INDEX_V622.md
            MANIFEST.sha256
      - name: Reject stale generated files
        shell: bash
        run: |
          git diff --exit-code -- \
            SKILL_FILE_INDEX.md \
            TEMPLATE_INDEX.md \
            HSK_SKILL_FILE_INDEX_V622.md \
            HSK_TEMPLATE_INDEX_V622.md \
            MANIFEST.sha256
