name: HSK Skill CI

on:
  push:
    branches: [main, "refactor/**", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Lint active skill graph
        run: python scripts/lint_skill.py --skip-generated
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  latex-smoke:
    name: LaTeX ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUMCM
            working_directory: templates/latex/cumcm/hsk
            root_file: hsk_main.tex
            xelatex: true
          - name: MCM-ICM
            working_directory: templates/latex/mcm
            root_file: main.tex
            xelatex: false
          - name: Diangong
            working_directory: templates/latex/diangong
            root_file: main.tex
            xelatex: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare CUMCM class
        if: matrix.name == 'CUMCM'
        run: |
          cp templates/latex/cumcm/cumcmthesis/cumcmthesis.cls templates/latex/cumcm/hsk/
          python scripts/prepare_cumcm_class.py templates/latex/cumcm/hsk/cumcmthesis.cls
      - name: Compile template
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ matrix.root_file }}
          working_directory: ${{ matrix.working_directory }}
          latexmk_use_xelatex: ${{ matrix.xelatex }}
          args: -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Reject unresolved references and fatal warnings
        shell: bash
        run: |
          log="${{ matrix.working_directory }}/${{ matrix.root_file }}"
          log="${log%.tex}.log"
          test -f "$log"
          ! grep -E "Undefined control sequence|LaTeX Error|Citation .* undefined|There were undefined references" "$log"

  generated-files:
    name: Generated file contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generated indexes and manifest
        run: python scripts/generate_indexes.py --check
