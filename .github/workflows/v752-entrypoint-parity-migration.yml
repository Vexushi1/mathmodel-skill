name: v7.5.2 entrypoint parity migration

on:
  push:
    branches:
      - fix/v7.5.2-entrypoint-parity
    paths:
      - .github/workflows/v752-entrypoint-parity-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for generated-metadata refresh triggered by this push
        run: sleep 25
      - name: Reset to latest branch head
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - name: Apply migration
        run: python scripts/_v752_entrypoint_parity_migration.py
      - name: Remove one-shot maintenance files
        run: |
          rm -f scripts/_v752_entrypoint_parity_migration.py
          rm -f .github/workflows/v752-entrypoint-parity-migration.yml
      - name: Refresh active indexes and manifest from final tree
        run: python scripts/generate_indexes.py
      - name: Syntax smoke
        run: python -m compileall -q scripts tests
      - name: Commit final source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: v7.5.2 guard dual skill entrypoints"
          git push origin "HEAD:${GITHUB_REF_NAME}"
