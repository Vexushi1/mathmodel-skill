name: I4b finalize generated metadata

on:
  push:
    branches:
      - "release/v900-phase-i-i4b-release-carriers"

permissions:
  contents: read

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Remove finalizer from final tree
        run: git rm .github/workflows/i4b-finalize-generated.yml
      - name: Rebuild repository generated metadata
        run: python scripts/generate_indexes.py
      - name: Commit final generated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL_FILE_INDEX.md TEMPLATE_INDEX.md HSK_SKILL_FILE_INDEX_V622.md HSK_TEMPLATE_INDEX_V622.md MANIFEST.sha256 .github/workflows/i4b-finalize-generated.yml
          git commit -m "chore: finalize generated metadata for v9 carriers"
          git push
