name: I5 finalize v9 release closure v3

on:
  push:
    branches:
      - "docs/v900-phase-i-i5-release-closure"

permissions:
  contents: read

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused-test dependency
        run: python -m pip install PyYAML
      - name: Sync latest branch after generated refresh
        run: |
          sleep 10
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - name: Reuse audited v2 content transformations
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          text = Path('.github/workflows/i5-finalize-release-closure-v2.yml').read_text(encoding='utf-8').splitlines()
          wanted = {
              'Write final migration and release closure documents',
              'Patch current release prose and migration acceptance bindings',
          }
          blocks = []
          i = 0
          while i < len(text):
              line = text[i]
              if line.startswith('      - name: '):
                  name = line.split(': ', 1)[1]
                  if name in wanted:
                      i += 1
                      while i < len(text) and text[i].strip() != 'run: |':
                          i += 1
                      if i >= len(text):
                          raise SystemExit(f'missing run block for {name}')
                      i += 1
                      block = []
                      while i < len(text):
                          cur = text[i]
                          if cur.startswith('      - name: '):
                              break
                          if cur.startswith('          '):
                              block.append(cur[10:])
                          elif cur.strip() == '':
                              block.append('')
                          else:
                              raise SystemExit(f'unexpected indentation in {name}: {cur!r}')
                          i += 1
                      blocks.append((name, '\n'.join(block) + '\n'))
                      continue
              i += 1

          if {name for name, _ in blocks} != wanted:
              raise SystemExit(f'expected {wanted}, extracted {[name for name, _ in blocks]}')
          for name, script in blocks:
              print(f'Executing audited block: {name}')
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY
      - name: Remove all temporary finalizers and regenerate metadata
        run: |
          git rm -f .github/workflows/i5-finalize-release-closure.yml
          git rm -f .github/workflows/i5-finalize-release-closure-v2.yml
          git rm -f .github/workflows/i5-finalize-release-closure-v3.yml
          python scripts/generate_indexes.py
      - name: Validate focused I5 closure
        run: |
          python -m unittest tests.test_v900_phase_i_release_closure tests.test_v900_phase_i_migration_matrix
          python scripts/generate_indexes.py --check
      - name: Commit final I5 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close Phase I v9 release migration contract"
          git push
