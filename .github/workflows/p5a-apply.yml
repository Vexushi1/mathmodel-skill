name: Temporary P5a patch applier

on:
  push:
    branches:
      - refactor/optimization-p5a-run-config

permissions:
  contents: write

concurrency:
  group: temporary-p5a-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply reviewed P5a source patch and remove temporary workflow
        shell: bash
        env:
          PATCH_B64: [... truncated for tool call safety ...]Cg==
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/p5a.patch
          git apply -p1 --check /tmp/p5a.patch
          git apply -p1 /tmp/p5a.patch
          python -m py_compile scripts/validate_code_delivery.py scripts/validate_user_execution.py tests/test_p5a_run_config.py
          python -m unittest tests.test_p5a_run_config tests.test_user_execution_contract tests.test_preprocessing_decision_contract tests.test_v714_receipt_fail_closed tests.test_v700_two_stage_execution tests.test_v701_stage_boundary_closure tests.test_starter_templates tests.test_split_pipeline_runtime tests.test_result_io tests.test_v830_editable_mechanism_diagram.ContractAndDriftTests
          python scripts/generate_indexes.py
          python scripts/lint_skill.py
          git rm .github/workflows/p5a-apply.yml
          git add core/user_execution_contract.yaml scripts/validate_code_delivery.py scripts/validate_user_execution.py templates/code/starter/README.md templates/code/hsk_pipeline/README.md modules/03_solve_validate.md modules/03_result_analysis.md tests/test_v830_editable_mechanism_diagram.py tests/test_p5a_run_config.py MANIFEST.sha256 SKILL_FILE_INDEX.md TEMPLATE_INDEX.md HSK_SKILL_FILE_INDEX_V622.md HSK_TEMPLATE_INDEX_V622.md
          git commit -m "refactor: implement P5a RUN_CONFIG task-only contract"
          git push origin HEAD:"${GITHUB_REF_NAME}"
