name: v7.11 model approval one-shot migration

on:
  push:
    branches: ["upgrade/v7.11.0-model-approval-gate"]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/v7.11.0-model-approval-gate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic migration
        run: python scripts/_v711_model_approval_migration.py
      - name: Commit migration result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md core/hsk_core_policy.md core/workflow_router.yaml core/output_contract.yaml scripts/resolve_workflow.py scripts/lint_skill_checks.py templates/model/model_paper_framework.md skills/mathmodel-skill/SKILL.md
          if git diff --cached --quiet; then
            echo "No migration changes required"
          else
            git commit -m "feat: integrate model approval gate across active authorities"
            git push origin HEAD:upgrade/v7.11.0-model-approval-gate
          fi
