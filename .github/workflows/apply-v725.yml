name: Apply v7.2.5 protected patch

on:
  push:
    branches:
      - fix/v7.2.5-preprocessing-runtime-closure

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v7.2.5-preprocessing-runtime-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact patch
        run: python scripts/apply_v725_patch.py
      - name: Commit patched repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: close v7.2.5 preprocessing runtime gaps"
          git push origin HEAD:fix/v7.2.5-preprocessing-runtime-closure
