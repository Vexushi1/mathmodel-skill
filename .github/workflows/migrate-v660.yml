name: Apply v6.6.0 self-contained question-folder migration

on:
  push:
    branches:
      - upgrade/v6.6.0-self-contained-question-folders
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-v660-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/v6.6.0-self-contained-question-folders
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Apply migration
        run: python scripts/migrate_v660_self_contained.py
      - name: Repair generated validator and obsolete code-scope test
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          validator = Path('scripts/validate_code_delivery.py')
          text = validator.read_text(encoding='utf-8')
          broken = 'if "if __name__ == "__main__":" not in text and "if __name__ == \'__main__\':" not in text:'
          fixed = 'if \'if __name__ == "__main__":\' not in text and "if __name__ == \'__main__\':" not in text:'
          if broken not in text:
              raise SystemExit('generated quoting pattern not found')
          validator.write_text(text.replace(broken, fixed), encoding='utf-8')

          test_path = Path('tests/test_sync_project.py')
          test_text = test_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    def test_formal_code_scope_requires_config_instructions_and_report\(self\):\n'
              r'.*?'
              r'(?=    def test_solve_phase_defaults_to_code_scope)',
              re.S,
          )
          replacement = '''    def test_formal_code_scope_does_not_require_auxiliary_files(self):
              syncer = load_syncer()
              with tempfile.TemporaryDirectory() as temp:
                  root = Path(temp)
                  setup_project(
                      root,
                      status="designed",
                      phase="solve_validate",
                      include_solution=False,
                      include_analysis=False,
                  )
                  report = syncer.synchronize(root, write=False, delivery_scope="code")
                  self.assertFalse(any("完整运行配置" in issue for issue in report["issues"]))
                  self.assertFalse(any("本地运行说明" in issue for issue in report["issues"]))
                  self.assertFalse(any("code_delivery_report" in issue for issue in report["issues"]))
                  self.assertFalse(report["issues"])

'''.replace('              ', '    ')
          updated, count = pattern.subn(replacement, test_text, count=1)
          if count != 1:
              raise SystemExit(f'obsolete code-scope test replacement count={count}')
          test_path.write_text(updated, encoding='utf-8')
          PY
      - name: Run targeted tests
        run: |
          python -m unittest tests.test_result_io
          python -m unittest tests.test_user_execution_contract
          python -m unittest tests.test_sync_project
          python -m unittest tests.test_v660_self_contained_question_folder
      - name: Run full validation
        run: |
          python scripts/lint_skill.py --skip-generated
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Regenerate indexes and manifest
        run: python scripts/generate_indexes.py
      - name: Remove one-shot migration files
        run: git rm scripts/migrate_v660_self_contained.py .github/workflows/migrate-v660.yml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: release v6.6.0 self-contained question folders'
          git push
