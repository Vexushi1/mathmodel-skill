name: Phase F concurrency hardening

on:
  push:
    branches:
      - phase-f/transactional-project-writes

permissions:
  contents: write

concurrency:
  group: phase-f-concurrency-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply deterministic concurrency patch
        run: python scripts/_phase_f_concurrency_fix.py
      - name: Run Phase F focused tests
        run: python -m unittest tests.test_v900_project_transaction tests.test_v900_transactional_writers
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Rebuild generated metadata
        run: python scripts/generate_indexes.py
      - name: Lint and generated checks
        run: |
          python scripts/lint_skill.py
          python scripts/generate_indexes.py --check
          git diff --check
      - name: Remove one-shot hardening files
        run: git rm scripts/_phase_f_concurrency_fix.py .github/workflows/_phase_f_concurrency_fix.yml
      - name: Rebuild final metadata
        run: |
          python scripts/generate_indexes.py
          python scripts/lint_skill.py
          python scripts/generate_indexes.py --check
          git diff --check
      - name: Commit final Phase F tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: serialize Phase F project transactions'
          git push origin HEAD:phase-f/transactional-project-writes
