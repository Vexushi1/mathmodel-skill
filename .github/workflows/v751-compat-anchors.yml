name: v7.5.1 compatibility anchors

on:
  push:
    branches:
      - fix/v7.5.1-architecture-slimming

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v7.5.1-architecture-slimming
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore compact compatibility anchors
        run: python scripts/_v751_restore_anchors.py
      - name: Remove one-shot maintenance files before metadata generation
        run: git rm scripts/_v751_restore_anchors.py .github/workflows/v751-compat-anchors.yml
      - name: Regenerate final active metadata
        run: python scripts/generate_indexes.py
      - name: Commit compatibility anchors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve v7.5 writing compatibility anchors"
          git push origin HEAD:fix/v7.5.1-architecture-slimming
