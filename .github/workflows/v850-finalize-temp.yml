name: Temporary v8.5.0 release finalizer

on:
  push:
    branches:
      - upgrade/v8.5.0-author-reasoning-voice

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Finalize v8.5.0 release carriers
        run: python scripts/_finalize_v850_tmp.py
      - name: Align v8.0 runtime release regression
        shell: bash
        run: sed -i 's/self.assertEqual(self.contract\["version"\], "8.4.0")/self.assertEqual(self.contract["version"], "8.5.0")/' tests/test_v800_writing_runtime.py
      - name: Regenerate active indexes and manifest
        run: python scripts/generate_indexes.py
      - name: Static contract lint
        run: python scripts/lint_skill.py --skip-generated
      - name: Unit regression suite
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py" > v850-finalizer-unittest.log 2>&1
      - name: Upload finalizer unit diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: v850-finalizer-unittest-diagnostics
          path: v850-finalizer-unittest.log
      - name: Generated file contract
        run: python scripts/generate_indexes.py --check
      - name: Commit finalized release candidate
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No finalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): finalize v8.5.0 metadata and regressions"
          git push
