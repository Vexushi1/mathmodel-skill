name: I4a protected authority rebaseline

on:
  push:
    branches:
      - "refactor/v900-phase-i-i4a-v9-applicability"

permissions:
  contents: read

jobs:
  rebaseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Update only approved protected Authority SHAs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_v830_editable_mechanism_diagram.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '"core/numerical_verification_contract.yaml": "b901923edf38112cbc922f51d1157265fe1931bd"':
              '"core/numerical_verification_contract.yaml": "f7e1921ec4945cb5e87984ccb8946302d854143f"',
              '"core/workbook_schema.yaml": "2422bbfa8cb3fad3b5b04c12de21c954ec8b3723"':
              '"core/workbook_schema.yaml": "ea33b857602754258915e35dbb0373e1f73fa7af"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one protected baseline: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit approved characterization update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v830_editable_mechanism_diagram.py
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "test: rebaseline v9 applicability authority hashes"
          git push
