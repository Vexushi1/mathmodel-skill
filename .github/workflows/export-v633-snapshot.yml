name: Apply v6.3.3 gate hardening

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/export-v633-snapshot.yml

permissions:
  contents: write

concurrency:
  group: apply-v633-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and apply reviewed patch
        run: |
          cat scripts/.v633_patch_1.b64 scripts/.v633_patch_2.b64 scripts/.v633_patch_3.b64 scripts/.v633_patch_4.b64 > /tmp/v633.patch.zlib.b64
          echo 'd7cda055d4664a24a2a9a36fc43d7c8e997636e5fc4527f1c6e10c0151ccb8bf  /tmp/v633.patch.zlib.b64' | sha256sum -c -
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          source = Path('/tmp/v633.patch.zlib.b64').read_text(encoding='ascii')
          patch = zlib.decompress(base64.b64decode(source))
          Path('/tmp/v633.patch').write_bytes(patch)
          PY
          echo 'fd7e354df8e9299156ed847ce961d54cc9ebdbe0e377372964906ba6f4116c28  /tmp/v633.patch' | sha256sum -c -
          git apply --check /tmp/v633.patch
          git apply /tmp/v633.patch
          rm scripts/.v633_patch_*.b64
          rm .github/workflows/export-v633-snapshot.yml
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate source changes
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/lint_skill.py --skip-generated
          python scripts/generate_indexes.py
          python scripts/lint_skill.py
          git diff --check
      - name: Commit formal v6.3.3 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden v6.3.3 delivery gates'
          git push origin HEAD:${{ github.head_ref }}
