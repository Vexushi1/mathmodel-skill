name: Phase 5 Actions runtime migration

on:
  push:
    branches:
      - maintenance/v803-health-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/v803-health-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply Phase 5 migration
        run: python scripts/_phase5_actions_runtime_migration.py
      - name: Remove one-shot migration machinery
        run: |
          rm scripts/_phase5_actions_runtime_migration.py
          rm .github/workflows/_phase5-actions-runtime.yml
      - name: Refresh generated metadata
        run: python scripts/generate_indexes.py
      - name: Validate final Phase 5 tree
        run: |
          python -m unittest tests.test_actions_runtime_modernization
          python -m unittest tests.test_generated_workflow_hardening
          python scripts/lint_skill.py
          python scripts/generate_indexes.py --check
      - name: Commit final Phase 5 tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: modernize GitHub Actions runtime'
          git push origin HEAD:maintenance/v803-health-hardening
