version: 2.3.0
introduced_in_skill_version: 7.4.2
skill_compatibility: '>=7.4.2,<9.0.0'
purpose: 定义用户本地完整版数值执行链；所有数据项目先根据当前题目、当前附件和模型输入要求锁定preprocessing_decision，只有project_level才增加项目级预处理执行边界，每问主求解与结果深化分析继续使用两个独立Python脚本。v7.14起新生成主求解还绑定Primary Quality Specification与主数值证据独立复核，但不得把结果深化分析提前塞进主求解。
numerical_verification_authority: core/numerical_verification_contract.yaml
default_mode:
  execution_owner: user
  execution_profile: full_fidelity
  assistant_runs_task_specific_code: false
  local_pipeline_remains_runnable_by_user: true
assistant_policy:
  prohibited:
  - 运行、导入或通过subprocess/runpy/notebook执行数据预处理.py、问题X求解.py或问题X结果深化分析.py
  - 为节省时间自动缩减数据、网格、时域、场景、重复次数、随机种子、迭代次数或容差
  - 在完整版失败后静默切换轻量模型、替代求解器、粗粒度近似或演示结果
  - 用户未返回相应工作簿前声称已完成项目级预处理、已求解、已分析或已得到正式数值
  - 因多问共享同一原始数据、检测到缺失值或某类赛题通常采用某处理方法而自动生成或强制执行项目级预处理
  - 为了让主工作簿看起来“验证充分”而把参数敏感性、压力场景、替代算法/结构、多seed稳健性、异质性或广义外样本稳定性提前写入问题X求解.py
  allowed:
  - 审题、通用数据审计、preprocessing_decision、模型设计、公式闭环、Primary Quality Specification和完整版代码生成
  - 不导入赛题脚本的静态代码、依赖、语法和工程质量检查
  - 读取用户返回的工作簿并执行Schema、哈希、质量门和主数值证据一致性校验
  - 在预处理工作簿accepted、主求解与结果深化分析完成后，于Figure Evidence阶段生成data_process.m；该MATLAB脚本只读工作簿绘图，不执行数值预处理
  - 运行本Skill仓库自身的lint、单元测试、索引生成和LaTeX模板CI
full_fidelity_flags:
  execution_profile: full_fidelity
  allow_reduced_data: false
  allow_coarser_grid: false
  allow_shorter_horizon: false
  allow_fewer_repetitions: false
  allow_relaxed_tolerance: false
  allow_silent_solver_fallback: false
preprocessing_decision_policy:
  required_before_code: true
  values: [not_needed, question_local, project_level]
  levels: [none, structural, transformative]
  judgment_source: current_problem_current_attachments_and_model_requirements
  shared_data_alone_is_not_project_level: true
  missing_values_alone_do_not_imply_interpolation: true
  task_prediction_is_not_preprocessing: true
  project_level_covered_raw_sources_required: true
  substantive_preprocessing_requires_paper_evidence: true
  source_modes:
    not_needed: raw
    question_local: raw
    project_level: preprocessed
  project_level_execution_required: true
  not_needed_or_question_local_preprocessing_artifacts_required: false
code_delivery:
  semantic_governance_required: true
  code_quality_contract: core/code_quality_contract.yaml
  preprocessing_script: 数据预处理/数据预处理.py
  preprocessing_matlab_script_after_workbook_acceptance: 数据预处理/data_process.m
  stage_scripts:
    primary: 问题X求解/问题X求解.py
    analysis: 问题X求解/问题X结果深化分析.py
  stage_activation:
    preprocessing: preprocessing_decision == project_level
    primary: always_after_decision_and_applicable_data_gate
    analysis: accepted_primary_workbook_required
    preprocessing_matlab: preprocessing_decision == project_level and preprocessing_workbook_accepted
  runtime_metadata: FULL_FIDELITY_CONFIG分别嵌入实际生成的阶段Python脚本，并写入该阶段工作簿的运行配置工作表
  standalone_files_forbidden_by_default:
  - 数据预处理完整运行配置.yaml
  - 数据预处理本地运行说明.md
  - 问题X完整运行配置.yaml
  - 问题X本地运行说明.md
  - code_delivery_report.yaml
  - 问题X结果深化完整运行配置.yaml
  - 问题X结果深化本地运行说明.md
  required_config_fields:
  - execution_owner
  - execution_profile
  - stage
  - problem_name
  - data_paths
  - data_sha256
  - solver
  - solver_version
  - random_seed
  - tolerance
  - iteration_or_time_limit
  - expected_workbook
  - allow_reduced_data
  - allow_coarser_grid
  - allow_shorter_horizon
  - allow_fewer_repetitions
  - allow_relaxed_tolerance
  - allow_silent_solver_fallback
  stage_required_config_fields:
    primary:
    - primary_quality_protocol_version
  primary_quality_protocol_version: 1.0.0
  primary_quality_protocol_marker_scope: primary_only
  primary_quality_protocol_binding: 已交付主求解代码FULL_FIDELITY_CONFIG + 返回主工作簸运行配置；receipt静态读取已交付代码并核对代码SHA，不新增project_state字段
  no_placeholder_markers:
  - TODO
  - FIXME
  - __QUESTION_NAME__
  - NotImplementedError
three_stage_policy:
  preprocessing:
    activation: 仅preprocessing_decision=project_level
    role: 读取需要统一处理的共享原始数据，冻结covered_raw_sources，执行通用审计和已批准公共处理，输出数据预处理结果.xlsx；同时保存论文公式/方法证据、处理前后对比、验证和data_process绘图底层数据
    freeze_after: preprocessing_workbook_accepted
  primary:
    role: 首次交付问题X求解.py，只负责主求解与PQS要求的当前主计算内在数值有效性检查并输出问题X求解结果.xlsx；主工作簿accepted后该脚本冻结，不为结果深化分析改写。
    input_by_decision:
      not_needed: 原始数据
      question_local: 原始数据 + 本问语义中已定义的局部变换
      project_level: 已验收数据预处理结果.xlsx
    primary_quality_boundary: 参数敏感性、压力场景、替代算法/结构、多seed/多初值结论稳定性、异质性、误差分解和广义外样本稳定性不属于本阶段
  analysis:
    role: 主工作簿accepted后新建问题X结果深化分析.py，继承同一preprocessing_decision与数据事实源，依据真实主结果执行敏感性、稳健性、阈值、替代方法/结构、异质性等深化分析，输出问题X结果深化分析.xlsx。
  isolation: 修改深化分析脚本不得改变主求解代码哈希、主工作簿或主结果质量状态；修改主求解脚本则主结果及其全部下游重新进入待验收状态；修改project_level预处理则依赖该数据口径的小问进入stale；修改data_process.m只影响预处理图表/论文层。
execution_states:
  preprocessing:
  - not_applicable
  - pending
  - code_delivered
  - awaiting_user_preprocessing
  - workbook_received
  - accepted
  - rejected
  primary:
  - pending
  - code_delivered
  - awaiting_user_execution
  - workbook_received
  - accepted
  - rejected
  analysis:
  - pending
  - code_delivered
  - awaiting_user_execution
  - workbook_received
  - accepted
  - rejected
  - redo_required
  rules:
  - preprocessing_decision=not_needed或question_local时，preprocessing状态应为not_applicable或不生成该阶段，不得阻塞primary。
  - preprocessing_decision=project_level时，preprocessing=accepted且预处理质量门通过后才能进入primary。
  - 代码交付不得把小问status提升为solved或analyzed。
  - primary_execution_status=accepted且主结果质量门及适用主数值证据复核通过后，status才可进入solved。
  - analysis_execution_status=accepted且结论稳定性校验通过后，status才可进入analyzed。
  - 主工作簿未验收前不得生成最终结果深化分析脚本；只能形成候选分析方向。
returned_workbook:
  semantic_governance_required: true
  numerical_evidence_checker: scripts/validate_numerical_evidence.py
  required_sheet: 运行配置
  required_columns:
  - 项目
  - 值
  required_items:
  - execution_owner
  - execution_profile
  - stage
  - problem_name
  - code_sha256
  - data_sha256
  - solver
  - solver_version
  - tolerance
  - iteration_or_time_limit
  - actual_stop_reason
  - random_seed
  - repetitions_or_scenarios
  - grid_or_time_range
  - fallback_used
  - platform
  - allow_reduced_data
  - allow_coarser_grid
  - allow_shorter_horizon
  - allow_fewer_repetitions
  - allow_relaxed_tolerance
  - allow_silent_solver_fallback
  stage_required_items:
    primary_v714_writer:
    - primary_quality_protocol_version
  preprocessing_required_sheets_when_project_level:
  - 运行配置
  - 数据审计
  - 预处理参数
  - 预处理方法证据
  - 处理前后对比
  - 绘图数据索引
  - 预处理质量门
  acceptance_rules:
  - 当前Problem Contract、preprocessing_decision、语义闭环与复杂度复审必须先通过semantic_governance gate。
  - execution_owner必须为user。
  - execution_profile必须为full_fidelity。
  - 所有缩减、放宽和静默回退标志必须为false。
  - fallback_used必须为false。
  - preprocessing工作簿仅允许位于数据预处理/数据预处理结果.xlsx，且仅在decision=project_level时验收。
  - 主/深化工作簿实际路径与标准文件名必须解析出唯一problem_name和stage，再与运行配置完全一致；当前项目只接受问题X求解/中的两个标准工作簿，旧结果数据表/问题X/仅作只读兼容。
  - preprocessing工作簿code_sha256必须与已交付数据预处理.py一致；主工作簿与深化工作簿分别绑定两阶段小问Python哈希。
  - data_sha256必须与对应阶段代码交付时锁定的数据哈希完全一致。
  - preprocessing工作簿必须通过预处理质量门，并包含预处理方法证据、处理前后对比、绘图数据索引以及供data_process.m使用的真实底层数据。
  - 新v7.14主求解验收时，receipt必须静态读取项目状态登记的已交付主求解代码，先核对其实际SHA-256与primary_code_sha256，再从该代码FULL_FIDELITY_CONFIG读取primary_quality_protocol_version；返回主工作簿必须携带同一协议版本。不得通过省略工作簿协议标记或Verification ID降级为legacy质量门。
  - 主结果工作簿必须通过主结果质量门；当已交付代码绑定v7.14协议、运行配置声明primary_quality_protocol_version或主结果质量门出现Verification ID时，还必须按core/numerical_verification_contract.yaml独立复核适用底层数值证据，不能只相信工作簿自报Boolean。
  - 结果深化分析工作簿必须在主工作簿accepted后验收，并包含分析设计和结论稳定性汇总；其参数敏感性、压力场景、替代方法/结构、多seed/多初值、异质性等证据不得被主结果质量门替代或提前吸收。
  - 插值、填补、预测修复、滤波、异常处理等实质操作的验证结论必须与预处理质量门一致；不得只提供摘要数字而缺少可绘图/可复核底层证据。
filenames:
  preprocessing_directory: 数据预处理/
  preprocessing_python_code: 数据预处理/数据预处理.py
  preprocessing_workbook: 数据预处理/数据预处理结果.xlsx
  preprocessing_matlab_script: 数据预处理/data_process.m
  question_directory: 问题X求解/
  primary_python_code: 问题X求解/问题X求解.py
  analysis_python_code: 问题X求解/问题X结果深化分析.py
  primary_workbook: 问题X求解/问题X求解结果.xlsx
  analysis_workbook: 问题X求解/问题X结果深化分析.xlsx
  matlab_script: 问题X求解/qX_plot.m
  legacy_result_directory: 结果数据表/问题X/
  validation_reports: 仅在聊天或标准输出返回，不写入用户项目
legacy_compatibility:
  v7_13_primary_workbook_without_verification_id: read_only_supported
  v7_2_0_preprocessing_without_decision: read_only_until_redesign
  v7_0_semantic_governance_fields: read_only_until_redesign
  v6_6_single_evolving_script: read_only
  rule: 旧项目可继续读取已有产物；v7.13及更早主工作簿只读时不强制反向补Verification ID；重新进入当前主求解时该问按v7.14主数值质量轨迹重新生成。v7.2.0--v7.2.2项目重新进入模型设计/预处理/绘图/写作时沿用三态decision并按当前通用审计与证据规则复核；只读历史交付不强制反向补data_process.m；更早项目重新进入当前流程时先补齐preprocessing_decision，只有project_level才要求统一预处理；重新深化分析时使用独立问题X结果深化分析.py。
