  - FULL_RUN_CONFIG
  legacy_config_reader_exit_gate: P9 release adjudication
  p5a_run_config_without_run_receipt_protocol: read_only_supported_until_p9_release_adjudication
  legacy_receipt_without_run_receipt_version: read_only_supported_until_p9_release_adjudication
  v7_13_primary_workbook_without_verification_id: read_only_supported
  v7_2_0_preprocessing_without_decision: read_only_until_redesign
  v7_0_semantic_governance_fields: read_only_until_redesign
  v6_6_single_evolving_script: read_only
  rule: 旧项目可继续读取已有产物；P5a后旧FULL_FIDELITY_CONFIG/FULL_RUN_CONFIG仍按原完整字段和no-degradation显式标志只读兼容，不能因RUN_CONFIG迁移而放宽。P5a过渡RUN_CONFIG和历史receipt在P9裁决前可缺少RUN_RECEIPT版本握手；一旦任一端显式声明版本则只接受当前协议且不得静默降级。v7.13及更早主工作簿只读时不强制反向补Verification ID；重新进入当前主求解时该问按v7.14主数值质量轨迹重新生成。v7.2.0--v7.2.2项目重新进入模型设计/预处理/绘图/写作时沿用三态decision并按当前通用审计与证据规则复核；只读历史交付不强制反向补data_process.m；更早项目重新进入当前流程时先补齐preprocessing_decision，只有project_level才要求统一预处理；重新深化分析时按当前后端与阶段合同生成独立入口。
