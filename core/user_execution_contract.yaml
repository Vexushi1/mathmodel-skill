version: 2.0.0
skill_version: 7.1.0
purpose: 定义用户本地完整版数值执行链；每问主求解与结果深化分析使用两个独立Python脚本，主求解脚本在主工作簿验收后冻结。
default_mode:
  execution_owner: user
  execution_profile: full_fidelity
  assistant_runs_task_specific_code: false
  local_pipeline_remains_runnable_by_user: true
assistant_policy:
  prohibited:
  - 运行、导入或通过subprocess/runpy/notebook执行问题X求解目录中的主求解或结果深化分析脚本
  - 为节省时间自动缩减数据、网格、时域、场景、重复次数、随机种子、迭代次数或容差
  - 在完整版失败后静默切换轻量模型、替代求解器、粗粒度近似或演示结果
  - 用户未返回工作簿前声称已求解、已分析或已得到正式数值
  allowed:
  - 审题、模型设计、公式闭环和完整版代码生成
  - 不导入赛题脚本的静态代码、依赖、语法和工程质量检查
  - 读取用户返回的工作簿并执行Schema、哈希、质量门和证据一致性校验
  - 运行本Skill仓库自身的lint、单元测试、索引生成和LaTeX模板CI
full_fidelity_flags:
  execution_profile: full_fidelity
  allow_reduced_data: false
  allow_coarser_grid: false
  allow_shorter_horizon: false
  allow_fewer_repetitions: false
  allow_relaxed_tolerance: false
  allow_silent_solver_fallback: false
code_delivery:
  semantic_governance_required: true
  code_quality_contract: core/code_quality_contract.yaml
  stage_scripts:
    primary: 问题X求解/问题X求解.py
    analysis: 问题X求解/问题X结果深化分析.py
  runtime_metadata: FULL_FIDELITY_CONFIG分别嵌入对应阶段Python脚本，并写入该阶段工作簿的运行配置工作表
  standalone_files_forbidden_by_default:
  - 问题X完整运行配置.yaml
  - 问题X本地运行说明.md
  - code_delivery_report.yaml
  - 问题X结果深化完整运行配置.yaml
  - 问题X结果深化本地运行说明.md
  required_config_fields:
  - execution_owner
  - execution_profile
  - stage
  - problem_name
  - data_paths
  - data_sha256
  - solver
  - solver_version
  - random_seed
  - tolerance
  - iteration_or_time_limit
  - expected_workbook
  - allow_reduced_data
  - allow_coarser_grid
  - allow_shorter_horizon
  - allow_fewer_repetitions
  - allow_relaxed_tolerance
  - allow_silent_solver_fallback
  no_placeholder_markers:
  - TODO
  - FIXME
  - __QUESTION_NAME__
  - NotImplementedError
two_script_stage_policy:
  primary: 首次交付问题X求解.py，只负责主求解并输出问题X求解结果.xlsx；主工作簿accepted后该脚本冻结，不为结果深化分析改写。
  analysis: 主工作簿accepted后新建问题X结果深化分析.py，读取已验收主工作簿与必要原始数据，输出问题X结果深化分析.xlsx。
  isolation: 修改深化分析脚本不得改变主求解代码哈希、主工作簿或主结果质量状态；修改主求解脚本则主结果及其全部下游重新进入待验收状态。
execution_states:
  primary:
  - pending
  - code_delivered
  - awaiting_user_execution
  - workbook_received
  - accepted
  - rejected
  analysis:
  - pending
  - code_delivered
  - awaiting_user_execution
  - workbook_received
  - accepted
  - rejected
  - redo_required
  rules:
  - 代码交付不得把小问status提升为solved或analyzed。
  - primary_execution_status=accepted且主结果质量门通过后，status才可进入solved。
  - analysis_execution_status=accepted且结论稳定性校验通过后，status才可进入analyzed。
  - 主工作簿未验收前不得生成最终结果深化分析脚本；只能形成候选分析方向。
returned_workbook:
  semantic_governance_required: true
  required_sheet: 运行配置
  required_columns:
  - 项目
  - 值
  required_items:
  - execution_owner
  - execution_profile
  - stage
  - problem_name
  - code_sha256
  - data_sha256
  - solver
  - solver_version
  - tolerance
  - iteration_or_time_limit
  - actual_stop_reason
  - random_seed
  - repetitions_or_scenarios
  - grid_or_time_range
  - fallback_used
  - platform
  - allow_reduced_data
  - allow_coarser_grid
  - allow_shorter_horizon
  - allow_fewer_repetitions
  - allow_relaxed_tolerance
  - allow_silent_solver_fallback
  acceptance_rules:
  - 当前Problem Contract、语义闭环与复杂度复审必须先通过semantic_governance gate。
  - execution_owner必须为user。
  - execution_profile必须为full_fidelity。
  - 所有缩减、放宽和静默回退标志必须为false。
  - fallback_used必须为false。
  - 工作簿实际路径与标准文件名必须先解析出唯一problem_name和stage，再与运行配置中的problem_name和stage完全一致；当前项目只接受问题X求解/中的两个标准工作簿，旧结果数据表/问题X/仅作只读兼容。
  - 主工作簿code_sha256必须与已交付的问题X求解.py完全一致；深化工作簿code_sha256必须与已交付的问题X结果深化分析.py完全一致。
  - data_sha256必须与对应阶段代码交付时锁定的数据哈希完全一致。
  - 主结果工作簿必须通过主结果质量门，结果深化分析工作簿必须包含分析设计和结论稳定性汇总。
filenames:
  question_directory: 问题X求解/
  primary_python_code: 问题X求解/问题X求解.py
  analysis_python_code: 问题X求解/问题X结果深化分析.py
  primary_workbook: 问题X求解/问题X求解结果.xlsx
  analysis_workbook: 问题X求解/问题X结果深化分析.xlsx
  matlab_script: 问题X求解/qX_plot.m
  legacy_result_directory: 结果数据表/问题X/
  validation_reports: 仅在聊天或标准输出返回，不写入用户项目
legacy_compatibility:
  v7_0_semantic_governance_fields: read_only_until_redesign
  v6_6_single_evolving_script: read_only
  rule: 旧项目可继续读取已有产物；重新进入审题/模型设计时补齐语义治理字段，重新深化分析时使用独立问题X结果深化分析.py。
