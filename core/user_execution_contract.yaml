version: 2.6.0
introduced_in_skill_version: 7.4.2
skill_compatibility: '>=7.4.2,<10.0.0'
purpose: 定义用户本地完整版数值执行链；所有数据项目先根据当前题目、当前附件和模型输入要求锁定preprocessing_decision，只有project_level才增加项目级预处理执行边界。每问主求解使用已选Python或MATLAB独立入口；结果深化分析仅在主工作簿accepted后经过Analysis Necessity Gate且判定required时使用独立入口，默认继承主后端。P5a起新生成阶段脚本使用RUN_CONFIG承载任务可变输入，全局user/full-fidelity/no-degradation政策由本Authority继承；P5b起新生成阶段脚本通过run_receipt_protocol_version绑定版本化RUN_RECEIPT，实际运行事实仍写入既有工作簿运行配置工作表。v7.14起新生成主求解还绑定Primary Quality Specification与主数值证据独立复核，但不得把结果深化分析提前塞进主求解。
numerical_verification_authority: core/numerical_verification_contract.yaml
solver_backends:
  request_values: [auto, python, matlab]
  resolved_values: [python, matlab]
  state_field: solver_execution
  stage_default: {preprocessing: python, analysis: inherit_primary}
  selection_time: after_model_structure_and_numerical_requirements_before_model_challenge
  template_resources:
    python:
      primary: [templates/code/starter/README.md]
      analysis: [templates/code/starter/README.md]
    matlab:
      primary: [templates/code/matlab/README.md, templates/code/matlab/q1_solver.m]
      analysis: [templates/code/matlab/README.md, templates/code/matlab/q1_analysis.m]
  naming_authority: core/output_contract.yaml#per_question.solver_scripts
  decision_criteria:
  - feasible_explicit_user_choice
  - required_solver_capabilities_and_mathematical_guarantees
  - verified_runtime_packages_toolboxes_and_license_or_explicit_unverified_conditions
  - input_scale_and_structure
  - reusable_reliable_implementation_and_reproduction_cost
  rules:
  - Record one concrete backend and selection_reason per question and active stage; auto is a request only and cannot authorize code delivery.
  - Include the concrete solver, dependencies and unresolved environment conditions in the existing Model Approval Brief implementation scope; do not add a separate approval gate.
  - Do not map a task type directly to a language or prefer MATLAB merely because formal figures use MATLAB.
  - Different questions may select different backends; analysis may depart from its primary backend only with a recorded reason and must consume the current accepted primary workbook.
  - Project-level preprocessing remains Python with receipt 1.0 and existing state; question-local mathematical transformations follow the question backend.
  - Do not silently switch backend, solver, data scale or precision after selection. Report unavailable dependencies without pretending they were verified.
  - Pure implementation changes use existing primary_code_changed or analysis_code_changed; changes to algorithm semantics use current semantic governance. Backend, paths and environment facts do not belong in the SIB.
  - Main functions and project helpers are implementation artifacts, never matlab_script which remains the formal figure role.
  - Each formal MATLAB numerical execution must start in a fresh -batch process using the delivered source; after source changes start another fresh process. An existing GUI session or clear/rehash alone is not sufficient evidence against locked or cached functions. Numerical entrypoints and project helpers must not use mlock.
code_bundle:
  protocol_version: 1.1.0
  scope: [primary, analysis]
  dependency_field: code_dependencies
  dependency_item_fields: [path, sha256]
  dependency_paths: normalized_project_relative_source_files_only_excluding_entrypoint
  hash_algorithm: sha256
  serialization: sort normalized relative paths by UTF-8 byte order; concatenate each UTF-8 path, NUL and raw SHA-256 digest bytes for its entrypoint/helper, then SHA-256 over that byte stream
  entry_hash_field: code_sha256
  receipt_hash_field: code_bundle_sha256
  delivered_state_field: solver_execution.<stage>.bundle_sha256
  accepted_state_field: solver_execution.<stage>.validated_bundle_sha256
  rules:
  - Reject missing, absolute, duplicate, aliasing, case-ambiguous or outside-project dependency paths before hashing; preserve raw bytes and do not normalize source line endings.
  - The entrypoint binds its dependency declarations through its existing entry SHA; never embed the complete bundle hash in the entrypoint because that creates self-reference.
  - Default to a self-contained entrypoint with local functions; declare every required project helper when separate source files are necessary. Data/workbooks and installed packages are not code_dependencies.
  - Cross-check statically discoverable project imports/calls and actual runtime resolution; unsupported dynamic loading is unverified, not a proven dependency closure.
  - Current MATLAB templates can verify ordinary same-directory or project-root .m helpers. Any +package/private resolution not verified by the current template/checker must remain unverified and cannot pass formal source-closure checks; a matching filename alone does not prove resolution.
  - Bind source/data identities before the run and recheck before writing a successful receipt; changed inputs or cached/shadowed MATLAB functions must not acquire a successful new receipt.
  - Only successful stage receipt and numerical acceptance may update validated_bundle_sha256; sync observes and invalidates without refreshing delivered or validated identities.
  - Existing Python code without the new protocol remains readable by its historical contract; new MATLAB cannot use missing-metadata compatibility.

default_mode:
  execution_owner: user
  execution_profile: full_fidelity
  assistant_runs_task_specific_code: false
  local_pipeline_remains_runnable_by_user: true
assistant_policy:
  prohibited:
  - 运行、导入或通过subprocess/runpy/notebook/MATLAB执行题目专属预处理、主求解或深化分析入口及其辅助代码
  - 为节省时间自动缩减数据、网格、时域、场景、重复次数、随机种子、迭代次数或容差
  - 在完整版失败后静默切换轻量模型、替代求解器、粗粒度近似或演示结果
  - 用户未返回相应工作簿前声称已完成项目级预处理、已求解、已分析或已得到正式数值
  - 因多问共享同一原始数据、检测到缺失值或某类赛题通常采用某处理方法而自动生成或强制执行项目级预处理
  - 为了让主工作簿看起来“验证充分”而把参数敏感性、压力场景、替代算法/结构、多seed稳健性、异质性或广义外样本稳定性提前写入主求解入口
  allowed:
  - 审题、通用数据审计、preprocessing_decision、模型设计、公式闭环、Primary Quality Specification和完整版代码生成
  - 不导入赛题脚本的静态代码、依赖、语法和工程质量检查
  - 读取用户返回的工作簿并执行Schema、哈希、质量门和主数值证据一致性校验
  - 在预处理工作簿accepted、主求解以及Gate=required时必要的结果深化分析完成后，于Figure Evidence阶段生成data_process.m；该MATLAB脚本只读工作簿绘图，不执行数值预处理
  - 运行本Skill仓库自身的lint、单元测试、索引生成和LaTeX模板CI
full_fidelity_flags:
  execution_profile: full_fidelity
  allow_reduced_data: false
  allow_coarser_grid: false
  allow_shorter_horizon: false
  allow_fewer_repetitions: false
  allow_relaxed_tolerance: false
  allow_silent_solver_fallback: false
preprocessing_decision_policy:
  required_before_code: true
  values: [not_needed, question_local, project_level]
  levels: [none, structural, transformative]
  judgment_source: current_problem_current_attachments_and_model_requirements
  shared_data_alone_is_not_project_level: true
  missing_values_alone_do_not_imply_interpolation: true
  task_prediction_is_not_preprocessing: true
  project_level_covered_raw_sources_required: true
  substantive_preprocessing_requires_paper_evidence: true
  source_modes:
    not_needed: raw
    question_local: raw
    project_level: preprocessed
  project_level_execution_required: true
  not_needed_or_question_local_preprocessing_artifacts_required: false
code_delivery:
  data_identity_mode:
    field: data_identity_mode
    scope: RUN_CONFIG_for_primary_or_analysis_receipt_1_1
    values: [combined, preprocessing_workbook]
    default: combined
    authority: core/global_preprocessing_contract.yaml
    rules:
    - New Python and MATLAB 1.1 stages under project_level must explicitly select preprocessing_workbook; data_paths must contain exactly the current accepted preprocessing XLSX and data_sha256 must be its ordinary file SHA-256, preserving the existing global data identity.
    - preprocessing_workbook is forbidden without project_level and accepted/passed preprocessing; the existing covered_raw_sources restriction still applies to configured paths and actual reader calls.
    - combined retains the existing ordered project-relative input fingerprint for not_needed and question_local. Do not replace the accepted preprocessing workbook identity with a combined path/file fingerprint.
    - The field is not accepted by project-level preprocessing 1.0. Existing legacy 1.0 solver inputs retain their original interpretation and do not require this new field.
  semantic_governance_required: true
  code_quality_contract: core/code_quality_contract.yaml
  preprocessing_script: 数据预处理/数据预处理.py
  preprocessing_matlab_script_after_workbook_acceptance: 数据预处理/data_process.m
  stage_scripts_authority: core/output_contract.yaml#per_question.solver_scripts
  # Legacy Python projection for old callers.
  stage_scripts:
    primary: 问题X求解/问题X求解.py
    analysis: 问题X求解/问题X结果深化分析.py
  stage_activation:
    preprocessing: preprocessing_decision == project_level
    primary: always_after_decision_and_applicable_data_gate
    analysis: accepted_primary_workbook and analysis_necessity_gate == required
    preprocessing_matlab: preprocessing_decision == project_level and preprocessing_workbook_accepted
  runtime_metadata: 新生成阶段代码使用RUN_CONFIG声明任务可变输入，并用run_receipt_protocol_version声明期望的RUN_RECEIPT协议；user/full-fidelity/no-degradation政策从本Authority继承。实际运行事实写入该阶段工作簿运行配置中的RUN_RECEIPT。FULL_FIDELITY_CONFIG与FULL_RUN_CONFIG仅作旧项目静态读取兼容。
  canonical_config_name: RUN_CONFIG
  legacy_config_names:
  - FULL_FIDELITY_CONFIG
  - FULL_RUN_CONFIG
  compatibility_window:
    release_decision: 9.2.0-read-only-retained
    legacy_full_config_read_only: true
    p5a_versionless_receipt_read_only: true
    new_writer_must_use_run_config: true
    new_writer_receipt_protocol_required: true
    earliest_removal_skill_major: 10
    removal_requires:
    - explicit_major_migration
    - legacy_project_detection_or_migration_evidence
    - compatibility_matrix_update
    - dedicated_regression
  multiple_supported_configs_in_one_script: forbidden_fail_closed
  standalone_files_forbidden_by_default:
  - 数据预处理完整运行配置.yaml
  - 数据预处理本地运行说明.md
  - 问题X完整运行配置.yaml
  - 问题X本地运行说明.md
  - code_delivery_report.yaml
  - 问题X结果深化完整运行配置.yaml
  - 问题X结果深化本地运行说明.md
  canonical_required_config_fields:
  - stage
  - problem_name
  - data_paths
  - data_sha256
  - solver
  - random_seed
  - tolerance
  - iteration_or_time_limit
  - expected_workbook
  policy_inherited_config_fields:
    execution_owner: user
    execution_profile: full_fidelity
    allow_reduced_data: false
    allow_coarser_grid: false
    allow_shorter_horizon: false
    allow_fewer_repetitions: false
    allow_relaxed_tolerance: false
    allow_silent_solver_fallback: false
  canonical_optional_compatibility_fields:
  - solver_version
  backend_config:
    backend_field: solver_backend
    dependencies_field: code_dependencies
    matlab_form: literal_jsondecode
    matlab_config_position: unconditional_start_of_matching_main_function
    rules:
    - MATLAB RUN_CONFIG is exactly one jsondecode of a literal JSON object; only tested literal concatenation, comments, escaping and continuation syntax are accepted.
    - Reject duplicate JSON keys, non-object roots, non-finite numbers, dynamic expressions, conditional assignment and later overrides without executing code.
    - Standard keys are ASCII identifiers; null/empty/logical/numeric/string and integer precision follow the tested field-level mapping, never silent field-name conversion.
    - The decoded values must drive the actual data scope, RNG, solver options and output, not merely echo expected metadata.
  run_receipt_protocol:
    field: run_receipt_protocol_version
    current_version: 1.0.0
    current_version_by_stage: {preprocessing: 1.0.0, primary: 1.1.0, analysis: 1.1.0}
    supported_versions: [1.0.0, 1.1.0]
    version_required_config_fields:
      '1.1.0': [solver_backend]
    version_stage_required_config_fields:
      '1.1.0':
        analysis: [primary_workbook_sha256]
    new_writer_required: true
    p5a_transitional_missing_marker_read_supported: true
    unknown_version_policy: fail_closed
    binding: 已交付阶段代码RUN_CONFIG中的协议期望 + 返回工作簿RUN_RECEIPT中的run_receipt_version；静态读取代码并核对阶段代码SHA；1.1另按code_bundle绑定已交付与已验收实现
  legacy_required_config_fields:
  - execution_owner
  - execution_profile
  - stage
  - problem_name
  - data_paths
  - data_sha256
  - solver
  - solver_version
  - random_seed
  - tolerance
  - iteration_or_time_limit
  - expected_workbook
  - allow_reduced_data
  - allow_coarser_grid
  - allow_shorter_horizon
  - allow_fewer_repetitions
  - allow_relaxed_tolerance
  - allow_silent_solver_fallback
  stage_required_config_fields:
    primary:
    - primary_quality_protocol_version
  primary_quality_protocol_version: 1.0.0
  primary_quality_protocol_marker_scope: primary_only
  primary_quality_protocol_binding: 已交付主求解代码RUN_CONFIG（旧项目可只读FULL_FIDELITY_CONFIG/FULL_RUN_CONFIG）+ 返回主工作簿RUN_RECEIPT；receipt静态读取已交付代码并核对代码SHA，不新增project_state字段
  no_placeholder_markers:
  - TODO
  - FIXME
  - __QUESTION_NAME__
  - NotImplementedError
three_stage_policy:
  preprocessing:
    activation: 仅preprocessing_decision=project_level
    role: 读取需要统一处理的共享原始数据，冻结covered_raw_sources，执行通用审计和已批准公共处理，输出数据预处理结果.xlsx；同时保存论文公式/方法证据、处理前后对比、验证和data_process绘图底层数据
    freeze_after: preprocessing_workbook_accepted
  primary:
    role: 按已选后端交付唯一主求解入口，只负责主求解与PQS要求的当前主计算内在数值有效性检查并输出问题X求解结果.xlsx；主工作簿accepted后该脚本冻结，不为结果深化分析改写。
    input_by_decision:
      not_needed: 原始数据
      question_local: 原始数据 + 本问语义中已定义的局部变换
      project_level: 已验收数据预处理结果.xlsx
    primary_quality_boundary: 参数敏感性、压力场景、替代算法/结构、多seed/多初值结论稳定性、异质性、误差分解和广义外样本稳定性不属于本阶段
  analysis:
    activation: 主工作簿accepted后先执行Analysis Necessity Gate；仅Gate=required时激活
    role: Gate=required时按已选后端新建独立深化分析入口，继承同一preprocessing_decision与数据事实源，依据真实主结果执行敏感性、稳健性、阈值、替代方法/结构、异质性等深化分析，输出问题X结果深化分析.xlsx；Gate=not_required时记录非空理由且不生成03B代码/工作簿。
  isolation: 修改深化分析脚本不得改变主求解代码哈希、主工作簿或主结果质量状态；修改主求解脚本则主结果及其全部下游重新进入待验收状态；修改project_level预处理则依赖该数据口径的小问进入stale；修改data_process.m只影响预处理图表/论文层。
execution_states:
  preprocessing:
  - not_applicable
  - pending
  - code_delivered
  - awaiting_user_preprocessing
  - workbook_received
  - accepted
  - rejected
  primary:
  - pending
  - code_delivered
  - awaiting_user_execution
  - workbook_received
  - accepted
  - rejected
  analysis:
  - pending
  - code_delivered
  - awaiting_user_execution
  - workbook_received
  - accepted
  - rejected
  - redo_required
  rules:
  - preprocessing_decision=not_needed或question_local时，preprocessing状态应为not_applicable或不生成该阶段，不得阻塞primary。
  - preprocessing_decision=project_level时，preprocessing=accepted且预处理质量门通过后才能进入primary。
  - 代码交付不得把小问status提升为solved或analyzed。
  - primary_execution_status=accepted且主结果质量门及适用主数值证据复核通过后，status才可进入solved。
  - 主工作簿accepted后必须先执行Analysis Necessity Gate；只有Gate=required才允许交付问题X结果深化分析.py并推进analysis_execution_status。
  - analysis_execution_status=accepted且结论稳定性校验通过后，status才可进入analyzed。
  - result_analysis_status=not_required且result_analysis_requirement_reason非空时，analysis阶段保持未激活，不生成03B代码/工作簿；下游可按validated_results语义继续，但不得据此声称已通过稳健性、稳定性或替代算法一致性检验。
  - 主工作簿未验收前不得生成最终结果深化分析脚本；只能形成候选分析方向。
analysis_necessity_state_mapping:
  authority: modules/03_result_analysis.md
  new_state_enum: false
  not_required: result_analysis_status=not_required且result_analysis_requirement_reason非空；代码交付或回执不能自动覆盖该决定。
  required_plan: result_analysis_status不是not_required，且有当前非空result_analysis_requirement_reason和非空analysis_methods；pending本身不表示已激活。
  receipt_activation: required计划还须有code_delivered/awaiting_user_execution/workbook_received/accepted/rejected/redo_required之一的明确analysis_execution_status及当前绑定的analysis代码；仅有文件不授权验收。
  primary_prerequisites: 读写和CLI都验证accepted且quality passed的主工作簿、项目内路径、实际与验收哈希、相关数值stale及适用的project_level预处理；图或论文独有stale不使主数值结果失效。
  data_identity: analysis RUN_CONFIG.data_sha256必须继承当前主结果data_hash；analysis代码交付不得覆盖主结果的数据身份。
  invalidation: 按state_transition_contract清除primary/data/semantic失效及其相关依赖后的旧requirement reason；保留的方法列表只是候选计划。分析代码重交或图形改动不单独清除此决定。
  historical_read: 已accepted且passed的同一已验收分析工作簿可只读且不补写新reason；新交付或新验收不能借legacy配置绕过当前前置。
  implementation: scripts/analysis_prerequisites.py
returned_workbook:
  semantic_governance_required: true
  numerical_evidence_checker: scripts/validate_numerical_evidence.py
  logical_receipt_name: RUN_RECEIPT
  receipt_transport: 既有运行配置工作表，不新增第二张回执表或独立YAML/JSON
  receipt_version_field: run_receipt_version
  current_receipt_version: 1.0.0
  current_receipt_version_by_stage: {preprocessing: 1.0.0, primary: 1.1.0, analysis: 1.1.0}
  required_sheet: 运行配置
  required_columns:
  - 项目
  - 值
  required_items:
  - execution_owner
  - execution_profile
  - stage
  - problem_name
  - code_sha256
  - data_sha256
  - solver
  - solver_version
  - tolerance
  - iteration_or_time_limit
  - actual_stop_reason
  - random_seed
  - repetitions_or_scenarios
  - grid_or_time_range
  - fallback_used
  - platform
  - allow_reduced_data
  - allow_coarser_grid
  - allow_shorter_horizon
  - allow_fewer_repetitions
  - allow_relaxed_tolerance
  - allow_silent_solver_fallback
  versioned_receipt:
    protocol_expectation_field_in_run_config: run_receipt_protocol_version
    actual_version_field: run_receipt_version
    current_version: 1.0.0
    current_version_by_stage: {preprocessing: 1.0.0, primary: 1.1.0, analysis: 1.1.0}
    supported_versions: [1.0.0, 1.1.0]
    version_required_fields:
      '1.1.0': [solver_backend, code_bundle_sha256]
    version_stage_required_fields:
      '1.1.0':
        analysis: [primary_workbook_sha256]
    analysis_primary_binding:
      applies_to: {version: 1.1.0, stage: analysis}
      field: primary_workbook_sha256
      format: sha256_hex
      comparison: case_insensitive
      accepted_state_field: subproblems.<question>.validated_artifact_hashes.solution_workbook
      rule: RUN_CONFIG与RUN_RECEIPT均须包含有效摘要，且两者与当前accepted主工作簿身份一致；缺失或不一致不得交付或验收。旧1.0 analysis不新增此必需项。
    new_writer_required: true
    p5a_transitional_missing_version_read_supported: true
    legacy_full_config_missing_version_read_supported: true
    declared_unknown_version_policy: fail_closed
    echo_fields:
    - stage
    - problem_name
    - data_sha256
    - solver
    - random_seed
    - tolerance
    - iteration_or_time_limit
    runtime_only_fact_fields:
    - solver_version
    - actual_stop_reason
    - repetitions_or_scenarios
    - grid_or_time_range
    - fallback_used
    - platform
    - execution_owner
    - execution_profile
    - allow_reduced_data
    - allow_coarser_grid
    - allow_shorter_horizon
    - allow_fewer_repetitions
    - allow_relaxed_tolerance
    - allow_silent_solver_fallback
  stage_required_items:
    primary_v714_writer:
    - primary_quality_protocol_version
  preprocessing_required_sheets_when_project_level:
  - 运行配置
  - 数据审计
  - 预处理参数
  - 预处理方法证据
  - 处理前后对比
  - 绘图数据索引
  - 预处理质量门
  acceptance_rules:
  - 成功验收primary仅关闭data/primary_code/solution_workbook的stale并同步既有data验收哈希；成功验收analysis仅关闭analysis_code/result_analysis_workbook。其它下游失效层保持，不能由局部回执隐式验收全项目。
  - 已登记主工作簿内容哈希改变时，回执写入先按state_transition_contract的solution_workbook_changed事件使旧Gate、分析和适用结果依赖失效，再记录本次主结果验收结论；字节未变不重复失效。
  - 当前Problem Contract、preprocessing_decision、语义闭环与复杂度复审必须先通过semantic_governance gate。
  - execution_owner必须为user。
  - execution_profile必须为full_fidelity。
  - 所有缩减、放宽和静默回退标志必须为false。
  - fallback_used必须为false。
  - 对应代码声明的run_receipt_protocol_version必须与回执run_receipt_version一致；缺失、不匹配或未知版本均fail closed，不能降级为legacy receipt。
  - 新03A/03B writer使用1.1；项目级预处理继续1.0且不接受1.1。1.1必须带solver_backend与code_bundle_sha256，静态核对配置、角色、实际源码集合与交付身份；不得把缺字段的新项目降级为历史Python。
  - 运行配置的项目键必须唯一；重复键不得以后值覆盖前值。旧1.0字段原义保持，不反向要求历史工作簿补1.1字段。
  - P5a过渡RUN_CONFIG或旧FULL_FIDELITY_CONFIG/FULL_RUN_CONFIG未声明receipt协议时，历史工作簿可继续缺少run_receipt_version只读验收；若主动声明run_receipt_version，则必须是当前受支持版本。
  - 版本化RUN_RECEIPT必须静态绑定对应已交付阶段代码，并核对stage、problem_name、data_sha256、solver、random_seed、tolerance、iteration_or_time_limit与代码RUN_CONFIG计划值一致；solver_version、实际停止原因、运行规模、platform、fallback和no-degradation仍以返回回执为事实源。
  - preprocessing工作簿仅允许位于数据预处理/数据预处理结果.xlsx，且仅在decision=project_level时验收。
  - 主/深化工作簿实际路径与标准文件名必须解析出唯一problem_name和stage，再与运行配置完全一致；当前项目只接受问题X求解/中的两个标准工作簿，旧结果数据表/问题X/仅作只读兼容。
  - preprocessing工作簿code_sha256必须与已交付数据预处理.py一致；主工作簿与深化工作簿分别绑定两阶段小问代码入口哈希及适用的bundle身份。
  - data_sha256必须与对应阶段代码交付时锁定的数据哈希完全一致。
  - preprocessing工作簿必须通过预处理质量门，并包含预处理方法证据、处理前后对比、绘图数据索引以及供data_process.m使用的真实底层数据。
  - 新v7.14主求解验收时，receipt必须静态读取项目状态登记的已交付主求解代码，先核对其实际SHA-256与primary_code_sha256，再从该代码唯一RUN_CONFIG（旧项目可只读FULL_FIDELITY_CONFIG/FULL_RUN_CONFIG）读取primary_quality_protocol_version；返回主工作簿必须携带同一协议版本。不得通过省略工作簿协议标记或Verification ID降级为legacy质量门。
  - 主结果工作簿必须通过主结果质量门；当已交付代码绑定v7.14协议、运行配置声明primary_quality_protocol_version或主结果质量门出现Verification ID时，还必须按core/numerical_verification_contract.yaml独立复核适用底层数值证据，不能只相信工作簿自报Boolean。
  - 结果深化分析工作簿仅在Analysis Necessity Gate=required时存在，并必须在主工作簿accepted后验收，包含分析设计和结论稳定性汇总；其参数敏感性、压力场景、替代方法/结构、多seed/多初值、异质性等证据不得被主结果质量门替代或提前吸收。
  - 插值、填补、预测修复、滤波、异常处理等实质操作的验证结论必须与预处理质量门一致；不得只提供摘要数字而缺少可绘图/可复核底层证据。
