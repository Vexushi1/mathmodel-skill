version: 1.3.0
introduced_in_skill_version: 7.4.2
skill_compatibility: '>=7.4.2,<8.0.0'
purpose: 规定跨赛题通用的数据质量审计、预处理必要性判定、项目级统一预处理、论文数学证据、MATLAB预处理图证据与下游读取边界。任何数据题都先判断原始数据能否正确、充分且无信息泄漏地支撑当前模型；只有真实数据问题或模型输入要求提供证据时才修改数据。共享数据、特定题型或某一次赛题经验都不能单独触发清洗、插值、预测填补、滤波或统一工作簿。

decision_gate:
  required_for_any_data_project: true
  decision_values: [not_needed, question_local, project_level]
  level_values: [none, structural, transformative]
  principle: 数据审计默认执行；数据修改按证据执行；方法按数据结构和模型需求选择；项目级统一预处理按必要性启用。
  required_fields:
  - decision
  - level
  - evidence
  - operations
  - forbidden_operations
  - downstream_data_source
  rules:
  - 两个及以上小问共享同一原始数据源，只触发统一口径审计，不自动触发项目级预处理。
  - 原始数据完整、有效、单位和索引一致、采样与覆盖满足模型要求且模型不要求公共变换时，必须判为not_needed，后续允许直接读取原始数据。
  - 仅某一问需要对数、标准化、窗口、滞后、专属派生特征、局部缺失处理或其他模型内变换时，判为question_local，不建立全局数据预处理目录。
  - 多问确实依赖同一单位换算、坐标修正、时间对齐、表关联、重采样、缺失处理、异常处理、预测填补、滤波或其他公共变换时，才判为project_level。
  - 用户明确要求统一数据预处理或统一数据总表时，可判为project_level；若数据无需改变观测值，则level应为structural而不是transformative。

judgment_framework:
  primary_question: 原始数据是否能够在不违反题意、物理语义、统计假设和时间因果的前提下，直接支撑当前模型的输入、估计、求解与验证要求。
  audit_dimensions:
    completeness:
    - 缺失值、空白、NaN、Inf、截断、缺测段和未观测区间
    - 缺失发生在哪些字段、样本、时间段、空间区域或类别，而不是只看总体缺失率
    consistency:
    - 单位、量纲、数据类型、编码、主键、时间格式、时区、坐标系和字段语义是否一致
    - 多表关联键是否唯一且可追溯，是否存在错位连接或同名异义
    validity:
    - 是否存在违反题意、物理边界、逻辑约束或跨字段关系的不可能值
    - 统计极端值与实际错误记录必须区分
    identity_and_duplicates:
    - 区分真正重复记录、重复采样、独立重复试验和同一对象多时刻观测
    - 只有确认重复记录无独立信息时才允许删除
    sampling_and_coverage:
    - 时间或空间采样是否规则，是否存在断档、边界缺测、长间隔、稀疏区域或覆盖不均
    - 当前模型是否真的要求规则网格、固定步长、完整面板或均匀覆盖
    measurement_quality:
    - 噪声、漂移、传感器饱和、量化、坏道、异常尖峰、测量精度和检测下限是否影响模型
    - 先判断这些现象是否属于真实过程，再决定去噪、平滑或修复
    model_readiness:
    - 所选模型对完整矩阵、尺度、正值、平稳性、规则网格、类别编码、特征范围或样本独立性的要求是否满足
    - 能由模型自然处理的问题，不应为了模板一致性额外改变原数据
    temporal_causality_and_leakage:
    - 任何插值、预测填补、标准化、特征构造或数据划分是否使用了在真实预测时不可获得的未来信息
    - 预测、分类或时序任务必须先划分训练验证边界，再拟合会学习数据分布的预处理参数
    target_and_label_integrity:
    - 标签、目标量和评估区间是否完整、错位、重复或被人工修复污染
    - 不能用目标变量本身或未来标签反向填补输入特征
  decision_order:
  - 审计数据事实，记录问题位置、规模、模式和对象语义
  - 判断该问题是否会影响当前小问或多个小问的模型输入、估计、求解或验证
  - 比较保持原数据、模型原生处理、局部处理和项目级处理四类方案
  - 在满足模型要求的方案中选择信息破坏最小、假设最弱、可验证性最强的方法
  - 通过掩蔽验证、留出验证、残差、边界检查、物理约束或处理前后对照验证处理是否合理
  - 再锁定not_needed、question_local或project_level及operations
  general_rules:
  - 有数据问题不等于一定要修复；若问题不影响当前模型或模型可原生处理，可以保持原样并记录原因。
  - 没有数据问题时不得为“完整流程”添加无效清洗步骤。
  - 任何方法都由数据结构、题意机制和模型需求共同决定，不从某一赛题的固定操作模板迁移到其他题目。
  - 数据预处理的目标是得到可信且与题意一致的模型输入，不是让曲线更平滑、指标更好看或结果更接近预期答案。

activation:
  audit_required_when:
  - 题目提供任何数值附件或结构化数据
  project_level_when_any:
  - 多个小问确实依赖同一且有依据的公共数据变换
  - 多数据源必须先统一单位、坐标、时间、主键或采样结构才能保持跨问数据语义一致
  - 多问共同依赖的缺失、断档、异常或测量问题必须采用同一经验证的修复口径
  - 用户明确要求统一数据预处理或统一数据总表
  never_sufficient_alone:
  - 两个及以上小问共享同一原始数据源
  - 检测到统计极端值但没有证据表明其为错误记录
  - 存在缺失值但相关模型可以原生处理且补值会增加无依据假设
  - 存在可选的平滑、插值、滤波、归一化、标准化或预测方法
  - 某一类赛题过去通常采用某种数据处理方法

workflow_position:
  decision_stage: model_design
  decision_after: data_audit_and_model_route_selection
  decision_before: proposed_model_spec_and_model_challenge
  project_level_stage_after: human_model_approval
  before: solve_validate
  rationale: 模型设计先审计数据并比较模型路线/输入需求，再锁定preprocessing_decision；该判定进入当前模型语义并先于proposed_model_spec与Model Challenge。只有decision=project_level且当前模型已通过Human Model Approval后才执行数据预处理模块，否则进入主求解前的数据源分流。

project_directory:
  create_only_when: preprocessing_decision.decision == project_level
  path: 数据预处理/
  exact_default_files:
  - 数据预处理.py
  - 数据预处理结果.xlsx
  - data_process.m
  no_auxiliary_files_by_default: true

missing_data_policy:
  principle: 先识别缺失模式和变量语义，再决定保持缺失、删除、插值、统计填补、模型化填补或预测填补；不存在“有缺失就插值”的默认规则。
  audit_before_method:
  - 缺失比例及其在字段、时间、空间、类别和关键样本中的分布
  - 缺失是孤立点、连续短缺口、长缺口、边界缺失还是整列/整组缺失
  - 变量是连续量、离散量、类别、ID、状态、计数还是物理场
  - 缺失是否可能与目标、时间、空间位置、设备状态或实验条件相关
  - 删除、插值或预测填补是否会改变样本代表性、物理守恒或分布结构
  method_boundaries:
    keep_missing: 模型原生支持缺失且补值缺乏可靠依据时，可以保持缺失并在模型与验证中显式处理。
    deletion: 只有缺失样本可被合理舍弃且不会造成明显选择偏差、破坏关键覆盖或违反题目完整性要求时才允许删除。
    interpolation: 仅适合具有明确局部连续性或平滑机制的连续变量；必须检查缺口长度、边界位置和采样间隔。类别、ID、标签、事件状态及无连续机制的变量不得数值插值。
    statistical_imputation: 均值、中位数、分组统计等只在分布假设和用途允许时使用，并检查方差收缩、相关结构破坏和偏差。
    model_based_imputation: 只有其他变量或历史结构对缺失量具有可验证解释力时使用，模型必须只利用可获得信息并通过人工掩蔽或留出样本评估填补误差。
    predictive_imputation: 预测填补只用于恢复作为后续模型输入而确实需要的缺测量；必须报告验证误差或不确定性，禁止用未来信息或目标标签造成泄漏。
  validation:
  - 对插值或填补方法优先进行人工掩蔽已知值后的恢复误差检验
  - 对时序数据使用符合时间顺序的验证，不得随机打乱后借用未来数据证明填补有效
  - 对空间或网络数据采用符合其邻接/距离结构的留出验证
  - 若多种合理处理方式会显著改变最终结论，应进入敏感性或鲁棒性分析，而不是把其中一种当唯一事实

prediction_boundary:
  principle: 区分“为了修复模型输入而估计缺测值”和“题目要求预测未知结果”。只有前者可能属于预处理，后者属于核心建模与求解。
  preprocessing_prediction_when:
  - 目标是补齐已定义但缺测的历史/现有输入量，使后续多个模型能按统一数据口径运行
  - 填补模型有独立训练或拟合依据，并能在已知样本上验证恢复能力
  - 不使用真实应用时不可获得的未来信息、目标标签或后续小问答案
  not_preprocessing_when:
  - 赛题直接要求预测未来值、未知类别、需求、价格、风险、趋势或其他最终输出
  - 估计量本身就是某一小问的主要答案、状态或决策变量
  - 为优化或仿真生成未来情景、需求场景或概率分布
  - 为提高后续结果而根据目标表现反向挑选补值结果
  rule: 题目要求的预测任务必须留在prediction或其他核心模型路线中；不得以“数据预处理”的名义提前生成答案。

operation_gate:
  applies_to: [缺失值填补, 缺测估计, 预测填补, 样本删除, 去重, 异常值替换或删除, 插值, 平滑, 滤波, 去噪, 去趋势, 去直流, 归一化, 标准化, 对数变换, 重采样, 坏道修复, taper, 坐标修正, 单位换算, 类型或编码修正]
  each_operation_must_answer:
  - 数据是否真实存在该问题或模型是否真实要求该变换
  - 若不处理会怎样影响当前模型或跨问数据语义
  - 为什么选择该方法和参数而不是保持原数据、让模型原生处理或采用更弱处理
  - 该操作是否会删除、平滑、补造或扭曲具有物理、统计、时间或决策意义的信息
  - 该操作能否通过独立数据、人工掩蔽、留出样本、约束检查或处理前后对照进行验证
  rules:
  - 检查结果为零问题时不得保留对应处理代码，例如NaN为0时不得机械插值。
  - 统计异常不等于错误数据；尖峰、跳变、边界、稀有事件和地质突变必须先判断其对象语义。
  - 不可逆处理必须记录处理前后证据、参数依据和失效风险。
  - 任何从数据中学习参数的预处理必须服从训练/验证边界，禁止数据泄漏。
  - 无法验证且对结论敏感的预测填补、强平滑或异常替换不得作为默认唯一口径。

method_selection:
  principle: 优先选择能满足模型要求且引入假设最少的方法，不按“方法高级程度”排序。
  preference_order:
  - 保持原始数据或使用模型原生缺失/不规则输入能力
  - 仅做确定性的结构修正，如单位、坐标、类型、合法编码或明确错位修正
  - 使用有机制依据的简单局部方法
  - 使用经验证的统计或模型化填补
  - 仅在证据充分时使用复杂预测填补、强平滑或学习型修复
  comparison_required_when:
  - 两种以上合理方法可能产生实质不同的数据或结论
  - 插值跨度较长、缺失并非局部孤立、预测填补误差较大或不确定性明显
  - 异常处理阈值缺乏唯一物理依据
  rule: 出现上述情况时，至少比较保持原样与一种处理方案，必要时比较多种方案，并把结论稳定性送入结果深化分析。

paper_evidence_contract:
  activation: preprocessing_decision.decision in [question_local, project_level] and preprocessing_decision.operations is not empty
  principle: 只要实际数据变换参与后续模型，论文不得用“完成清洗/插值/标准化”等一句话带过；必须形成问题证据、数学方法、参数依据、验证证据、处理前后证据和模型影响的闭环。
  depth_by_operation:
    structural:
      examples: [单位换算, 坐标修正, 类型修正, 编码统一, 主键对齐, 确定性时间对齐]
      writing: 给出映射关系或变换公式、单位/索引一致性条件和处理前后核对；确定性操作无需伪造形式证明。
    statistical_transform:
      examples: [标准化, 归一化, 对数变换, Box-Cox, 去趋势]
      writing: 给出变换公式、参数估计口径、适用条件以及分布/尺度/残差变化验证。
    interpolation_imputation:
      examples: [插值, 统计填补, 模型化填补, 预测填补]
      writing: 给出插值或估计公式/目标函数、边界条件或特征集合、参数选择和人工掩蔽/留出恢复误差；预测填补还要报告不确定性或适用边界。
    filtering_resampling:
      examples: [滤波, 平滑, 去噪, 重采样, taper]
      writing: 给出核函数、频率响应、离散映射或重采样关系及参数依据，并验证有效信息未被不可接受地削弱。
    outlier_or_deletion:
      examples: [异常识别, 异常替换, 样本删除, 去重, 坏道修复]
      writing: 给出判定指标/阈值的数学定义和来源，说明对象语义，并比较保留与处理后的关键结果或统计量。
  required_paper_elements:
  - 原始数据问题及规模，不只报告总体比例
  - 选择当前方法而非保持原样或更弱方法的理由
  - 与实际操作对应的数学公式、变换关系、目标函数或算法定义
  - 参数、阈值、窗口、频带、阶数、邻域或模型超参数的来源
  - 合理性验证：理论条件、物理约束、人工掩蔽、留出验证、残差、频谱、分布或处理前后对照中至少一种与方法匹配的证据
  - 处理误差、信息损失、适用范围或潜在偏差
  - 处理后数据如何进入后续模型的变量/公式/代码接口
  - 至少一张真正支撑处理必要性或有效性的预处理图；不得用装饰性图替代证据
  formal_proof_boundary: 只有存在可证明的等价性、守恒性、单调性、误差界或可行性保持命题时才写形式证明；经验型清洗不得编造数学证明，应使用可复验的统计/物理验证。
  question_local_location: 写入对应小问的数据处理或模型输入构造段，并由该问qX_plot.m承接必要图证据。
  project_level_location: 论文设置实质“数据预处理”章节或节，集中写公共方法、公式、验证和data_process图证据，后续各问引用该统一数据口径，不重复全文推导。

preprocessing_figure_contract:
  project_level_script: 数据预处理/data_process.m
  export_stem: data_process
  required_when: preprocessing_decision.decision == project_level
  role: 只读取数据预处理结果.xlsx中Python已持久化的处理前/后、诊断和验证数据，绘制预处理证据图；不得在MATLAB中重新清洗、插值、滤波、重采样或估计参数。
  runtime_forbidden_matlab_functions: [interp1, interp2, interp3, interpn, griddedInterpolant, scatteredInterpolant, fillmissing, rmmissing, standardizeMissing, filloutliers, rmoutliers, isoutlier, smooth, smoothdata, movmean, movmedian, resample, interpft, decimate, downsample, upsample, retime, synchronize, detrend, normalize, rescale, zscore, filter, filtfilt, designfilt, lowpass, highpass, bandpass, bandstop, butter, cheby1, cheby2, ellip, fir1, fir2, fit, fitlm, fitrlinear, fitrgp, fitrensemble, fitrtree, predict, trainNetwork, trainnet]
  runtime_forbidden_matlab_dispatch_functions: [eval, evalin, feval, str2func, builtin]
  runtime_gate_rule: figures及后续正式交付时，sync_project必须对data_process.m剥离行尾/整行注释后的实际代码执行函数调用扫描；命中上述预处理函数、动态调度函数或被禁止函数句柄即拒绝交付，避免通过feval/str2func/@function等方式绕过绘图职责边界。
  minimum_evidence: 至少一张图直接回答“为什么需要处理”或“处理是否合理”；变换较多时按证据职责组织多面板，不为凑图重复画同一结论。
  candidate_figures:
  - 缺失位置/覆盖与填补结果对比
  - 处理前后时序、空间场、轨迹或剖面对比
  - 分布、箱线、QQ、残差或尺度变化对比
  - 频谱/功率谱/频率响应处理前后对比
  - 人工掩蔽或留出样本的真实值—恢复值对比与误差分布
  - 重采样前后网格/采样间隔/覆盖变化
  - 异常判定边界与保留/处理样本对比
  style: 服从modules/04_figure_evidence.md的MATLAB科研绘图总规范；版式动态选择单图/多面板，主比较允许中高饱和高对比色，辅助元素降权，标题简洁，默认不自动导出。
  filename_rule: MATLAB脚本固定为data_process.m；需要导出正式图片时文件基名使用data_process或data_process_<evidence>，不得使用中文文件名。

source_policy:
  raw_data_role: immutable_source
  modes:
    raw:
      when: preprocessing_decision.decision in [not_needed, question_local]
      downstream_raw_read_allowed: true
      rule: 主求解可直接读取题目原始附件；仍必须执行字段、维度、单位、NaN/Inf、主键等非破坏性检查。question_local变换只能服务本问模型，不能伪装成项目级清洗。
    preprocessed:
      when: preprocessing_decision.decision == project_level
      raw_readers_allowed:
      - 数据预处理/数据预处理.py
      covered_raw_sources_field: state.preprocessing.covered_raw_sources
      covered_raw_sources_required: true
      independent_raw_sources_allowed: true
      downstream_raw_read_forbidden: true
      rule: 统一工作簿通过质量门后，state.preprocessing.covered_raw_sources中列出的原始源由统一工作簿替代，依赖该公共口径的主求解、深化分析和数据型MATLAB流程不得再次直接读取这些源；未列入covered_raw_sources的独立辅助附件可按题意继续读取。如需改变覆盖范围或公共口径必须回退本阶段并传播stale。

preprocessing_script:
  filename: 数据预处理.py
  responsibilities:
  - 读取需要统一处理的共享原始数据源，并把实际被统一工作簿替代的路径冻结到state.preprocessing.covered_raw_sources
  - 字段、维度、单位、坐标、时间与空间粒度审计
  - 缺失、无穷、重复、有效性、采样覆盖、测量质量、信息泄漏或题目专属质量检查
  - 仅执行preprocessing_decision中已批准且有依据的公共操作
  - 对插值、填补或预测修复输出独立验证证据和适用边界
  - 保留不可逆处理前后的统计证据，不覆盖原始文件
  - 为data_process.m持久化足够的处理前后底层数据、诊断数据和验证数据，MATLAB不得根据摘要数字反推
  - 输出统一工作簿、运行配置、数据哈希与预处理质量门
  forbidden:
  - 因为数据被多问共享就自动清洗、插值、滤波或标准化
  - 因为存在缺失值就自动选择插值或预测填补
  - 求解任何小问核心模型或提前完成题目要求的预测任务
  - 生成某一小问专属特征或决策结果
  - 为得到更好结果而按小问反向调整清洗或填补参数
  - 覆盖或改写原始数据文件
  - 使用matplotlib或seaborn生成论文图

workbook:
  filename: 数据预处理结果.xlsx
  role: decision=project_level时的全项目统一数值数据入口，同时保存论文公式参数、方法验证和data_process.m绘图所需底层证据
  common_required_sheets:
    运行配置:
      required_columns: [项目, 值]
    数据审计:
      required_columns: [数据源, 检查项, 结论, 处理方式]
    预处理参数:
      required_columns: [步骤, 参数, 取值, 单位, 依据]
    预处理方法证据:
      required_columns: [步骤, 问题证据, 数学方法, 参数依据, 验证方法, 验证结论]
      optional_columns: [公式编号或名称, 误差指标, 误差数值, 适用范围, 风险]
    处理前后对比:
      required_columns: [对象, 指标, 处理前, 处理后]
      optional_columns: [单位, 变化量, 变化率, 说明]
    绘图数据索引:
      required_columns: [图组, 图作用, 源工作表]
      optional_columns: [横轴字段, 处理前字段, 处理后字段, 分组字段, 验证字段, 单位, 论文位置]
    预处理质量门:
      required_columns: [检查项, 是否通过, 证据]
  task_specific_data_sheets:
    rule: 由题目真实数据对象决定，使用中文描述性工作表名并记录行列、单位、主键与处理状态；必须保留data_process.m所需的处理前后或验证底层数据，不得只保存摘要统计，不得把不同物理对象硬拼成超宽表。
  quality_gate:
    must_pass_before_downstream: true
    checks:
    - 所有实际执行的变换均存在必要性证据和参数依据
    - 每个实质变换具有可写入论文的数学定义/公式或确定性映射关系，并明确何时不需要形式证明
    - 输出数据无未说明的NaN或Inf；保留缺失时必须说明模型为何允许及其传播方式
    - 坐标、时间、单位和索引口径唯一
    - 输出行列与预期数据对象一致
    - 原始数据哈希和预处理脚本哈希已记录
    - 未引入小问专属求解结果
    - 未执行preprocessing_decision.operations之外的数据修改
    - 插值、统计填补或预测填补在适用时具有人工掩蔽、留出样本、物理约束或其他独立验证证据
    - 任何学习型预处理均未跨越训练验证或时间因果边界造成信息泄漏
    - 预处理方法证据、处理前后对比和绘图数据索引与实际执行步骤一致
    - data_process.m所需底层证据已保存，MATLAB无需重新计算预处理

question_local:
  allowed_examples: [对数变换, 本问标准化, 滞后变量, 滑动窗口, 本问专属派生特征, 仅服务本问算法的编码, 只影响本问输入且有依据的局部缺失处理]
  rules:
  - 由问题X求解.py在数学层有来源的前提下构造。
  - 不建立数据预处理目录，不要求其他小问复用。
  - 不得包含本应统一的坐标修正、公共单位换算或跨问共享清洗。
  - 若局部填补或预测会学习数据分布，仍必须遵守训练验证边界与信息泄漏检查。
  - 只要局部处理会实质改变模型输入，就必须在该问正文给出方法公式/定义、参数依据和验证，不得以“简单预处理”省略。
  - 需要处理前后图证据时，由该问qX_plot.m读取Python已输出的底层数据绘制，不在MATLAB中重新处理。

semantic_governance:
  preprocessing_decision_is_semantic: true
  change_category: preprocessing
  stale_policy: decision、公共处理操作、参数、源数据或统一工作簿发生变化时，只对实际依赖该公共数据口径的小问及其下游传播stale；not_needed或question_local项目不得因不存在的统一工作簿变化而失效。

downstream_contract:
  solve_scripts: 问题X求解/问题X求解.py
  analysis_scripts: 问题X求解/问题X结果深化分析.py
  matlab_scripts:
    project_level_preprocessing: 数据预处理/data_process.m
    per_question: 问题X求解/qX_plot.m
  source_selection:
    not_needed: 原始数据 + 已验收标准结果工作簿
    question_local: 原始数据 + 本问数学层定义的局部变换 + 已验收标准结果工作簿
    project_level: 数据预处理/数据预处理结果.xlsx + 已验收标准结果工作簿
  rules:
  - 下游必须先读取preprocessing_decision，再决定原始数据或统一工作簿作为事实源。
  - 只有decision=project_level时才禁止下游直接读取共享原始数据。
  - project_level的data_process.m只读取统一预处理工作簿中的处理前后/验证证据；它不是数据事实源也不得重新生成统一数据。
  - 若某小问需要改变公共预处理口径，必须回退本阶段；若只新增本问派生特征，则保持question_local并在本问语义闭环中说明。

seismic_guidance:
  role: 领域专项示例，只说明地震数据如何应用通用判定框架，不得反向成为其他赛题的默认预处理模板。
  principle: 先审计后处理；推荐检查不等于推荐修改。
  audits:
  - 采样间隔、记录长度、NaN/Inf、道数和坐标一致性
  - 振幅均值、趋势、RMS、频谱、相邻道相关和边界效应
  - 速度场范围、梯度、界面突变及其地质语义
  optional_operations:
    去直流: 仅在存在非物理均值偏移且会影响算法时启用
    去趋势: 仅在检测到非物理趋势且会影响算法时启用
    带通滤波: 仅在频谱证据支持有效频带且不会破坏所需幅值解释时启用
    坏道处理: 仅在坏道判定有证据且不是实际地质结构时启用
    taper: 仅在所用算法存在明确边界伪影风险时启用
    插值或重采样: 仅在求解方法要求规则网格而原始采样不满足时启用
  forbidden_defaults:
  - 默认平滑速度场
  - 默认AGC
  - 默认逐道强归一化
  - 默认带通滤波
  - 默认插值坏道
  - 将速度突变或振幅极端值直接视为异常删除
