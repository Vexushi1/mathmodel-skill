version: 1.0.0
skill_version: 7.2.0
purpose: 规定多小问共享原始数据时的项目级统一数据预处理、唯一结果工作簿和下游读取边界，防止各问重复读取原始附件、重复清洗或产生数据口径漂移。

activation:
  required_when_any:
  - 两个及以上小问共享同一原始数据源
  - 多个小问依赖同一清洗、坐标、单位、编码、滤波、重采样或异常处理口径
  - 用户明确要求统一数据预处理或统一数据总表
  optional_when:
  - 单问且预处理完全局部，不会形成跨问数据依赖

workflow_position:
  after: model_design
  before: solve_validate
  rationale: 模型设计先锁定数据语义与允许的预处理操作；正式求解前只执行一次统一预处理并冻结可复用数据口径。

project_directory:
  path: 数据预处理/
  exact_default_files:
  - 数据预处理.py
  - 数据预处理结果.xlsx
  no_auxiliary_files_by_default: true

source_policy:
  raw_data_role: immutable_source
  raw_readers_allowed:
  - 数据预处理/数据预处理.py
  downstream_raw_read_forbidden: true
  rule: 一旦统一预处理工作簿通过质量门，问题一至后续所有主求解、深化分析和MATLAB数据读取都不得再次直接读取原始数据文件；若确需新增原始字段，必须回退数据预处理阶段并使全部依赖小问 stale。

preprocessing_script:
  filename: 数据预处理.py
  responsibilities:
  - 读取全部共享原始数据源
  - 字段、维度、单位、坐标、时间与空间粒度审计
  - 缺失、无穷、重复、异常、坏道或异常记录检查
  - 执行模型设计阶段已锁定且有依据的统一预处理
  - 保留不可逆处理前的统计证据，不覆盖原始文件
  - 输出统一工作簿、运行配置、数据哈希与预处理质量门
  forbidden:
  - 求解任何小问核心模型
  - 生成某一小问专属特征或决策结果
  - 为得到更好结果而按小问反向调整清洗参数
  - 覆盖或改写原始数据文件
  - 使用matplotlib或seaborn生成论文图

workbook:
  filename: 数据预处理结果.xlsx
  role: 全项目唯一的统一数值数据入口
  common_required_sheets:
    运行配置:
      required_columns: [项目, 值]
    数据审计:
      required_columns: [数据源, 检查项, 结论, 处理方式]
    预处理参数:
      required_columns: [步骤, 参数, 取值, 单位, 依据]
    预处理质量门:
      required_columns: [检查项, 是否通过, 证据]
  task_specific_data_sheets:
    rule: 由题目数据结构决定，但必须使用中文描述性工作表名，并在数据审计中记录行列、单位、主键与处理状态。
  quality_gate:
    must_pass_before_downstream: true
    checks:
    - 输出数据无未说明的NaN或Inf
    - 坐标、时间、单位和索引口径唯一
    - 不可逆预处理均有参数与依据
    - 输出行列与预期数据对象一致
    - 原始数据哈希和预处理脚本哈希已记录
    - 未引入小问专属求解结果

semantic_governance:
  preprocessing_is_semantic: true
  change_category: preprocessing
  stale_policy: 数据预处理脚本、参数、源数据或统一工作簿发生变化时，所有依赖该工作簿的小问主结果、深化分析、MATLAB图表和论文结果摘要全部 stale，必须按依赖链重新验收。

downstream_contract:
  primary_input: 数据预处理/数据预处理结果.xlsx
  solve_scripts: 问题X求解/问题X求解.py
  analysis_scripts: 问题X求解/问题X结果深化分析.py
  matlab_scripts: 问题X求解/qX_plot.m
  rules:
  - 下游脚本只读统一预处理工作簿和已验收的本问/前问标准工作簿。
  - 下游不得重新执行项目级去缺失、去异常、单位换算、统一滤波、统一重采样或坐标修正。
  - 小问专属派生特征允许在本问脚本中构造，但其输入必须来自统一预处理工作簿，并在模型论文框架中有数学来源。
  - 若某小问需要改变统一预处理口径，必须先回退本阶段，不允许在小问代码中局部绕过。

naming_examples:
  seismic_project:
    sheets:
    - 参考速度模型
    - 预处理地震记录
    - 数据审计
    - 频谱审计
    - 道质量审计
    - 预处理参数
    - 预处理质量门
