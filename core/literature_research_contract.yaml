$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.local/hsk/literature/evidence-v1
title: Literature Research Evidence — read-only structural contract
version: 1.3.0
introduced_in_skill_version: 10.28.0
x-research:
  scope: explicit_evidence_audit_and_conditional_model_design_intake
  model_design_intake:
    activation: new_or_substantively_revised_model_after_frozen_problem_contract
    independent_structure_assessment_before_search: required
    research_brief_inputs: [question, problem_contract, research_object, objective, constraints, data_availability, unknown_mechanisms, search_terms, recency_window, evidence_purpose]
    actual_search_when_licensed_tools_available_and_evidence_material: required
    default_depth: targeted
    levels: [lightweight, targeted, deep]
    no_fixed_paper_count_or_model_route_quota: true
    fallback_states: [completed, no_suitable_source, unavailable, skipped, failed]
    stop_criterion: key_model_decisions_and_applicability_questions_have_sufficient_evidence_or_explicitly_recorded_gaps
    absence_of_relevant_literature: does_not_prohibit_independent_mathematical_model
    unresolved_critical_external_assumption: expose_as_blocking_model_challenge_risk
    framework_creation: only_after_proposed_model_spec_under_existing_output_contract
    existing_model_lock: unchanged_when_only_citation_metadata_or_retrieval_results_change
    approval_authority: core/model_approval_contract.yaml
    citation_authority: core/writing_reasoning_contract.yaml#citation_evidence
  metadata_provider_adapter:
    script: scripts/literature_search.py
    contract: same_json_report_protocol_1.0.0
    modes: [crossref, openalex]
    network_permission: explicit_allow_network_required
    remote_data_sent: only_user_approved_short_queries_not_problem_contract
    request_hosts: [api.crossref.org, api.openalex.org]
    max_queries: 4
    max_results_per_query: 10
    http_timeout_seconds: [1, 20]
    record_evidence_ceiling: E0_metadata_only
    no_automatic_fulltext_retrieval: true
    no_provider_response_proves_method_validity: true
    never_write_project_state_or_model_approval: true
    cli_output: stdout_or_explicitly_selected_new_file_only
    no_network_or_provider_failure: declared_skipped_unavailable_or_failed
    provider_documents: [https://www.crossref.org/documentation/retrieve-metadata/rest-api/, https://help.openalex.org/api/]
  optional_project_snapshot:
    implementation: scripts/literature_snapshot.py
    output_contract: core/output_contract.yaml#literature_research_snapshot
    protocol_version: 1.0.0
    storage: research_evidence/Qn.snapshot.json
    activation: explicit_preview_then_read_set_confirmed_record
    requires: [current_question, existing_frozen_problem_contract_file, valid_literature_report]
    record_bound_sources: [raw_problem_contract_bytes_sha256, raw_report_bytes_sha256, canonical_embedded_report_sha256]
    preview_and_inspect: no_file_writes
    record: opt_in_new_file_only_never_overwrite
    do_not_interpret_source_hash_as_semantic_verification: true
    currentness: only_raw_bound_local_sources_not_remote_paper_truth
    stale_on: [contract_file_change_or_missing, research_report_change_or_missing, invalid_embedded_report]
    permitted_downstream: current_declared_method_source_navigation_and_citation_candidate_summary
    forbidden_grants: [human_model_approval, model_lock, accepted_workbook, source_authenticity, actual_search_attestation]
    state_schema_changes: forbidden_in_this_phase
    official_submission_default: excluded
    no_alternative_semantic_identity: true
  explicit_audit:
    route: literature_evidence_audit
    validator: scripts/literature_evidence.py
    contract_schema_protocol: 1.0.0
    validation_is_read_only_and_not_external_search: true
  research_workflow: [frozen_problem_contract, independent_structure_assessment, targeted_retrieval, source_verification, method_transfer_review, independent_model_design, existing_model_challenge, explicit_human_approval]
  preferred_search_window: recent_three_to_five_years_with_foundational_papers_when_relevant
  quality_order: [problem_fit, method_applicability, source_integrity, recency]
  search_executes_externally: true
  report_validation_attests_search_executed: false
  report_validation_attests_source_truth: false
  report_validation_attests_model_applicability: false
  report_validation_grants_approval_or_numerical_acceptance: false
  report_bytes_limit: 262144
type: object
additionalProperties: false
required: [protocol_version, scope, search, sources, methods, decision]
properties:
  protocol_version: {const: 1.0.0}
  scope:
    type: object
    additionalProperties: false
    required: [mode, question, problem_contract_status, independent_problem_structure, research_questions]
    properties:
      mode: {enum: [model_design, standalone]}
      question: {type: string, pattern: '^(Q[1-9][0-9]*|general)$'}
      problem_contract_status: {enum: [frozen, not_applicable]}
      problem_contract_anchor: {type: string, minLength: 1, maxLength: 512}
      independent_problem_structure: {type: string, minLength: 8, maxLength: 4096}
      research_questions:
        type: array
        minItems: 1
        maxItems: 12
        items: {type: string, minLength: 4, maxLength: 1024}
  search:
    type: object
    additionalProperties: false
    required: [depth, status, attempts, stop_reason]
    properties:
      depth: {enum: [lightweight, targeted, deep]}
      status: {enum: [completed, no_suitable_source, unavailable, skipped, failed]}
      searched_at: {type: string, minLength: 10, maxLength: 64}
      stop_reason: {type: string, minLength: 4, maxLength: 2048}
      attempts:
        type: array
        maxItems: 30
        items:
          type: object
          additionalProperties: false
          required: [provider, channel, query, status]
          properties:
            provider: {type: string, minLength: 2, maxLength: 128}
            channel: {enum: [web, academic_connector, user_supplied]}
            query: {type: string, minLength: 2, maxLength: 1024}
            status: {enum: [success, failed, unavailable]}
            retrieved_at: {type: string, minLength: 10, maxLength: 64}
            provider_url: {type: string, pattern: '^https://', maxLength: 256}
            result_count: {type: integer, minimum: 0, maximum: 100}
  sources:
    type: array
    maxItems: 50
    items:
      type: object
      additionalProperties: false
      required: [id, title, source_url, origin, access_level, evidence_level]
      properties:
        id: {type: string, pattern: '^L[1-9][0-9]*$'}
        title: {type: string, minLength: 3, maxLength: 1024}
        source_url: {type: string, pattern: '^https?://', maxLength: 2048}
        doi: {type: string, minLength: 4, maxLength: 256}
        origin: {enum: [web, academic_connector, user_supplied]}
        access_level: {enum: [metadata, abstract, method, full]}
        evidence_level: {enum: [E0, E1, E2, E3]}
        method_anchor: {type: string, minLength: 4, maxLength: 1024}
        replication_anchor: {type: string, minLength: 4, maxLength: 1024}
        publication_year: {type: integer, minimum: 1600, maximum: 2100}
        venue: {type: string, minLength: 1, maxLength: 256}
        provider_record_id: {type: string, minLength: 1, maxLength: 256}
        retrieved_at: {type: string, minLength: 10, maxLength: 64}
        is_retracted: {type: boolean}
  methods:
    type: array
    maxItems: 30
    items:
      type: object
      additionalProperties: false
      required: [id, source_id, method_summary, transferability, disposition, applicability_reason]
      properties:
        id: {type: string, pattern: '^M[1-9][0-9]*$'}
        source_id: {type: string, pattern: '^L[1-9][0-9]*$'}
        method_summary: {type: string, minLength: 6, maxLength: 4096}
        transferability: {enum: [applicable, conditional, inapplicable, unverifiable]}
        disposition: {enum: [adopt_as_basis, adapt_to_problem, use_as_comparator, use_for_validation, reference_only, reject, insufficient_evidence]}
        applicability_reason: {type: string, minLength: 6, maxLength: 4096}
        data_limitations: {type: string, maxLength: 2048}
  decision:
    type: object
    additionalProperties: false
    required: [evidence_status, independent_model_reasoning, unresolved_gaps]
    properties:
      evidence_status: {enum: [sufficient, partial, insufficient, not_required]}
      independent_model_reasoning: {type: string, minLength: 8, maxLength: 4096}
      unresolved_gaps:
        type: array
        maxItems: 24
        items: {type: string, minLength: 2, maxLength: 1024}
