version: 1.4.0
status: active_opt_in
introduced_in_skill_version: 10.5.0
propagate_introduced_in_skill_version: 10.6.0
latex_text_gate_introduced_in_skill_version: 10.7.0
figure_identity_binding_introduced_in_skill_version: 10.8.0
figure_source_binding_introduced_in_skill_version: 10.9.0
purpose: Locate and compare declared claim consumption, propagate qualifying stale fragment status, gate only the declared static modular LaTeX text subset, and observe opt-in Figure identities and source/current-bundle facts without asserting semantic truth.
authority:
  policy_shape: core/project_state.schema.yaml#/$defs/claim_consumption_policy
  policy_path: paper_framework.claim_consumption_policy
  claim_record: core/project_state.schema.yaml#/$defs/claim_evidence
  consumption_edges: core/project_state.schema.yaml#/$defs/paper_fragment_entry
  numerical_qualification: core/claim_evidence_contract.yaml
  claim_strength: core/writing_reasoning_contract.yaml#claim_strength_calibration
  stale_governance: core/writing_reasoning_contract.yaml#paper_fragment_stale_governance
  state_transitions: core/state_transition_contract.yaml
activation:
  explicit_route: claim_consumption_audit
  missing_policy: not_assessed
  null_partial_unknown_policy: blocked
  supported_policies:
  - {protocol_version: 1.0.0, mode: observe, stale_writer: none}
  - {protocol_version: 1.1.0, mode: propagate, stale_writer: existing_project_transaction_only}
  - {protocol_version: 1.2.0, mode: enforce_latex_text, stale_writer: existing_project_transaction_only}
  audit_route_read_only_in_all_modes: true
  automatic_existing_gate_insertion: explicit_latex_or_submission_scope_only_for_protocol_1.2.0
  project_writer: existing_project_transaction_for_propagate_or_enforce_latex_text
  persistence: audit_stdout_only_and_claim_stale_status_only
  default_project_files_added: []
relationships:
  actual_consumption: 'paper_fragments[].depends_on contains claim:<id>'
  required_consumptions: obligations_only_not_duplicate_location_or_evidence
  source_location: paper_fragments[].source_file_and_anchor
  state_authority: paper_framework_machine_state
  framework_role: human_readable_projection_must_agree_when_opted_in
  numerical_truth: original_accepted_workbook_qualification_only
stale_propagation:
  activation: explicit_propagate_1.1.0_or_enforce_latex_text_1.2.0
  trigger: current_modify_or_reject_disposition_with_exact_same_question_B1_claim_ID
  seed_edges: 'claim:<id> dependencies of paper_fragments'
  transitive_edges: paper_fragment_ID_dependencies
  merge: union_with_existing_question_and_artifact_stale
  status_change: current_to_stale_only_never_clear_stale
  status_change_scope: claim_driven_only_existing_question_level_rules_remain
  persistence: State_and_Framework_fragment_rows_in_one_existing_project_transaction
  audit_route: report_only_in_all_modes
formal_text_gate:
  activation: explicit_enforce_latex_text_protocol_1.2.0_and_explicit_latex_or_submission_scope
  supported_source: proven_active_static_modular_latex_text
  permitted_fragment_kinds: [abstract_claim, question_result_text]
  read_only_entrypoint: scripts/claim_consumption.py#formal_text_gate
  checked_subset: declared_claim_consumption_in_active_text
  excludes: [figure_content, docx, single_file_latex, rendered_pdf, full_paper_semantic_coverage]
  stale_dependency: inherited_claim_driven_and_legacy_stale_status_must_be_current
  write_behavior: no_independent_State_or_Framework_writer
  passing_sync: preserve_State_and_Framework_bytes_write_only_sync_report_under_project_lock
  changed_candidate_sync: fail_formal_qualification_and_keep_existing_safe_stale_transaction
  activated_policy_non_passed: block_explicit_latex_or_submission_qualification
  source_binding: project_and_skill_read_sets_rechecked_under_existing_project_lock
figure_identity_audit:
  activation: optional_figure_bindings_on_existing_explicit_policy
  eligible_figures: workbook_driven_result_figures_only
  binding_fields: [figure_id, fragment_id, latex_label, image_path]
  read_only_entrypoint: scripts/claim_consumption.py#_figure_identity_checks
  framework_registry: current_model_paper_framework_figure_evidence_table
  state_source: current_fragment_and_actual_and_approved_figure_paths
  latex_source: proven_active_static_modular_figure_label_caption_image_and_body_reference
  image_resolution: from_main_tex_working_directory_without_active_graphicspath
  framework_body_reference_location: exact_active_source_file_colon_physical_line
  source_registry_fields: checked_for_presence_not_qualified
  image_file: declared_and_approved_path_must_exist_and_be_readable_without_recertifying_prior_approval
  read_set: project_and_skill_bytes_rechecked_before_report_return
  result_fields: [identity_status, approval_freshness, source_and_visual_semantics]
  approval_freshness: not_assessed_until_original_figure_bundle_qualification_is_rechecked
  source_and_visual_semantics: not_assessed
  formal_gate: none_in_this_slice
  write_behavior: read_only_no_approval_or_project_state_writer
  excludes: [mechanism_and_global_diagrams, tables, workbook_and_plot_script_content_qualification, image_visual_adequacy, caption_semantic_support, rendered_pdf, docx, single_file_or_dynamic_latex]
figure_source_audit:
  activation: optional_nonempty_source_bindings_on_existing_figure_binding
  source_binding_fields: [source_id, sheet, required_headers]
  source_id: current_linked_claim_B1_source_closure_only
  sheet_and_headers: literal_match_to_current_B1_selector_and_current_accepted_worksheet
  read_only_report: figure_source_checks
  source_statuses: [current, needs_review, not_assessed]
  absent_source_bindings: not_assessed_without_changing_prior_identity_observation
  shared_one_audit_unique_byte_budgets:
    accepted_workbooks_total: 67108864 # reuse core/claim_evidence_contract.yaml#limits.total_workbook_bytes (64 MiB)
    images_total: 268435456 # 256 MiB
    scripts_total: 16777216 # 16 MiB
  shared_one_audit_unique_file_budgets: {accepted_workbooks: 8, images: 512, scripts: 16}
  budget_exceeded: needs_review_never_truncate_to_current
  reuse_within_one_audit: same_project_root_and_path_may_reuse_captured_hash_parsed_workbook_and_scoped_discovery
  final_recheck: all_project_and_skill_read_set_bytes_and_scoped_figure_discovery_still_rechecked
  approved_bundle_freshness: current_only_when_existing_validated_script_and_figure_bundle_hashes_match_current_bytes_and_all_discovered_scoped_figure_paths_are_in_original_approved_figures
  approval_freshness_without_current_bundle: not_assessed_or_needs_review
  source_report_visual_and_caption_semantics: not_assessed
  identity_report_source_and_visual_semantics: not_assessed
  formal_gate: none_in_this_slice
  write_behavior: read_only_no_bundle_resign_or_project_state_writer
  excludes: [plot_script_execution, workbook_recalculation, image_visual_adequacy, caption_semantic_support, rendered_pdf, docx, single_file_or_dynamic_latex]
scope:
  first_slice: provably_active_static_modular_latex
  unsupported_active_graph: not_assessed
  unsupported_active_graph_when_formal: failed
  unsupported_formats: not_assessed
  unregistered_candidates: needs_review_not_complete_semantic_recall
  human_semantic_coverage: not_assessed
  audit_proposed_fragment_stale: report_only_not_written_status
  formal_text_gate: only_explicit_1.2.0_policy_and_explicit_latex_or_submission_scope
limits:
  policy_obligations: 512
  fragment_kinds_per_obligation: 8
  fragment_nodes: 512
  fragment_dependency_edges: 2048
result_semantics:
  statuses: [observed, needs_review, not_assessed, blocked]
  formal_text_gate_statuses: [passed, failed, not_applicable]
  evidence_status: inherit_live_B1_result_per_claim
  semantic_support: not_established
  execution_authorized: false
rules:
- Missing policy leaves existing routes and gates unchanged.
- Protocol 1.0.0 observe adds no claim-driven write; its audit is read-only. Existing question-level sync writes still update stale fragments and their Framework projection.
- Protocol 1.1.0 propagate explicitly opts into claim-driven stale-only writes in existing project transactions.
- Protocol 1.2.0 enforce_latex_text inherits the claim-driven stale-only writer and adds a limited formal gate only for explicit latex or submission scope.
- Unknown, partial, or mismatched protocol-version and mode pairs block opt-in processing.
- The claim_consumption_audit route remains read-only in all modes and cannot be treated as formal delivery approval.
- Only existing claim-prefixed fragment dependencies record actual consumption; the policy records coverage obligations.
- Unknown or duplicated claim IDs, malformed claim references, clear question-scope conflicts and cyclic fragment references block opt-in structural validation.
- An unlocated required fragment is an observed coverage gap, not a successful semantic claim or a schema-shape error.
- Read current B1 source qualification and paper bytes in the same audit; a saved B1 stdout report is not current evidence.
- Keep original accepted workbook and artifact stale decisions; a value match never signs them current again.
- Machine text matches do not prove robustness, optimality, causality, statistical significance or full-paper claim coverage.
- Propagate may mark a transitively dependent current fragment stale, but cannot clear stale status or requalify source evidence.
- Claim-driven stale propagation accepts only a current modify/reject disposition whose target_claim is an exact B1 claim ID in the same question scope; legacy text matches remain audit suggestions only.
- Seed from claim-prefixed dependencies, traverse fragment-ID dependencies, and union the result with existing question and artifact stale decisions.
- Commit fragment status in State and the Framework dependency table through the same existing project transaction.
- The 1.2.0 formal text gate must fail closed on missing coverage, conflicting or unassessed numeric text, unresolved wording or current stale fragments in its declared static LaTeX text subset; it does not certify semantic truth or full-paper coverage.
- Optional Figure bindings identify workbook-driven result figures by the same Figure ID across the current Framework registry, State fragment and actual/approved figure path, and literal active LaTeX label/caption/image/body reference; they do not change the supported policy-version/mode pairs.
- A matched Figure identity is a read-only location and path observation. The audit does not qualify the registered workbook or plot script content, approve visual or caption semantics, extend the formal text gate, or sign a new delivery approval.
- Optional Figure source bindings use only a Figure-linked claim's current B1 source closure, exact sheet and required literal headers; an old Figure binding without source bindings remains source `not_assessed`.
- The Figure audit may observe existing validated script/figure bundle hashes against current bytes and require every discovered path in this scoped Figure bundle to belong to the original approved_figures list. It does not recheck every globally approved path, renew or write prior approval, execute plotting code, judge the image or caption, or add a formal Figure gate.
- Figure source auditing counts unique accepted workbook, image and script bytes once per audit against the shared limits above. Reuse of a captured hash, workbook parser or Figure discovery for the same source cannot waive the final read-set or discovery recheck.
