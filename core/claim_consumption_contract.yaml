version: 1.1.0
status: active_opt_in
introduced_in_skill_version: 10.5.0
propagate_introduced_in_skill_version: 10.6.0
purpose: Locate and compare declared claim consumption; explicitly propagate stale fragment status from qualifying claim dispositions without asserting semantic truth.
authority:
  policy_shape: core/project_state.schema.yaml#/$defs/claim_consumption_policy
  policy_path: paper_framework.claim_consumption_policy
  claim_record: core/project_state.schema.yaml#/$defs/claim_evidence
  consumption_edges: core/project_state.schema.yaml#/$defs/paper_fragment_entry
  numerical_qualification: core/claim_evidence_contract.yaml
  claim_strength: core/writing_reasoning_contract.yaml#claim_strength_calibration
  stale_governance: core/writing_reasoning_contract.yaml#paper_fragment_stale_governance
  state_transitions: core/state_transition_contract.yaml
activation:
  explicit_route: claim_consumption_audit
  missing_policy: not_assessed
  null_partial_unknown_policy: blocked
  supported_policies:
  - {protocol_version: 1.0.0, mode: observe, stale_writer: none}
  - {protocol_version: 1.1.0, mode: propagate, stale_writer: existing_project_transaction_only}
  audit_route_read_only_in_all_modes: true
  automatic_existing_gate_insertion: false
  project_writer: existing_project_transaction_for_propagate_only
  persistence: audit_stdout_only_and_propagate_stale_only
  default_project_files_added: []
relationships:
  actual_consumption: 'paper_fragments[].depends_on contains claim:<id>'
  required_consumptions: obligations_only_not_duplicate_location_or_evidence
  source_location: paper_fragments[].source_file_and_anchor
  state_authority: paper_framework_machine_state
  framework_role: human_readable_projection_must_agree_when_opted_in
  numerical_truth: original_accepted_workbook_qualification_only
stale_propagation:
  activation: explicit_propagate_protocol_1.1.0_only
  trigger: current_modify_or_reject_disposition_with_exact_same_question_B1_claim_ID
  seed_edges: 'claim:<id> dependencies of paper_fragments'
  transitive_edges: paper_fragment_ID_dependencies
  merge: union_with_existing_question_and_artifact_stale
  status_change: current_to_stale_only_never_clear_stale
  status_change_scope: claim_driven_only_existing_question_level_rules_remain
  persistence: State_and_Framework_fragment_rows_in_one_existing_project_transaction
  audit_route: report_only_in_both_modes
scope:
  first_slice: provably_active_static_modular_latex
  unsupported_active_graph: not_assessed
  unsupported_formats: not_assessed
  unregistered_candidates: needs_review_not_complete_semantic_recall
  human_semantic_coverage: not_assessed
  audit_proposed_fragment_stale: report_only_not_written_status
limits:
  policy_obligations: 512
  fragment_kinds_per_obligation: 8
  fragment_nodes: 512
  fragment_dependency_edges: 2048
result_semantics:
  statuses: [observed, needs_review, not_assessed, blocked]
  evidence_status: inherit_live_B1_result_per_claim
  semantic_support: not_established
  execution_authorized: false
rules:
- Missing policy leaves existing routes and gates unchanged.
- Protocol 1.0.0 observe adds no claim-driven write; its audit is read-only. Existing question-level sync writes still update stale fragments and their Framework projection.
- Protocol 1.1.0 propagate explicitly opts into claim-driven stale-only writes in existing project transactions.
- Unknown, partial, or mismatched protocol-version and mode pairs block opt-in processing.
- The claim_consumption_audit route is read-only in both modes and cannot be treated as formal delivery approval.
- Only existing claim-prefixed fragment dependencies record actual consumption; the policy records coverage obligations.
- Unknown or duplicated claim IDs, malformed claim references, clear question-scope conflicts and cyclic fragment references block opt-in structural validation.
- An unlocated required fragment is an observed coverage gap, not a successful semantic claim or a schema-shape error.
- Read current B1 source qualification and paper bytes in the same audit; a saved B1 stdout report is not current evidence.
- Keep original accepted workbook and artifact stale decisions; a value match never signs them current again.
- Machine text matches do not prove robustness, optimality, causality, statistical significance or full-paper claim coverage.
- Propagate may mark a transitively dependent current fragment stale, but cannot clear stale status or requalify source evidence.
- Propagate accepts only a current modify/reject disposition whose target_claim is an exact B1 claim ID in the same question scope; legacy text matches remain audit suggestions only.
- Seed from claim-prefixed dependencies, traverse fragment-ID dependencies, and union the result with existing question and artifact stale decisions.
- Commit fragment status in State and the Framework dependency table through the same existing project transaction.
- A formal delivery gate requires a separate reviewed protocol; this audit does not claim one.
