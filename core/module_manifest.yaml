    - execution_instructions
    - code_delivery_report
    - awaiting_user_execution
    - proposition_plan
    - model_paper_framework
    pre_delivery_gates:
    - semantic_governance
    - code_delivery
    terminal_outputs:
    - preprocessing_decision
    - python_code
    - stage_python_code
    - full_run_config
    - execution_instructions
    - code_delivery_report
    - awaiting_user_execution
    - proposition_plan
    - model_paper_framework
    - semantic_governance_report
    - project_state
  full_workflow:
    modules:
    - problem_audit
    - model_design
    - solve_validate
    conditional_modules:
      data_preprocessing:
        when: preprocessing_decision == project_level
        before: solve_validate
    module_terminal_outputs:
    - preprocessing_decision
    - python_code
    - stage_python_code
    - full_run_config
    - execution_instructions
    - code_delivery_report
    - awaiting_user_execution
    - model_paper_framework
    pre_delivery_gates:
    - semantic_governance
    - code_delivery
    terminal_outputs:
    - preprocessing_decision
    - python_code
    - stage_python_code
    - full_run_config
    - execution_instructions
