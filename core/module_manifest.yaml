version: 7.10.0
workflow_order:
- problem_audit
- model_design
- data_preprocessing
- solve_validate
- result_analysis
- figure_evidence
- writing_latex
- ai_cleanup
- latex_compile_quality
- review_delivery
- writing_docx
conditional_modules:
- data_preprocessing
contracts:
  bootstrap: core/bootstrap.yaml
  taxonomy: core/task_taxonomy.yaml
  output: core/output_contract.yaml
  workbook: core/workbook_schema.yaml
  preprocessing: core/global_preprocessing_contract.yaml
  project_state: core/project_state.schema.yaml
  user_execution: core/user_execution_contract.yaml
  code_quality: core/code_quality_contract.yaml
  writing_reasoning: core/writing_reasoning_contract.yaml
  framework_template: templates/model/model_paper_framework.md
  compile_profiles: core/compile_profiles.yaml
external_artifacts:
- problem_text
- attachments
- competition
- requested_deliverable
- data
- bibliography
- compile_profile
- workbook_schema
- output_contract
- code_quality_contract
- all_requested_artifacts
- existing_project_state
- existing_model_paper_framework
- discovered_artifacts
artifact_catalog:
  requirement_map: 题目要求与交付映射
  subproblem_map: 小问依赖、边界与依赖类型
  problem_contract: 每问题意对象、量、约束、禁止假设、数据角色和依赖的冻结合同
  classification_by_subproblem: 每问objective、structures、顶层capabilities与置信度
  problem_types_by_subproblem: 旧版题型标签兼容派生输出
  data_schema: 字段、单位、粒度、键和数据质量口径
  preprocessing_decision: 数据审计后的条件判定；not_needed/question_local/project_level决定是否创建统一预处理阶段以及下游raw/preprocessed事实源
  risks: 审题、数据、模型和交付风险
  route_comparison: 每问模型路线比较
  selected_models: 每问选定模型
  locked_model_spec: 已锁定变量、假设、公式、目标和约束
  formula_closure: 公式—代码—输出映射
  formula_reasoning_chain: 核心公式Source—Derivation—Destination闭环；记录题意/定义/机制来源、关键推导与后续模型/求解/验证用途，不单独落盘
  semantic_closure: 题面对象与要求—数学层—Python层—输出证据三层闭环
  complexity_sanity_check: 对异常降维、解耦、条件闲置和异常容易求解的复审结论
  proposition_plan: 全文高价值命题规划；0--4为默认正文阅读预算，超过预算时记录必要性说明而非自动否决
  model_paper_framework: 助手可再次读取的当前项目语义记忆与论文骨架；只保存Problem Contract、预处理判定、模型语义、Formula Trace、Algorithm Trace、参数证据、Terminology Registry、Numeric Profile、Title Claim、命题、Citation Evidence、paper-fragment状态、逐问结果摘要和图表映射，通用写作规则由Authority管理，具体数值仍以已验收工作簿为准
  mechanism_contracts: 机理图合同
  validation_plan: 建模阶段识别的风险与候选验证方向
  semantic_governance_report: 聊天或标准输出中的Problem Contract、语义闭环、复杂度复审、语义哈希、跨问和paper-fragment stale校验结果
  preprocessing_code: 仅decision=project_level时生成的数据预处理/数据预处理.py；共享原始数据唯一公共处理入口
  preprocessing_workbook: 仅decision=project_level时生成的数据预处理/数据预处理结果.xlsx；依赖小问的统一数值数据入口，同时保存论文方法验证和MATLAB绘图底层证据
  preprocessing_quality_report: 仅project_level时适用的统一工作簿预处理质量门及聊天/标准输出验收结论
  preprocessing_matlab_script: 仅project_level在figure_evidence阶段生成的数据预处理/data_process.m；只读预处理工作簿绘制处理前后与验证证据
  preprocessing_figures: 由data_process.m形成并人工确认的预处理必要性/有效性证据图；默认不要求自动导出文件
  awaiting_user_preprocessing: decision=project_level且预处理代码已交付后等待用户本地运行的暂停状态
  python_code: 问题X求解/问题X求解.py；只负责主求解，主工作簿accepted后冻结
  result_analysis_code: 问题X求解/问题X结果深化分析.py；主工作簿accepted后独立生成，只负责深化分析并记录support/modify/reject对具体claim的作用
  stage_python_code: 当前代码交付阶段的题目专属Python文件；data_preprocessing仅在project_level时映射统一预处理脚本，solve_validate映射主求解脚本，result_analysis映射深化分析脚本
  full_run_config: 分别嵌入对应阶段Python和工作簸运行配置表的完整精度参数，不单独落盘
  execution_instructions: 聊天内给出的本地运行步骤，不单独落盘
  code_delivery_report: 聊天或标准输出中的静态交付检查结果，不单独落盘
  awaiting_user_execution: 等待用户本地运行并返回工作簿的暂停状态
  user_execution_validation_report: 用户返回工作簿的运行配置、哈希和质量门验收报告
  solution_workbook: 用户返回并验收的主求解结果工作簿
  result_quality_report: 主结果精度、收敛、可行性和基础正确性报告
  solved_results: 已通过主结果质量门的结果
  constraint_checks: 约束、残差、守恒、离散或收敛检查
  result_analysis_plan: 基于主结果风险选择的深化分析计划
  result_analysis_workbook: 用户返回并验收的结果深化分析工作簿
  result_analysis_report: 实际深化分析报告；入文证据需说明target claim及support/modify/reject处置
  validated_results: 通过结果深化分析且可用于写作的结果
  evidence_map: 结论到公式、代码、表和图的证据映射
  matlab_scripts: MATLAB绘图脚本集合；project_level包含data_process.m，每问包含qX_plot.m
  result_figures: 工作簿驱动且包含简洁标题的正式结果图
  refined_mechanism_figures: 精修后的S/A级机理图
  figure_contracts: 预处理图、结果图和机理图合同
  approved_figures: 已确认可入文的图
  docx_draft: DOCX草稿
  latex_migration_notes: DOCX到LaTeX迁移说明
  latex_source_draft: 未清理LaTeX源码
  paper_text: 可执行文本审查的论文内容
  latex_source: 已清理待编译LaTeX源码
  cleaned_paper_text: 已清理论文正文
  unsupported_claims: 缺乏证据的结论清单
  latex_audit_report: 绑定当前LaTeX source bundle与模型论文框架哈希的正式项目审计证明
  compiled_pdf: 最终PDF
  compile_report: 绑定LaTeX审计、编译profile、source bundle、日志与PDF哈希的编译证明
  review_report: 终审问题与评分报告
  submission_package: 已按official或reproducibility规则整理、尚待package provenance gate验证的提交ZIP
  submission_package_validation_report: 提交ZIP的kind、allowlist、manifest及当前项目哈希一致性验证报告
  validated_submission_package: submission_package_validation gate通过后的正式可交付提交包
  project_state: 项目机器状态
  sync_report: 项目同步器生成的发现、Schema校验、分层哈希、stale和证据链报告
  figure_evidence: 由当前数据事实源、预处理/结果工作簿与对应MATLAB脚本形成的逻辑证据，不默认生成独立文件
  accepted_solution_workbook: 通过运行配置、哈希和主结果质量门验收的主工作簿
  accepted_result_analysis_workbook: 通过运行配置和结论稳定性验收的结果深化工作簿
