modules:
  problem_audit:
    path: modules/01_problem_audit.md
    inputs:
    - problem_text
    - attachments
    - competition
    - requested_deliverable
    outputs:
    - requirement_map
    - subproblem_map
    - problem_contract
    - classification_by_subproblem
    - problem_types_by_subproblem
    - data_schema
    - risks
  model_design:
    path: modules/02_model_design.md
    inputs:
    - requirement_map
    - problem_contract
    - data_schema
    - classification_by_subproblem
    outputs:
    - route_comparison
    - selected_models
    - locked_model_spec
    - preprocessing_decision
    - formula_closure
    - formula_reasoning_chain
    - semantic_closure
    - complexity_sanity_check
    - proposition_plan
    - model_paper_framework
    - mechanism_contracts
    - validation_plan
  data_preprocessing:
    path: modules/03_data_preprocessing.md
    conditional: true
    activation: preprocessing_decision == project_level
    inputs:
    - locked_model_spec
    - data_schema
    - preprocessing_decision
    - model_paper_framework
    - data
    - code_quality_contract
    outputs:
    - preprocessing_code
    - preprocessing_workbook
    - preprocessing_quality_report
    - awaiting_user_preprocessing
    - model_paper_framework
  solve_validate:
    path: modules/03_solve_validate.md
    inputs:
    - locked_model_spec
    - preprocessing_decision
    - formula_closure
    - semantic_closure
    - complexity_sanity_check
    - proposition_plan
    - model_paper_framework
    - data_schema
    - data
    - workbook_schema
    - code_quality_contract
    conditional_inputs:
      preprocessing_workbook:
        when: preprocessing_decision == project_level
    outputs:
    - python_code
    - stage_python_code
    - full_run_config
    - execution_instructions
    - code_delivery_report
    - awaiting_user_execution
    - model_paper_framework
  result_analysis:
    path: modules/03_result_analysis.md
    inputs:
    - preprocessing_decision
    - data
    - accepted_solution_workbook
    - result_quality_report
    - validation_plan
    - model_paper_framework
    - workbook_schema
    - code_quality_contract
    conditional_inputs:
      preprocessing_workbook:
        when: preprocessing_decision == project_level
    outputs:
    - result_analysis_plan
    - result_analysis_code
    - stage_python_code
    - full_run_config
    - execution_instructions
    - code_delivery_report
    - awaiting_user_execution
    - model_paper_framework
  figure_evidence:
    path: modules/04_figure_evidence.md
    inputs:
    - preprocessing_decision
    - data
    - solution_workbook
    - result_analysis_workbook
    - workbook_schema
    - model_paper_framework
    - mechanism_contracts
    conditional_inputs:
      preprocessing_workbook:
        when: preprocessing_decision == project_level
    outputs:
    - preprocessing_matlab_script
    - preprocessing_figures
    - matlab_scripts
    - result_figures
    - refined_mechanism_figures
    - figure_contracts
    - approved_figures
    - evidence_map
    - model_paper_framework
  writing_docx:
    path: modules/05_writing/docx.md
    inputs:
    - model_paper_framework
    - proposition_plan
    - locked_model_spec
    - validated_results
    - figure_contracts
    outputs:
    - docx_draft
    - latex_migration_notes
  writing_latex:
    path: modules/05_writing/latex.md
    inputs:
    - model_paper_framework
    - proposition_plan
    - locked_model_spec
    - validated_results
    - approved_figures
    - bibliography
    outputs:
    - latex_source_draft
    - paper_text
  ai_cleanup:
    path: modules/05_writing/ai_cleanup.md
    inputs:
    - latex_source_draft
    - paper_text
    - evidence_map
    outputs:
    - latex_source
    - cleaned_paper_text
    - unsupported_claims
  latex_compile_quality:
    path: modules/05_latex_compile_quality.md
    inputs:
    - latex_source
    - compile_profile
    outputs:
    - latex_audit_report
    - compiled_pdf
    - compile_report
  review_delivery:
    path: modules/06_review_delivery.md
    inputs:
    - all_requested_artifacts
    - proposition_plan
    - model_paper_framework
    - output_contract
    - workbook_schema
    - compile_profile
    - compile_report
    outputs:
    - review_report
    - submission_package
utility_gates:
  semantic_governance:
    path: scripts/validate_semantic_governance.py
    command: python scripts/validate_semantic_governance.py <project_root> --write --strict
    inputs:
    - existing_project_state
    - existing_model_paper_framework
    outputs:
    - semantic_governance_report
    - project_state
    rules:
    - Requires frozen Problem Contract, passed semantic closure, passed complexity sanity and a locked preprocessing_decision for designed-or-later subproblems.
    - Hashes only each question's current model-scope section, not numerical result summaries.
    - Semantic changes require an incremented revision and explicit change categories.
    - Propagates stale recursively through typed cross-question dependencies before accepting a new semantic hash.
    - Propagates paper-fragment stale only through explicit source_questions/depends_on links; unrelated background and independent questions remain current.
    - Changes to preprocessing_decision or actual project-level preprocessing are semantic changes and invalidate only dependent downstream question results.
    - Never runs task-specific Python and never clears numerical stale states.
  code_delivery:
    path: scripts/validate_code_delivery.py
    command: python scripts/validate_code_delivery.py <project_root> --write --strict
    inputs:
    - existing_project_state
    - existing_model_paper_framework
    - stage_python_code
    - code_quality_contract
    outputs:
    - code_delivery_report
    - project_state
    - awaiting_user_execution
  user_execution_receipt:
    path: scripts/validate_user_execution.py
    command: python scripts/validate_user_execution.py <project_root> --write --strict
    inputs:
    - existing_project_state
    - discovered_artifacts
    outputs:
    - user_execution_validation_report
    - project_state
    - solution_workbook
    - accepted_solution_workbook
    - result_quality_report
    - solved_results
    - result_analysis_workbook
    - accepted_result_analysis_workbook
    - validated_results
  project_sync:
    path: scripts/sync_project.py
    command: python scripts/sync_project.py <project_root> --write --strict --delivery-scope <delivery_scope>
    inputs:
    - existing_project_state
    - existing_model_paper_framework
    - discovered_artifacts
    - workbook_schema
    - output_contract
    outputs:
    - project_state
    - sync_report
    delivery_scopes:
    - design
    - code
    - results
    - figures
    - docx
    - latex
    - submission
    stage_requirements_source: core/output_contract.yaml#project_sync.stage_requirements
    rules:
    - Runs after semantic governance for formal design and downstream delivery.
    - Reads exact delivery requirements from core/output_contract.yaml before checking artifacts.
    - Validates project state and the current model-paper framework before artifact discovery.
    - Discovers preprocessing Python/workbook only when preprocessing_decision=project_level, and additionally requires data_process.m from figure_evidence onward.
    - Discovers both stage-specific per-question Python scripts, validates workbook contracts and hashes the evidence chain without inventing model semantics or validation success.
    - Propagates stale from the active data source, preprocessing figure script, primary code, analysis code, workbooks, MATLAB scripts and figure bundles without clearing it.
    - Required before formal model, workbooks, figures, DOCX, LaTeX or submission delivery.
    - Code delivery uses the dedicated non-executing code_delivery gate.
  submission_package_validation:
    path: scripts/validate_submission_package.py
    command: python scripts/validate_submission_package.py <project_root> --strict
    inputs:
    - existing_project_state
    - discovered_artifacts
    - submission_package
    outputs:
    - submission_package_validation_report
    - validated_submission_package
    rules:
    - Requires exactly one submission_manifest.yaml with per-file SHA-256 records.
    - Revalidates archived files against the current project and requires the packaged PDF to match the current compiled_pdf hash.
    - Official packages require current verified competition edition_rules and must match the verified submission_files allowlist exactly.
    - Reproducibility packages keep the broader internal material boundary and must include PDF, Python, result workbook and MATLAB evidence files.
