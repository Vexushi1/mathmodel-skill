    - problem_contract
    - route_comparison
    - selected_models
    - locked_model_spec
    - preprocessing_decision
    - formula_closure
    - formula_reasoning_chain
    - semantic_closure
    - complexity_sanity_check
    - validation_plan
    - model_paper_framework
    pre_delivery_gates:
    - semantic_governance
    - project_sync
    terminal_outputs:
    - requirement_map
    - problem_contract
    - route_comparison
    - selected_models
    - locked_model_spec
    - preprocessing_decision
    - formula_closure
    - formula_reasoning_chain
    - semantic_closure
    - complexity_sanity_check
    - validation_plan
    - model_paper_framework
    - semantic_governance_report
    - project_state
