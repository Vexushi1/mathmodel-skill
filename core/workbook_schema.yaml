version: 6.2.3
purpose: 约束每问两类标准工作簿的工作表名称、最低字段、条件工作表和非空规则，供 Python 输出、MATLAB 读取和终审共同使用。

runtime_enforcement:
  writer: templates/code/hsk_pipeline/result_io.py
  artifact_checker: scripts/hsk_check_artifact.py
  matlab_reader: templates/matlab/hsk_read_result_workbooks.m
  rules:
    - 标准工作簿写入前必须执行本 Schema；不得只检查工作表是否存在。
    - 交付检查必须复用写入器的同一校验函数，不维护第二套字段规则。
    - MATLAB 绘图脚本必须声明所需工作表和字段，并以 VariableNamingRule=preserve 读取中文列名。

global_rules:
  worksheet_name_language: Chinese descriptive names
  worksheet_name_max_length: 31
  empty_worksheet_allowed: false
  missing_analysis_policy: 使用“适用性说明”工作表记录不适用原因、替代检验和证据位置，不得写入空表。
  units_policy: 数值字段涉及物理量、时间、成本、距离、概率或比例时，列名或独立“单位”列必须明确单位。
  key_policy: 明细数据优先提供“记录键”或“样本键”；显式主键必须非空且唯一。多维明细可自行构造复合记录键。
  numeric_policy: 数值字段不得包含正负无穷；允许有依据的缺失值，但必须在数据审计中说明。

capability_contract:
  allowed:
    - has_explicit_constraints
    - requires_feasibility_check
    - requires_equilibrium_residual
    - requires_conservation_residual
    - requires_discretization_check
    - requires_convergence_diagnostic
  required_sheets:
    has_explicit_constraints: [约束违反检查]
    requires_feasibility_check: [约束违反检查]
    requires_equilibrium_residual: [均衡残差]
    requires_conservation_residual: [守恒残差]
    requires_discretization_check: [离散精度]
    requires_convergence_diagnostic: [收敛诊断]
  legacy_problem_type_fallback:
    description: 仅在旧项目没有 capability 标志时兼容使用；新项目不得依赖该回退。
    problem_types: [optimization, scheduling]
    required_sheets: [约束违反检查]

solution_workbook:
  filename: 问题{中文序号}求解结果.xlsx
  common_required_sheets:
    核心指标:
      required_columns: [指标, 数值]
      optional_columns: [单位, 统计口径, 说明]
    数据审计:
      required_columns: [等级, 检查项, 信息, 处理方式]
  common_recommended_sheets:
    推荐方案:
      required_columns: [方案]
      optional_columns: [目标值, 单位, 排名, 选择理由]
    明细结果:
      required_columns: [记录键]
      optional_columns: [时间, 区域, 对象, 方案, 数值, 单位]
    多算法对比:
      required_columns: [算法, 目标值, 可行性]
      optional_columns: [运行时间, 最优间隙, 重复次数, 均值, 标准差, 说明]
    约束违反检查:
      required_columns: [约束编号, 约束含义, 违反量, 容差, 是否满足]
      optional_columns: [左端值, 右端值或界, 最坏样本或时刻]
    均衡残差:
      required_columns: [主体或均衡, 残差, 容差, 是否满足]
      optional_columns: [策略组合, 收益, 说明]
    守恒残差:
      required_columns: [守恒量, 残差, 容差, 是否满足]
      optional_columns: [时刻或区域, 基准量, 相对残差, 说明]
    离散精度:
      required_columns: [离散参数, 取值, 目标指标, 相对变化]
      optional_columns: [计算时间, 是否收敛, 说明]
    收敛诊断:
      required_columns: [迭代或样本数, 指标, 数值, 判定]
      optional_columns: [阈值, 随机种子, 说明]
  task_profiles:
    prediction:
      required_any: [预测明细, 误差指标]
      recommended: [残差诊断, 区间预测, 基准模型对比]
    evaluation:
      required_any: [综合评分, 排序结果]
      recommended: [指标权重, 排名变化]
    statistics_ml:
      required_any: [模型指标, 预测或分类结果]
      recommended: [交叉验证, 校准结果, 解释性结果]
    spatial:
      required_any: [空间诊断, 参数估计]
      recommended: [空间效应分解, 局部结果]
    graph_network:
      required_any: [节点结果, 边结果, 路径或流结果]
      recommended: [连通性检查, 复杂度记录]

sensitivity_robustness_workbook:
  filename: 问题{中文序号}敏感性与鲁棒性结果.xlsx
  required_any_sheets: [参数敏感性, 鲁棒性区间, 扰动明细, 算法稳定性, 适用性说明]
  sheet_schemas:
    参数敏感性:
      required_columns: [参数, 基准值, 扰动值, 目标指标]
      optional_columns: [变化率, 弹性系数, 单位, 场景]
    鲁棒性区间:
      required_columns: [指标, 下界, 上界]
      optional_columns: [置信水平, 分位数口径, 样本数, 单位]
    扰动明细:
      required_columns: [扰动编号, 扰动对象, 扰动值, 结果指标]
      optional_columns: [随机种子, 场景, 是否可行, 约束最大违反量]
    算法稳定性:
      required_columns: [算法, 重复编号, 目标值, 是否可行]
      optional_columns: [随机种子, 运行时间, 最优间隙, 初值]
    适用性说明:
      required_columns: [分析类型, 不适用原因, 替代检验]
      optional_columns: [证据位置, 结论]

matlab_handoff:
  required_mapping_fields: [figure_id, workbook, worksheet, matlab_script]
  rules:
    - MATLAB 读取前必须确认工作表存在且字段满足对应图表需要。
    - 正式图不得从论文摘要数字或人工构造序列反推。
    - 图表合同必须记录源工作簿、工作表和字段。
    - 中文字段读取必须使用 VariableNamingRule=preserve。
