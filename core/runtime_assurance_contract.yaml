version: 2.0.0
introduced_in_skill_version: 10.0.0
skill_compatibility: '>=10.0.0,<11.0.0'
purpose: >-
  Define the machine-readable runtime assurance layer that sits above the legacy
  resolver plan: context hydration, intent provenance, artifact assurance,
  declarative contract dependency closure, and authority fingerprinting. This
  contract does not redefine modeling, workbook, approval, execution, writing,
  numerical-verification, or submission semantics owned by their existing authorities.

authority_boundary:
  owns:
  - runtime_context_precedence
  - intent_resolution_provenance
  - artifact_assurance_semantics
  - runtime_contract_dependency_closure
  - authority_fingerprint
  - runtime_plan_assurance_envelope
  delegates:
    route_order_and_boundaries: core/workflow_router.yaml
    module_artifact_graph: core/module_manifest.yaml
    project_state_schema: core/project_state.schema.yaml
    model_approval: core/model_approval_contract.yaml
    semantic_identity_implementation: scripts/semantic_identity.py
    preprocessing: core/global_preprocessing_contract.yaml
    user_execution: core/user_execution_contract.yaml
    code_quality: core/code_quality_contract.yaml
    workbook: core/workbook_schema.yaml
    numerical_verification: core/numerical_verification_contract.yaml
    writing_reasoning: core/writing_reasoning_contract.yaml
    writing_runtime: core/writing_runtime_contract.yaml
    writing_protocol: modules/05_writing/paper_writing_protocol.md
    cumcm_template: templates/latex/cumcm/hsk/template_manifest.yaml

runtime_context:
  optional_project_root: true
  state_path: state/project_state.yaml
  framework_path: 模型论文框架.md
  precedence:
  - explicit_cli_or_api_arguments
  - current_project_state
  - current_framework_navigation_only
  - deterministic_keyword_inference
  rules:
  - Explicit intent, competition, classification, preprocessing decision, question scope, solver_backend, or artifact declarations remain backward-compatible inputs.
  - New active Skill solve requests explicitly pass solver_backend=auto when neither the user nor current state has selected a backend; auto is not a resolved backend.
  - A current project hydrates exactly one backend from execution.solver_backend, after checking whole-project declarations before filtering question scope. Missing policy never defaults to Python and cannot authorize numerical delivery or receipt acceptance.
  - A concrete explicit request that differs from the current project selection is review_required. Historical stage selections remain diagnostic migration evidence only; they do not hydrate a current backend or promote old accepted results under a new selection.
  - Stateless legacy CLI/API requests may retain their historical Python planning projection only when no current project state is supplied. Such a plan is not a current numerical delivery authorization.
  - Legacy Python terminal outputs retain python_code/stage_python_code projection; MATLAB and unresolved auto plans use neutral primary_code/stage_code without false Python aliases.
  - When project_root is supplied, current project state may hydrate missing competition, preprocessing decision, question classification, and verified artifact availability.
  - Framework memory may guide a human or agent to the relevant section, but the runtime resolver must not promote framework prose into a verified numerical artifact.
  - Project-state hydration must never silently override a conflicting explicit argument; conflicts are reported in assurance.context.conflicts.
  - Hydration, analysis prerequisites, artifact assurance and reading plan use the same validated ProjectStateSnapshot bytes and generation; a changed snapshot requires complete replanning or a fail-closed result.
  - Multi-question classification is hydrated automatically only when the scoped questions agree; otherwise the resolver reports ambiguity and requires explicit classification for routes that need task packs.

  state_read_consistency:
    implementation: scripts/runtime_assurance.py:ProjectStateSnapshot
    identity: original_state_bytes_and_state_generation
    sharing: one_in_memory_byte_snapshot_for_hydration_dependency_checks_and_reading_plan
    checks: [before_hydration, after_hydration, before_reading_plan, after_reading_plan, before_resolver_return]
    observed_change: fail_closed_with_project_state_changed_and_require_complete_replanning
    pending_transaction: recovery_required_without_lock_creation_or_implicit_recovery
    invalid_state: reject_non_utf8_invalid_yaml_nonmapping_state_and_invalid_generation
    standalone_projection: without_the_original_hydration_snapshot_do_not_qualify_a_narrow_project_read
    boundary: optimistic_state_read_consistency_not_atomic_snapshot_of_every_artifact_or_future_execution_authorization

intent_resolution:
  explicit_intent_priority: true
  inference_source: core/workflow_router.yaml:routing.*.infer_keywords
  score_meaning: sum_of_matched_keyword_character_lengths_not_probability
  selection_rule: explicit_intents_else_top_specificity_candidates
  confidence_bands:
    explicit: high
    unique_multi_match: high
    unique_single_match: medium
    tied_top_match: low
  required_diagnostics:
  - mode
  - explicit_intents
  - inferred_candidates
  - selected_intents
  - confidence_band
  - confidence_score
  - ambiguity
  - selection_reason
  rules:
  - Inference is deterministic and explainable; every inferred candidate records matched keywords, matched keyword count, and specificity score.
  - When explicit intents exist, inferred keyword matches remain provenance only and cannot silently add routes.
  - Without explicit intent, only the highest-specificity candidate or tied highest-specificity candidates are selected; lower-scoring matches remain diagnostics only.
  - full_workflow retains dominance when it is among the selected top inferred candidates.
  - Ambiguity means multiple inferred candidates share the selected top specificity score; routes that still lack required classification after hydration fail closed through the existing resolver prerequisite logic.

artifact_assurance:
  legacy_name_only_input: available_artifacts
  legacy_status: declared_unverified
  project_path_boundary: artifact paths hydrated from project state must resolve inside project_root
  semantic_identity_mode_selection:
    principle: structured_identity_preferred_legacy_only_when_absent
    structured_state_when: any semantic_identity_* field is present for the current question
    structured_framework_when: current question contains a complete valid HSK Semantic Identity Block
    legacy_when: both state has no semantic_identity_* fields and framework has no SIB markers
    partial_or_mode_mismatch_fails_closed: true
  verified_state_sources:
    locked_model_spec:
      kind: semantic_file_backed
      common_requires:
      - model_challenge_status == passed
      - human_model_approval_status == approved
      - approved_semantic_revision == semantic_revision
      - current 模型论文框架.md exists
      - current question semantic scope exists in 模型论文框架.md
      structured_requires:
      - semantic_identity_schema_version == current supported SIB schema version
      - current framework SIB parses and validates
      - hash(current canonical SIB) == semantic_identity_hash
      - semantic_identity_hash == validated_semantic_identity_hash
      - validated_semantic_identity_hash == approved_semantic_identity_hash
      legacy_read_only_evidence:
      - no semantic_identity_* state fields exist
      - current framework semantic scope contains no SIB markers
      - approved_semantic_hash == semantic_hash
      - sha256(current framework semantic scope) == semantic_hash
      - status is legacy_review_required, never verified
      - migration to a current validated and explicitly approved SIB is required before new preprocessing or primary-solve code delivery
    preprocessing_workbook:
      kind: file_backed
      requires:
      - preprocessing.status == accepted
      - workbook path resolves inside project_root
      - workbook path exists
      - expected sha256 exists
      - actual sha256 == expected sha256
    accepted_solution_workbook:
      kind: file_backed
      requires:
      - primary_execution_status == accepted
      - result_quality_status == passed
      - no stale data, primary_code, or solution_workbook layer
      - declared primary code and project-level preprocessing remain bound to current accepted file and data identities under the shared analysis prerequisite check
      - protocol 1.1 primary backend, entrypoint and actual source bundle match delivered and validated identities without requiring a prior sync
      - workbook path resolves inside project_root
      - workbook path exists
      - validated or current workbook sha256 exists
      - actual sha256 == expected sha256
    accepted_result_analysis_workbook:
      kind: file_backed
      requires:
      - accepted_solution_workbook is currently verified for the same question
      - analysis_execution_status == accepted
      - result_analysis_status == passed
      - no stale analysis_code or result_analysis_workbook layer
      - protocol 1.1 analysis backend, entrypoint and actual source bundle match delivered and validated identities without requiring a prior sync
      - workbook path resolves inside project_root
      - workbook path exists
      - validated or current workbook sha256 exists
      - actual sha256 == expected sha256
  scope_rules:
  - validated_results requires a current verified primary result plus either current verified analysis or a reasoned not_required decision for every scoped question.
  - With project state loaded, solution_workbook, solved_results, and result_quality_report declarations share accepted_solution_workbook qualification; result_analysis_workbook shares accepted_result_analysis_workbook qualification. A derived validated_results declaration cannot bypass these qualifications.
  - With --question Qn, semantic and workbook evidence is evaluated for that question.
  - Without a question scope, generic locked_model_spec is promoted only when every scoped question passes the structured identity evidence chain; legacy questions remain readable provenance but are not promoted as verified locked_model_spec.
  - Without a question scope, generic accepted_solution_workbook or accepted_result_analysis_workbook is promoted only when every scoped subproblem satisfies the corresponding condition.
  - A known stale, rejected, hash-mismatched, missing, malformed, identity-mode-mismatched, legacy-review-required, or outside-project-root artifact must not be promoted merely because its legacy name appears in available_artifacts.
  - Runtime assurance recomputes current semantic evidence from 模型论文框架.md. Project-state equality alone cannot self-attest locked_model_spec.
  - In structured mode, wording-only prose outside the SIB may change semantic_text_hash without invalidating locked_model_spec when the canonical SIB identity and all approval bindings remain current.
  required_evidence_fields:
  - artifact
  - source
  - scope
  - status
  - reason
  - path
  - expected_sha256
  - actual_sha256
  optional_semantic_evidence_fields:
  - identity_mode
  - identity_schema_version

contract_dependency_closure:
  source: core/runtime_assurance_contract.yaml:contract_dependencies
  principle: >-
    Route declarations choose work; selected modules and utility gates then pull
    the contracts they require. Router-level explicit core contract loads remain
    readable as compatibility hints but are not required for correctness.
  contract_dependencies:
    modules/01_problem_audit.md: [taxonomy]
    modules/02_model_design.md: [taxonomy, preprocessing, model_approval, user_execution, writing_reasoning, numerical_verification]
    modules/03_data_preprocessing.md: [preprocessing, model_approval, user_execution, code_quality]
    modules/03_solve_validate.md: [preprocessing, model_approval, user_execution, code_quality, workbook, numerical_verification]
    modules/03_result_analysis.md: [taxonomy, preprocessing, user_execution, code_quality, workbook]
    modules/04_figure_evidence.md: [workbook]
    modules/05_writing/docx.md: [writing_reasoning, writing_protocol]
    modules/05_writing/latex.md: [writing_runtime, writing_protocol]
    modules/05_writing/ai_cleanup.md: [writing_runtime, writing_protocol]
    modules/05_latex_compile_quality.md: [compile_profiles]
    modules/06_review_delivery.md: [writing_reasoning, output, workbook]
    gate:semantic_governance: [project_state, state_transition]
    gate:model_approval: [project_state, model_approval]
    gate:code_delivery: [code_quality, state_transition]
    gate:user_execution_receipt: [user_execution, workbook, numerical_verification]
    gate:project_sync: [project_state, output, state_transition]
    gate:submission_package_validation: [output]
  rules:
  - Dependency aliases resolve through core/module_manifest.yaml:contracts.
  - Closure only adds missing contracts and never reorders modules.
  - Missing aliases or missing contract paths are blocking runtime configuration errors.

assurance_envelope:
  additive_backward_compatibility: true
  legacy_top_level_plan_preserved: true
  new_top_level_sections: [runtime_plan, assurance, reading_plan]
  runtime_plan_fields:
  - selected_intents
  - delivery_scope
  - pause_state
  - modules
  - pre_delivery_gate_names
  - terminal_outputs
  assurance_fields:
  - schema_version
  - status
  - context
  - intent_resolution
  - artifact_assurance
  - dependency_closure
  - authority_fingerprint
  status_values: [pass, review_required]
  review_required_when:
  - intent ambiguity remains unresolved
  - explicit input conflicts with current project state
  - a legacy artifact declaration conflicts with known stale or invalid current-state evidence
  - current model evidence is legacy_review_required and the selected route requires a locked_model_spec

authority_fingerprint:
  algorithm: sha256
  ordered_sources:
  - core/bootstrap.yaml
  - core/workflow_router.yaml
  - core/module_manifest.yaml
  - config/competition_profiles.yaml
  - core/runtime_assurance_contract.yaml
  - core/user_execution_contract.yaml
  - core/output_contract.yaml
  - core/code_quality_contract.yaml
  - core/writing_reasoning_contract.yaml
  - core/writing_runtime_contract.yaml
  - templates/latex/cumcm/hsk/template_manifest.yaml
  - modules/05_writing/paper_writing_protocol.md
  purpose: Bind one runtime plan to the authority files that produced its routing, writing package, and assurance semantics.

compatibility:
  legacy_resolver_entrypoint: scripts/resolve_workflow.py
  legacy_cli_supported: true
  new_default_entrypoint: scripts/resolve_runtime.py
  old_projects_without_state: supported_via_legacy_arguments
  legacy_semantic_hash_read_supported: true
  legacy_semantic_hash_is_read_only_provenance: true
  structured_identity_is_new_write_and_lock_path: true
  project_state_schema_change_required: project_backend_policy_schema_8_0_0
  workbook_schema_change_required: false
  task_code_interface_change_required: current_numerical_stage_binding_requires_project_backend


reading_plan:
  schema_version: 1.1.0
  selection_authority: core/workflow_router.yaml#reading_policy
  producer: scripts/reading_plan.py
  consumer: assistant follows read_now, conditional triggers and tool_interfaces after resolve_runtime
  role: additive_content_reading_projection_not_execution_authorization
  preserves: [load_order, modules, contracts, templates, packs, pause_state, terminal_outputs, pre_delivery_gates, runtime_plan, assurance]
  fields: [schema_version, profile, status, reasons, read_now, conditional, tool_interfaces, project_backend_navigation, project_sources, machine_dependencies, authority_fingerprint, metrics]
  source_identity: exact_relative_path_and_full_file_sha256_plus_1_based_inclusive_line_ranges
  applicability_context: include_document_preamble_and_ancestor_introductions_for_Markdown_and_parent_mapping_headers_for_YAML
  selector_failure: whole_existing_file_with_explicit_fallback_reason
  missing_source: error_never_empty_rule
  mixed_or_unknown_scope: conservative_full_reading_without_changing_selected_intents
  narrow_evidence_source: existing_file_backed_artifact_assurance_and_current_framework_binding
  rules:
    - The reading_plan schema is versioned independently; building a reading plan preserves the resolved assurance envelope and does not set or downgrade its version or fields.
    - read_now and conditional are consumption instructions, not passed review, authorization, or evidence that text was actually read.
    - project_backend_navigation is non-executable guidance for the sole inspect/select/migrate CLI when a current project selection needs review; it is not a pre_delivery_gate and never supplies migration confirmation.
    - Need for human semantic/visual review remains; byte/path/hash checks cannot decide mathematical correctness or visual quality.
    - The legacy resource plan and complete machine closure remain available to old clients; new clients must not run fewer gates.
    - Approved figure binding only narrows reading when existing registry/files/hash evidence agrees; it never creates or refreshes approval.
    - Only verified source rows may support narrow modes; declared_unverified artifact names never substitute for verified project evidence.
    - Planned file/fragment bytes are distinct from observed reads/tokens; actual_read_tokens remains null without a real trace.
    - Existing CUMCM progressive writing stages and capability preflight remain authoritative; the reading plan delegates instead of inventing a new chapter order.
