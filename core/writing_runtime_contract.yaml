version: 8.7.1
role: >-
  v8 写作阶段的最小运行时映射。它不建立第二套数学写作 Authority，只声明普通论文写作真正需要加载的
  模板、项目事实、证据和 writing_reasoning_contract 中的语义能力，从而避免每次写作预载完整建模、数值与项目治理上下文。

principles:
  - Template 决定论文固定骨架与 LaTeX 渲染结构。
  - paper_writing_protocol 决定普通正文怎样组织数学叙事与结果解释。
  - writing_reasoning_contract 保留完整跨题型 Authority，但普通写作只按需消费声明的语义能力。
  - 模型论文框架只提供当前项目事实和证据位置，不复制通用写作手册。
  - 数值事实必须回到当前有效工作簿或等价证据源；Compact Runtime 不改变事实来源。
  - 内部状态治理词只用于上游状态判断，不作为正文语言输入。

required_runtime_inputs:
  - current_model_paper_framework
  - current_chapter_handoff_map_when_available
  - active_template_manifest
  - relevant_numeric_evidence
  - relevant_figure_map
  - bibliography_when_needed
document_length_profile:
  default: adaptive_coverage_diagnostic
  user_configurable_fields:
    - competition_or_school_page_limit
    - optional_target_range
    - appendix_inclusion_policy
  rules:
    - 页数目标只能用于检查是否遗漏关键技术链，不能按页数反向生成背景、算法百科、重复结果或伪验证。
    - 官方页数限制优先于用户偏好；没有明确限制时不设置跨竞赛统一页数目标。
    - 篇幅调整不得改变模型、参数、数值精度、证据范围或 Claim Strength。

template_override_provenance:
  default: none
  record_in: 模型论文框架.md#当前写作选择
  required_fields:
    - template_id
    - instruction_source
    - override_scope
    - affected_files
    - reason
    - official_compliance_impact
    - status
  status_values: [proposed, approved, rejected]
  rules:
    - 只有用户明确要求的模板偏离才可记录为 proposed；未经用户确认不得应用会改变一级结构或官方格式的 override。
    - override 不得创造或修改模型事实、数值结果、证据、引用支持或数学语义。
    - 与当届官方格式冲突的 override 必须 rejected，除非用户明确说明当前交付不受该官方格式约束。

canonical_template:
  manifest: templates/latex/cumcm/hsk/template_manifest.yaml
  executable_entry: templates/latex/cumcm/hsk/hsk_main.tex
  competition: CUMCM
  single_file_reference_status: adapted_verified

applicability:
  compact_runtime_intents:
    - latex
  compact_runtime_competitions:
    - CUMCM
  fallback_for_other_competitions: core/writing_reasoning_contract.yaml
  rule: >-
    只有具备当前 Template Manifest 的 CUMCM LaTeX 路由移除完整 reasoning 预载；
    DOCX、MCM/ICM、电工杯及其他尚无独立 manifest 的载体继续加载完整 Authority，
    不得错误套用 CUMCM 一级骨架。

writing_module:
  protocol: modules/05_writing/paper_writing_protocol.md
  latex_adapter: modules/05_writing/latex.md
  cleanup: modules/05_writing/ai_cleanup.md
  review: modules/06_review_delivery.md
  compile_quality: modules/05_latex_compile_quality.md
  proposition_proof_pack: packs/artifact/proposition_proof.md
  algorithm_flow_pack: packs/artifact/algorithm_flow.md
  legacy_prose_audit: scripts/audit_paper_prose.py
  v8_surface_audit: scripts/audit_v8_writing_surface.py
  surface_pattern_config: config/prose_audit_patterns.yaml

current_question_evidence_bundle:
  role: project_fact_composition_only
  legacy_token: current_question_model_formula_algorithm_result_and_figure_evidence
  status: current_composition_authority
  includes:
    - current_question_model_facts
    - current_question_formula_trace
    - current_question_core_model_summary_state
    - current_question_proposition_plan
    - current_question_algorithm_trace
    - current_question_numeric_result_evidence
    - current_question_validation_evidence
    - current_question_figure_map
  rules:
    - 本 bundle 只定义逐问写作必须主动检查的项目事实组成，不复制这些事实本身，也不创造新的数学 Authority。
    - "`current_question_proposition_plan` 是由全局 proposition plan、按 `related_question` 过滤的命题项以及当前 framework preflight 记录派生的逐问视图，不是第四套独立状态事实源。"
    - 任一 required 子状态缺失时不得静默按 not_applicable 或 not_needed 处理；先进入逐问能力预检的 needs_adjudication。
    - stale 项目事实不得因为进入写作阶段而自动恢复为 current。

per_question_writing_capability_preflight:
  mode: mandatory_before_each_question_write
  role: >-
    在每一问正文写入前，消费 current_question_evidence_bundle 中的项目状态，明确本问需要激活的写作能力、
    完整 Authority 或条件 Pack。Preflight 只做 capability dispatch，不重新定义数学语义，不自动制造命题、公式或算法。
  project_memory: templates/model/model_paper_framework.md#逐问写作能力预检
  inspect:
    - formula_roles
    - core_model_summary_state
    - proposition_proof_state
    - algorithm_presentation_state
    - model_construction_rationale_state
    - solver_precondition_state
    - result_validation_state
    - figure_evidence_state
  status_values: [current, needs_adjudication, review_required, stale, not_applicable]
  formula_roles:
    known_roles:
      - final_model_relation
      - key_bridge_relation
      - supporting_derivation
    routine_algebra_policy: normally_not_registered_in_core_formula_trace
    missing_role: needs_adjudication
    rule: >-
      Preflight 只消费 Formula Trace 中已经登记的角色；公式角色本身的定义与正文取舍仍由 writing_reasoning_contract / Paper Writing Protocol 负责。
  activation:
    core_model_summary:
      authority: core/writing_reasoning_contract.yaml#adaptive_core_model_summary
      state_source: current_question_core_model_summary_state
      rules:
        required:
          activate:
            - adaptive_core_model_summary
          gate: final_model_relations_must_be_recoverably_closed_before_solver
        inline:
          activate:
            - adaptive_core_model_summary
          gate: final_relation_or_decision_rule_must_close_in_adjacent_model_prose
        not_applicable:
          activate: []
          gate: explicit_not_applicable_adjudication_required
        missing:
          status: needs_adjudication
          prohibition: do_not_silently_default_to_not_applicable
    proposition_proof:
      authority: core/writing_reasoning_contract.yaml#proposition_governance
      pack: packs/artifact/proposition_proof.md
      state_source: derived_current_question_proposition_state
      state_derivation:
        global_plan_source: state/project_state.yaml#paper_framework.proposition_status
        item_source: state/project_state.yaml#paper_framework.propositions filtered by related_question=current_question
        framework_projection_source: current_model_paper_framework#逐问写作能力预检.Proposition / Proof
        output: current_question_proposition_plan
        item_status_values: [candidate, current, stale, removed]
        global_plan_status_values: [not_assessed, planned, current, stale]
        projection_status_values: [not_assessed, candidate, planned, current, stale, removed, missing]
        rules:
          - 缺少全局 plan 字段、命题数组或当前 v0.8 项目的逐问 preflight 记录时，派生为 missing；missing 必须进入 needs_adjudication，不能推成 not_assessed。
          - 先按 related_question 过滤命题项；其他小问的 candidate/current/stale 不得把本问自动激活或标 stale。
          - 当前问存在 stale 命题项，或当前问 framework projection 已明确 stale 时，派生 stale；不得被全局 current/planned 覆盖。
          - 当前问存在 current 命题项时，至少激活 current proof branch；若同时存在 candidate 项，还要追加 semantic proposition necessity review，不能因已有 current 命题吞掉新增 candidate。
          - 全局 plan=planned 且当前问仅有 candidate 命题项时，这些 candidate 作为已纳入当前 plan 的 planned 命题派生为 planned；未进入 planned 全局计划的 candidate 仍只触发必要性审查。
          - 当前问只有 candidate 命题项且未满足 planned 条件时，派生 candidate；candidate 只触发 semantic necessity review，不自动创建正文命题。
          - 当前问没有 candidate/current/stale 命题项时，显式 removed projection 可派生 removed；否则派生 not_assessed，即使其他问题使全局 plan 为 planned/current/stale。
          - framework projection 是缓存的逐问裁决而不是新的 Authority；若其与上述全局 plan + question-scoped items 派生结果冲突，Preflight 状态升级为 review_required 并重新同步，不选择任一方静默覆盖。
          - 用户显式要求证明可以触发证明分支，但不能覆盖 stale/missing/review_required 的项目事实冲突。
      rules:
        planned:
          activate:
            - core/writing_reasoning_contract.yaml
            - packs/artifact/proposition_proof.md
        current:
          activate:
            - core/writing_reasoning_contract.yaml
            - packs/artifact/proposition_proof.md
        candidate:
          activate:
            - core/writing_reasoning_contract.yaml
          action: semantic_proposition_necessity_review
          prohibition: candidate_signal_must_not_auto_create_a_proposition
        stale:
          activate:
            - core/writing_reasoning_contract.yaml
            - packs/artifact/proposition_proof.md
          status: review_required
          prohibition: stale_proposition_must_not_surface_as_current
        removed:
          activate: []
        not_assessed:
          activate: []
          high_signal_review_when_any:
            - equivalence_or_reduction_depends_on_a_property
            - monotonicity_or_uniqueness_changes_search_or_interpretation
            - feasibility_or_boundary_claim_controls_candidate_region
            - error_bound_or_solver_precondition_requires_math_property
          high_signal_action: semantic_proposition_necessity_review_only
          prohibition: high_signal_structure_must_not_auto_create_a_proposition
        missing:
          status: needs_adjudication
          prohibition: do_not_silently_treat_as_no_proposition_need
    algorithm_presentation:
      authority: core/writing_reasoning_contract.yaml#algorithm_presentation
      pack: packs/artifact/algorithm_flow.md
      state_source: current_question_algorithm_trace
      rules:
        not_needed:
          activate: []
        stepwise:
          activate:
            - core/writing_reasoning_contract.yaml
            - packs/artifact/algorithm_flow.md
          gate: current_algorithm_trace_required_before_writing_steps
        pseudocode:
          activate:
            - core/writing_reasoning_contract.yaml
            - packs/artifact/algorithm_flow.md
            - modules/05_writing/latex.md#5-图表命题和算法环境
          gate: current_algorithm_trace_required_before_writing_pseudocode
        missing:
          status: needs_adjudication
          prohibition: do_not_silently_default_to_not_needed
  before_write_gate:
    - current_question_evidence_bundle_has_been_inspected
    - formula_roles_are_adjudicated_or_explicitly_not_applicable
    - core_model_summary_state_is_adjudicated
    - proposition_proof_state_is_adjudicated
    - algorithm_presentation_state_is_adjudicated
    - required_conditional_resources_are_resolved
    - stale_project_facts_are_not_rendered_as_current
  compact_runtime_boundary:
    full_reasoning_authority_eager_preload: false
    proposition_pack_eager_preload: false
    algorithm_pack_eager_preload: false
    rule: 先读逐问状态，再按 activation 读取；不得通过本 Preflight 恢复开篇全量 preload。

template_first_progressive_authoring:
  mode: mandatory
  sequence_authority: this_section
  initial_read_order:
    - core/hsk_core_policy.md
    - core/writing_runtime_contract.yaml
    - templates/latex/cumcm/hsk/template_manifest.yaml
    - templates/latex/cumcm/hsk/hsk_main.tex
  resource_order_semantics: >-
    ordinary_writing_resource_order 只声明本次任务可用资源及稳定解析顺序，不表示可以在开篇一次性预读全部写作、去 AI、编译和终审模块。
    实际读取时机只能服从 stages；完成当前阶段写入与 gate 后，才读取下一阶段资源。
  hard_rules:
    - 每次新论文或结构性重写都先读取 active Template Manifest、main 编排文件和 active slot 列表，只确定固定骨架、条件槽与目标文件；此时不生成正文。
    - 每个正文阶段必须执行 read_now → write_now → gate，不得只凭模板注释、旧聊天记忆或后续章节规则提前生成当前章节。
    - 每写一问前必须先执行本问 capability preflight；缺失状态必须裁决，不能因为用户未提醒“汇总/命题/伪代码”而跳过已有项目状态。
    - 问题章节按问题顺序逐问执行；一问未完成模型—求解—结果—验证的真实闭环前，不预写下一问正文。
    - 摘要虽然位于成品前部，但在逐问结果、评价和结论口径稳定后再写，避免从计划或旧结果虚构摘要。
    - draft_semantic_review 必须早于 ai_cleanup；AI Cleanup 只能修改表达和必要性，不能替代章节完整性、数学语义或证据审查。
    - LaTeX Adapter 只在内容进入模板槽和正式审计/编译时读取，不参与前置章节的内容决策。
    - Cross-File Chapter Handoff 只对最终装配顺序中的 actual active physical files 生效；authoring order 不得替代 assembled order。
    - Chapter Handoff Map 是 writing-only 项目记忆；纯 handoff 修改不得递增模型 semantic revision、使 locked model stale 或触发 Model Approval/primary solve。

  cross_file_chapter_handoff:
    authority: modules/05_writing/paper_writing_protocol.md#5A-Cross-File-Chapter-Handoff
    project_memory: templates/model/model_paper_framework.md#Chapter-Handoff-Map
    role: >-
      解析最终 active physical-file adjacency，按阶段读取和更新项目 handoff 记录，并把 seam gate 接入 draft/final review；
      不在 Runtime 复制 prose 规则，不建立第二套正文 Authority。
    activation:
      requires: modular_latex_with_multiple_active_physical_files
      single_file: not_applicable
      non_cumcm_or_missing_manifest: full_reasoning_fallback
    order:
      authoring_order_source: stages
      assembled_order_source: templates/latex/cumcm/hsk/template_manifest.yaml#paper_skeleton.ordered_slots+activation
      seam_gate_uses: [assembled_predecessor, assembled_successor]
      rules:
        - 只为最终顺序中相邻的 active source files 建立 seam。
        - data 或 model_preparation 未激活时直接连接其前后实际文件，不保留虚假中间 seam。
        - question_sections 按当前实际问题数量展开，保持 Q1 → Q2 → Q3 的物理顺序。
    profiles:
      narrative:
        bridge_default: optional
      registry_or_definition:
        bridge_default: not_needed
      frontmatter_consistency:
        bridge_default: not_needed
      structural_terminal:
        bridge_default: not_needed
      cross_question_increment:
        parent: narrative
        activate_when: actual_dependency_exists
        delegates_to: cross_question_progression
    record:
      fields:
        - seam_id
        - profile
        - source_file
        - target_file
        - source_closure
        - carry_forward
        - open_gap_or_entry_reason
        - consistency_anchors
        - bridge_need
        - status
      bridge_need_values: [required, optional, not_needed]
      status_values: [current, stale, not_applicable]
      anchor_reuse:
        - terminology_registry
        - formula_trace
        - numeric_profile
        - claim_strength
        - paper_fragment_dependency_map
      prohibition: 不复制 source/target 全文，不建立平行正文依赖图，不把内部字段机械打印进论文。
    relevant_authoring_stages:
      - problem_restatement
      - problem_analysis
      - assumptions_symbols_and_preparation
      - question_model_solution_result_validation
      - evaluation_references_conclusion_appendix
      - abstract_title_and_keywords
    timing:
      before_write:
        - read_current_project_facts
        - read_relevant_assembled_predecessor_handoff
        - read_relevant_cross_question_or_shared_dependency
        - point_read_source_tail_and_target_head_only_when_record_is_missing_or_conflicted
      after_write:
        - update_current_incoming_seam_status
        - update_outgoing_handoff_for_assembled_successor
        - update_reused_fragment_or_result_anchors
        - stale_only_real_downstream_dependencies
      stage_gate:
        - required_handoff_record_exists_or_seam_is_not_applicable
        - bridge_need_is_semantically_adjudicated
        - object_symbol_term_dependency_claim_and_duplication_continuity_are_reviewed
      draft_semantic_review: assembled_seam_sweep_in_final_active_order
      final_review: repeat_assembled_seam_sweep_after_cleanup_and_latex_assembly
    abstract_special_case:
      authoring_position: after_current_question_answers_and_evaluation_are_stable
      final_reading_position: first_active_slot
      required_final_seam: frontmatter/abstract.tex -> sections/01_problem_statement.tex
      forbidden_authoring_seam: sections/09_evaluation.tex -> frontmatter/abstract.tex
      required_consistency:
        - current_question_answers
        - terminology_and_numeric_profile
        - title_claim_and_claim_strength
        - validation_boundaries
    semantic_boundary:
      writing_only: true
      included_in_model_semantic_hash: false
      pure_handoff_semantic_revision_bump: false
      invalidates_locked_model_spec: false
      triggers_model_approval: false
      triggers_primary_solve: false
      rule: 上游真实模型、结果或依赖变化仍按既有机制使相关 fragment 与 seam stale；纯措辞变化不得反向污染模型状态。
    compatibility:
      missing_map: initialize_incrementally_on_next_writing_route
      rewrite_existing_body: false
      require_model_redesign_or_resolve: false
      inactive_conditional_slots_in_current_map: forbidden

  stages:
    - id: template_inspection
      read_now:
        - templates/latex/cumcm/hsk/template_manifest.yaml
        - templates/latex/cumcm/hsk/hsk_main.tex
        - current_model_paper_framework#当前写作选择
        - current_model_paper_framework#Chapter-Handoff-Map when available
      run_now:
        - resolve_active_final_assembly_and_actual_seams
      write_now: []
      gate: 固定一级骨架、条件槽、问题数量、目标 section 文件和任何已批准 override 均已确定；不得生成正文。
    - id: problem_restatement
      read_now:
        - modules/05_writing/paper_writing_protocol.md#6.1-问题重述
        - current_problem_contract
        - original_problem_text
      write_now:
        - templates/latex/cumcm/hsk/sections/01_problem_statement.tex
      gate: 不照抄或逐句同义替换原题，同时完整保留对象、条件、量词、单位、边界和所求输出，且不提前写模型、算法或结果。
    - id: problem_analysis
      read_now:
        - modules/05_writing/paper_writing_protocol.md#6.2-问题分析
        - current_problem_contract
        - current_classification_and_cross_question_dependencies
      write_now:
        - templates/latex/cumcm/hsk/sections/02_problem_analysis.tex
      gate: 形成对象/条件 → 困难 → 数学抓手 → 建模转化 → 准备建立的结构 → 跨问关系的连续论证，不得写成散乱清单或软件流水线。
    - id: assumptions_symbols_and_preparation
      read_now:
        - modules/05_writing/paper_writing_protocol.md#6.3-模型假设与符号说明
        - modules/05_writing/paper_writing_protocol.md#6.4-数据说明与必要预处理
        - modules/05_writing/paper_writing_protocol.md#6.5-共享基础与模型准备
        - current_model_paper_framework#预处理判定与共享关系
      write_now:
        - templates/latex/cumcm/hsk/sections/03_assumptions.tex
        - templates/latex/cumcm/hsk/sections/04_symbols.tex
        - templates/latex/cumcm/hsk/sections/05_data.tex when project facts activate it
        - templates/latex/cumcm/hsk/sections/05_model_preparation.tex when project facts activate it
      gate: 假设、符号、数据处理和共享关系均有真实依据；未激活的条件章节保持关闭。
    - id: question_model_solution_result_validation
      repeat_for_each_question_in_template_order: true
      before_write_preflight:
        contract: core/writing_runtime_contract.yaml#per_question_writing_capability_preflight
        read_now:
          - current_question_evidence_bundle
          - current_model_paper_framework#逐问写作能力预检
        dispatch_from_project_state: true
        required_before_write_now: true
        gate: >-
          本问 Formula roles、Core Model Summary、Proposition / Proof、Algorithm presentation 以及所需条件资源均已显式裁决；
          missing/stale 不得静默降级，也不得依赖用户再次提醒能力名称。
      read_now:
        - modules/05_writing/paper_writing_protocol.md#1-写作输入
        - modules/05_writing/paper_writing_protocol.md#3-每问的四个功能槽
        - modules/05_writing/paper_writing_protocol.md#4-Local-Narrative-Chain
        - modules/05_writing/paper_writing_protocol.md#5-Paragraph-Handoff-Test
        - modules/05_writing/paper_writing_protocol.md#7-模型建立
        - modules/05_writing/paper_writing_protocol.md#7.3-作者视角与建模解释
        - modules/05_writing/paper_writing_protocol.md#8-模型求解
        - modules/05_writing/paper_writing_protocol.md#9-求解结果数值与术语
        - modules/05_writing/paper_writing_protocol.md#10-结果与验证的分层
        - modules/05_writing/paper_writing_protocol.md#11-Result-Validation-Bridge
        - modules/05_writing/paper_writing_protocol.md#12-跨问递进
        - modules/05_writing/paper_writing_protocol.md#13-图结果叙事
        - current_question_model_formula_algorithm_result_and_figure_evidence
      write_now:
        - current_question_section_file
      conditional_reads_before_relevant_passage:
        proposition_or_proof:
          when: >-
            当前问 preflight 的 derived proposition_proof state 为 planned/current，或 candidate/stale/missing/review_required 需要语义裁决，
            或用户明确要求创建/修改/审查命题、引理、推论、等价性/可行性/单调性证明或误差界；显式请求不得覆盖 stale/missing 冲突。
          read:
            - core/writing_reasoning_contract.yaml
            - packs/artifact/proposition_proof.md
          required_outcome: 命题具有真实下游作用，前提、结论、证明边界和对后续变量/约束/solver/解释的作用闭合；数值实验不得冒充证明。
        stepwise_or_pseudocode:
          when: >-
            当前问 preflight 已裁决 Algorithm Trace presentation_mode 为 stepwise 或 pseudocode，而不是 not_needed；
            mode 来自项目状态即可触发，不要求用户 prompt 再出现“伪代码/算法流程”。
          read:
            - core/writing_reasoning_contract.yaml
            - packs/artifact/algorithm_flow.md
            - modules/05_writing/latex.md#5-图表命题和算法环境
          required_outcome: 算法块前说明本题需要与输入，块内只写数学对象和控制逻辑，块后说明输出怎样进入结果或下一阶段，并与真实实现及证据一致。
        complex_semantic_dispute:
          when: Model/Solver/Validator、优化语义、跨问依赖、术语数值、Model Construction Rationale、Reduction Provenance、solver precondition、Preflight 缺失状态或 Claim Strength 存在争议。
          read:
            - core/writing_reasoning_contract.yaml
        reasoning_example:
          when: 当前段落需要改写示范，或难以区分有效建模解释与空泛铺垫；只读取相关案例，不作为开篇预读。
          read:
            - modules/05_writing/references/model_solution_reasoning_examples.md
          required_outcome: 理解解释的作用后回到当前项目事实写作，不套用示例中的题目对象、数值、算法或句式。
        model_construction_solution_example:
          when: 当前段落难以说明为什么建立该模型、为什么结构化简成立、solver 前提/适用性、关键数值参数依据，或小节标题拆分/压缩存在争议；只读取相关案例。
          read:
            - modules/05_writing/references/model_construction_solution_rationale_examples.md
          required_outcome: 只提取“gap—结构—适用边界—solver/参数—导航”的功能，不复制示例标题、算法、对象或数值作为当前项目事实。
      gate: 当前问题已通过 capability preflight，并完成模型建立理由/适用边界 → 模型闭合 → solver 前提与适配 → 求解结果 → 真实验证/边界 → 直接回答的局部闭环；简单题可合并标题并省略已明确裁决为不适用的功能，但不得因未读取而删掉必要功能。
    - id: evaluation_references_conclusion_appendix
      read_now:
        - modules/05_writing/paper_writing_protocol.md#15-模型评价逐问结论与附录
        - modules/05_writing/paper_writing_protocol.md#16-引用与正文语言
        - current_citation_evidence_and_final_question_answers
      write_now:
        - templates/latex/cumcm/hsk/sections/09_evaluation.tex
        - templates/latex/cumcm/hsk/references.bib
        - templates/latex/cumcm/hsk/appendices/appendices.tex when needed
      gate: 评价不替代验证，结论不新增主张，外部事实有真实 citation key，正文论证主体未被移入附录。
    - id: abstract_title_and_keywords
      read_now:
        - modules/05_writing/paper_writing_protocol.md#2-模板与写作职责
        - modules/05_writing/paper_writing_protocol.md#14-摘要
        - current_final_question_answers_and_validation_boundaries
      write_now:
        - templates/latex/cumcm/hsk/frontmatter/abstract.tex
        - current_template_metadata_title_and_keywords
      gate: 摘要逐问闭合任务—模型—目标/条件—方法—结果—真实检验—结论，标题和关键词均有正文及结果证据，不虚构敏感性或鲁棒性。
    - id: draft_semantic_review
      read_now:
        - core/writing_reasoning_contract.yaml
        - modules/05_writing/paper_writing_protocol.md#5-Paragraph-Handoff-Test
        - modules/05_writing/paper_writing_protocol.md#7.3-作者视角与建模解释
        - modules/06_review_delivery.md#三-公式模型角色算法命题与数值证据审查
        - modules/05_writing/paper_writing_protocol.md#5A-Cross-File-Chapter-Handoff
        - current_model_paper_framework#Chapter-Handoff-Map
        - modules/06_review_delivery.md#Cross-File-Assembled-Seam-Sweep
        - modules/06_review_delivery.md#五-Title-Claim-正文结构与-Paragraph-Necessity
        - modules/06_review_delivery.md#v7.20-v8.0.1-章节能力保全检查
      run_now:
        - assembled_seam_sweep
        - scripts/audit_v8_writing_surface.py
      write_now:
        - draft_review_findings
      gate: 逐章详细内容、Model Construction Rationale、solver preconditions、标题/小节导航、命题/算法、数值、引用、图叙事和 Result → Validation Bridge 均已审查；blocking/review_required 项先处理。
    - id: ai_cleanup
      read_now:
        - modules/05_writing/ai_cleanup.md
        - modules/05_writing/paper_writing_protocol.md#5-Paragraph-Handoff-Test
        - modules/05_writing/paper_writing_protocol.md#7.3-作者视角与建模解释
        - resolved_draft_review_findings
      write_now:
        - cleaned_paper_text
      gate: 只清除模板感、空话、机械重复和证据越界，不删除章节必要建模理由/适用边界、推导、约束、solver 前提、命题、伪代码、结果或验证内容，也不按标题数量/字数机械合并或拆分。
    - id: latex_assembly_audit_and_compile
      read_now:
        - modules/05_writing/latex.md
        - modules/05_latex_compile_quality.md
        - packs/artifact/latex.md
      run_now:
        - scripts/validate_template_manifest.py
        - scripts/audit_latex_project.py
        - scripts/render_paper.py
      write_now:
        - latex_source
        - latex_audit_report
        - compiled_pdf
        - compile_report
      gate: 模板、引用、公式/图表/命题/算法环境、编译日志和 PDF 全部通过正式门禁。
    - id: final_review_and_delivery
      read_now:
        - core/writing_reasoning_contract.yaml
        - modules/06_review_delivery.md
        - templates/review/final_review_matrix.yaml
        - current_latex_audit_and_compile_reports
      write_now:
        - review_report
      gate: 最终终审完成八类动态 coverage、原子 finding、规则核验与证据扫描后，才允许交付或进入 submission package；review matrix 不进入 official package。

semantic_capabilities:
  chapter_content_from_protocol:
    - title_and_keywords_evidence_alignment
    - abstract_per_question_information_closure
    - problem_restatement_without_prompt_copying
    - coherent_problem_analysis
    - assumption_rationale_and_failure_impact
    - symbol_cross_artifact_consistency
    - data_preprocessing_and_shared_foundation_boundary
    - model_construction_rationale_and_local_applicability
    - model_establishment_detail_preservation
    - solver_precondition_and_detail_preservation
    - adaptive_subsection_separation_and_title_minimality
    - numeric_and_terminology_consistency
    - citation_use_boundary
    - figure_role_specific_interpretation
    - model_evaluation_evidence_boundary
    - direct_answer_conclusion_boundary
    - appendix_body_boundary
  ordinary_writing:
    - formula_reasoning_chain
    - adaptive_core_model_summary
    - model_solver_validator_roles
    - model_naming
    - optimization_model_expression
    - model_construction_rationale
    - solver_justification
    - cross_question_progression
    - detail_allocation_governance
    - figure_result_narrative
    - numerical_parameter_evidence
    - paragraph_necessity
    - claim_strength_calibration
    - numeric_style_contract
    - terminology_governance
  local_narrative:
    - local_narrative_chain
    - paragraph_handoff_test
    - cross_file_chapter_handoff
    - result_validation_governance
  load_full_reasoning_authority_when_any:
    - proposition_or_proof_is_being_created_or_revised
    - algorithm_trace_semantics_are_being_created_or_revised
    - question_preflight_requires_semantic_adjudication
    - model_construction_rationale_or_applicability_is_in_dispute
    - reduction_provenance_is_in_dispute
    - solver_precondition_or_fit_is_in_dispute
    - model_solver_validator_role_is_ambiguous
    - optimization_semantics_are_in_dispute
    - cross_question_dependency_is_in_dispute
    - terminology_or_numeric_profile_semantics_are_in_dispute
    - citation_evidence_scope_is_in_dispute
    - title_claim_or_claim_strength_requires_semantic_adjudication
    - final_review_requires_full_authority

ordinary_writing_resource_order:
  - core/hsk_core_policy.md
  - core/writing_runtime_contract.yaml
  - templates/latex/cumcm/hsk/template_manifest.yaml
  - templates/latex/cumcm/hsk/hsk_main.tex
  - modules/05_writing/paper_writing_protocol.md
  - modules/05_writing/latex.md

runtime_vocabulary_firewall:
  purpose: 避免项目治理语言直接进入正文生成上下文。
  do_not_surface_as_paper_vocabulary:
    - 主工作簿
    - 已验收工作簿
    - 主结果质量门
    - 质量门
    - 深化分析
    - 03A
    - 03B
    - support
    - modify
    - reject
    - accepted
    - stale
    - semantic revision
    - semantic hash
    - full_fidelity
    - Evidence ID
    - 主求解脚本冻结
  rule: >-
    若这些状态背后存在真实数学动作，正文写真实动作，例如参数敏感性、边界扰动、多初值一致性、残差分析、
    Bootstrap 区间或替代算法比较；若只是内部项目状态，则不进入论文。

excluded_from_ordinary_writing_preload:
  - core/numerical_verification_contract.yaml
  - core/model_approval_contract.yaml
  - core/user_execution_contract.yaml
  - core/code_quality_contract.yaml
  - full_model_approval_history
  - full_stale_propagation_history
  - raw_support_modify_reject_tracking

full_authority_fallback:
  authority: core/writing_reasoning_contract.yaml
  rule: >-
    Compact Runtime 只是加载策略，不覆盖或削弱完整 Authority；需要复杂语义裁决时按 semantic_capabilities 中的触发条件补读完整 Authority。

machine_boundary:
  may_check:
    - required_runtime_file_exists
    - ordinary_writing_resource_order_contains_template_manifest
    - template_inspection_is_first_and_writes_no_body
    - chapter_read_write_gate_order_is_explicit
    - per_question_preflight_exists_before_question_write
    - project_state_to_conditional_resource_mapping_is_declared
    - missing_preflight_state_is_not_silently_defaulted
    - proposition_and_pseudocode_branches_are_reachable
    - draft_review_precedes_ai_cleanup
    - ai_cleanup_precedes_latex_compile
    - ordinary_writing_route_avoids_unneeded_full_reasoning_preload
    - workflow_vocabulary_leak
    - decorative_quote_density
    - concept_chain_density
    - result_validation_bridge_risk
    - template_override_provenance_completeness
    - active_final_assembly_adjacency_matches_manifest_activation
    - required_handoff_record_presence
    - inactive_conditional_slot_absent_from_current_handoff_map
    - stale_anchor_current_status_conflict
  must_not_claim:
    - mathematical_correctness_from_compact_context
    - evidence_sufficiency_from_file_presence
    - prose_quality_from_runtime_size
    - prose_quality_from_surface_token_count_only
    - semantic_continuity_from_transition_words
    - bridge_necessity_from_connector_frequency
    - mathematical_dependency_from_physical_adjacency_only
    - model_rationale_quality_from_conditional_example_presence
    - heading_quality_from_title_length_or_count
    - proposition_necessity_from_high_signal_keyword_or_structure_alone
    - formula_role_correctness_from_machine_label_alone
