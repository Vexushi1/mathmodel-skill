version: 1.2.0
skill_version: 7.2.0
purpose: 约束项目级统一数据预处理、题目专属Python主求解与结果深化分析代码的规模、可读性、反过度工程和静态工程质量；不替代Problem Contract、模型语义正确性、预处理质量门与数值结果质量门。
scope:
- 数据预处理/数据预处理.py
- 问题X求解/问题X求解.py
- 问题X求解/问题X结果深化分析.py
line_count:
  metric: nonblank_physical_lines
  target_max: 500
  warning_max: 700
  hard_max: 700
  exemption_max: 900
  exemption_field: code_quality_exemption
  exemption_required_fields: [enabled, reason]
  exemption_reason_min_chars: 20
  policy: 501--700行给出warning；超过700行默认failed；只有复杂题显式说明无法进一步精简的原因时才允许到900行；超过900行始终failed。
function_size:
  target_max: 80
  warning_max: 120
  hard_max: 120
parameter_count:
  target_max: 8
  warning_max: 12
  hard_max: 12
complexity:
  warning_max: 15
  hard_max: 25
print_calls:
  warning_count: 1
  hard_count: 5
forbidden_import_roots: [matplotlib, seaborn]
hard_antipatterns:
  wildcard_import: true
  bare_except: true
  breakpoint_call: true
  pdb_set_trace: true
  duplicate_top_level_definitions: true
warning_antipatterns:
  unused_import: true
  any_print_call: true
principles:
- 成熟科学计算库优先，不手写无必要的低质量替代实现。
- 代码工程质量门必须位于semantic_governance gate之后；代码不能静默引入数学层没有定义的核心变量、目标项、约束、阈值或预处理语义。
- 统一数据预处理脚本是共享原始数据唯一直接读取者，只保留路径与字段检查、数据审计、统一预处理、预处理质量门、统一工作簿输出和主入口，不求解任何小问核心模型。
- 启用统一数据预处理后，主求解和结果深化分析脚本不得直接读取共享原始数据源，不得重复项目级去缺失、异常处理、单位换算、统一滤波、统一重采样或坐标修正。
- 主求解脚本只保留统一工作簿读取与字段检查、模型求解、约束/残差或题型质量检查、主结果整理、主工作簿输出和主入口。
- 结果深化分析脚本只保留统一工作簿和已验收主结果读取、题目专属深化分析、稳定性判定、深化工作簿输出和主入口；不得复制主求解主链。
- 删除无用import、调试print、重复逻辑、死代码、伪抽象和未来脚手架。
- Python不承担论文结果图绘制；正式结果图由MATLAB读取统一预处理工作簿与标准结果工作簿完成。
- 代码长度是工程质量门，不得为了压行数删除随机种子、目标函数、约束、质量检查、结果输出或复现信息。
