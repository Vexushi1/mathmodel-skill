version: 6.2.2

default_load:
  - core/hsk_core_policy.md
  - core/workflow_router.yaml
  - core/module_manifest.yaml

classifier_contract:
  output:
    primary: one task label
    secondary: zero to two task labels
    confidence: mapping from task label to score in [0, 1]
  allowed_labels: [mechanism, optimization, prediction, evaluation, statistics_ml, simulation, spatial, graph_network, scheduling, game_decision]
  load_policy:
    - Load the primary task pack.
    - Load a secondary task pack only when it changes variables, constraints, validation or deliverables.
    - Do not load more than three task packs for one request without an explicit reason.

execution_contract:
  workflow_order: [problem_audit, model_design, solve_validate, figure_evidence, writing_docx, writing_latex, ai_cleanup, review_delivery]
  rules:
    - Stop after the last module required by the user deliverable; do not manufacture later artifacts.
    - A downstream module may run only when its gate inputs exist or the response explicitly records the missing prerequisite.
    - Full solution ends after solve_validate unless figures or writing are explicitly requested.
    - Full workflow includes all modules in workflow order and ends with review_delivery.
    - Reuse locked project state and existing artifacts before recomputing.

routing:
  new_problem_design:
    triggers: [新赛题, 建模方案, 建模思路, 全流程思路]
    load:
      - modules/01_problem_audit.md
      - packs/competition/auto.md
      - packs/task/classifier.md
    then:
      - modules/02_model_design.md
      - packs/task/{classified_label}.md

  full_solution:
    triggers: [完整求解, 全部计算, 求出各问, 完成求解]
    load:
      - modules/01_problem_audit.md
      - packs/competition/auto.md
      - packs/task/classifier.md
    then:
      - modules/02_model_design.md
      - packs/task/{classified_label}.md
      - modules/03_solve_validate.md
      - packs/artifact/code.md

  full_workflow:
    triggers: [全流程, 完整论文, 全套成果, 完整交付]
    load:
      - modules/01_problem_audit.md
      - packs/competition/auto.md
      - packs/task/classifier.md
    then:
      - modules/02_model_design.md
      - packs/task/{classified_label}.md
      - modules/03_solve_validate.md
      - packs/artifact/code.md
      - modules/04_figure_evidence.md
      - packs/artifact/figure.md
      - templates/figure/chart_selection.md
      - modules/05_writing/docx.md
      - packs/artifact/docx.md
      - modules/05_writing/latex.md
      - modules/05_latex_compile_quality.md
      - modules/05_writing/ai_cleanup.md
      - packs/artifact/latex.md
      - modules/06_review_delivery.md
      - packs/artifact/full_submission.md

  problem_analysis:
    triggers: [审题, 问题理解, 题目拆解, 命题意图]
    load: [modules/01_problem_audit.md]

  model_selection:
    triggers: [模型比较, 建模路线, 变量, 假设, 公式, 目标函数, 约束]
    load:
      - modules/02_model_design.md
      - packs/task/classifier.md
      - packs/task/{classified_label}.md

  advanced_method:
    triggers: [高级模型, W-DRO, CVaR, MPEC, Stackelberg, ALNS, GNN, 空间杜宾, DML, 强化学习, 深度学习]
    load:
      - modules/02_model_design.md
      - packs/task/advanced_method_gate.md
      - packs/task/classifier.md
      - packs/task/{classified_label}.md

  code_and_solution:
    triggers: [代码, Python, MATLAB, 求解, 算法, 最优解]
    load:
      - modules/03_solve_validate.md
      - packs/artifact/code.md
      - packs/task/classifier.md
      - packs/task/{classified_label}.md

  validation:
    triggers: [检验, 多算法, 全局最优, 敏感性, 鲁棒性, 误差, 稳健性]
    load:
      - modules/03_solve_validate.md
      - packs/task/classifier.md
      - packs/task/{classified_label}.md

  figures:
    triggers: [图表, 可视化, 机理图, 推导图, Nature, SCI]
    load:
      - modules/04_figure_evidence.md
      - packs/artifact/figure.md
      - templates/figure/chart_selection.md

  docx:
    triggers: [DOCX, Word, 草稿论文]
    load: [modules/05_writing/docx.md, packs/artifact/docx.md]

  latex:
    triggers: [LaTeX, PDF终稿, cumcmthesis, 终稿论文]
    load:
      - modules/05_writing/latex.md
      - modules/05_latex_compile_quality.md
      - modules/05_writing/ai_cleanup.md
      - packs/artifact/latex.md
      - packs/competition/auto.md

  full_submission:
    triggers: [复现包, 提交压缩包, 提交包]
    load:
      - modules/06_review_delivery.md
      - packs/artifact/full_submission.md
      - packs/competition/auto.md

  review:
    triggers: [评分, 审稿, 终审, 检查, 提交包检查]
    load:
      - modules/06_review_delivery.md
      - packs/artifact/review.md
      - packs/competition/auto.md

multi_intent_policy:
  - Merge module lists in workflow order and remove duplicates.
  - When a request includes solving and writing, solve and validate before generating final prose.
  - When a request includes figures and LaTeX, verify workbook sources before inserting figures.
  - Full submission includes review_delivery after all requested artifact modules.

rules:
  - Do not load legacy by default.
  - Reuse locked project state and artifacts before recomputing.
  - Replace {classified_label} only with classifier labels selected under classifier_contract.
  - Load advanced_method_gate only for explicit advanced-method requests or when route B is proposed as the main model.
  - DOCX and LaTeX modules are both loaded only for explicit migration or full_workflow.
  - Result figures precede final mechanism-figure refinement.
