version: 7.13.0
bootstrap: core/bootstrap.yaml

# 默认只加载全局硬规则。其余核心合同按 route 显式加载，避免绘图/写作等阶段
# 无差别读取 taxonomy、用户执行合同和预处理合同。
default_load:
- core/hsk_core_policy.md

load_policy:
  principle: minimal_route_specific
  resolver_internal_only: [core/module_manifest.yaml]
  rules:
  - Do not expose resolver-internal manifests in load_order unless the user task directly needs their content.
  - Load task_taxonomy only for classification/modeling/code-analysis routes that actually use objective/structure packs.
  - Load global_preprocessing_contract only when the route decides, executes or inherits preprocessing semantics.
  - Load model_approval_contract for model-design routes that can propose/lock a model and for task-code routes that must verify current Human Model Approval.
  - Load user_execution_contract and code_quality_contract only for code-generation or returned-workbook execution boundaries.
  - Load writing_reasoning_contract only for model-design/proposition/algorithm-presentation/writing/review routes that create, revise or formally inspect mathematical reasoning; do not make it a global preload for figures, workbook validation or unrelated utilities.
  - Writing and final-review routes that create or inspect prose load modules/05_writing/latex.md as the expression authority; figure and workbook routes do not preload it.
  - Writing and figure routes inherit current project semantics from 模型论文框架.md and their stage authority; do not preload unrelated code/preprocessing contracts.

project_memory_contract:
  artifact: model_paper_framework
  project_file: 模型论文框架.md
  activation: proposed_model_spec exists or locked_model_spec exists and current framework is available
  purpose: assistant-readable current project semantic memory for context recovery across stages and chats
  read_before_modules: [data_preprocessing, solve_validate, result_analysis, figure_evidence, writing_docx, writing_latex, review_delivery]
  targeted_read_sections: [当前有效口径, relevant_subproblem, required_dependencies, Model Challenge, Human Model Approval, relevant_result_summary, Algorithm Trace, Terminology Registry, Numeric Profile, 待办与缺口]
  full_read_when: [cross_chat_handoff, long_context_recovery, full_paper_writing, cross_question_synthesis, final_review]
  numeric_fact_source: accepted_standard_workbooks
  machine_state_source: state/project_state.yaml
  rules:
  - Prefer the current framework over reconstructing current model semantics from chat memory.
  - Use targeted section reads for ordinary single-question continuation; do not preload the whole framework without need.
  - Use the full current framework for full-paper writing, cross-question synthesis, handoff and final review.
  - Verify concrete numerical claims against accepted workbooks; framework result summaries and Numeric Profile are navigation/display-policy layers, not replacements for the numerical source of truth.
  - If the framework is stale or conflicts with project state/workbooks, repair the upstream semantic/result state before downstream use.
  - Synchronize affected framework sections after semantic changes and after accepted primary results, result analysis or figure evidence.
  - Treat paper_framework.sync_status as framework synchronization state; explicit paper-fragment stale is tracked locally and must be repaired before affected formal claims are delivered.

classification_contract:
  axes: [objective, structures, capabilities]
  capability_source: subproblem.capabilities
  deprecated_capability_alias: classification.capabilities
  objective_required_for_modeling_routes: true
  structures_max_items: 3
  legacy_task_labels_supported: true
  task_pack_budget: 3

execution_contract:
  workflow_order: [problem_audit, model_design, data_preprocessing, solve_validate, result_analysis, figure_evidence, writing_latex, ai_cleanup, latex_compile_quality, review_delivery, writing_docx]
  conditional_modules: [data_preprocessing]
  formal_delivery_gates: [semantic_governance, project_sync]
  task_code_execution_allowed: false
  rules:
  - Stop after the last module required by the user deliverable.
  - Never manufacture downstream artifacts when gate inputs are missing.
  - Problem Contract, semantic closure and complexity sanity must pass before Model Challenge; project-level preprocessing or primary solve code additionally requires challenge passed plus explicit Human Model Approval bound to the current semantic revision/hash.
  - Every data project audits the current attachments and freezes preprocessing_decision in model_design before code generation.
  - Preprocessing judgment must use the current data's completeness, consistency, validity, sampling/coverage, measurement quality, model-readiness and leakage risks; no competition type or previous dataset supplies a default cleaning recipe.
  - Shared raw data alone never makes data_preprocessing mandatory.
  - If preprocessing_decision=not_needed, skip data_preprocessing and let downstream code use raw data with non-destructive checks.
  - If preprocessing_decision=question_local, skip data_preprocessing and keep mathematically defined local transformations inside the relevant question script; substantive local transforms still require paper formula/validation evidence and may use qX_plot.m for before/after evidence.
  - If preprocessing_decision=project_level, pause before solve_validate, complete data_preprocessing, accept the unified workbook, then forbid dependent downstream code from rereading the corresponding shared raw sources.
  - Project-level preprocessing must persist paper method/validation/before-after plotting evidence in the unified workbook; figure_evidence then creates 数据预处理/data_process.m, which may only read that workbook and may not redo preprocessing.
  - Generate full-fidelity task code and stop at the applicable user-execution boundary; never execute task-specific preprocessing, solve or analysis code.
  - Primary user-produced workbook must be accepted before final result-analysis code is generated.
  - Accepted primary workbooks freeze the primary solve script; result-analysis code is a separate stage-specific Python file.
  - Accepted result-analysis workbooks precede figures and writing.
  - Result analysis may send the workflow back to model_design, conditionally to data_preprocessing, or to solve_validate when the locked result is not stable enough; paper-facing analysis evidence records support/modify/reject against a target claim.
  - Semantic or preprocessing-decision changes must propagate stale through typed cross-question dependencies before downstream work continues; paper fragments propagate only through explicit local dependencies.
  - Merge multiple intents in workflow order and remove duplicate modules, packs and outputs.
  - Reuse current project state, framework and artifacts before recomputing; when a current 模型论文框架.md exists, apply project_memory_contract and read the relevant sections before downstream work.
  - A gate output is available only after the gate executes successfully.
  - Compile only the LaTeX source produced after AI cleanup; formal compile attestation must bind the current project audit, compile profile, source bundle and PDF.
  - Submission scope additionally validates the packaged ZIP against its manifest, the current compiled PDF and verified competition rules when official mode is used.

runtime_segments:
  model_approval_pending:
    role: model_approval
    satisfied_when:
      any: [locked_model_spec, accepted_solution_workbook]
      all_groups:
      - [solution_workbook, result_quality_report]
      - [solved_results, result_quality_report]
    stop_before_module: data_preprocessing
    required_load: [core/model_approval_contract.yaml, core/writing_reasoning_contract.yaml, modules/01_problem_audit.md, modules/02_model_design.md]
    terminal_outputs: [route_comparison, selected_models, proposed_model_spec, model_challenge, model_approval_brief, awaiting_model_approval, preprocessing_decision, formula_closure, formula_reasoning_chain, semantic_closure, complexity_sanity_check, validation_plan, model_paper_framework]
    delivery_scope: design
    pre_delivery_gates: [semantic_governance]
    formal_delivery: false
    pause_state: awaiting_model_approval

  preprocessing:
    role: preprocessing
    canonical_route: data_preprocessing
    stage_module: data_preprocessing
    stop_before_module: solve_validate
    satisfied_when:
      any: [accepted_preprocessing_workbook, preprocessing_workbook]

  primary_execution:
    role: primary_execution
    canonical_route: code_and_solution
    stage_module: solve_validate
    stop_before_module: result_analysis
    satisfied_when:
      any: [accepted_solution_workbook]
      all_groups:
      - [solution_workbook, result_quality_report]
      - [solved_results, result_quality_report]

  analysis_execution:
    role: analysis_execution
    canonical_route: result_analysis
    pre_delivery_gates: [semantic_governance, code_delivery]
    stage_module: result_analysis
    reset_from_module: solve_validate
    satisfied_when:
      any: [accepted_result_analysis_workbook]
      all_groups:
      - [result_analysis_workbook, validated_results]

  full_workflow_resume:
    role: full_workflow_resume
    final_load: [modules/04_figure_evidence.md, packs/artifact/figure.md, templates/figure/chart_selection.md, templates/figure/figure_enhancement_patterns.md, modules/05_writing/latex.md, packs/artifact/latex.md, modules/05_writing/ai_cleanup.md, modules/05_latex_compile_quality.md, modules/06_review_delivery.md, packs/artifact/review.md, packs/artifact/full_submission.md]
    terminal_outputs: [approved_figures, latex_source, latex_audit_report, compiled_pdf, compile_report, review_report, submission_package, model_paper_framework]
    delivery_scope: submission
    pre_delivery_gates: [semantic_governance, project_sync, submission_package_validation]
    formal_delivery: true

routing:
  new_problem_design:
    boundary_roles: [model_approval]
    triggers: [新赛题, 建模方案, 建模思路, 全流程思路]
    infer_keywords: [新赛题, 建模方案, 建模思路, 审题并建模]
    load: [core/task_taxonomy.yaml, core/global_preprocessing_contract.yaml, core/model_approval_contract.yaml, core/writing_reasoning_contract.yaml, modules/01_problem_audit.md, packs/task/classifier.md]
    then: [modules/02_model_design.md]
    load_classified_task_packs: true
    load_competition_pack: true
    terminal_outputs: [requirement_map, problem_contract, route_comparison, selected_models, locked_model_spec, preprocessing_decision, formula_closure, semantic_closure, formula_reasoning_chain, complexity_sanity_check, validation_plan, model_paper_framework]
    formal_delivery: true
    delivery_scope: design

  framework_sync:
    triggers: [模型论文框架, 框架同步, 结果摘要, 模型变更同步, 参数变更同步, 约束变更同步]
    infer_keywords: [模型论文框架, 框架同步, 更新框架, 同步结果摘要]
    load: [core/writing_reasoning_contract.yaml, modules/02_model_design.md, templates/model/model_paper_framework.md]
    terminal_outputs: [model_paper_framework, preprocessing_decision, semantic_closure, formula_reasoning_chain, complexity_sanity_check]
    formal_delivery: true
    delivery_scope: design

  project_sync:
    triggers: [项目同步, 同步项目, stale, 哈希检查, 产物一致性]
    infer_keywords: [项目同步, 同步项目, stale, 哈希, 产物一致性]
    load: [scripts/sync_project.py]
    terminal_outputs: [sync_report, project_state]
    formal_delivery: false

  proposition_proof:
