schema_version: 1.3.0
role: >-
  跨数学建模竞赛的正文推理与证据治理权威。约束核心公式的来源—推导—去向、共享基础模型、
  跨问递进、结构化简、Algorithm Trace 与算法流程呈现、数值参数证据、命题预算、引用证据、
  术语一致性、数字与单位展示、标题主张、深化证据处置和正文必要性；不规定具体题型、固定算法、
  固定章节名或载体排版细节。

scope:
  competitions: all
  task_families:
    - mechanism_geometry
    - statistics_regression
    - prediction_time_series
    - optimization_operations_research
    - network_graph
    - simulation_dynamic_system
    - machine_learning
    - spatial_econometrics
    - mixed_multi_question
  anti_template_boundary:
    - 不从单一优秀论文复制固定句式、算法名、章节编号或题目专属模型。
    - 不要求所有论文设置“模型准备”、问题关系图、命题、核心模型汇总独立小节、正式算法框或统一敏感性章节。
    - 规则只抽象可跨题型复用的推理结构，具体章节和证据按当前赛题决定。

rule_governance:
  authority_principle: >-
    同一规则只在其权威文件定义一次。consumer、artifact pack、checklist 与 review 模块只引用、执行或检查，
    不复制为第二套正文规范。
  levels:
    hard:
      meaning: 违反后会造成答案、数学语义、事实来源、可复现性或正式交付错误。
      action: blocking
      examples:
        - accepted_workbook_number_mismatch
        - stale_result_used_as_current
        - missing_core_requirement
        - unsupported_global_optimality_claim
        - numerical_experiment_used_as_mathematical_proof
        - unresolved_citation_key
        - unresolved_cross_reference
        - unbuildable_formal_latex
    default:
      meaning: 高质量数学建模论文的默认组织方式；题型、比赛模板、真实数学结构或用户明确要求可形成例外。
      action: review_required_unless_justified
      examples:
        - cumcm_problem_restatement_background_plus_statement
        - multi_question_analysis_by_question
        - no_standalone_conclusion_by_default
        - local_result_evidence_loop
        - adaptive_core_model_summary
        - adaptive_algorithm_presentation
        - title_claim_closure
        - abstract_without_figures_tables_or_display_math
    recommendation:
      meaning: 经验性质量建议，不应作为否决条件。
      action: warning_only
      examples:
        - compact_problem_background
        - short_proof_length_budget
        - proposition_default_budget
        - terminology_drift_check
        - caption_length_check
        - paragraph_necessity_check
  machine_mapping:
    hard: blocking
    default: review_required
    recommendation: warning
  exception_rule: >-
    Default 或 Recommendation 的偏离必须能够由当前赛题、模板、题型、证据或用户明确要求解释；
    不能仅为版式整齐或套用旧模板而偏离。

formula_reasoning_chain:
  required_for: core_formula_or_relation
  chain: [source, derivation, destination]
  source_allowed:
    - prompt_condition
    - definition
    - physical_or_geometric_mechanism
    - statistical_or_probability_principle
    - data_generation_mechanism
    - decision_logic_or_resource_constraint
    - state_transition
    - prior_formula_or_proposition
    - verified_standard_theorem
    - inherited_shared_model
  source_rule: 核心公式必须能指出题意、定义、机制、数据或已验证理论依据，禁止“根据相关理论可得”后直接悬空给式。
  derivation_rule: >-
    推导深度按题型自适应。需要说明从前一对象/条件到当前关系的关键理由；
    纯代数展开可压缩，不能为了形式强迫所有题写长演算。
  destination_allowed:
    - define_state_or_parameter
    - feed_next_formula
    - build_objective
    - build_constraint
    - derive_decision_rule
    - reduce_feasible_region_or_dimension
    - construct_algorithm_evaluation
    - determine_numerical_parameter
    - generate_result_or_validation_evidence
    - support_figure_table_or_answer
  destination_rule: 核心公式必须说明后续用途；若既不改变模型也不支撑求解、验证或结论，应删除、压缩或移附录。
  chain_quality_rules:
    - 连续公式应形成逻辑链而非公式集合。
    - “进一步可得、同理可得”只能连接确有直接数学关系的步骤，不能代替对象机制说明。
    - 公式前解释为什么需要，公式后解释得到什么以及下一步如何使用。
    - 核心模型汇总只呈现最终可计算模型，不重复完整推导。
  internal_trace:
    required_fields: [formula_id, question, source, derivation, destination, status]
    optional_fields: [depends_on, code_anchor, workbook_evidence]
    status_values: [closed, gap, stale]
    rule: >-
      内部 trace 只验证来源、依赖、去向和锚点是否存在，不用正则或关键词判断数学正确性；
      正文不得机械显示内部合同列名。

adaptive_core_model_summary:
  governance_level: default
  modes: [required, inline, not_applicable]
  required_when_any:
    - multiple_decision_or_state_variables
    - multiple_core_equations_or_constraints
    - optimization_or_complex_dynamic_system
    - long_derivation_before_numerical_solver
  inline_when:
    - one_or_two_final_analytic_relations_are_sufficient
    - final_decision_rule_can_close_the_derivation_without_a_separate_subsection
  not_applicable_when:
    - direct_readout_or_simple_calculation_without_new_model_structure
    - later_question_fully_inherits_prior_model_and_adds_no_new_core_relation
  rule: >-
    目标是让评委快速恢复求解器实际消费的最终模型；不得为了章节整齐强制所有小问设置同名小节。

shared_foundation:
  default: adaptive
  activate_when_any:
    - two_or_more_questions_share_core_state_equations
    - two_or_more_questions_share_geometry_probability_network_or_transition_structure
    - repeated_definition_would_make_question_one_bloated_and_later_questions_redundant
  allowed_contents:
    - shared_objects_and_coordinate_or_index_system
    - shared_definitions_and_notation
    - shared_mechanism_or_state_equations
    - shared_probability_or_network_structure
    - shared_decision_rule_or_evaluation_metric
  forbidden_contents:
    - question_specific_optimum_or_result
    - question_specific_algorithm
    - question_specific_decision_variable_unless_truly_shared
    - later_question_specific_constraint_or_parameter
  naming: dynamic
  example_names: [模型准备, 基础模型建立, 共同机理模型, 统一概率模型, 共享状态方程, 网络基础结构]
  rule: 章节是否独立以及名称均由当前题目决定；共享内容只定义一次，后问只写增量。

cross_question_progression:
  activate_when: actual_dependency_exists
  paragraph_information_order:
    - inherited_structure
    - new_object_condition_or_requirement
    - changed_modeling_difficulty
    - model_and_solver_increment
  rule: 后问不得把前问共享模型从头复制；若小问彼此独立，也不得虚构继承关系。
  optional_relation_figure:
    activate_when:
      - at_least_three_questions
      - dependency_is_substantial
      - prose_only_dependency_map_is_inefficient
    allowed_content: [inherited_object_or_model, new_condition, model_increment, downstream_input]
    forbidden_content: generic_input_model_solve_plot_flowchart

structure_before_algorithm:
  principle: 高维、非线性或组合问题先检查可利用的数学结构，再决定是否需要高级优化算法。
  check_order:
    - exact_or_approximate_analytic_relation
    - monotonicity_convexity_symmetry_or_invariance
    - variable_elimination_or_dimension_reduction
    - candidate_region_or_bound
    - decomposition_or_hierarchical_structure
    - combination_then_continuous_optimization
    - prior_question_information_for_search_restriction
    - final_solver_selection
  writing_order: problem_structure -> simplification_or_decomposition -> effective_search_space -> algorithm
  prohibition: 不以“变量多/问题复杂”为唯一理由直接调用GA、PSO、DE、ALNS、深度学习或其他高级方法。

algorithm_presentation:
  governance_level: default
  modes: [not_needed, stepwise, pseudocode]
  principle: >-
    算法流程用于恢复当前模型的真实计算逻辑，并连接数学结构、公式/命题、程序实现和结果证据；
    不用于介绍通用算法百科，也不把 Python 源码压缩成论文伪代码。
  closure_chain:
    - model_structure
    - algorithm_trace
    - paper_algorithm_presentation
    - python_implementation
    - workbook_result_or_validation
  mode_selection:
    not_needed_when:
      - direct_calculation_or_closed_form_solution
      - one_shot_standard_solver_call_with_no_problem_specific_control_flow
      - adjacent_formula_and_short_prose_already_restore_execution_logic
    stepwise_when:
      - multiple_mathematical_stages_exist_but_control_flow_is_not_the_main_information
      - global_then_local_or_estimate_then_refine_pipeline
      - calibration_inversion_postprocess_or_hierarchical_solution_pipeline
    pseudocode_when_any:
      - problem_specific_loop_or_branch_is_material
      - candidate_generation_screening_or_repair_is_material
      - graph_search_dynamic_programming_monte_carlo_or_event_iteration_requires_control_flow
      - custom_accept_reject_neighborhood_or_termination_logic_changes_the_solution
      - proposition_or_constraint_changes_the_candidate_set_or_branch_logic
  admission_rule: >-
    只有当算法块能比相邻正文更清楚地恢复真实求解链时才单列；不得为了每问结构整齐机械设置“算法1”。
  internal_trace:
    required_fields:
      - algorithm_id
      - question
      - role
      - inputs
      - core_operations
      - termination
      - outputs
      - presentation_mode
      - status
    optional_fields:
      - state_or_decision_variables
      - branch_or_iteration
      - formula_anchors
      - proposition_anchors
      - constraint_anchors
      - code_anchors
      - workbook_evidence
    status_values: [current, stale, not_applicable]
    rule: >-
      Trace 只记录当前真实求解结构与锚点，不把通用算法定义写入项目记忆；机器不得仅凭步骤文字判断算法数学正确性。
  paper_rules:
    - stepwise 每一步必须承担真实数学动作并说明向下一步传递的对象；纯“初始化/计算/输出”模板步骤应合并或删除。
    - pseudocode 优先使用数学对象、集合、状态、判定量和约束，不写 range(len(...))、DataFrame、文件路径、日志、异常捕获等实现细节。
    - 输入、输出、参数、终止条件必须与当前模型和真实程序一致。
    - 若命题或公式实质改变搜索域、候选集、更新规则、分支或停止条件，应在 Algorithm Trace 中建立对应锚点。
    - 完整 Python/MATLAB 代码仍放附录或附件，伪代码不是源码缩写。
  semantic_change_rule: >-
    状态定义、搜索域、更新规则、分支判据、修复策略、停止条件或模型—算法连接发生实质变化时属于 algorithm 语义变化；
    仅字号、缩进、换行、行号等版式修改不触发数值 stale。
  machine_audit_scope:
    may_check:
      - declared_presentation_mode
      - missing_required_trace_fields_for_current_algorithm
      - declared_formula_or_proposition_anchor_exists
      - obvious_raw_python_syntax_in_declared_pseudocode_as_warning
    must_not_claim:
      - algorithm_correctness_from_step_text
      - convergence_from_presence_of_termination_words
      - equivalence_between_pseudocode_and_python_without_semantic_review

numerical_parameter_evidence:
  applies_to:
    - time_step
    - spatial_grid
    - discretization_points
    - monte_carlo_samples
    - bootstrap_repetitions
    - truncation_order
    - neighborhood_size
    - lag_or_window
    - optimization_tolerance
    - search_resolution
    - max_iterations
  chain: candidate_range -> accuracy_convergence_or_validation_evidence -> selected_value
  optional_second_check: selected_value -> main_result_stability
  evidence_by_family:
    numerical_discretization: grid_or_step_convergence
    stochastic_simulation: standard_error_confidence_interval_or_replication_stability
    statistics_time_series: information_criterion_cross_validation_residual_or_stability
    machine_learning: validation_curve_cross_validation_or_learning_curve
    optimization: objective_feasibility_multi_start_and_termination_evidence
  prohibition: 禁止仅用“综合考虑精度与效率，取……”替代参数依据。

numeric_style_contract:
  governance_level: default
  principle: >-
    数学建模竞赛中的核心答案数值必须按题目、官方格式、评分粒度和结果敏感性保持足够高的展示精度；
    不得为了版面简洁或“可读性”擅自把已验收结果粗略舍入。若精确到小数后 6--7 位可能影响结果分，
    摘要、正文直接答案和关键结果表必须保留相应高精度，并与标准工作簿同源。
  high_precision_default:
    applies_when_any:
      - exact_numeric_answer_is_scored
      - judging_may_compare_late_decimal_digits
      - optimization_or_geometry_answer_requires_precise_coordinates_times_or_objective
      - competition_or_user_requires_fixed_decimal_places
    preferred_decimal_places_when_not_otherwise_specified: [6, 7]
    rule: >-
      6--7 位是高精度结果展示的常用默认区间而非无条件硬编码；若题目、模板、物理分辨率、统计不确定性或官方要求给出其他精度，以其为准。
  consistency:
    - 摘要、正文直接答案、核心结果表与提交结果文件的同一指标必须来自同一已验收数值事实源。
    - 同一指标可因百分比/比例、科学计数法等表现形式不同而改变字符串，但不得改变数值含义或有效精度。
    - 百分比与百分点必须区分；例如从 90% 升至 92% 是增加 2 个百分点，而不是增加 2%。
    - 单位必须与数值间距、量纲和符号含义一致，避免 10m、10 m、10.00m 混用。
    - 均值±标准差、置信区间和上下界必须说明统计含义，不把区间端点误写成点估计。
  display_profiles:
    abstract: 核心答案和决定性数值优先保留可评分的高精度；不得以摘要为理由强行降到 3--4 位。
    body: 与工作簿和题目要求保持精度闭合；可在解释性非核心数字上按项目 profile 统一。
    table: 核心结果列保留足以复核和评分的精度；同列通常统一小数位或科学计数法。
    figure_axis: 坐标刻度以可读性为主，但关键点/阈值/标注数值不得因坐标轴格式丢失必要精度。
    optimization_variable: 决策变量、坐标、时间、目标值按题目输出要求和评分敏感度保留高精度。
  machine_audit_scope:
    may_check:
      - declared_metric_format_consistency
      - unit_spacing_for_registered_units
      - decimal_place_drift_for_registered_metrics
      - ratio_percent_mixing_for_registered_metrics
      - percentage_point_wording_pattern
    must_not_claim:
      - a_specific_precision_is_correct_without_profile_or_prompt_evidence
      - statistical_significance_from_decimal_places
      - physical_accuracy_from_display_precision

terminology_governance:
  governance_level: recommendation
  principle: >-
    自然语言技术术语应与符号治理同等级保持语义稳定。技术论文不以同义词丰富为目标；
    同一量优先使用一个 canonical term，不同量即使语言相近也必须明确区分。
  registry_fields:
    - term_id
    - canonical_term
    - definition
    - dimension_or_unit
    - allowed_aliases
    - discouraged_aliases
    - confusable_terms
    - linked_symbols
    - scope
    - status
  rules:
    - 同一 canonical term 的定义、量纲和 linked symbol 在当前语义 revision 内必须稳定。
    - allowed alias 只能用于确有需要的简称，不能改变定义或量纲。
    - discouraged alias 出现时只提示复查，不自动认定为数学错误。
    - confusable terms 必须分别登记定义，避免“有效时长/总时长”“样本/场景”等近义词跨量混用。
    - 一个 alias 不应同时映射到两个不同 canonical term；确有上下文区分时必须记录理由。
  machine_audit_scope:
    may_check:
      - duplicate_term_id
      - alias_collision
      - discouraged_alias_occurrence
      - local_confusable_term_interleaving
      - undefined_registered_term_reference
    must_not_claim:
      - unseen_terms_are_synonyms
      - semantic_equivalence_from_string_similarity_only

multi_method_validation:
  two_levels:
    numerical_consistency: 目标值、误差、概率、预测值或主指标是否相近。
    structural_consistency: >-
      决策变量区间、活跃约束、变量排序、策略结构、重要性、系数方向、分群结构或关键结论是否一致。
  rule: 只比较单个目标值不能自动推出模型可靠；第二层按题型选择，不要求所有模型拥有相同结构指标。

analysis_evidence_disposition:
  governance_level: default
  statuses: [support, modify, reject]
  required_fields: [evidence_id, question, method_or_source, target_claim, disposition, key_finding, required_action, paper_or_figure_anchor]
  semantics:
    support: 目标主张在该检验下保持，可作为正文增强证据，不扩大原主张适用范围。
    modify: 目标主张主体仍可使用，但区间、阈值、置信度、边界、排序或文字必须修改并同步下游。
    reject: 目标主张在该证据下不能继续原样使用；应删除该 claim、回退模型/求解或重做验证，具体由 target_claim 的重要性决定。
  propagation_rules:
    - reject_core_answer_or_core_model_claim -> redo_required_or_model_redesign
    - reject_auxiliary_style_or_strength_claim -> remove_or_rewrite_claim_without_forcing_full_resolve
    - modify -> mark_dependent_paper_fragments_stale_until_updated
    - support -> keep_target_current_only_if_upstream_model_and_result_are_current
  rule: >-
    深化分析不是“做过就算验证”。每项敏感性、鲁棒性、外样本、算法一致性或压力测试都必须说明它支持、修正还是否决哪个具体主张。

proposition_governance:
  default_budget: [0, 4]
  governance_level: recommendation
  over_budget_action: justification_required
  automatic_rejection_over_budget: false
  admission_effects:
    - reduce_dimension
    - reduce_constraints
    - restrict_candidate_region
    - guarantee_feasibility
    - justify_transformation
    - provide_threshold_or_bound
    - justify_model_necessity
    - establish_solution_structure
  rule: >-
    命题数量由实际数学作用决定，不按小问分配。0--4 是正文阅读预算而非数学硬上限；
    超出默认预算时应先合并同质命题、把技术引理移附录，并说明保留额外命题的必要性。
  proof_length_recommendation: 正文连续短证明通常用自然分段和必要公式，篇幅预算只作为写作建议，不作为数学有效性的判断。

proposition_downstream_consequence:
  required_when_proposition_is_used_for_computation: true
  allowed_consequences:
    - reduce_dimension
    - reduce_constraints
    - restrict_candidate_region
    - guarantee_feasibility
    - justify_transformation
    - provide_threshold_or_bound
    - justify_model_necessity
  rule: 证明后应说明它怎样改变后续模型或计算，而不是只写“命题得证”。

citation_evidence:
  principle: >-
    参考文献只支撑外部来源型主张，不替代本文自己的推导、工作簿结果和数值验证；
    每个需要外部证据的核心 claim 应能回到实际 citation key 与使用位置。
  claim_types:
    prompt_or_attachment_fact:
      citation: usually_not_required
    own_derivation:
      citation: not_required
    own_numerical_result:
      citation: not_required
    standard_model_or_method_origin:
      citation: required_or_recommended
    nontrivial_standard_theorem:
      citation: required_and_conditions_verified
    external_empirical_parameter:
      citation: required
    external_dataset_or_domain_fact:
      citation: required
    algorithm_origin_when_material_to_method:
      citation: required_or_recommended
    comparison_with_prior_research:
      citation: required
  preferred_source_order:
    - official_document_or_primary_dataset
    - original_research_paper
    - formal_standard_textbook_or_monograph
    - high_quality_review
    - secondary_source_when_no_better_source_exists
  project_trace_fields: [claim_id, claim_or_source_object, claim_type, citation_key, paper_location, status]
  status_values: [current, pending, stale, not_required]
  closure_rules:
    - required_claim_has_existing_bib_key
    - citation_key_is_used_in_paper_or_explicitly_retained_for_documented_reason
    - external_parameter_explains_how_source_value_is_adapted_to_current_problem
    - cited_theorem_verifies_current_problem_conditions
    - own_result_is_not_replaced_by_external_citation
  machine_audit_scope:
    may_check:
      - missing_bib_key_for_existing_cite
      - duplicate_bib_key
      - unused_bib_entry_as_warning
      - suspicious_nocite_all
    must_not_claim:
      - source_quality_from_domain_name_only
      - semantic_support_of_claim_from_citation_presence_only
      - theorem_applicability_from_regex

title_claim_gate:
  governance_level: default
  principle: >-
    标题中的研究对象、主方法、核心机制或贡献性表述必须与全文真实主线一致，禁止仅在末尾附加一次某方法却在标题中将其包装为全文核心。
  claim_types: [research_object, main_method, core_mechanism, core_contribution]
  required_fields: [title_claim_id, claim_text, claim_type, related_questions, body_anchor, result_evidence, abstract_anchor, keyword_link, status]
  closure_rules:
    - selected_title_has_registered_substantive_claims
    - main_method_or_contribution_claim_serves_at_least_one_core_question
    - main_method_or_contribution_claim_has_substantive_model_or_algorithm_use
    - title_claim_has_result_evidence
    - abstract_does_not_overstate_title_claim
    - keyword_set_is_consistent_with_selected_title_and_actual_main_model
  machine_audit_scope:
    may_check:
      - missing_title_claim_fields
      - missing_declared_anchor
      - title_keyword_registry_mismatch
    must_not_claim:
      - a_method_is_truly_the_main_contribution_from_word_frequency_only
      - novelty_from_title_wording

paragraph_necessity:
  governance_level: recommendation
  functions:
    - problem_requirement
    - mechanism
    - mathematical_relation
    - solver_basis
    - result_evidence
    - necessary_boundary
  rule: >-
    每一段正文至少承担一种不可替代的信息功能。若删去后不丢失题意、机制、数学关系、求解依据、结果证据或必要边界，
    应优先删除、合并或移附录。该规则是 Formula Destination 在段落层的对应物。
  common_removal_targets:
    - generic_algorithm_history
    - textbook_definition_without_current_use
    - repeated_background
    - repeated_model_strength
    - repeated_question_summary
    - decorative_process_description
    - repeated_numbers_without_new_interpretation
    - explanation_of_formula_with_no_downstream_use
  machine_audit_scope:
    may_warn:
      - highly_similar_adjacent_paragraphs
      - generic_algorithm_exposition_without_local_variable_or_constraint_terms
      - repeated_result_number_sentence
      - repeated_meta_summary
    must_not_do:
      - automatically_delete_text
      - infer_paragraph_semantic_necessity_from_regex_only

paper_fragment_stale_governance:
  governance_level: hard
  principle: >-
    论文 stale 应按真实依赖局部传播。Q3 约束或结果变化时，只使依赖 Q3 的正文、图表、摘要片段、模型评价和标题主张 stale；
    不把无依赖的背景、Q1、Q2 或其他参考文献机械判 stale。
  fragment_kinds:
    - paper_section
    - question_model_text
    - question_result_text
    - figure_or_table_claim
    - abstract_claim
    - model_evaluation_claim
    - title_claim
    - keyword_claim
  required_fields: [fragment_id, kind, scope, depends_on, anchor, status]
  status_values: [current, stale, not_applicable]
  propagation_rule: upstream_stale -> dependent_fragments_stale
  framework_sync_semantics: >-
    paper_framework.sync_status 只表示框架已经同步记录当前项目状态，不代表其中每个 paper fragment 都为 current；
    允许框架 current 而某个依赖片段 stale，正式交付前必须消除交付范围内的 stale fragments。

prose_style:
  name: evidence_driven_undergraduate_academic
  target: 规范、朴素、略带科研训练初期的推理痕迹；技术含义稳定，不追求期刊式抽象包装。
  preferred_sentence_flow:
    - concrete_object_or_condition
    - current_mathematical_difficulty
    - mathematical_treatment
    - obtained_information_or_next_use
  allow_natural_connectors: [根据, 因此, 由此, 进一步, 从而, 此时, 结合, 从表中可以看出]
  connector_policy: 这些词不是禁词；只在机械重复、无逻辑推进或句法同构时复查。
  avoid:
    - repeated_meta_navigation
    - abstract_jargon_stacking_without_object_support
    - frequent_self_negation_or_disclaimer
    - deliberate_grammar_degradation
    - mechanical_synonym_replacement
  human_reasoning_trace:
    allow:
      - 指出当前还缺哪个量或条件
      - 说明某关系为何能缩小搜索范围
      - 说明两个区间、对象或约束为何需要进一步比较
      - 说明由某一结果引出的下一步建模动作

problem_background:
  governance_level: recommendation
  default: one_paragraph
  allow_second_short_paragraph_when: reality_background_to_specific_research_object_needs_semantic_narrowing
  second_paragraph_must: narrow_object_or_core_conflict
  forbidden_second_paragraph: document_structure_or_chapter_management_only

model_evaluation:
  governance_level: recommendation
  strengths_typical: [2, 4]
  weaknesses_typical: [1, 2]
  count_relation_required: false
  rule: 优点有证据、缺点说明影响对象与边界；数量按实际模型决定，不检查“优点必须多于缺点”。

machine_audit_boundary:
  report_only_for_semantic_style_risks: true
  may_warn:
    - dense_formula_blocks_with_little_prose
    - repeated_further_obtain_or_similarly_obtain
    - repeated_meta_navigation
    - repeated_cross_question_redefinition
    - unexplained_numeric_parameter_assignment
    - repeated_identical_question_opening_pattern
    - unused_bibliography_entry
    - terminology_drift
    - numeric_style_drift
    - unreferenced_label_or_equation
    - unusually_long_caption
    - paragraph_redundancy_risk
    - raw_python_like_pseudocode
  may_review:
    - default_structure_deviation_without_justification
    - title_claim_without_complete_declared_evidence
    - abstract_contains_figure_table_or_display_math_without_exception
    - algorithm_presentation_mode_inconsistent_with_declared_trace
  may_block:
    - deterministic_structural_error_such_as_missing_citation_key_or_duplicate_label
    - unresolved_cross_reference
  must_not_claim:
    - mathematical_correctness_from_regex
    - formula_source_semantic_validity_from_keywords_only
    - parameter_optimality_from_prose_only
    - citation_semantic_support_from_key_presence_only
    - terminology_equivalence_from_string_similarity_only
    - physical_or_statistical_accuracy_from_decimal_places_only
    - algorithm_correctness_or_convergence_from_pseudocode_shape_only

authority_boundaries:
  reasoning_authority: core/writing_reasoning_contract.yaml
  prose_and_section_authority: modules/05_writing/latex.md
  docx_role: 只定义 Word 审阅载体与排版差异，不复制正文规则。
  ai_cleanup_role: 只识别模板化、空泛、重复、推理呈现风险，不建立第二套正文规则。
  review_role: 只映射 Authority 到检查级别与交付判定，不重新定义写作规范。
  artifact_pack_role: 只定义加载条件、输入、输出、编译或载体特有验收，不复制正文规范。
  project_framework_role: 只保存当前项目事实、选择、状态和证据位置，不保存跨项目写作手册。
