$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.local/hsk/case-memory/retrieval-contract.yaml
title: D2 bounded offline synthetic case retrieval
version: 1.0.0
introduced_in_skill_version: 10.17.0
x-retrieval:
  protocol_version: 1.0.0
  taxonomy: core/task_taxonomy.yaml
  taxonomy_version: 2.1.0
  modes: [structural, lexical]
  limits:
    file_bytes: 262144
    total_bytes: 2097152
    depth: 32
    nodes: 32768
    string_chars: 8192
    query_bytes: 16384
    report_bytes: 16384
    evaluation_bytes: 65536
    top_k: 5
    features: 64
    queries: 32
  weights: {objective: 40, structures: 16, capabilities: 4, typed: 12, conditions: 3, lexical: 1}
  semantics:
    types: Manual synthetic projections describe applicability conditions, not observed project facts.
    unknown: Valid unknown traits and missing conditions remain conditional; explicitly violated requirements are excluded.
    grouping: Exclude a whole connected D1 group if any member origin is excluded.
    source: Current D1 admission and index are consumed in the same protected raw-byte read set.
    authority: Semantic changes require a new supported contract identity and consumer review; limits may only tighten.
    qualification: Retrieval never grants model approval, numerical acceptance, project writes or independent evidence.
    evaluation: Queries derived from the seeds are development checks; contaminated examples cannot establish independent performance.
type: object
additionalProperties: false
minProperties: 1
maxProperties: 1
properties:
  query: {$ref: '#/$defs/query'}
  features: {$ref: '#/$defs/features'}
  development: {$ref: '#/$defs/development'}
$defs:
  id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'}
  sha: {type: string, pattern: '^[0-9a-f]{64}$'}
  text: {type: string, minLength: 1, maxLength: 2048}
  objective: {type: string}
  structures:
    type: array
    maxItems: 3
    uniqueItems: true
    items: {type: string}
  capabilities:
    type: array
    maxItems: 11
    uniqueItems: true
    items: {type: string}
  observation:
    enum: [unknown, ordered_fixed_interval, comparable_objects, shared_resource_tasks, lumped_state, network_tasks, random_trials, prediction_decision_chain, cross_sectional, distributed_state]
  variable: {enum: [unknown, continuous, integer, binary, categorical, mixed]}
  information: {enum: [unknown, current_only, future_available]}
  condition:
    enum: [historical_sequence, cycle_basis, temporal_separation, no_future_features, comparable_definitions, indicator_directions, consistent_units, justified_weights, distinct_indicator_meanings, same_decision_period, shared_resource_feasibility, linear_relations, divisible_allocation, initial_state, boundary_flows, uniform_state_approximation, conservation_balance, network_connections, processing_times, resource_capacities, precedence, time_windows, distribution_basis, correlation_basis, event_definition, fixed_horizon, upstream_contract, uncertainty_propagation]
  conditions:
    type: object
    maxProperties: 28
    propertyNames: {$ref: '#/$defs/condition'}
    additionalProperties: {enum: [satisfied, violated, unknown]}
  traits:
    type: object
    additionalProperties: false
    required: [observation_regime, variable_domain, information_boundary, conditions]
    properties:
      observation_regime: {$ref: '#/$defs/observation'}
      variable_domain: {$ref: '#/$defs/variable'}
      information_boundary: {$ref: '#/$defs/information'}
      conditions: {$ref: '#/$defs/conditions'}
  query:
    type: object
    additionalProperties: false
    required: [protocol_version, objective, structures, capabilities, summary, traits]
    properties:
      protocol_version: {const: 1.0.0}
      objective: {$ref: '#/$defs/objective'}
      structures: {$ref: '#/$defs/structures'}
      capabilities: {$ref: '#/$defs/capabilities'}
      summary: {$ref: '#/$defs/text'}
      traits: {$ref: '#/$defs/traits'}
  anchored_observation:
    type: object
    additionalProperties: false
    required: [value, source_anchor]
    properties:
      value: {$ref: '#/$defs/observation'}
      source_anchor: {$ref: '#/$defs/id'}
  anchored_variable:
    type: object
    additionalProperties: false
    required: [value, source_anchor]
    properties:
      value: {$ref: '#/$defs/variable'}
      source_anchor: {$ref: '#/$defs/id'}
  anchored_information:
    type: object
    additionalProperties: false
    required: [value, source_anchor]
    properties:
      value: {$ref: '#/$defs/information'}
      source_anchor: {$ref: '#/$defs/id'}
  feature:
    type: object
    additionalProperties: false
    required: [case_id, case_version, case_sha256, source_sha256, annotation_kind, traits, required_conditions, terms]
    properties:
      case_id: {$ref: '#/$defs/id'}
      case_version: {$ref: '#/$defs/id'}
      case_sha256: {$ref: '#/$defs/sha'}
      source_sha256: {$ref: '#/$defs/sha'}
      annotation_kind: {const: synthetic_example}
      traits:
        type: object
        additionalProperties: false
        required: [observation_regime, variable_domain, information_boundary]
        properties:
          observation_regime: {$ref: '#/$defs/anchored_observation'}
          variable_domain: {$ref: '#/$defs/anchored_variable'}
          information_boundary: {$ref: '#/$defs/anchored_information'}
      required_conditions:
        type: array
        maxItems: 28
        items:
          type: object
          additionalProperties: false
          required: [condition, source_anchor]
          properties:
            condition: {$ref: '#/$defs/condition'}
            source_anchor: {$ref: '#/$defs/id'}
      terms:
        type: array
        maxItems: 16
        items:
          type: object
          additionalProperties: false
          required: [term, source_anchor]
          properties:
            term: {type: string, minLength: 1, maxLength: 64}
            source_anchor: {$ref: '#/$defs/id'}
  features:
    type: object
    additionalProperties: false
    required: [protocol_version, annotation_scope, features]
    properties:
      protocol_version: {const: 1.0.0}
      annotation_scope: {const: manual_synthetic_applicability_projection}
      features:
        type: array
        maxItems: 64
        items: {$ref: '#/$defs/feature'}
  development:
    type: object
    additionalProperties: false
    required: [protocol_version, evaluation_scope, queries]
    properties:
      protocol_version: {const: 1.0.0}
      evaluation_scope: {const: seed_derived_development_only}
      queries:
        type: array
        maxItems: 32
        items:
          type: object
          additionalProperties: false
          required: [id, query, expected_case_ids, derived_origins]
          properties:
            id: {$ref: '#/$defs/id'}
            query: {$ref: '#/$defs/query'}
            expected_case_ids:
              type: array
              maxItems: 5
              uniqueItems: true
              items: {$ref: '#/$defs/id'}
            derived_origins:
              type: array
              maxItems: 64
              uniqueItems: true
              items: {$ref: '#/$defs/id'}
