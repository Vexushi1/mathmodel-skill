skill_version: 10.18.0
bootstrap_schema_version: 1.1.0
purpose: >-
  Read first, load workflow_router.default_load, and use
  scripts/resolve_runtime.py for the task plan. Do not preload domain contracts.
authoritative_sources:
  global_policy: core/hsk_core_policy.md
  routing: core/workflow_router.yaml
  artifact_graph: core/module_manifest.yaml
  task_taxonomy: core/task_taxonomy.yaml
  project_state: core/project_state.schema.yaml
  state_transitions: core/state_transition_contract.yaml
  workbook: core/workbook_schema.yaml
  output: core/output_contract.yaml
  preprocessing: core/global_preprocessing_contract.yaml
  model_approval: core/model_approval_contract.yaml
  user_execution: core/user_execution_contract.yaml
  code_quality: core/code_quality_contract.yaml
  model_code_conformance: core/model_code_conformance_contract.yaml
  claim_consumption: core/claim_consumption_contract.yaml
  review_receipts: core/review_receipt_contract.yaml
  review_receipt_consumption: core/review_receipt_consumption_contract.yaml
  case_memory: knowledge/case_memory/schema.yaml
  case_memory_retrieval: core/case_memory_retrieval_contract.yaml
  writing_reasoning: core/writing_reasoning_contract.yaml
  writing_runtime: core/writing_runtime_contract.yaml
  figure_evidence: modules/04_figure_evidence.md
  review_delivery: modules/06_review_delivery.md
  cumcm_template: templates/latex/cumcm/hsk/template_manifest.yaml
  numerical_verification: core/numerical_verification_contract.yaml
  semantic_governance: scripts/validate_semantic_governance.py
  runtime_assurance: core/runtime_assurance_contract.yaml
startup_contract:
  principle: minimal_route_specific
  default_policy_source: core/hsk_core_policy.md
  resolver: scripts/resolve_runtime.py
  rules:
    - Bootstrap stores startup pointers; global rules live in core/hsk_core_policy.md.
    - Load route contracts only when needed.
    - For reading_plan, use read_now then conditional triggers; load_order remains compatibility inventory. Execute every pre_delivery_gate. See core/runtime_assurance_contract.yaml#reading_plan.
    - Context hydration, intent provenance, artifact assurance and contract closure follow core/runtime_assurance_contract.yaml.
    - Load resolver manifests and taxonomies only when the route needs them.
    - Current project semantics are restored from current 模型论文框架.md when available; numerical facts still come from accepted workbooks and machine state from project_state.
    - New 模型论文框架.md instances use scripts/instantiate_model_paper_framework.py; core/output_contract.yaml owns compact/full modes and the canonical full template.
    - Paper writing follows core/writing_runtime_contract.yaml, the active template manifest and paper_writing_protocol; full writing_reasoning_contract is a declared fallback.
    - For a project-wide numerical backend, inspect before writing; select records a first choice, while migration of historical or locked choices requires a reviewed preview and explicit project confirmation. Follow core/user_execution_contract.yaml#solver_backends.
hard_invariants:
  - Global modeling, preprocessing, solving, figure, writing and review rules are governed by their authoritative sources above; bootstrap must not restate those contracts in detail.
  - Resolve the smallest task-specific load order and stop after the user-requested deliverable; do not preload unrelated contracts or modules.
  - Formal delivery must execute every `pre_delivery_gates` entry returned by the resolver, in resolver order. The resolver owns this list.
  - Current 模型论文框架.md is the assistant-readable semantic memory; accepted workbooks are numerical fact sources and project state is the machine-state source.
  - Problem Contract freezing does not authorize task code by itself; before current model code is generated, the Model Challenge must pass and the user must explicitly approve the current semantic_revision and validated semantic_identity_hash under core/model_approval_contract.yaml; legacy semantic_hash approval is read-only provenance only.
  - Task-specific preprocessing, solve and result-analysis code remains user-executed; the assistant generates, statically checks and validates returned artifacts under the existing execution contracts.
  - legacy/ remains outside default execution; compatibility pointers are read-only bridges and may not become active dependencies.
entrypoints:
  resolve: python scripts/resolve_runtime.py
  resolve_legacy: python scripts/resolve_workflow.py
  project_solver_backend: python scripts/project_solver_backend.py
  instantiate_framework: python scripts/instantiate_model_paper_framework.py
  semantic_governance: python scripts/validate_semantic_governance.py
  model_approval: python scripts/validate_model_approval.py
  sync: python scripts/sync_project.py
  validate_state: python scripts/validate_project_state.py
  validate_framework: python scripts/validate_model_paper_framework.py
  review: python scripts/score_submission.py
  validate_code_delivery: python scripts/validate_code_delivery.py
  validate_user_execution: python scripts/validate_user_execution.py
  validate_numerical_evidence: python scripts/validate_numerical_evidence.py
  claim_consumption: python scripts/claim_consumption.py
  review_receipts: python scripts/review_receipts.py
  case_memory: python scripts/case_memory.py
  case_memory_retrieval: python scripts/case_memory_retrieve.py
  case_references: python scripts/case_references.py
  audit_latex_project: python scripts/audit_latex_project.py
  render_paper: python scripts/render_paper.py
  validate_submission_package: python scripts/validate_submission_package.py
  audit_paper_prose: python scripts/audit_paper_prose.py
  audit_v8_writing_surface: python scripts/audit_v8_writing_surface.py
  generate_mechanism_drawio: python scripts/generate_mechanism_drawio.py
  validate_drawio_figure: python scripts/validate_drawio_figure.py
repository_maintenance:
  governance: SKILL_CHANGE_GOVERNANCE.md
  mandatory_before_write: true
  read_from_ref: main
  branch_required: true
  pull_request_required: true
  direct_main_write_allowed: false
  generated_files_managed_by: scripts/generate_indexes.py
compatibility:
  legacy_task_labels_supported: true
  legacy_router_single_intent_supported: true
  deprecated_classification_capabilities_supported: true
  deprecated_problem_types_supported: true
  legacy_robustness_workbook_read_supported: true
  v7_2_0_preprocessing_without_decision_read_supported: true
  v7_0_semantic_governance_fields_optional_for_read: true
  v6_6_single_script_question_folders_read_supported: true
  versionless_active_documents:
    - PROJECT_INSTRUCTIONS.md
    - RUNTIME_ROUTER.md
    - SKILL_FILE_INDEX.md
    - TEMPLATE_INDEX.md
  legacy_document_pointers_supported: true
