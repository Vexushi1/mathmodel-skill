$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.local/hsk/project_state.schema.yaml
title: HSK 数学建模项目状态
version: 6.2.2
type: object
additionalProperties: false
required: [project, requirements, decisions, variables, artifacts, risks, next_gate]
properties:
  project:
    type: object
    additionalProperties: false
    required: [competition, problem, current_phase, problem_types]
    properties:
      competition: {type: string, minLength: 1}
      problem: {type: string, minLength: 1}
      current_phase:
        type: string
        enum: [problem_audit, model_design, solve_validate, figure_evidence, writing_docx, writing_latex, ai_cleanup, review_delivery, completed]
      problem_types:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum: [mechanism, optimization, prediction, evaluation, statistics_ml, simulation, spatial, graph_network, scheduling, game_decision]
      version: {type: string}
      updated_at: {type: string, format: date-time}

  requirements:
    type: object
    additionalProperties: false
    required: [total, completed, pending]
    properties:
      total: {type: integer, minimum: 0}
      completed:
        type: array
        uniqueItems: true
        items: {type: string}
      pending:
        type: array
        uniqueItems: true
        items: {type: string}

  data:
    type: object
    additionalProperties: false
    properties:
      sources:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, path, role]
          properties:
            name: {type: string, minLength: 1}
            path: {type: string, minLength: 1}
            role: {type: string, minLength: 1}
            sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
            as_of: {type: string}
      version_hashes:
        type: object
        additionalProperties: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      locked_scope: {type: string}

  decisions:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [selected_model, rejected_models, key_reason]
      properties:
        selected_model: {type: string}
        rejected_models:
          type: array
          items: {type: string}
        key_reason: {type: string}
        solver_candidates:
          type: array
          items: {type: string}
        validation_plan:
          type: array
          items: {type: string}

  subproblems:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [status, selected_model, validation_status]
      properties:
        status:
          type: string
          enum: [pending, audited, designed, solved, validated, written, completed]
        selected_model: {type: string}
        data_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        code: {type: string}
        solution_workbook: {type: string}
        robustness_workbook: {type: string}
        solver_status: {type: string}
        random_seed:
          oneOf: [{type: integer}, {type: 'null'}]
        tolerance: {type: number, minimum: 0}
        optimality_gap:
          oneOf: [{type: number, minimum: 0}, {type: 'null'}]
        max_constraint_violation:
          oneOf: [{type: number, minimum: 0}, {type: 'null'}]
        validation_status:
          type: string
          enum: [pending, passed, failed, not_applicable]
        evidence:
          type: array
          uniqueItems: true
          items: {type: string}

  variables:
    type: object
    additionalProperties: false
    required: [locked, source]
    properties:
      locked:
        type: array
        uniqueItems: true
        items: {type: string}
      source:
        type: object
        additionalProperties: {type: string}

  execution:
    type: object
    additionalProperties: false
    properties:
      python_version: {type: string}
      matlab_version: {type: string}
      dependencies:
        type: object
        additionalProperties: {type: string}
      last_run: {type: string, format: date-time}
      command: {type: string}
      platform: {type: string}

  artifacts:
    type: object
    additionalProperties: false
    required: [code, results, figures, papers]
    properties:
      code:
        type: array
        items: {type: string}
      results:
        type: array
        items: {type: string}
      figures:
        type: array
        items: {type: string}
      papers:
        type: array
        items: {type: string}

  risks:
    type: array
    items:
      oneOf:
        - type: string
        - type: object
          additionalProperties: false
          required: [level, item, action]
          properties:
            level: {type: string, enum: [fatal, important, general]}
            item: {type: string}
            action: {type: string}

  next_gate:
    type: object
    additionalProperties: false
    required: [module, condition]
    properties:
      module:
        type: string
        enum: [problem_audit, model_design, solve_validate, figure_evidence, writing_docx, writing_latex, ai_cleanup, review_delivery, completed]
      condition: {type: string}

policy:
  required_on_every_chat: false
  create_when: [full_project, cross_chat_handoff, multiple_artifacts, user_request]
  semantic_checks:
    - requirements.total equals the number of unique completed and pending requirements.
    - completed and pending are disjoint.
    - subproblem artifact paths must exist before status becomes validated, written or completed.
    - solver claims must include tolerance, feasibility evidence and applicable optimality evidence.
