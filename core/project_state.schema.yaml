$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.local/hsk/project_state.schema.yaml
title: HSK 数学建模项目状态
version: 6.2.6
type: object
additionalProperties: false
required: [project, requirements, decisions, subproblems, variables, paper_framework, artifacts, risks, next_gate]

$defs:
  task_label:
    type: string
    enum: [mechanism, optimization, prediction, evaluation, statistics_ml, simulation, spatial, graph_network, scheduling, game_decision]
  problem_types:
    type: object
    additionalProperties: false
    required: [primary, secondary]
    properties:
      primary: {$ref: '#/$defs/task_label'}
      secondary:
        type: array
        maxItems: 2
        uniqueItems: true
        items: {$ref: '#/$defs/task_label'}
      confidence:
        type: object
        additionalProperties: {type: number, minimum: 0, maximum: 1}
  capabilities:
    type: object
    additionalProperties: false
    required: [has_explicit_constraints, requires_feasibility_check, requires_equilibrium_residual, requires_conservation_residual, requires_discretization_check, requires_convergence_diagnostic]
    properties:
      has_explicit_constraints: {type: boolean}
      requires_feasibility_check: {type: boolean}
      requires_equilibrium_residual: {type: boolean}
      requires_conservation_residual: {type: boolean}
      requires_discretization_check: {type: boolean}
      requires_convergence_diagnostic: {type: boolean}
  proposition_entry:
    type: object
    additionalProperties: false
    required: [id, title, related_question, claim_type, proof_level, status]
    properties:
      id: {type: string, pattern: '^P[1-4]$'}
      title: {type: string, minLength: 1}
      related_question: {type: string, minLength: 1}
      claim_type:
        type: string
        enum: [equivalence, existence_or_feasibility, monotonicity_or_threshold, convexity_uniqueness_or_solution_structure, constraint_reduction_or_dimension_reduction, feasibility_preservation, stability_or_error_bound, cited_standard_theorem]
      proof_level: {type: string, enum: [full, outline, cited]}
      status: {type: string, enum: [candidate, current, stale, removed]}
      assumptions_and_domain: {type: string}
      conclusion: {type: string}
      modeling_effect: {type: string}
      failure_boundary: {type: string}
      framework_anchor: {type: string}

properties:
  project:
    type: object
    additionalProperties: false
    required: [competition, problem, current_phase]
    properties:
      competition: {type: string, minLength: 1}
      problem: {type: string, minLength: 1}
      current_phase:
        type: string
        enum: [problem_audit, model_design, solve_validate, figure_evidence, writing_docx, writing_latex, ai_cleanup, latex_compile_quality, review_delivery, completed]
      problem_types:
        description: 项目级汇总标签，仅用于导航；运行校验以 subproblems 中的每问题型为准。
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/task_label'}
      version: {type: string}
      updated_at: {type: string, format: date-time}

  requirements:
    type: object
    additionalProperties: false
    required: [total, completed, pending]
    properties:
      total: {type: integer, minimum: 0}
      completed:
        type: array
        uniqueItems: true
        items: {type: string}
      pending:
        type: array
        uniqueItems: true
        items: {type: string}

  data:
    type: object
    additionalProperties: false
    properties:
      sources:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, path, role]
          properties:
            name: {type: string, minLength: 1}
            path: {type: string, minLength: 1}
            role: {type: string, minLength: 1}
            sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
            as_of: {type: string}
      version_hashes:
        type: object
        additionalProperties: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      locked_scope: {type: string}

  decisions:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [selected_model, rejected_models, key_reason]
      properties:
        selected_model: {type: string}
        rejected_models:
          type: array
          items: {type: string}
        key_reason: {type: string}
        solver_candidates:
          type: array
          items: {type: string}
        validation_plan:
          type: array
          items: {type: string}

  subproblems:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [status, selected_model, problem_types, capabilities, validation_status, framework_section, result_summary_status]
      properties:
        status:
          type: string
          enum: [pending, audited, designed, solved, validated, written, completed]
        selected_model: {type: string}
        problem_types: {$ref: '#/$defs/problem_types'}
        capabilities: {$ref: '#/$defs/capabilities'}
        framework_section: {type: string, minLength: 1}
        result_summary_status:
          type: string
          enum: [pending, current, stale]
        result_summary_anchor: {type: string}
        proposition_refs:
          type: array
          maxItems: 4
          uniqueItems: true
          items: {type: string, pattern: '^P[1-4]$'}
        data_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        validated_data_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        model_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        validated_model_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        artifacts_stale: {type: boolean, default: false}
        code: {type: string}
        solution_workbook: {type: string}
        robustness_workbook: {type: string}
        paper_source: {type: string}
        solver_status: {type: string}
        optimality_claim:
          type: string
          enum: [none, local, heuristic, bounded, proven_optimal, global]
          default: none
        random_seed:
          oneOf: [{type: integer}, {type: 'null'}]
        tolerance: {type: number, minimum: 0}
        optimality_gap:
          oneOf: [{type: number, minimum: 0}, {type: 'null'}]
        max_constraint_violation:
          oneOf: [{type: number, minimum: 0}, {type: 'null'}]
        validation_status:
          type: string
          enum: [pending, passed, failed, not_applicable]
        evidence:
          type: array
          uniqueItems: true
          items: {type: string}

  variables:
    type: object
    additionalProperties: false
    required: [locked, source]
    properties:
      locked:
        type: array
        uniqueItems: true
        items: {type: string}
      source:
        type: object
        additionalProperties: {type: string}

  paper_framework:
    type: object
    additionalProperties: false
    required: [path, version, sync_status, last_sync_scope, proposition_limit, proposition_count, proposition_status, propositions]
    properties:
      path:
        type: string
        const: 模型论文框架.md
      version: {type: string, minLength: 1}
      sync_status:
        type: string
        enum: [current, stale]
      last_synced_at: {type: string, format: date-time}
      last_sync_scope: {type: string, minLength: 1}
      sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      proposition_limit: {type: integer, const: 4}
      proposition_count: {type: integer, minimum: 0, maximum: 4}
      proposition_status:
        type: string
        enum: [not_assessed, planned, current, stale]
      propositions:
        type: array
        maxItems: 4
        items: {$ref: '#/$defs/proposition_entry'}

  execution:
    type: object
    additionalProperties: false
    properties:
      python_version: {type: string}
      matlab_version: {type: string}
      dependencies:
        type: object
        additionalProperties: {type: string}
      last_run: {type: string, format: date-time}
      command: {type: string}
      platform: {type: string}

  artifacts:
    type: object
    additionalProperties: false
    required: [code, results, figures, papers]
    properties:
      code:
        type: array
        items: {type: string}
      results:
        type: array
        items: {type: string}
      figures:
        type: array
        items: {type: string}
      papers:
        type: array
        items: {type: string}

  risks:
    type: array
    items:
      oneOf:
        - type: string
        - type: object
          additionalProperties: false
          required: [level, item, action]
          properties:
            level: {type: string, enum: [fatal, important, general]}
            item: {type: string}
            action: {type: string}

  next_gate:
    type: object
    additionalProperties: false
    required: [module, condition]
    properties:
      module:
        type: string
        enum: [problem_audit, model_design, solve_validate, figure_evidence, writing_docx, writing_latex, ai_cleanup, latex_compile_quality, review_delivery, completed]
      condition: {type: string}

policy:
  required_on_every_chat: false
  create_when: [full_project, cross_chat_handoff, multiple_artifacts, user_request]
  semantic_validator: scripts/validate_project_state.py
  framework_validator: scripts/validate_model_paper_framework.py
  semantic_checks:
    - requirements.total equals the number of unique completed and pending requirements.
    - completed and pending are disjoint.
    - 模型设计阶段及以后必须存在当前有效的 模型论文框架.md。
    - 全文命题数量允许为0但不得超过4；proposition_count、propositions 数组与框架登记数量必须一致。
    - 每个小问必须能定位到框架章节；solved、validated、written 或 completed 状态要求结果摘要为 current。
    - subproblem artifact paths must exist before status becomes validated, written or completed.
    - solver claims must include tolerance, feasibility evidence and applicable optimality evidence.
    - validated artifacts become stale when the current data or model hash differs from the validated hash.
    - artifacts_stale 为 true 时，paper_framework、相关命题状态与对应 result_summary_status 不得保持 current。
