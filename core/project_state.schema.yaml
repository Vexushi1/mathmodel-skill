$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.local/hsk/project_state.schema.yaml
title: HSK 数学建模项目状态
version: 7.4.1
type: object
additionalProperties: false
required: [project, requirements, decisions, subproblems, variables, paper_framework, artifacts, risks, next_gate]
$defs:
  legacy_task_label:
    type: string
    enum: [mechanism, optimization, prediction, evaluation, statistics_ml, simulation, spatial, graph_network, scheduling, game_decision]
  objective:
    type: string
    enum: [explanation, inference, prediction, evaluation, optimization, simulation]
  structure:
    type: string
    enum: [physical_mechanism, temporal, spatial, network, scheduling, game, stochastic, static_tabular]
  dependency_kind:
    type: string
    enum: [data, parameter, model, result]
  dependency_entry:
    type: object
    additionalProperties: false
    required: [question, kind]
    properties:
      question: {type: string, pattern: '^Q[1-9][0-9]*$'}
      kind: {$ref: '#/$defs/dependency_kind'}
      note: {type: string}
  semantic_change_category:
    type: string
    enum: [initial_design, problem_definition, data_scope, variable, parameter, assumption, objective, constraint, preprocessing, algorithm, dependency]
  complexity_sanity_flag:
    type: string
    enum: [unused_problem_conditions, unused_attachment_fields, unexpected_dimension_collapse, unexpected_decoupling, dynamic_to_static_collapse, multi_agent_to_independent, inactive_key_constraints, downstream_copy, implausibly_easy_computation]
  preprocessing_decision:
    type: string
    enum: [not_needed, question_local, project_level]
  preprocessing_level:
    type: string
    enum: [none, structural, transformative]
  preprocessing_source_mode:
    type: string
    enum: [raw, preprocessed]
  problem_types:
    type: object
    additionalProperties: false
    required: [primary, secondary]
    properties:
      primary: {$ref: '#/$defs/legacy_task_label'}
      secondary:
        type: array
        maxItems: 2
        uniqueItems: true
        items: {$ref: '#/$defs/legacy_task_label'}
      confidence:
        type: object
        additionalProperties: {type: number, minimum: 0, maximum: 1}
  capabilities:
    type: object
    additionalProperties: false
    required:
    - has_explicit_constraints
    - requires_feasibility_check
    - requires_equilibrium_residual
    - requires_conservation_residual
    - requires_discretization_check
    - requires_convergence_diagnostic
    properties:
      has_explicit_constraints: {type: boolean}
      requires_feasibility_check: {type: boolean}
      requires_equilibrium_residual: {type: boolean}
      requires_conservation_residual: {type: boolean}
      requires_discretization_check: {type: boolean}
      requires_convergence_diagnostic: {type: boolean}
      requires_out_of_sample_validation: {type: boolean, default: false}
      requires_uncertainty_quantification: {type: boolean, default: false}
      requires_leakage_check: {type: boolean, default: false}
      requires_calibration_check: {type: boolean, default: false}
      requires_identifiability_check: {type: boolean, default: false}
  classification:
    type: object
    additionalProperties: false
    required: [objective, structures]
    properties:
      objective: {$ref: '#/$defs/objective'}
      structures:
        type: array
        maxItems: 3
        uniqueItems: true
        items: {$ref: '#/$defs/structure'}
      confidence:
        type: object
        additionalProperties: {type: number, minimum: 0, maximum: 1}
      capabilities:
        description: 兼容别名；若存在必须与小问顶层capabilities一致
        $ref: '#/$defs/capabilities'
      legacy_task_packs:
        type: array
        maxItems: 3
        uniqueItems: true
        items: {$ref: '#/$defs/legacy_task_label'}
  artifact_hashes:
    type: object
    additionalProperties: false
    properties:
      data: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      model: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      solution_workbook: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      result_analysis_workbook: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      robustness_workbook:
        description: 旧项目兼容字段
        type: string
        pattern: '^[0-9a-fA-F]{64}$'
      matlab_script: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      figure_bundle: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      framework: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
  artifact_layer:
    type: string
    enum: [data, model, solution_workbook, result_analysis_workbook, robustness_workbook, matlab_script, figure_bundle, framework]
  proposition_entry:
    type: object
    additionalProperties: false
    required: [id, title, related_question, claim_type, proof_level, status]
    properties:
      id: {type: string, pattern: '^P[1-4]$'}
      title: {type: string, minLength: 1}
      related_question: {type: string, minLength: 1}
      claim_type:
        type: string
        enum: [equivalence, existence_or_feasibility, monotonicity_or_threshold, convexity_uniqueness_or_solution_structure, constraint_reduction_or_dimension_reduction, feasibility_preservation, stability_or_error_bound, cited_standard_theorem]
      proof_level: {type: string, enum: [full, outline, cited]}
      status: {type: string, enum: [candidate, current, stale, removed]}
      assumptions_and_domain: {type: string}
      conclusion: {type: string}
      modeling_effect: {type: string}
      failure_boundary: {type: string}
      framework_anchor: {type: string}
properties:
  semantic_governance_version:
    description: v7.1+语义治理门版本；旧项目可缺失，只读兼容，重新进入审题/模型设计时补齐
    type: string
    const: 1.0.0
  project:
    type: object
    additionalProperties: false
    required: [competition, problem, current_phase]
    properties:
      competition: {type: string, minLength: 1}
      problem: {type: string, minLength: 1}
      current_phase:
        type: string
        enum: [problem_audit, model_design, data_preprocessing, solve_validate, result_analysis, figure_evidence, writing_docx, writing_latex, ai_cleanup, latex_compile_quality, review_delivery, completed]
      problem_types:
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/legacy_task_label'}
      objectives:
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/objective'}
      version: {type: string}
      updated_at: {type: string, format: date-time}
  requirements:
    type: object
    additionalProperties: false
    required: [total, completed, pending]
    properties:
      total: {type: integer, minimum: 0}
      completed: {type: array, uniqueItems: true, items: {type: string}}
      pending: {type: array, uniqueItems: true, items: {type: string}}
  data:
    type: object
    additionalProperties: false
    properties:
      sources:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, path, role]
          properties:
            name: {type: string, minLength: 1}
            path: {type: string, minLength: 1}
            role: {type: string, minLength: 1}
            sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
            as_of: {type: string}
      version_hashes:
        type: object
        additionalProperties: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      locked_scope: {type: string}
      active_source_mode: {$ref: '#/$defs/preprocessing_source_mode'}
  preprocessing:
    description: v7.2.6引入的条件式预处理状态。旧项目可缺失；重新进入模型设计或求解时先锁定decision并按当前通用审计规则复核必要性。
    type: object
    additionalProperties: false
    properties:
      decision: {$ref: '#/$defs/preprocessing_decision'}
      level: {$ref: '#/$defs/preprocessing_level'}
      status:
        type: string
        enum: [pending, locked, not_applicable, code_delivered, awaiting_user_preprocessing, workbook_received, accepted, rejected, stale]
      evidence:
        type: array
        items: {type: string}
      operations:
        type: array
        uniqueItems: true
        items: {type: string}
      covered_raw_sources:
        description: decision=project_level时被统一工作簿替代、下游不得再次直接读取的原始数据源路径；仅列实际覆盖源，未列出的独立辅助附件可继续按模型需要读取。
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      forbidden_operations:
        type: array
        uniqueItems: true
        items: {type: string}
      downstream_data_source: {$ref: '#/$defs/preprocessing_source_mode'}
      code: {type: string}
      workbook: {type: string}
      code_sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      workbook_sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      quality_status: {type: string, enum: [not_applicable, pending, passed, failed]}
      note: {type: string}
  decisions:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [selected_model, rejected_models, key_reason]
      properties:
        selected_model: {type: string}
        rejected_models: {type: array, items: {type: string}}
        key_reason: {type: string}
        solver_candidates: {type: array, items: {type: string}}
        validation_plan: {type: array, items: {type: string}}
        result_analysis_candidates: {type: array, items: {type: string}}
  subproblems:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required: [status, selected_model, capabilities, result_quality_status, result_analysis_status, framework_section, result_summary_status]
      anyOf:
      - required: [classification]
      - required: [problem_types]
      properties:
        status:
          type: string
          enum: [pending, audited, designed, solved, analyzed, validated, written, completed]
        selected_model: {type: string}
        classification: {$ref: '#/$defs/classification'}
        problem_types: {$ref: '#/$defs/problem_types'}
        capabilities: {$ref: '#/$defs/capabilities'}
        framework_section: {type: string, minLength: 1}
        result_summary_status: {type: string, enum: [pending, current, stale]}
        result_summary_anchor: {type: string}
        proposition_refs:
          type: array
          maxItems: 4
          uniqueItems: true
          items: {type: string, pattern: '^P[1-4]$'}
        depends_on:
          type: array
          uniqueItems: true
          items: {$ref: '#/$defs/dependency_entry'}
        problem_contract_status:
          type: string
          enum: [pending, frozen, stale]
        semantic_closure_status:
          type: string
          enum: [pending, passed, stale]
        complexity_sanity_status:
          type: string
          enum: [pending, passed, review_required]
        complexity_sanity_flags:
          type: array
          uniqueItems: true
          items: {$ref: '#/$defs/complexity_sanity_flag'}
        complexity_sanity_note: {type: string}
        semantic_revision: {type: integer, minimum: 1}
        validated_semantic_revision: {type: integer, minimum: 1}
        semantic_change_categories:
          type: array
          uniqueItems: true
          items: {$ref: '#/$defs/semantic_change_category'}
        semantic_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        validated_semantic_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        artifact_hashes: {$ref: '#/$defs/artifact_hashes'}
        validated_artifact_hashes: {$ref: '#/$defs/artifact_hashes'}
        stale_layers:
          type: array
          uniqueItems: true
          items: {$ref: '#/$defs/artifact_layer'}
        data_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        validated_data_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        model_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        validated_model_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        artifacts_stale: {type: boolean, default: false}
        code: {type: string, description: 主求解脚本路径}
        result_analysis_code: {type: string, description: 独立结果深化分析脚本路径}
        primary_code_sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        analysis_code_sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        primary_execution_status:
          type: string
          enum: [pending, code_delivered, awaiting_user_execution, workbook_received, accepted, rejected]
        analysis_execution_status:
          type: string
          enum: [pending, code_delivered, awaiting_user_execution, workbook_received, accepted, rejected, redo_required]
        solution_workbook: {type: string}
        result_analysis_workbook: {type: string}
        robustness_workbook: {type: string, description: 旧项目兼容字段}
        result_quality_report: {type: string}
        result_analysis_report: {type: string}
        matlab_script: {type: string}
        paper_source: {type: string}
        solver_status: {type: string}
        optimality_claim: {type: string, enum: [none, local, heuristic, bounded, proven_optimal, global], default: none}
        random_seed:
          oneOf: [{type: integer}, {type: 'null'}]
        tolerance: {type: number, minimum: 0}
        optimality_gap:
          oneOf: [{type: number, minimum: 0}, {type: 'null'}]
        max_constraint_violation:
          oneOf: [{type: number, minimum: 0}, {type: 'null'}]
        result_quality_status: {type: string, enum: [pending, passed, failed]}
        execution_note: {type: string, description: 代码交付与用户本地运行状态说明}
        result_analysis_status: {type: string, enum: [pending, passed, failed, redo_required]}
        validation_status:
          description: 旧项目兼容汇总字段
          type: string
          enum: [pending, passed, failed, not_applicable]
        analysis_methods:
          type: array
          uniqueItems: true
          items: {type: string}
        evidence:
          type: array
          uniqueItems: true
          items: {type: string}
  variables:
    type: object
    additionalProperties: false
    required: [locked, source]
    properties:
      locked: {type: array, uniqueItems: true, items: {type: string}}
      source: {type: object, additionalProperties: {type: string}}
  paper_framework:
    type: object
    additionalProperties: false
    required: [path, version, sync_status, last_sync_scope, proposition_limit, proposition_count, proposition_status, propositions]
    properties:
      path: {type: string, const: 模型论文框架.md}
      version: {type: string, minLength: 1}
      mode: {type: string, enum: [compact, full], default: compact}
      sync_status: {type: string, enum: [current, stale]}
      last_synced_at: {type: string, format: date-time}
      last_sync_scope: {type: string, minLength: 1}
      sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      proposition_limit: {type: integer, const: 4}
      proposition_count: {type: integer, minimum: 0, maximum: 4}
      proposition_status: {type: string, enum: [not_assessed, planned, current, stale]}
      propositions:
        type: array
        maxItems: 4
        items: {$ref: '#/$defs/proposition_entry'}
  execution:
    type: object
    additionalProperties: false
    properties:
      owner: {type: string, enum: [user, assistant, external]}
      profile: {type: string, enum: [full_fidelity]}
      assistant_task_execution_allowed: {type: boolean}
      allow_reduced_data: {type: boolean}
      allow_coarser_grid: {type: boolean}
      allow_shorter_horizon: {type: boolean}
      allow_fewer_repetitions: {type: boolean}
      allow_relaxed_tolerance: {type: boolean}
      allow_silent_solver_fallback: {type: boolean}
      python_version: {type: string}
      matlab_version: {type: string}
      dependencies: {type: object, additionalProperties: {type: string}}
      last_run: {type: string, format: date-time}
      command: {type: string}
      platform: {type: string}
      last_sync_report: {type: string}
  artifacts:
    type: object
    additionalProperties: false
    required: [code, results, figures, papers]
    properties:
      code: {type: array, items: {type: string}}
      results: {type: array, items: {type: string}}
      figures: {type: array, items: {type: string}}
      papers: {type: array, items: {type: string}}
      sync_report: {type: string}
      approved_figures: {type: array, uniqueItems: true, items: {type: string}}
      docx: {type: array, uniqueItems: true, items: {type: string}}
      latex_source: {type: string}
      compiled_pdf: {type: string}
      compile_report: {type: string}
      submission_package: {type: string}
  risks: {type: array, items: {type: string}}
  next_gate:
    type: object
    additionalProperties: false
    required: [module, condition]
    properties:
      module: {type: string}
      condition: {type: string}
