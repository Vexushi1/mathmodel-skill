version: 6.3.0
schema: core/workbook_schema.yaml
bootstrap: core/bootstrap.yaml
taxonomy: core/task_taxonomy.yaml

project_root:
  problem_and_attachments: 赛题、附件数据表和说明文件直接放在项目根目录
  model_paper_framework: 模型论文框架.md
  project_state: state/project_state.yaml
  sync_report: sync_report.yaml
  python_scripts: 问题求解、检验、敏感性与鲁棒性Python脚本直接放在项目根目录
  result_tables: 结果数据表/
  draft_docx: draft_docx/
  final_latex: final_latex/

model_paper_framework:
  path: 模型论文框架.md
  template: templates/model/model_paper_framework.md
  create_after: locked_model_spec
  role: 当前有效模型语义、论文结构、命题规划、逐问结果摘要与图表映射
  modes:
    compact:
      use_when: 日常迭代、单问交付、普通聊天续作
      required_sections: [当前有效口径, 各问模型与结果, 图表证据链, 待办与缺口]
    full:
      use_when: 跨聊天交接、完整复现、DOCX/LaTeX终稿、终审提交
      required_sections: [当前有效口径, 论文整体框架, 命题与证明规划, 各问模型与结果, 综合检验与跨问结论, 图表证据链, 待办与缺口, 同步检查]
  default_mode: compact
  history_policy: 文件内部不累积旧版；旧版本由Git历史保存
  replacement_policy: 模型、参数、约束、数据处理、算法、命题、证明、结果或图表变化时，删除受影响旧内容并完整替换
  formal_delivery_sync: true
  sync_command: python scripts/sync_project.py <project_root> --write --strict
  result_summary_required_after: solved
  authoritative_boundaries:
    model_semantics_and_paper_structure: 模型论文框架.md
    machine_state_and_freshness: state/project_state.yaml
    numerical_results: 每问两类标准工作簿

project_sync:
  script: scripts/sync_project.py
  report: sync_report.yaml
  default_mode: dry_run
  write_flag: --write
  strict_flag: --strict
  responsibilities:
    - 发现根目录Python、每问工作簿、MATLAB脚本和图表
    - 读取工作簿真实工作表、表头与数据行数
    - 计算输入、模型、工作簿和框架哈希
    - 当已验证哈希变化时传播stale
    - 更新产物路径和同步报告
  forbidden:
    - 自动生成模型语义
    - 自动填写结果数值
    - 自动把validation_status提升为passed
    - 以文件存在代替可行性或正确性验证

classification_contract:
  taxonomy: core/task_taxonomy.yaml
  current_axes: [objective, structures, capabilities]
  legacy_task_labels_supported: true
  per_subproblem: true

proposition_contract:
  optional: true
  maximum_per_paper: 4
  minimum_per_paper: 0
  detail_pack: packs/artifact/proposition_proof.md
  lazy_load_when: [explicit_proof_request, proposition_count_greater_than_zero]
  latex_outer_environment: hskproposition
  latex_proof_environment: hskproof
  main_text_default_proof_level: outline
  main_text_key_steps_min: 2
  main_text_key_steps_max: 6
  required_fields: [proposition_id, assumptions_and_domain, conclusion, proof_level, modeling_effect, failure_boundary, status]
  display_contract:
    single_outer_box: true
    statement_and_proof_in_same_box: true
    nested_box_forbidden: true
    background: white
    border: thin
    shadow: false
    large_color_fill: false
    flowchart_or_mechanism_color_rule_applies: false
  hard_rules:
    - 命题必须实际服务问题简化、模型必要性、关键点识别、降维、约束删减、可行性保持或理论边界。
    - 数值实验、准确率比较和求解器退出状态不能替代数学证明。
    - 模型、参数、约束或定义域变化后必须重新检查相关证明。

per_question:
  question_directory: 结果数据表/问题{中文序号}/
  mandatory_workbooks:
    solution: 问题{中文序号}求解结果.xlsx
    sensitivity_robustness: 问题{中文序号}敏感性与鲁棒性结果.xlsx
  matlab_script: q{阿拉伯序号}_plot.m
  figure_directory: 图表/
  optional_editable_directory: 图表/可编辑源/

matlab_figure_contract:
  title_required: true
  single_panel_title: title
  multi_panel_title: sgtitle
  field_resolution: exact_header_unique_match
  expected_column_position: optional_drift_check
  fuzzy_matching_forbidden: true
  alias_guessing_forbidden: true
  keep_title_in_export_by_default: true
  caption_role: DOCX/LaTeX图注补充统计口径、数据范围和解释，不与图内标题逐字重复
  title_registry: 模型论文框架.md与Figure Contract

ownership:
  Python: 读取项目根目录题目附件，完成数据处理、求解、优化、仿真、检验、敏感性、鲁棒性并输出工作簿
  MATLAB: 与对应问题工作簿同目录，精确读取真实表头绘图，不重新计算核心结果
  other_figure_tools: GeoGebra、PPT、draw.io、SVG、TikZ可用于非数据驱动机理图

filenames:
  model_paper_framework: 模型论文框架.md
  project_state: state/project_state.yaml
  sync_report: sync_report.yaml
  python_scripts: 项目根目录中文描述性名称
  matlab_scripts: q1_plot.m、q2_plot.m等ASCII固定名称
  workbooks: 中文固定名称
  worksheets: 中文描述性名称，最长31字符
  figures: ASCII英文或拼音

optional_metadata:
  run_info.json: [full_reproduction, many_algorithms, cross_chat_handoff, final_review, explicit_request]
  result_manifest.yaml: [full_reproduction, many_algorithms, cross_chat_handoff, final_review, explicit_request]
  matlab_figure_handoff.json: [many_figures, cross_chat_handoff, explicit_request]
  metadata_location: 对应的结果数据表/问题X/

rules:
  - 每次正式模型、代码、工作簿、图表、DOCX、LaTeX或提交包交付前必须生成sync_report。
  - 同步器只做发现、哈希和stale传播，不替代求解与验证。
  - 不再默认创建Python求解/、MATLAB绘图/或问题X结果数据/重复层级。
  - Excel工作簿是默认结果交换格式；CSV仅用于明确兼容需求。
  - 所有工作表必须非空；不适用分析写入非空适用性说明。
