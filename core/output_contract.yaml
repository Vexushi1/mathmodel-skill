version: 6.4.1
schema: core/workbook_schema.yaml
bootstrap: core/bootstrap.yaml
taxonomy: core/task_taxonomy.yaml
project_root:
  problem_and_attachments: 赛题、附件数据表和说明文件直接放在项目根目录
  model_paper_framework: 模型论文框架.md
  project_state: state/project_state.yaml
  sync_report: sync_report.yaml
  python_scripts: 主求解、结果深化分析和专项检验Python脚本直接放在项目根目录
  result_tables: 结果数据表/
  draft_docx: draft_docx/
  final_latex: final_latex/
  submission: submission/
writing_policy:
  default_mode: latex_first
  default_sequence: [figure_evidence, writing_latex, ai_cleanup, latex_compile_quality]
  docx_mode: explicit_only_independent
  docx_is_latex_prerequisite: false
result_policy:
  primary_solve_role: 在当前题意、数据和模型口径下得到高精度、可行、收敛且可复算的主结果
  primary_quality_gate_required: true
  failed_quality_evidence_persisted: true
  downstream_admission_requires_quality_passed: true
  result_analysis_role: 在主结果通过质量门后解释形成机制、稳定范围、适用边界和算法或结构依赖
  result_analysis_method_selection: based_on_problem_model_data_result_and_reviewer_risk
  result_analysis_outcomes: [passed, failed, redo_required]
  fixed_perturbation_forbidden: true
  feedback_loop: 深化分析发现主结果不可靠时，自动写入redo_required、标记下游stale并回退模型设计或主求解
model_paper_framework:
  path: 模型论文框架.md
  template: templates/model/model_paper_framework.md
  create_after: locked_model_spec
  role: 当前有效模型语义、论文结构、命题规划、逐问主结果与深化分析摘要和图表映射
  modes:
    compact:
      use_when: 日常迭代、单问交付、普通聊天续作
      required_sections: [当前有效口径, 各问模型与结果, 图表证据链, 待办与缺口]
    full:
      use_when: 跨聊天交接、完整复现、DOCX/LaTeX终稿、终审提交
      required_sections: [当前有效口径, 论文整体框架, 命题与证明规划, 各问模型与结果, 综合检验与跨问结论, 图表证据链, 待办与缺口, 同步检查]
  validation_mode_priority: [cli, project_state, framework_header, default]
  default_mode: compact
  history_policy: 文件内部不累积旧版；旧版本由Git历史保存
  replacement_policy: 模型、参数、约束、数据处理、算法、主结果或深化分析变化时，删除受影响旧内容并完整替换
  formal_delivery_sync: true
  result_summary_required_after: solved
  authoritative_boundaries:
    model_semantics_and_paper_structure: 模型论文框架.md
    machine_state_and_freshness: state/project_state.yaml
    numerical_results: 主求解工作簿与结果深化分析工作簿
project_sync:
  role: formal_pre_delivery_gate
  script: scripts/sync_project.py
  report: sync_report.yaml
  default_mode: dry_run
  write_flag: --write
  strict_flag: --strict
  command: python scripts/sync_project.py <project_root> --write --strict --delivery-scope <scope>
  delivery_scopes: [design, results, figures, docx, latex, submission]
  phase_scope_mapping_role: 未显式传入delivery_scope时只用于报告标签，不激活正式交付全量要求
  implicit_phase_sync_semantics: status_minimum_only
  formal_scope_requires_explicit_flag: true
  phase_scope_mapping:
    problem_audit: design
    model_design: design
    solve_validate: results
    result_analysis: results
    figure_evidence: figures
    writing_docx: docx
    writing_latex: latex
    ai_cleanup: latex
    latex_compile_quality: latex
    review_delivery: submission
    completed: submission
  stage_requirements_authority: core/output_contract.yaml#project_sync.stage_requirements
  stage_requirements_semantics: exact_scope
  formal_state_requirements:
    result_quality_status: passed
    result_analysis_status: passed
    downstream_artifacts_stale: false
  stage_requirements:
    design: [project_state, model_paper_framework]
    results: [project_state, model_paper_framework, python_code, solution_workbook, result_quality_report, result_analysis_workbook, result_analysis_report]
    figures: [project_state, model_paper_framework, solution_workbook, result_quality_report, result_analysis_workbook, result_analysis_report, matlab_scripts, result_figures, figure_evidence]
    docx: [project_state, model_paper_framework, solution_workbook, result_quality_report, result_analysis_workbook, result_analysis_report, approved_figures, docx_draft]
    latex: [project_state, model_paper_framework, result_quality_report, result_analysis_report, approved_figures, latex_source, compiled_pdf, compile_report]
    submission: [project_state, model_paper_framework, result_quality_report, result_analysis_report, compiled_pdf, validated_submission_package]
  artifact_hash_layers: [data, model, solution_workbook, result_analysis_workbook, matlab_script, figure_bundle, framework]
  stale_propagation:
    data_or_model: [solution_workbook, result_quality, result_analysis_workbook, result_analysis, matlab_script, figure_bundle, result_summary]
    solution_workbook: [result_quality, result_analysis_workbook, result_analysis, matlab_script, figure_bundle, result_summary]
    result_analysis_workbook: [result_analysis, matlab_script, figure_bundle, result_summary]
    matlab_script: [figure_bundle, paper_figure_evidence]
    figure_bundle: [paper_figure_evidence]
  write_order:
  - 发现产物并执行工作簿与图表链检查
  - 计算当前分层哈希并比较已验证哈希
  - 传播stale并更新框架头部
  - 重新计算最终框架哈希
  - 写入project_state
  - 写入sync_report
  - 执行写后哈希自检
  responsibilities:
  - 进入产物同步前强制执行项目状态Schema/语义校验与模型论文框架校验
  - 发现根目录Python、每问主求解与结果深化工作簿、MATLAB脚本和图表
  - 复用工作簿Schema检查工作表、字段、capability条件、主键、非有限数值和约束判定
  - 普通阶段同步按小问status检查最低产物；只有显式delivery scope执行正式交付全量门槛
  - 正式交付同时核对工作簿存在、质量与分析状态为passed以及下游产物非stale
  - 核对MATLAB工作簿引用、声明导出图、正式图存在性和时间新旧关系
  - 计算输入、模型、两类工作簿、MATLAB脚本、图表包和框架哈希
  - 当已验证哈希变化时按证据链传播stale
  - 只允许设置或保持stale；清除stale必须由质量门或结果分析流程在完整验证哈希覆盖后显式完成
  - 对DOCX、LaTeX与提交scope检查真实文件、编译报告、图片引用和提交ZIP内容
  forbidden:
  - 自动生成模型语义
  - 自动清除artifacts_stale或stale_layers
  - 自动填写结果数值
  - 自动把result_quality_status或result_analysis_status提升为passed
  - 以文件存在代替可行性、精度或稳定性验证
  artifact_hash_semantics:
    global_framework: paper_framework.sha256记录完整模型论文框架文件哈希
    subproblem_framework: subproblem.artifact_hashes.framework记录framework_section对应章节哈希
  data_hash_policy:
    primary: state/project_state.yaml中的data.sources
    fallback: 仅扫描根目录数据型文件，不包含PDF、DOCX、ZIP和正式交付目录
  figure_provenance:
    record: 结果数据表/问题X/figure_evidence.yaml
    hashes: [solution_workbook, result_analysis_workbook, matlab_script, figure_bundle, individual_figures]
    mtime_role: 缺少哈希证据时的辅助警告，不作为主要判定
classification_contract:
  taxonomy: core/task_taxonomy.yaml
  current_axes: [objective, structures, capabilities]
  per_subproblem: true
  authoritative_locations:
    objective_and_structures: subproblem.classification
    capabilities: subproblem.capabilities
  deprecated_aliases:
    classification.capabilities: 若保留必须与顶层capabilities完全一致
    problem_types: 由三轴分类派生的旧Pack兼容字段
    legacy_task_packs: 由三轴分类派生的旧Pack兼容字段
  legacy_task_labels_supported: true
proposition_contract:
  optional: true
  maximum_per_paper: 4
  minimum_per_paper: 0
  detail_pack: packs/artifact/proposition_proof.md
  lazy_load_when: [explicit_proof_request, proposition_count_greater_than_zero]
  latex_outer_environment: hskproposition
  latex_proof_environment: hskproof
  main_text_default_proof_level: outline
  main_text_key_steps_min: 2
  main_text_key_steps_max: 6
  required_fields: [proposition_id, assumptions_and_domain, conclusion, proof_level, modeling_effect, failure_boundary, status]
  hard_rules:
  - 命题必须实际服务问题简化、模型必要性、关键点识别、降维、约束删减、可行性保持或理论边界。
  - 数值实验、准确率比较和求解器退出状态不能替代数学证明。
  - 模型、参数、约束或定义域变化后必须重新检查相关证明。
per_question:
  question_directory: 结果数据表/问题{中文序号}/
  mandatory_workbooks:
    solution: 问题{中文序号}求解结果.xlsx
    result_analysis: 问题{中文序号}结果深化分析.xlsx
  matlab_script: q{阿拉伯序号}_plot.m
  figure_directory: 图表/
  optional_editable_directory: 图表/可编辑源/
  legacy_compatibility:
    sensitivity_robustness_filename: 旧项目只读兼容，不得用于新交付
matlab_figure_contract:
  title_required: true
  single_panel_title: title
  multi_panel_title: sgtitle
  field_resolution: exact_header_unique_match
  expected_column_position: optional_drift_check
  fuzzy_matching_forbidden: true
  alias_guessing_forbidden: true
  workbook_reference_scope: same_question_standard_workbooks
  declared_export_must_exist: true
  formal_figure_must_not_predate_sources: true
  keep_title_in_export_by_default: true
  caption_role: DOCX/LaTeX图注补充统计口径、数据范围和解释，不与图内标题逐字重复
  title_registry: 模型论文框架.md与Figure Contract
  workbook_reference_required: true
  handoff_alternative: matlab_figure_handoff.json/yaml
  provenance_record: figure_evidence.yaml
  mtime_role: auxiliary_warning_only
ownership:
  Python: 主求解阶段完成高精度求解与质量门；随后按题设计结果深化分析并输出对应工作簿
  MATLAB: 与对应问题工作簿同目录，精确读取真实表头绘图，不重新计算核心结果
  other_figure_tools: GeoGebra、PPT、draw.io、SVG、TikZ可用于非数据驱动机理图
filenames:
  model_paper_framework: 模型论文框架.md
  project_state: state/project_state.yaml
  sync_report: sync_report.yaml
  python_scripts: 项目根目录中文描述性名称
  matlab_scripts: q1_plot.m、q2_plot.m等ASCII固定名称
  workbooks: 中文固定名称
  worksheets: 中文描述性名称，最长31字符
  figures: ASCII英文或拼音
optional_metadata:
  run_info.json: [full_reproduction, many_algorithms, cross_chat_handoff, final_review, explicit_request]
  result_manifest.yaml: [full_reproduction, many_algorithms, cross_chat_handoff, final_review, explicit_request]
  matlab_figure_handoff.json: [many_figures, cross_chat_handoff, explicit_request]
  metadata_location: 对应的结果数据表/问题X/
rules:
- 每次正式模型、代码、工作簿、图表、DOCX、LaTeX或提交包交付前必须成功执行project_sync gate并生成sync_report。
- 同步器只做发现、校验、哈希和stale传播，不替代主求解质量门与结果深化分析。
- 普通阶段同步不等于正式results交付；只有显式--delivery-scope启用对应stage_requirements。
- 不再默认创建Python求解/、MATLAB绘图/或问题X结果数据/重复层级。
- Excel工作簿是默认结果交换格式；CSV仅用于明确兼容需求。
- 所有工作表必须非空；不生成不适用分析的占位工作表。
