  workbook: 数据预处理结果.xlsx
  matlab_script: data_process.m
  exact_default_files:
  - 数据预处理.py
  - 数据预处理结果.xlsx
  - data_process.m
  no_auxiliary_files_by_default: true
  raw_data_reader_exclusive_when_project_level: true
  downstream_raw_read_forbidden_when_project_level: true
  workbook_is_single_project_data_entry_when_project_level: true
  matlab_reprocessing_forbidden: true
  absent_when: preprocessing_decision in [not_needed, question_local]
per_question:
  question_directory: 问题{中文序号}求解/
  python_scripts:
    primary: 问题{中文序号}求解.py
    result_analysis: 问题{中文序号}结果深化分析.py
  mandatory_workbooks:
    solution: 问题{中文序号}求解结果.xlsx
    result_analysis: 问题{中文序号}结果深化分析.xlsx
  matlab_script: q{阿拉伯序号}_plot.m
  exact_default_files:
  - 问题{中文序号}求解.py
  - 问题{中文序号}求解结果.xlsx
  - 问题{中文序号}结果深化分析.py
  - 问题{中文序号}结果深化分析.xlsx
  - q{阿拉伯序号}_plot.m
  two_python_stage_policy:
    primary: 主求解阶段交付问题X求解.py；数据入口由preprocessing_decision决定，主工作簿accepted后冻结该脚本。
    result_analysis: 主工作簿accepted后单独生成问题X结果深化分析.py；该脚本继承同一preprocessing_decision与数据事实源并形成深化分析工作簿。
    no_backwrite: 深化分析不得通过改写问题X求解.py实现；若主模型确需修改，则明确回退solve_validate并重新验收主结果。
    raw_shared_data_read: 只有decision=project_level时禁止两个小问Python直接读取对应共享原始数据源。
  no_auxiliary_files_by_default: true
  legacy_compatibility:
    result_directory: 结果数据表/问题{中文序号}/
    single_evolving_python: v6.6.x仅问题X求解.py的四文件项目可只读兼容
    sensitivity_robustness_filename: 问题{中文序号}敏感性与鲁棒性结果.xlsx
    mode: read_only
matlab_figure_contract:
  title_required: true
  single_panel_title: title
  multi_panel_title: sgtitle
  field_resolution: exact_header_unique_match
  expected_column_position: optional_drift_check
  fuzzy_matching_forbidden: true
  alias_guessing_forbidden: true
  workbook_reference_scope: current_data_source_when_needed_and_same_question_standard_workbooks
  declared_export_must_exist: false
  formal_figure_must_not_predate_sources: false
  keep_title_in_export_by_default: true
  caption_role: DOCX/LaTeX图注补充统计口径、数据范围和解释，不与图内标题逐字重复
  title_registry: 模型论文框架.md与Figure Contract
  workbook_reference_required: true
  preprocessing_script: 数据预处理/data_process.m
  preprocessing_export_stem: data_process
  preprocessing_source_workbook: 数据预处理/数据预处理结果.xlsx
  preprocessing_matlab_must_not_reprocess: true
  handoff_alternative: matlab_figure_handoff.json/yaml
  provenance_record: null
  mtime_role: 仅作辅助警告
  default_output: 每问交付同目录qX_plot.m；project_level另交付数据预处理/data_process.m；图窗由用户人工检查和按需导出
ownership:
  Python_preprocessing: 仅preprocessing_decision=project_level时生成；负责共享原始数据的公共审计与已批准处理、论文方法/验证证据和绘图底层数据并输出统一工作簿，不求解小问核心模型。
  MATLAB_preprocessing: 仅project_level时由data_process.m读取统一工作簿绘制处理前后与验证证据；不重新清洗、插值、滤波、重采样或估计参数。
  Python: 每问维护同目录两个题目专属脚本；not_needed/question_local可读取原始数据，project_level读取统一工作簿。问题X求解.py负责主求解，问题X结果深化分析.py负责主结果验收后的独立深化分析。
  MATLAB: 同目录qX_plot.m精确读取本问两个标准工作簿，并仅在图确实需要底层数据时按preprocessing_decision读取原始数据或统一预处理工作簿；不重新计算核心结果，默认不自动导出图片
  other_figure_tools: GeoGebra、PPT、draw.io、SVG、TikZ可用于非数据驱动机理图
filenames:
  preprocessing_script: 数据预处理/数据预处理.py（仅project_level）
  preprocessing_workbook: 数据预处理/数据预处理结果.xlsx（仅project_level）
  preprocessing_matlab_script: 数据预处理/data_process.m（仅project_level，图表阶段生成）
  model_paper_framework: 模型论文框架.md
  project_state: state/project_state.yaml
  sync_report: sync_report.yaml
  python_scripts:
  - 问题X求解/问题X求解.py
  - 问题X求解/问题X结果深化分析.py
  matlab_scripts: 数据预处理/data_process.m（project_level）以及问题X求解/q1_plot.m、q2_plot.m等ASCII固定名称
  workbooks: 中文固定名称
  worksheets: 中文描述性名称，最长31字符
  figures: ASCII英文或拼音；预处理图基名data_process或data_process_<evidence>
optional_metadata:
  default_generation: forbidden
  explicit_request_only:
  - run_info.json
  - result_manifest.yaml
  - matlab_figure_handoff.json
  rule: 不得放入问题X求解目录或数据预处理目录；仅在用户明确要求完整复现包时放入项目内部元数据目录
rules:
- 所有数据题先做非破坏性数据审计并锁定preprocessing_decision；审计不等于清洗。
- 预处理判定必须以当前附件的缺失结构、单位/主键/时间/坐标一致性、有效性、重复身份、采样覆盖、测量质量、模型输入要求和时间因果/信息泄漏风险为依据；不得从题型或过去赛题套固定处理模板。
- 两个及以上小问共享同一原始数据，只触发统一口径审计，不自动触发项目级预处理。
- preprocessing_decision=not_needed时不创建数据预处理目录，各问可直接读取原始数据并保留必要检查。
- preprocessing_decision=question_local时不创建全局预处理目录，本问可执行有数学来源的局部变换；实质变换必须写公式/定义、参数依据和验证，必要图由qX_plot.m承接。
- preprocessing_decision=project_level时才创建数据预处理目录；最终默认恰好包含数据预处理.py、数据预处理结果.xlsx和data_process.m；一个总表指一个统一工作簿，可含多个对象语义明确的工作表。
- 只有project_level时，共享原始数据在统一工作簿验收后只允许数据预处理.py作为公共处理入口，依赖小问主求解、深化分析和数据型MATLAB流程不得再次直接读取对应共享原始数据。
- project_level统一工作簿质量门未通过时必须停在awaiting_user_preprocessing；其他两种decision不得因为缺少统一工作簿而阻塞。
- 缺失填补、预测填补、异常删除、插值、平滑、滤波、去趋势、归一化、标准化和重采样等操作必须有数据/机理/模型必要性证据；有缺失不等于必须插值，赛题本身要求的预测结果不得包装为预处理。
- 只要实际预处理参与后续模型，论文必须闭合问题证据、数学公式/确定性映射、参数依据、方法验证、处理前后证据、图和模型接口；形式证明仅在数学上适用时使用。
- project_level进入figure_evidence时必须生成data_process.m，并至少形成一张预处理必要性或有效性证据图；MATLAB不得重新执行预处理。
- 新项目每问只创建一个问题X求解目录，默认最终恰好包含两个Python脚本、两个Excel工作簿和一个qX_plot.m。
- Problem Contract、preprocessing_decision、语义闭环与复杂度复审先于正式模型和代码交付，不能用运行成功或结果合理替代语义正确性。
- 主工作簿accepted后冻结问题X求解.py，并单独生成问题X结果深化分析.py；不得为深化分析覆盖改写主求解脚本。
- 默认不生成独立完整运行配置、运行说明、code_delivery_report、user_execution_validation_report、semantic_governance_report、figure_evidence或图表子目录。
- 实际生成的项目级预处理脚本和两个正式小问Python脚本都必须通过静态工程质量检查且不得由助手执行；校验结果在聊天或标准输出中返回，不额外落盘。
- 用户返回的适用预处理工作簿和小问工作簿均必须先通过对应质量门；代码交付本身不得把状态提升为solved或analyzed。
- 同步器只做发现、校验、哈希和stale传播，不替代语义治理、条件式预处理质量门、主求解质量门与结果深化分析。
- v7.8算法流程呈现按not_needed/stepwise/pseudocode自适应；只有真实多阶段或控制流有信息价值时单列，并由Algorithm Trace连接模型/命题、Python实现与工作簿结果。
- v7.8不把Python源码压缩成论文伪代码，也不要求每问设置Algorithm 1；算法语义变化继续使用既有semantic_change_categories=algorithm传播stale。
- v7.7核心答案的展示精度优先服从题目、官方格式和评分精度；若后续小数位可能计分，不得为摘要简洁或版面美观擅自降低精度。
- v7.7正文自然语言术语优先使用Terminology Registry中的canonical term；机器只对已登记别名/易混词做提示，不猜测数学语义。
- v7.7深化分析每项证据必须指向target claim并记录support/modify/reject；reject核心答案必须回退，reject非核心评价可删除/重写。
- v7.7框架v0.8使用局部paper fragment stale；v0.7及更早项目保持只读兼容，不强迫历史项目无条件迁移。
- v7.2.0--v7.2.2旧项目重新进入模型设计、预处理、绘图或写作时继续沿用三态preprocessing_decision，并按当前通用审计与论文证据规则复核；只读历史交付不强制反向补文件。
- v7.1.x及更早旧项目可只读；重新进入当前流程时先做数据审计和preprocessing_decision。
- v7.0.x缺少语义治理字段的旧项目可只读；重新进入审题或模型设计时补齐当前语义字段。
- v6.6.x四文件项目和旧结果数据表/问题X/仅作只读兼容；新项目或重新深化分析时使用五文件结构。
- Excel工作簿是默认结果交换格式；CSV仅用于明确兼容需求。
- 所有工作表必须非空；不生成不适用分析的占位工作表。
