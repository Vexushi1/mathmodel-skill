version: 7.8.1
schema: core/workbook_schema.yaml
preprocessing_contract: core/global_preprocessing_contract.yaml
user_execution_contract: core/user_execution_contract.yaml
code_quality_contract: core/code_quality_contract.yaml
writing_reasoning_contract: core/writing_reasoning_contract.yaml
bootstrap: core/bootstrap.yaml
taxonomy: core/task_taxonomy.yaml
project_root:
  problem_and_attachments: 赛题、附件数据表和说明文件直接放在项目根目录
  preprocessing_outputs: 仅preprocessing_decision=project_level时创建数据预处理/；最终包含数据预处理.py、数据预处理结果.xlsx和data_process.m
  model_paper_framework: 模型论文框架.md
  project_state: state/project_state.yaml
  sync_report: sync_report.yaml
  draft_docx: draft_docx/
  final_latex: final_latex/
  submission: submission/
  per_question_outputs: 问题{中文序号}求解/
writing_policy:
  role: 写作契约只保存权威指针与运行时开关，不复制正文规则。
  default_mode: latex_first
  default_sequence:
  - figure_evidence
  - writing_latex
  - ai_cleanup
  - latex_compile_quality
  docx_mode: explicit_only_independent
  docx_is_latex_prerequisite: false
  expression_authority: modules/05_writing/latex.md
  reasoning_contract: core/writing_reasoning_contract.yaml
  rule_governance: core/writing_reasoning_contract.yaml#rule_governance
  citation_evidence_contract: core/writing_reasoning_contract.yaml#citation_evidence
  terminology_contract: core/writing_reasoning_contract.yaml#terminology_governance
  numeric_style_contract: core/writing_reasoning_contract.yaml#numeric_style_contract
  title_claim_contract: core/writing_reasoning_contract.yaml#title_claim_gate
  analysis_evidence_disposition_contract: core/writing_reasoning_contract.yaml#analysis_evidence_disposition
  paragraph_necessity_contract: core/writing_reasoning_contract.yaml#paragraph_necessity
  paper_fragment_stale_contract: core/writing_reasoning_contract.yaml#paper_fragment_stale_governance
  proposition_governance: core/writing_reasoning_contract.yaml#proposition_governance
  algorithm_presentation_contract: core/writing_reasoning_contract.yaml#algorithm_presentation
  core_model_summary_policy: adaptive_required_inline_not_applicable
  prose_audit_script: scripts/audit_paper_prose.py
  prose_audit_framework_flag: --framework
  prose_audit_default_mode: report_only
  prose_audit_strict_blocks_on: [blocking, review_required]
  core_result_precision_priority: scoring_and_official_output_requirements
  high_precision_default_when_scoring_sensitive: 6--7_decimal_places_unless_more_specific_requirement
  carrier_specific:
    docx: modules/05_writing/docx.md
    latex: packs/artifact/latex.md
    proposition_proof: packs/artifact/proposition_proof.md
    algorithm_flow: packs/artifact/algorithm_flow.md
  consumer_rule: modules、packs、checklists与review只引用Authority，不重新定义正文规则。
execution_policy:
  default_owner: user
  default_profile: full_fidelity
  assistant_task_code_execution_allowed: false
  semantic_governance_gate: scripts/validate_semantic_governance.py
  code_delivery_gate: scripts/validate_code_delivery.py
  code_quality_contract: core/code_quality_contract.yaml
  returned_workbook_gate: scripts/validate_user_execution.py
  pause_states:
  - awaiting_user_preprocessing
  - awaiting_user_execution
  code_delivery_does_not_promote_result_status: true
  preprocessing_decision_required_before_solve: true
  preprocessing_required_before_solve_when_decision: project_level
  shared_data_alone_does_not_require_preprocessing: true
  preprocessing_paper_evidence_required_when_operations_nonempty: true
  preprocessing_matlab_required_for_project_level_figures: true
  preprocessing_matlab_filename: data_process.m
  analysis_code_requires_primary_workbook_accepted: true
  primary_code_freezes_after_acceptance: true
  full_fidelity_flags_must_be_false:
  - allow_reduced_data
  - allow_coarser_grid
  - allow_shorter_horizon
  - allow_fewer_repetitions
  - allow_relaxed_tolerance
  - allow_silent_solver_fallback
semantic_governance:
  version: 1.0.0
  script: scripts/validate_semantic_governance.py
  role: 在模型设计、条件式统一数据预处理、代码交付、工作簿验收和正式下游交付前检查题意口径、三层语义闭环、复杂度合理性、preprocessing_decision、语义变更影响与v0.8论文局部stale依赖
  report_persistence: stdout_or_chat_only
  framework_scope: 每问#### 当前模型口径至#### 结果摘要之前的当前语义区
  required_for_designed_or_later:
    problem_contract_status: frozen
    semantic_closure_status: passed
    complexity_sanity_status: passed
    preprocessing_decision_status: locked
    semantic_revision_min: 1
    semantic_change_categories_nonempty: true
  problem_contract_required_fields:
  - research_object
  - original_objects
  - derived_objects
  - known_quantities
  - computable_quantities
  - decision_variables
  - state_variables
  - outputs
  - explicit_constraints
  - implicit_constraints
  - forbidden_assumptions
  - data_roles
  - typed_dependencies
  semantic_closure_chain: 题面对象与要求 -> 数学变量/公式/目标/约束 -> Python变量/函数 -> 工作簿输出或验证证据
  semantic_change_categories:
  - problem_definition
  - data_scope
  - variable
  - parameter
  - assumption
  - objective
  - constraint
  - preprocessing
  - algorithm
  - dependency
  complexity_sanity_flags:
  - unused_problem_conditions
  - unused_attachment_fields
  - unexpected_dimension_collapse
  - unexpected_decoupling
  - dynamic_to_static_collapse
  - multi_agent_to_independent
  - inactive_key_constraints
  - downstream_copy
  - implausibly_easy_computation
  dependency_kinds: [data, parameter, model, result]
  change_policy:
  - 语义变化必须递增semantic_revision并记录具体semantic_change_categories。
  - preprocessing_decision、实际公共预处理的源数据、参数、脚本或输出口径变化属于preprocessing语义变化。
  - 共享数据但decision=not_needed时，不得因为不存在统一工作簿而虚构preprocessing stale。
  - 已验证语义发生变化时，本问主结果及相关下游先标记stale。
  - 按depends_on递归传播到实际依赖的小问，不能无差别失效全部小问。
  - v0.8项目继续按Paper Fragment Dependency Map传播到真实依赖的正文、摘要、模型评价、图表和Title Claim；无关问题和背景保持current。
  - v0.8的paper_framework.sync_status表示框架已同步记录当前状态，不等于所有paper fragment均current。
  - 接受新的语义哈希不等于恢复旧数值；需要重新处理的数据、求解和验收完成后才能清除对应数值stale。
  - 模型论文框架只保存当前有效语义，历史由Git保存，不新增用户项目变更日志文件。
  legacy_compatibility:
    v7_6_framework_v0_7_whole_framework_stale_semantics: read_only_compatible
    v7_2_0_projects_without_preprocessing_decision: read_only
    v7_1_projects_without_global_preprocessing: read_only
    v7_0_projects_without_fields: read_only
    migration_trigger: 旧项目重新进入当前写作/终审时迁移框架v0.8语义；重新进入problem_audit、model_design或solve_validate时先补齐preprocessing_decision，只有判为project_level才迁移到统一预处理结构
result_policy:
  preprocessing_decision_role: 所有数据项目先判断原始数据是否可直接建模、是否仅需本问局部变换、或是否确需项目级公共处理
  preprocessing_role: 仅decision=project_level时一次性完成共享原始数据审计与有依据的公共处理，形成依赖小问的数据入口，并持久化论文数学方法、验证和data_process绘图底层证据
  preprocessing_quality_gate_required_when: preprocessing_decision == project_level
  preprocessing_paper_chain: 问题证据 -> 数学公式/定义 -> 参数依据 -> 方法验证 -> 处理前后证据 -> data_process或qX_plot图 -> 后续模型接口
  primary_solve_role: 在当前题意、当前数据事实源和模型口径下得到高精度、可行、收敛且可复算的主结果
  primary_quality_gate_required: true
  failed_quality_evidence_persisted: true
  downstream_admission_requires_quality_passed: true
  result_analysis_role: 在主结果通过质量门后解释形成机制、稳定范围、适用边界和算法或结构依赖
  result_analysis_method_selection: based_on_problem_model_data_result_and_reviewer_risk
  result_analysis_dispositions: [support, modify, reject]
  result_analysis_disposition_authority: core/writing_reasoning_contract.yaml#analysis_evidence_disposition
  result_analysis_outcomes:
  - passed
  - failed
  - redo_required
  fixed_perturbation_forbidden: true
  feedback_loop: 深化分析发现主结果不可靠时，按target claim与disposition决定删除/改写局部主张或写入redo_required，并按真实依赖传播下游stale
model_paper_framework:
  path: 模型论文框架.md
  template: templates/model/model_paper_framework.md
  current_template_version: v0.8-project-memory
  create_after: locked_model_spec
  role: 当前项目事实与工作记忆；保存题意口径、preprocessing_decision、模型语义、Formula Trace、Algorithm Trace、参数证据、跨问依赖、写作选择、命题、Citation Evidence、Terminology Registry、Numeric Profile、Title Claim、Paper Fragment、深化证据处置、逐问结果摘要和图表映射，不复制跨项目写作手册。
  project_memory_only: true
  modes:
    compact:
      use_when: 日常迭代、单问交付、普通聊天续作
      required_sections:
      - 当前有效口径
      - 各问模型与结果
      - 图表证据链
      - 待办与缺口
    full:
      use_when: 跨聊天交接、完整复现、DOCX/LaTeX终稿、终审提交
      required_sections:
      - 当前有效口径
      - 论文整体框架
      - 命题与证明规划
      - 各问模型与结果
      - 综合检验与跨问判断
      - 图表证据链
      - 待办与缺口
      - 同步检查
  validation_mode_priority:
  - cli
  - project_state
  - framework_header
  - default
  default_mode: compact
  history_policy: 文件内部不累积旧版；旧版本由Git历史保存
  replacement_policy: 题意解释、模型、参数、约束、preprocessing_decision、数据处理、算法、主结果或深化分析变化时，删除受影响旧内容并完整替换
  formal_delivery_sync: true
  local_fragment_stale_from: v0.8-project-memory
  result_summary_required_after: solved
  authoritative_boundaries:
    model_semantics_and_paper_structure: 模型论文框架.md
    writing_rules: modules/05_writing/latex.md + core/writing_reasoning_contract.yaml
    preprocessing_decision_and_active_data_source: state/project_state.yaml + core/global_preprocessing_contract.yaml
    preprocessing_workbook_when_project_level: 数据预处理结果.xlsx
    preprocessing_figure_script_when_project_level: 数据预处理/data_process.m
    semantic_revision_dependency_hash_and_freshness: state/project_state.yaml
    paper_fragment_dependency_and_freshness: state/project_state.yaml + 模型论文框架.md
    numerical_results: 主求解工作簿与结果深化分析工作簿
project_sync:
  role: formal_pre_delivery_gate_after_semantic_governance
  script: scripts/sync_project.py
  report: sync_report.yaml
  default_mode: dry_run
  write_flag: --write
  strict_flag: --strict
  command: python scripts/sync_project.py <project_root> --write --strict --delivery-scope <scope>
  delivery_scopes:
  - design
  - code
  - results
  - figures
  - docx
  - latex
  - submission
  phase_scope_mapping_role: 未显式传入delivery_scope时只用于报告标签，不激活正式交付全量要求
  implicit_phase_sync_semantics: status_minimum_only
  formal_scope_requires_explicit_flag: true
  phase_scope_mapping:
    problem_audit: design
    model_design: design
    data_preprocessing: code
    solve_validate: code
    result_analysis: code
    figure_evidence: figures
    writing_docx: docx
    writing_latex: latex
    ai_cleanup: latex
    latex_compile_quality: latex
    review_delivery: submission
    completed: submission
  stage_requirements_authority: core/output_contract.yaml#project_sync.stage_requirements
  stage_requirements_semantics: exact_scope
  conditional_stage_requirements_semantics: additive_when_condition_true_without_changing_base_exact_scope
  formal_state_requirements:
    result_quality_status: passed
    result_analysis_status: passed
    downstream_artifacts_stale: false
    v0_8_delivery_paper_fragments_stale: false
  stage_requirements:
    design:
    - project_state
    - model_paper_framework
    code:
    - project_state
    - model_paper_framework
    - python_code
    results:
    - project_state
    - model_paper_framework
    - python_code
    - result_analysis_code
    - solution_workbook
    - result_quality_report
    - result_analysis_workbook
    - result_analysis_report
    figures:
    - project_state
    - model_paper_framework
    - solution_workbook
    - result_quality_report
    - result_analysis_workbook
    - result_analysis_report
    - matlab_scripts
    docx:
    - project_state
    - model_paper_framework
    - solution_workbook
    - result_quality_report
    - result_analysis_workbook
    - result_analysis_report
    - approved_figures
    - docx_draft
    latex:
    - project_state
    - model_paper_framework
    - result_quality_report
    - result_analysis_report
    - approved_figures
    - latex_source
    - compiled_pdf
    - compile_report
    submission:
    - project_state
    - model_paper_framework
    - result_quality_report
    - result_analysis_report
    - compiled_pdf
    - validated_submission_package
  conditional_stage_requirements:
    preprocessing_decision_project_level:
      condition: preprocessing_decision == project_level
      code: [preprocessing_code, preprocessing_workbook]
      results: [preprocessing_workbook]
      figures: [preprocessing_workbook, preprocessing_matlab_script]
      docx: [preprocessing_workbook, preprocessing_matlab_script]
      latex: [preprocessing_workbook, preprocessing_matlab_script]
      submission: [preprocessing_workbook, preprocessing_matlab_script]
    preprocessing_decision_not_needed_or_question_local:
      condition: preprocessing_decision in [not_needed, question_local]
      forbidden_required_artifacts: [preprocessing_code, preprocessing_workbook, preprocessing_matlab_script]
  artifact_hash_layers:
  - raw_data
  - preprocessing_decision
  - preprocessing_code
  - preprocessing_workbook
  - preprocessing_matlab_script
  - model
  - solution_workbook
  - result_analysis_workbook
  - matlab_script
  - figure_bundle
  - framework
  stale_propagation:
    raw_data:
    - preprocessing_workbook
    - preprocessing_matlab_script
    - solution_workbook
    - result_quality
    - result_analysis_workbook
    - result_analysis
    - matlab_script
    - figure_bundle
    - result_summary
    preprocessing_decision_or_project_level_preprocessing:
    - preprocessing_matlab_script
    - solution_workbook
    - result_quality
    - result_analysis_workbook
    - result_analysis
    - matlab_script
    - figure_bundle
    - result_summary
    data_or_model:
    - solution_workbook
    - result_quality
    - result_analysis_workbook
    - result_analysis
    - matlab_script
    - figure_bundle
    - result_summary
    preprocessing_workbook:
    - preprocessing_matlab_script
    - solution_workbook
    - result_quality
    - result_analysis_workbook
    - result_analysis
    - matlab_script
    - figure_bundle
    - result_summary
    preprocessing_matlab_script:
    - figure_bundle
    - paper_figure_evidence
    primary_code:
    - solution_workbook
    - result_quality
    - result_analysis_workbook
    - result_analysis
    - matlab_script
    - figure_bundle
    - result_summary
    analysis_code:
    - result_analysis_workbook
    - result_analysis
    - matlab_script
    - figure_bundle
    - result_summary
    solution_workbook:
    - result_quality
    - result_analysis_workbook
    - result_analysis
    - matlab_script
    - figure_bundle
    - result_summary
    result_analysis_workbook:
    - result_analysis
    - matlab_script
    - figure_bundle
    - result_summary
    matlab_script:
    - figure_bundle
    - paper_figure_evidence
    figure_bundle:
    - paper_figure_evidence
    paper_fragment_dependency:
    - only_fragments_with_real_dependency
  write_order:
  - 读取preprocessing_decision并按当前数据事实源发现项目级可选预处理产物与每问产物
  - 执行工作簿与图表链检查
  - 计算当前分层哈希并比较已验证哈希、条件式预处理哈希、data_process哈希和两阶段小问代码哈希
  - 按小问depends_on传播数值stale；v0.8再按Paper Fragment Dependency Map传播论文局部stale
  - 更新框架同步头；v0.8框架current只表示状态已同步，局部stale保留在paper_fragments
  - 重新计算最终框架哈希
  - 写入project_state
  - 写入sync_report
  - 执行写后哈希自检
  responsibilities:
  - 正式交付前先由semantic_governance检查当前模型语义、preprocessing_decision和跨问失效传播
  - 进入产物同步前强制执行项目状态Schema/语义校验与模型论文框架校验
  - decision=project_level时发现数据预处理目录中的统一预处理Python、工作簿和图表阶段data_process.m；其他状态不得因缺少该目录报错
  - 发现每问问题X求解目录中的主求解Python、结果深化分析Python、两类工作簿和qX_plot.m
  - 只有decision=project_level时检查依赖下游脚本不得再次直接读取对应共享原始数据源
  - 复用工作簿Schema检查工作表、字段、capability条件、主键、非有限数值和约束判定
  - 普通阶段同步按小问status检查最低产物；只有显式delivery scope执行正式交付全量门槛
  - 正式交付按decision条件核对预处理质量，再核对主结果质量、分析状态为passed以及下游数值产物和v0.8 paper fragments非stale
  - project_level进入figures及后续scope时必须核对data_process.m存在、引用数据预处理结果.xlsx且不重新执行预处理；question_local需要局部处理图时由qX_plot.m承接
  - 核对MATLAB只读取其实际需要的数据事实源和标准工作簿，不要求所有qX_plot.m强制引用统一预处理工作簿
  - project_level时统一预处理脚本/工作簿哈希绑定依赖数据链，data_process.m只影响预处理图表/论文层；not_needed/question_local时以原始数据哈希作为数据事实源
  - 主求解脚本哈希与本问主结果链绑定；深化分析脚本哈希只影响本问深化工作簿及其下游
  - 当已验证哈希变化时按实际依赖证据链传播stale
  - v0.8只把stale传播到依赖该小问/上游paper fragment的论文片段；不得因为单问变化使整篇无关章节stale
  - 只允许设置或保持stale；清除stale必须由适用的数据质量门、主结果质量门、结果分析流程或对应论文片段重写复核显式完成
  - 对DOCX、LaTeX与提交scope检查真实文件、编译报告、图片引用和提交ZIP内容
  forbidden:
  - 自动生成模型语义或preprocessing_decision
  - 因共享数据自动把preprocessing_decision提升为project_level
  - 自动清除artifacts_stale、stale_layers或paper fragment stale
  - 自动填写结果数值
  - 自动把preprocessing_quality_status、result_quality_status或result_analysis_status提升为passed
  - 以文件存在代替数据质量、可行性、精度、预处理验证或稳定性验证
  artifact_hash_semantics:
    global_framework: paper_framework.sha256记录完整模型论文框架文件哈希
    preprocessing_decision: 项目级预处理判定本身属于数据/模型语义层
    preprocessing_code: 仅project_level时绑定依赖共享数据下游
    preprocessing_workbook: 仅project_level时作为依赖小问数据哈希事实源，同时保存论文/图证据底层数据
    preprocessing_matlab_script: data_process.m只影响预处理图表与论文证据层，不改变已验收数值数据事实源
    subproblem_framework: subproblem.artifact_hashes.framework记录framework_section对应章节哈希
    primary_code: subproblem.primary_code_sha256记录已交付主求解脚本哈希
    analysis_code: subproblem.analysis_code_sha256记录已交付结果深化分析脚本哈希
    model_layer: subproblem.artifact_hashes.model只使用主求解脚本，不把结果深化分析脚本并入主模型哈希
  data_hash_policy:
    project_level: 已验收数据预处理结果.xlsx哈希；预处理阶段另记录state/project_state.yaml中的raw data sources
    not_needed: state/project_state.yaml中的原始data.sources哈希
    question_local: 原始data.sources哈希 + 本问模型/代码中的局部变换语义
    fallback: 仅扫描根目录数据型文件，不包含PDF、DOCX、ZIP和正式交付目录
  figure_provenance:
    default: 不生成独立figure_evidence文件
    project_level_preprocessing: 数据预处理结果.xlsx -> data_process.m -> 预处理证据图 -> LaTeX正文结论
    per_question: 问题X标准工作簿 -> qX_plot.m -> 结果图 -> LaTeX正文结论
    legacy_read_compatibility: 结果数据表/问题X/figure_evidence.yaml
    mtime_role: 仅作辅助警告
classification_contract:
  taxonomy: core/task_taxonomy.yaml
  current_axes:
  - objective
  - structures
  - capabilities
  per_subproblem: true
  authoritative_locations:
