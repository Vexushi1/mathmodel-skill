version: 1.5.0
status: active
introduced_in_staged_version: 9.0.0
purpose: >-
  Own deterministic project-state invalidation and typed cross-question stale propagation.
  This contract defines how current semantic/data/code/result changes invalidate lifecycle
  state. It does not redefine project-state field shape, artifact naming, numerical
  acceptance, Model Approval semantics, or project-file transaction behavior.

authority_boundary:
  owns:
  - transition_events
  - stale_layer_profiles
  - lifecycle_status_updates
  - typed_dependency_propagation
  - legacy_untyped_dependency_fallback
  - dependency_cycle_reporting
  - transition_report_semantics
  - structured_rejection_return
  - lifecycle_rewind_precedence
  delegates:
    project_state_shape: core/project_state.schema.yaml
    model_approval: core/model_approval_contract.yaml
    semantic_identity: scripts/semantic_identity.py
    numerical_acceptance: core/numerical_verification_contract.yaml
    artifact_naming_migration: docs/semantic_state_runtime_refactor_plan.md#phase-e-artifact-naming-migration
    transactional_writes: docs/semantic_state_runtime_refactor_plan.md#phase-f-transactional-project-writes

compatibility:
  canonical_artifact_layer_names_use_explicit_implementation_identity: true
  obsolete_implementation_artifact_aliases_in_active_state_supported: false
  historical_implementation_alias_adapter: scripts/artifact_identity.py
  historical_implementation_alias_adapter_scope: read_only_audit_or_pre_schema_migration
  model_layer_note: >-
    Phase I I3b retires the v8 implementation artifact layer `model` from active Project
    State and State Transition Authority. Historical files may still be inspected or
    mechanically normalized before active-state validation through scripts/artifact_identity.py;
    mathematical model dependency kind `model` remains a distinct semantic dependency type.
  legacy_string_dependency_read_supported: true
  legacy_string_dependency_policy: conservative_full_invalidation
  unknown_dependency_kind_policy: blocking_or_conservative_full_invalidation

profiles:
  core_answer_rejection:
    invalidate_conformance:
      primary: [conformance_acceptance]
      analysis: [conformance_delivery, conformance_acceptance]
    clear: [result_analysis_requirement_reason, proposition_refs]
    stale_layers: [solution_workbook, result_analysis_workbook, matlab_script, figure_bundle, framework]
    set:
      result_quality_status: pending
      result_analysis_status: redo_required
      validation_status: pending
      result_summary_status: stale
    set_if_present:
      primary_execution_status: pending
      analysis_execution_status: redo_required
  model_validity_rejection:
    invalidate_conformance:
      primary: [conformance_delivery, conformance_acceptance]
      analysis: [conformance_delivery, conformance_acceptance]
    clear: [result_analysis_requirement_reason, proposition_refs]
    stale_layers: [primary_code, analysis_code, solution_workbook, result_analysis_workbook, matlab_script, figure_bundle, framework]
    set:
      result_quality_status: pending
      result_analysis_status: redo_required
      validation_status: pending
      result_summary_status: stale
    set_if_present:
      primary_execution_status: pending
      analysis_execution_status: redo_required
      model_challenge_status: stale
      human_model_approval_status: stale
      semantic_closure_status: stale
  semantic:
    invalidate_conformance:
      primary: [conformance_delivery, conformance_acceptance]
      analysis: [conformance_delivery, conformance_acceptance]
    clear: [result_analysis_requirement_reason]
    stale_layers: [primary_code, solution_workbook, result_analysis_workbook, matlab_script, figure_bundle, framework]
    set:
      result_quality_status: pending
      result_analysis_status: pending
      validation_status: pending
      result_summary_status: stale
    set_if_present:
      primary_execution_status: pending
      analysis_execution_status: pending
      model_challenge_status: stale
      human_model_approval_status: stale
  primary_result:
    invalidate_conformance:
      primary: [conformance_delivery, conformance_acceptance]
      analysis: [conformance_delivery, conformance_acceptance]
    clear: [result_analysis_requirement_reason]
    stale_layers: [primary_code, solution_workbook, result_analysis_workbook, matlab_script, figure_bundle, framework]
    set:
      result_quality_status: pending
      result_analysis_status: pending
      validation_status: pending
      result_summary_status: stale
    set_if_present:
      analysis_execution_status: pending
  dependent_result:
    invalidate_conformance:
      primary: [conformance_acceptance]
      analysis: [conformance_delivery, conformance_acceptance]
    clear: [result_analysis_requirement_reason]
    stale_layers: [solution_workbook, result_analysis_workbook, matlab_script, figure_bundle, framework]
    set:
      result_quality_status: pending
      result_analysis_status: pending
      validation_status: pending
      result_summary_status: stale
    set_if_present:
      primary_execution_status: pending
      analysis_execution_status: pending
  analysis_result:
    invalidate_conformance:
      analysis: [conformance_delivery, conformance_acceptance]
    stale_layers: [analysis_code, result_analysis_workbook, matlab_script, figure_bundle, framework]
    set:
      result_analysis_status: pending
      validation_status: pending
      result_summary_status: stale
    set_if_present:
      analysis_execution_status: pending
  data_result:
    invalidate_conformance:
      primary: [conformance_acceptance]
      analysis: [conformance_delivery, conformance_acceptance]
    clear: [result_analysis_requirement_reason]
    stale_layers: [data, solution_workbook, result_analysis_workbook, matlab_script, figure_bundle, framework]
    set:
      result_quality_status: pending
      result_analysis_status: pending
      validation_status: pending
      result_summary_status: stale
    set_if_present:
      primary_execution_status: pending
      analysis_execution_status: pending
  matlab:
    stale_layers: [matlab_script, figure_bundle, framework]
    set:
      validation_status: pending
      result_summary_status: stale
  figure:
    stale_layers: [figure_bundle, framework]
    set:
      result_summary_status: stale
  paper:
    stale_layers: [framework]
    set:
      result_summary_status: stale

transition_events:
  core_answer_rejected:
    caller_scope: explicit_B2_1.4.0_current_reject_only
    own_profile: core_answer_rejection
    emitted_impacts: [result]
    own_status_cap: designed
    restart_phase: solve_validate
    restart_condition: Resolve the rejected core answer through a new accepted primary result.
    dependency_status_caps:
      model: audited
      result: designed
      parameter: designed
      data: designed
      legacy_untyped: audited
    dependency_clear: [proposition_refs]
    dependency_restart_phases:
      model: model_design
      result: solve_validate
      parameter: solve_validate
      data: solve_validate
      legacy_untyped: model_design
  analysis_conclusion_rejected:
    caller_scope: failed_analysis_conclusion_receipt_under_exact_B2_1.4.0_only
    own_profile: core_answer_rejection
    emitted_impacts: [result]
    own_status_cap: designed
    restart_phase: solve_validate
    restart_condition: Resolve the failed analysis conclusion through a new accepted primary result.
    dependency_status_caps:
      model: audited
      result: designed
      parameter: designed
      data: designed
      legacy_untyped: audited
    dependency_clear: [proposition_refs]
    dependency_restart_phases:
      model: model_design
      result: solve_validate
      parameter: solve_validate
      data: solve_validate
      legacy_untyped: model_design
  model_validity_rejected:
    caller_scope: explicit_B2_1.4.0_current_reject_only
    own_profile: model_validity_rejection
    emitted_impacts: [model, result, parameter, data]
    own_status_cap: audited
    restart_phase: model_design
    restart_condition: Resolve the rejected model validity through renewed challenge and explicit approval.
    dependency_status_caps:
      model: audited
      result: designed
      parameter: designed
      data: designed
      legacy_untyped: audited
    dependency_clear: [proposition_refs]
    dependency_restart_phases:
      model: model_design
      result: solve_validate
      parameter: solve_validate
      data: solve_validate
      legacy_untyped: model_design
  primary_conformance_changed:
    implementation_binding: opted-in primary declaration or structural delivery/acceptance is no longer current
    own_profile: primary_result
    emitted_impacts: [result]
  analysis_conformance_changed:
    implementation_binding: opted-in analysis declaration or structural delivery/acceptance is no longer current
    own_profile: analysis_result
    emitted_impacts: []
  semantic_identity_changed:
    own_profile: semantic
    emitted_impacts: [model, result]
    category_impacts:
      parameter: [parameter]
      data_scope: [data]
      preprocessing: [data]
  primary_code_changed:
    implementation_binding: primary backend, entry path, entry bytes or declared code dependency set/bytes changed
    own_profile: primary_result
    emitted_impacts: [result]
  analysis_inputs_changed:
    implementation_binding: declared analysis input bytes are missing or differ from delivered identities
    own_profile: analysis_result
    emitted_impacts: []
  analysis_code_changed:
    implementation_binding: analysis backend, entry path, entry bytes or declared code dependency set/bytes changed
    own_profile: analysis_result
    emitted_impacts: []
  primary_numerical_source_retired:
    caller_scope: explicit_project_backend_migration_only
    implementation_binding: retiring a primary numerical source, not an opposite backend request
    own_profile: primary_result
    emitted_impacts: [data, parameter, result]
  analysis_numerical_source_retired:
    caller_scope: explicit_project_backend_migration_only
    implementation_binding: retiring analysis outputs while keeping an unaffected primary source current
    own_profile: analysis_result
    emitted_impacts: [data, parameter, result]
  data_changed:
    own_profile: data_result
    emitted_impacts: [data, parameter, result]
  solution_workbook_changed:
    own_profile: dependent_result
    emitted_impacts: [result]
  analysis_workbook_changed:
    own_profile: analysis_result
    emitted_impacts: []
  matlab_script_changed:
    own_profile: matlab
    emitted_impacts: []
  figure_bundle_changed:
    own_profile: figure
    emitted_impacts: []
  paper_fragment_changed:
    own_profile: paper
    emitted_impacts: []

dependency_rules:
  model:
    trigger_impacts: [model]
    target_profile: semantic
    emitted_impacts: [model, result]
    reason: downstream model semantics depend on changed upstream model semantics
  result:
    trigger_impacts: [result]
    target_profile: dependent_result
    emitted_impacts: [result]
    reason: downstream execution consumes an upstream result that is no longer current
  parameter:
    trigger_impacts: [parameter]
    target_profile: dependent_result
    emitted_impacts: [parameter, result]
    reason: downstream execution consumes an upstream parameter that must be re-established
  data:
    trigger_impacts: [data]
    target_profile: data_result
    emitted_impacts: [data, result]
    reason: downstream execution consumes upstream data whose identity is no longer current
  legacy_untyped:
    trigger_impacts: ['*']
    target_profile: semantic
    emitted_impacts: [model, result, parameter, data]
    reason: legacy dependency has no kind, so invalidate conservatively rather than under-invalidate

cycle_policy:
  detect_before_propagation: true
  ordering: lexical_deterministic
  behavior: report_and_terminate_by_visited_transition
  note: >-
    Cycles are reported deterministically and propagation uses visited (question, impact)
    state so a cycle can never loop indefinitely. Callers may escalate reported cycles
    according to their gate severity; the transition engine itself remains deterministic.

lifecycle_rewind:
  status_order: [pending, audited, designed, solved, analyzed, validated, written, completed]
  project_phase_order: [problem_audit, model_design, data_preprocessing, solve_validate, result_analysis, figure_evidence, writing_docx, writing_latex, ai_cleanup, latex_compile_quality, review_delivery, completed]
  event_order_independent_restart_precedence: [model_design, solve_validate]
  restart_conditions:
    model_design: Resolve rejected model validity through renewed semantic closure, Model Challenge, and explicit Human Approval.
    solve_validate: Resolve the rejected core answer through a new accepted primary result.
  rule: A structured rejection may only rewind lifecycle status and project phase; it never advances either one.

transition_report:
  cleared_field_reporting: Profile clear removes an existing state field; status_updates reports its removal as null without writing null into project state.
  required_fields: [event, source, affected_questions, transitions, dependency_cycles]
  optional_fields: [project_updates]
  transition_fields:
  - question
  - scope
  - source
  - dependency_kind
  - profile
  - stale_layers
  - status_updates
  - emitted_impacts
  - reason
  scope_values: [own, downstream]

invariants:
- Applying the same transition to an already-transitioned state is idempotent.
- Structured B2 rejection events rewind subproblem lifecycle and project phase atomically; model_design always wins over solve_validate regardless of disposition order.
- Model Approval is invalidated only by semantic-profile transitions, not by ordinary primary-code or analysis-code freshness changes.
- Ordinary observed backend/source-bundle freshness changes use existing code events even if the entry SHA is unchanged; explicit project-level retirement uses numerical-source events, and matlab_script_changed remains restricted to formal figure code.
- Numerical-source retirement uses the matching primary/analysis profile and emits data/parameter/result, never a direct model impact; ordinary code events and backend request conflicts are not retirement.
- Retirement events change freshness only. The migration coordinator must separately archive evidence, retire current bindings, and persist an approved whole-project change through the existing transaction; the pure engine does not authorize migration.
- For both-stage retirement, capture affected stages before applying profiles; a primary profile may reset analysis disposition. Independent affected questions must be included explicitly, not only reached from Q1.
- Typed result/parameter/data dependencies invalidate execution/evidence without automatically invalidating downstream mathematical approval.
- Unknown or legacy untyped dependencies must never be treated as no-impact.
- State transition logic must not read or write project files; callers own persistence.
- The three active stale-producing entrypoints must consume this Authority through scripts/state_transitions.py rather than maintain private stale-layer sets.
- New transitions must emit only active Project State artifact layers; implementation layers are `primary_code` and `analysis_code`, never the retired v8 `model` alias.

# Structural binding invalidation preserves declaration/provenance and never grants or refreshes acceptance.
